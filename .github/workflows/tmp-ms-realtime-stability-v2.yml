name: TEMP MS Realtime Stability V2

on:
  push:
    branches: [codex/dev-ms-realtime-stability-v2]

permissions:
  contents: write

jobs:
  audit-and-apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dev-ms-realtime-stability-v2
          fetch-depth: 0

      - name: Apply preventive realtime stability patch
        run: |
          node .github/dev-tools/tmp-ms-realtime-stability-v2-fixed.mjs
          node --check ms.js
          node --check ms-report.js
          node --check .github/dev-tools/patch-ms-transient-empty-guard.mjs
          node --check .github/dev-tools/stage-dev-runtime.mjs
          grep -q 'MS_TRANSIENT_EMPTY_CONFIRM_V1' ms.js
          grep -q 'MS_TRANSIENT_EMPTY_SOURCE_GUARD_V1' .github/dev-tools/patch-ms-transient-empty-guard.mjs
          ! grep -q 'waiting-trucks-report.alert-squid-6738.chatgpt.site' ms-report.js

      - name: Run full Worker and frontend contract checks
        working-directory: worker
        run: npm run check

      - name: Run focused realtime and quota regression checks
        run: |
          node --test worker/tests/ms-transient-empty-guard.test.mjs
          node --test .github/dev-tools/realtime-quota-hardening.test.mjs
          node --test worker/tests/ms-owner-live-v8.test.mjs worker/tests/ms-fast-first-paint.test.mjs worker/tests/ms-har-browser-context.test.mjs

      - name: Verify no polling or quota regression
        run: |
          node <<'NODE'
          const fs = require('fs');
          const front = fs.readFileSync('ms.js','utf8');
          const stage = fs.readFileSync('.github/dev-tools/stage-dev-runtime.mjs','utf8');
          const report = fs.readFileSync('ms-report.js','utf8');
          const checks = [
            ['visible 4s cadence', /pollMs:\s*4000/.test(front)],
            ['WS first', front.includes('MS_REALTIME_WS_V1')],
            ['no direct HTTP 4s timer', !/setInterval\(\(\) => state\.auth && loadData\(true\), CONFIG\.pollMs\)/.test(front)],
            ['foreground resume guard', front.includes('MS_RESUME_NO_ZERO_FLASH_V1')],
            ['transient empty frontend guard', front.includes('MS_TRANSIENT_EMPTY_CONFIRM_V1')],
            ['transient empty staged worker guard', stage.includes('patchMsTransientEmptyGuardWorker')],
            ['promoted report API', report.includes('waiting-trucks-report-api-dev.26nak-testdev.workers.dev')],
            ['retired report API removed', !report.includes('waiting-trucks-report.alert-squid-6738.chatgpt.site')],
          ];
          for (const [name, ok] of checks) {
            console.log(`${ok ? 'PASS' : 'FAIL'} ${name}`);
            if (!ok) process.exitCode = 1;
          }
          NODE

      - name: Show final diff and remove temporary runner
        run: |
          git status --short
          git diff -- ms.js ms-report.js worker/package.json .github/dev-tools/stage-dev-runtime.mjs .github/workflows/current-system-acceptance.yml
          git rm .github/dev-tools/tmp-ms-realtime-stability-v2.mjs
          git rm .github/dev-tools/tmp-ms-realtime-stability-v2-fixed.mjs
          git rm .github/workflows/tmp-ms-realtime-stability-v2.yml

      - name: Commit tested DEV hardening
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add ms.js ms-report.js worker/package.json worker/tests/ms-transient-empty-guard.test.mjs .github/dev-tools/stage-dev-runtime.mjs .github/dev-tools/patch-ms-transient-empty-guard.mjs .github/workflows/current-system-acceptance.yml
          git add -u .github/dev-tools .github/workflows
          git commit -m 'fix(dev): harden realtime empty snapshot continuity'
          git push origin HEAD:codex/dev-ms-realtime-stability-v2

      - name: Verify temporary runner removed
        run: |
          test ! -e .github/dev-tools/tmp-ms-realtime-stability-v2.mjs
          test ! -e .github/dev-tools/tmp-ms-realtime-stability-v2-fixed.mjs
          test ! -e .github/workflows/tmp-ms-realtime-stability-v2.yml
          echo 'TEMP_RUNNER_REMOVED=PASS'
