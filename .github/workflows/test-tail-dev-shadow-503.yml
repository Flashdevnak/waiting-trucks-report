name: Test Tail DEV Shadow 503

on:
  push:
    branches:
      - test/tbr-shadow-final-20260904
    paths:
      - .github/workflows/test-tail-dev-shadow-503.yml

permissions:
  contents: read

jobs:
  tail-dev:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DEV tooling
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Tail DEV TEST across Browser cron calls
        working-directory: worker
        run: |
          set +e
          timeout 95s npx wrangler tail waiting-trucks-report-api-dev --config wrangler.dev.jsonc --format json > /tmp/dev-tail.log 2>&1
          set -e
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/dev-tail.log').read_text(errors='replace') if Path('/tmp/dev-tail.log').exists() else ''
          keep=[]
          for line in text.splitlines():
              if any(x in line.lower() for x in ['api_error','ms_','bustime','bus','route','503','error','connector']):
                  keep.append(line[:5000])
          print('DEV_RELEVANT_LOGS_BEGIN')
          print('\n'.join(keep[-160:]) if keep else 'NO_RELEVANT_LOGS')
          print('DEV_RELEVANT_LOGS_END')
          print('MUTATIONS=0')
          print('PRODUCTION_TOUCHED=NO')
          PY
