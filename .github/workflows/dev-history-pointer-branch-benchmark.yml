name: DEV History Thin Pointer Branch Benchmark

# DEV ONLY. Creates pointer structures only on an isolated Turso copy, then deletes it.
on:
  push:
    branches:
      - codex/dev-history-latest-state-benchmark
    paths:
      - .github/workflows/dev-history-pointer-branch-benchmark.yml

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_SOURCE_DATABASE: waiting-trucks-dev-turso-20260902192750
      ACCEPTANCE_HUB: NE1
      ACCEPTANCE_DAY: 2026-09-16
    steps:
      - name: Benchmark thin latest-history pointer on isolated branch
        shell: bash
        run: |
          node <<'NODE'
          const { createHash } = require('node:crypto');
          (async()=>{
            const platform=process.env.TURSO_PLATFORM_API_TOKEN;
            const org=process.env.TURSO_ORG;
            const sourceDb=process.env.TURSO_SOURCE_DATABASE;
            const hub=process.env.ACCEPTANCE_HUB;
            const day=process.env.ACCEPTANCE_DAY;
            const runId=String(process.env.GITHUB_RUN_ID||Date.now());
            const branchDb=`wt-hist-pointer-${runId}`.toLowerCase().slice(0,60);
            if(!platform) throw new Error('TURSO_PLATFORM_API_TOKEN missing');
            if(org!=='flashdevnak') throw new Error('DEV organization guard failed');
            if(sourceDb!=='waiting-trucks-dev-turso-20260902192750') throw new Error('DEV source database guard failed');
            if(hub!=='NE1' || !/^\d{4}-\d{2}-\d{2}$/.test(day)) throw new Error('Acceptance guard failed');

            const headers={Authorization:`Bearer ${platform}`};
            async function platformJson(url,init={}) {
              const response=await fetch(url,{...init,headers:{...headers,...(init.headers||{})}});
              let json={}; try { json=await response.json(); } catch {}
              if(!response.ok) throw new Error(`Turso platform HTTP ${response.status}: ${JSON.stringify(json).slice(0,800)}`);
              return json;
            }
            async function deleteBranch() {
              const response=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${branchDb}`,{method:'DELETE',headers});
              if(response.ok || response.status===404) {
                console.log(`ISOLATED_BRANCH_DELETED=${response.status===404?'ALREADY_GONE':'YES'}`);
                return;
              }
              const text=await response.text();
              throw new Error(`Failed to delete isolated branch: HTTP ${response.status} ${text.slice(0,500)}`);
            }
            let created=false;
            try {
              const sourceJson=await platformJson(`https://api.turso.tech/v1/organizations/${org}/databases/${sourceDb}`);
              const source=sourceJson.database||sourceJson;
              const group=source.Group||source.group||source.GroupName||source.group_name||'default';
              const createJson=await platformJson(`https://api.turso.tech/v1/organizations/${org}/databases`,{
                method:'POST',headers:{'content-type':'application/json'},
                body:JSON.stringify({name:branchDb,group,seed:{type:'database',name:sourceDb}}),
              });
              created=true;
              const branch=createJson.database||createJson;
              let hostname=branch.Hostname||branch.hostname||'';
              if(!hostname) {
                const readback=await platformJson(`https://api.turso.tech/v1/organizations/${org}/databases/${branchDb}`);
                const db=readback.database||readback;
                hostname=db.Hostname||db.hostname||'';
              }
              if(!hostname) throw new Error('Isolated branch hostname missing');
              const tokenJson=await platformJson(`https://api.turso.tech/v1/organizations/${org}/databases/${branchDb}/auth/tokens?expiration=20m&authorization=full-access`,{method:'POST'});
              if(!tokenJson.jwt) throw new Error('Isolated branch token missing');
              console.log(`::add-mask::${tokenJson.jwt}`);
              console.log(`SOURCE_DATABASE=${sourceDb}`);
              console.log(`ISOLATED_BRANCH=${branchDb}`);

              async function pipeline(requests) {
                const response=await fetch(`https://${hostname}/v2/pipeline`,{
                  method:'POST',headers:{Authorization:`Bearer ${tokenJson.jwt}`,'content-type':'application/json'},
                  body:JSON.stringify({requests:[...requests,{type:'close'}]}),
                });
                const body=await response.json();
                if(!response.ok) throw new Error(`Turso SQL HTTP ${response.status}: ${JSON.stringify(body).slice(0,800)}`);
                for(const item of body.results||[]) if(item?.type==='error') throw new Error(`Turso SQL error: ${JSON.stringify(item.error).slice(0,800)}`);
                return body.results||[];
              }
              const resultOf=(item)=>item?.response?.result||{};
              const scalar=(cell)=>cell?.type==='null'||cell==null?null:cell.value;
              const canonical=(result)=>{
                const values=(result.rows||[]).map(row=>row.map(scalar));
                const lines=values.map(row=>JSON.stringify(row)).sort();
                return {count:values.length,hash:createHash('sha256').update(lines.join('\n')).digest('hex')};
              };
              const businessDay=`CASE
                WHEN COALESCE(json_extract(h.payload_json,'$.attendanceType'),'') LIKE '%ต้นทาง%' THEN
                  date(datetime(COALESCE(
                    NULLIF(json_extract(h.payload_json,'$.estimatedDepartureAt'),''),
                    NULLIF(json_extract(h.payload_json,'$.actualDepartureAt'),''),
                    NULLIF(json_extract(h.payload_json,'$.estimatedArrivalAt'),'')
                  ), '+7 hours'))
                ELSE
                  date(datetime(COALESCE(
                    NULLIF(json_extract(h.payload_json,'$.estimatedArrivalAt'),''),
                    NULLIF(json_extract(h.payload_json,'$.actualArrivalAt'),''),
                    NULLIF(json_extract(h.payload_json,'$.estimatedDepartureAt'),'')
                  ), '+7 hours'))
                END`;

              const createResults=await pipeline([
                {type:'execute',stmt:{sql:`CREATE TABLE probe_history_pointer (
                  hub TEXT NOT NULL,
                  route_id TEXT NOT NULL,
                  business_day TEXT,
                  latest_rowid INTEGER NOT NULL,
                  PRIMARY KEY (hub,route_id)
                )`}},
                {type:'execute',stmt:{sql:`CREATE INDEX idx_probe_history_pointer_day ON probe_history_pointer(hub,business_day,route_id)`}},
              ]);
              console.log(`POINTER_SCHEMA_ROWS_READ=${createResults.reduce((s,x)=>s+Number(resultOf(x).rows_read||0),0)}`);
              console.log(`POINTER_SCHEMA_ROWS_WRITTEN=${createResults.reduce((s,x)=>s+Number(resultOf(x).rows_written||0),0)}`);

              const buildSql=`INSERT INTO probe_history_pointer(hub,route_id,business_day,latest_rowid)
                SELECT r.hub,r.route_id,${businessDay},h.rowid
                FROM ms_route_registry r
                JOIN ms_route_history h ON h.rowid=(
                  SELECT h2.rowid FROM ms_route_history h2 INDEXED BY idx_ms_route_history_hub_route_snapshot
                  WHERE h2.hub=r.hub AND h2.route_id=r.route_id
                  ORDER BY h2.snapshot_at DESC,h2.rowid DESC LIMIT 1
                )
                WHERE r.hub='${hub}' AND h.hub='${hub}' AND json_valid(h.payload_json)=1`;
              const buildResults=await pipeline([{type:'execute',stmt:{sql:buildSql}}]);
              const buildResult=resultOf(buildResults[0]);
              console.log(`POINTER_BUILD_ROWS_READ=${Number(buildResult.rows_read||0)}`);
              console.log(`POINTER_BUILD_ROWS_WRITTEN=${Number(buildResult.rows_written||0)}`);

              const oldSql=`WITH latest AS (
                SELECT h.route_id,h.payload_json,h.snapshot_at,h.synced_by,h.event_type
                FROM ms_route_registry r
                JOIN ms_route_history h ON h.rowid=(
                  SELECT h2.rowid FROM ms_route_history h2 INDEXED BY idx_ms_route_history_hub_route_snapshot
                  WHERE h2.hub=r.hub AND h2.route_id=r.route_id
                  ORDER BY h2.snapshot_at DESC,h2.rowid DESC LIMIT 1
                )
                WHERE r.hub='${hub}' AND h.hub='${hub}' AND json_valid(h.payload_json)=1
              ), daily AS (
                SELECT route_id,payload_json,snapshot_at,synced_by,event_type,
                CASE
                  WHEN COALESCE(json_extract(payload_json,'$.attendanceType'),'') LIKE '%ต้นทาง%' THEN
                    date(datetime(COALESCE(NULLIF(json_extract(payload_json,'$.estimatedDepartureAt'),''),NULLIF(json_extract(payload_json,'$.actualDepartureAt'),''),NULLIF(json_extract(payload_json,'$.estimatedArrivalAt'),'')), '+7 hours'))
                  ELSE
                    date(datetime(COALESCE(NULLIF(json_extract(payload_json,'$.estimatedArrivalAt'),''),NULLIF(json_extract(payload_json,'$.actualArrivalAt'),''),NULLIF(json_extract(payload_json,'$.estimatedDepartureAt'),'')), '+7 hours'))
                END AS business_day
                FROM latest
              )
              SELECT route_id,payload_json,snapshot_at,synced_by,event_type,business_day
              FROM daily WHERE business_day>='${day}' AND business_day<='${day}'
              ORDER BY business_day DESC,snapshot_at DESC`;

              const pointerSql=`SELECT h.route_id,h.payload_json,h.snapshot_at,h.synced_by,h.event_type,p.business_day
                FROM probe_history_pointer p INDEXED BY idx_probe_history_pointer_day
                JOIN ms_route_history h ON h.rowid=p.latest_rowid
                WHERE p.hub='${hub}' AND p.business_day>='${day}' AND p.business_day<='${day}'
                ORDER BY p.business_day DESC,h.snapshot_at DESC`;

              const queryResults=await pipeline([
                {type:'execute',stmt:{sql:oldSql}},
                {type:'execute',stmt:{sql:pointerSql}},
                {type:'execute',stmt:{sql:`EXPLAIN QUERY PLAN ${pointerSql}`}},
              ]);
              const oldResult=resultOf(queryResults[0]);
              const newResult=resultOf(queryResults[1]);
              const planResult=resultOf(queryResults[2]);
              const oldCanon=canonical(oldResult);
              const newCanon=canonical(newResult);
              const oldRead=Number(oldResult.rows_read||0);
              const newRead=Number(newResult.rows_read||0);
              const reduction=oldRead>0?((oldRead-newRead)/oldRead*100):0;
              console.log(`OLD_RESULT_ROWS=${oldCanon.count}`);
              console.log(`NEW_RESULT_ROWS=${newCanon.count}`);
              console.log(`OLD_RESULT_SHA256=${oldCanon.hash}`);
              console.log(`NEW_RESULT_SHA256=${newCanon.hash}`);
              console.log(`RESULT_PARITY=${oldCanon.count===newCanon.count&&oldCanon.hash===newCanon.hash?'PASS':'FAIL'}`);
              console.log(`OLD_QUERY_ROWS_READ=${oldRead}`);
              console.log(`NEW_QUERY_ROWS_READ=${newRead}`);
              console.log(`ROWS_READ_REDUCTION_PERCENT=${reduction.toFixed(2)}`);
              console.log(`OLD_QUERY_ROWS_WRITTEN=${Number(oldResult.rows_written||0)}`);
              console.log(`NEW_QUERY_ROWS_WRITTEN=${Number(newResult.rows_written||0)}`);
              console.log(`POINTER_PLAN=${JSON.stringify((planResult.rows||[]).map(row=>row.map(scalar)))}`);
              console.log('POINTER_CREATED_ON_SOURCE_DEV=NO');
              console.log('UPSTREAM_MS_CALLS=0');
              console.log('SOURCE_DEV_SCHEMA_CHANGED=NO');
              console.log('PRODUCTION_TOUCHED=NO');
              if(oldCanon.count!==newCanon.count || oldCanon.hash!==newCanon.hash) throw new Error('FAIL: pointer result is not 100% identical');
              if(Number(oldResult.rows_written||0)!==0 || Number(newResult.rows_written||0)!==0) throw new Error('FAIL: benchmark search query wrote rows');
              if(newRead>=oldRead) throw new Error(`FAIL: pointer query did not reduce Rows Read (${newRead} >= ${oldRead})`);
              console.log('THIN_POINTER_BENCHMARK=PASS');
            } finally {
              if(created) await deleteBranch();
            }
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE
