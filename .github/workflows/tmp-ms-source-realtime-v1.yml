name: TEMP MS Source Realtime V1

on:
  push:
    branches: [codex/dev-ms-source-realtime-v1]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/dev-ms-source-realtime-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Apply source realtime restoration
        run: |
          node .github/dev-tools/tmp-ms-source-realtime-v1.mjs
          node <<'NODE'
          const fs=require('node:fs');
          const p='worker/package.json';
          let s=fs.readFileSync(p,'utf8');
          const anchor='node --test ../.github/dev-tools/realtime-quota-hardening.test.mjs';
          if(!s.includes('ms-source-realtime-v1.test.mjs')) {
            if(!s.includes(anchor)) throw new Error('package check anchor missing');
            s=s.replace(anchor, `${anchor} && node --test ../.github/dev-tools/ms-source-realtime-v1.test.mjs`);
          }
          fs.writeFileSync(p,s);
          NODE
          node --check ms.js
          node --check .github/dev-tools/patch-bus-time-hot-lane-v14.mjs
          node --check .github/dev-tools/ms-source-realtime-v1.test.mjs
          grep -q 'MS_REALTIME_SOURCE_MIN_MS = 3 \* 1000' .github/dev-tools/patch-bus-time-hot-lane-v14.mjs
          ! grep -q 'MS_REALTIME_SOURCE_MIN_MS = 12 \* 1000' .github/dev-tools/patch-bus-time-hot-lane-v14.mjs
          grep -q 'REALTIME_FOLLOWER_TAKEOVER_MS = 2 \* CONFIG.pollMs + 1000' ms.js

      - name: Install
        working-directory: worker
        run: npm ci

      - name: Full DEV check
        working-directory: worker
        run: npm run check

      - name: Focused staging and truth checks
        run: |
          node --test .github/dev-tools/ms-source-realtime-v1.test.mjs
          node --test .github/dev-tools/realtime-quota-hardening.test.mjs
          node --test .github/dev-tools/ms-durable-coordinator.test.mjs
          node --test .github/dev-tools/bus-time-hot-lane-v14.test.mjs
          node --test .github/dev-tools/ms-unload-completion-ui.test.mjs
          node --test .github/dev-tools/ms-summary-filter.test.mjs
          node --test .github/dev-tools/ms-drop-lifecycle.test.mjs
          node .github/dev-tools/stage-dev-runtime.mjs /tmp/ms-staged.js /tmp/worker-staged.js

      - name: Verify staged latency contract and quota boundaries
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const patch=fs.readFileSync('.github/dev-tools/patch-bus-time-hot-lane-v14.mjs','utf8');
          const front=fs.readFileSync('ms.js','utf8');
          const checks=[
            ['visible UI 4s', /pollMs:\s*4000/.test(front)],
            ['shared source floor 3s', /MS_REALTIME_SOURCE_MIN_MS = 3 \* 1000/.test(patch)],
            ['old 12s gate removed', !/MS_REALTIME_SOURCE_MIN_MS = 12 \* 1000/.test(patch)],
            ['WebSocket first', front.includes('MS_REALTIME_WS_V1')],
            ['no per-client HTTP 4s polling', !front.includes('setInterval(() => state.auth && loadData(true), CONFIG.pollMs)')],
            ['9s follower takeover', front.includes('REALTIME_FOLLOWER_TAKEOVER_MS = 2 * CONFIG.pollMs + 1000')],
            ['transient empty guard preserved', front.includes('MS_TRANSIENT_EMPTY_CONFIRM_V1')],
            ['resume guard preserved', front.includes('MS_RESUME_NO_ZERO_FLASH_V1')],
          ];
          for(const [name,ok] of checks){ console.log(`${ok?'PASS':'FAIL'} ${name}`); if(!ok) process.exitCode=1; }
          console.log('EXPECTED_ACTIVE_ROUTE_REFRESH_MAX_MS=4000_PLUS_UPSTREAM_LATENCY');
          console.log('PER_CLIENT_UPSTREAM_SCALING=0');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE

      - name: Commit tested source only
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git rm .github/dev-tools/tmp-ms-source-realtime-v1.mjs
          git add ms.js worker/package.json .github/dev-tools/patch-bus-time-hot-lane-v14.mjs .github/dev-tools/realtime-quota-hardening.test.mjs .github/dev-tools/ms-source-realtime-v1.test.mjs
          git add -u .github/dev-tools
          git status --short
          git commit -m 'fix(dev): restore shared MS source realtime cadence'
          git push origin HEAD:codex/dev-ms-source-realtime-v1
