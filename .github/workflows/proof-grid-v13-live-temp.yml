name: Proof Grid V13 Browser Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-grid-v13-live-temp.yml

permissions:
  contents: read

jobs:
  browser-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chromium
        run: |
          mkdir -p /tmp/proof-v13 && cd /tmp/proof-v13
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify V13 live UI
        run: |
          cd /tmp/proof-v13
          node <<'NODE'
          const {chromium}=require('playwright');
          (async()=>{const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';const browser=await chromium.launch({headless:true});try{const page=await browser.newPage({viewport:{width:1680,height:1050}});const req=[];const errs=[];page.on('request',r=>req.push(r.url()));page.on('pageerror',e=>errs.push(String(e)));const res=await page.goto(base+'/proof.html?v13='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});if(!res?.ok())throw new Error('proof '+res?.status());await page.waitForFunction(()=>window.__PROOF_V10_READY__===true,{timeout:15000});await page.waitForTimeout(600);if(errs.length)throw new Error(errs.join('|'));const bg=req.filter(u=>u.includes('/api/proof/editor')||u.includes('/api/proof/plate-options')||u.includes('/api/proof/history'));if(bg.length)throw new Error('background api '+bg.join(','));const out=await page.evaluate(()=>{const P=window.ProofV2;const a={lineId:'A',departureDate:'2026-09-06',lineName:'FD-4W-NE1-SNRR-07:00-BD-RO',lineTypeText:'Feeder',routeTypeText:'FD',lineMode:1,proofState:1,proofId:'',destinationCode:'SNRR',destinationName:'สูงเนิน',plateNumber:'3ฒผ766(กรุงเทพ)',plateTypeText:'4W',driver:'นิ่ม เติมสูงเนิน',driverPhone:'0886345679',plannedDepartureTime:420,standbyTime:300,detailReady:true};const b={...a,lineId:'B',lineName:'FD-4W-NE1-BKW-07:00-BD-RO',destinationCode:'BKW',destinationName:'บ้านแวง'};const html=P.groupedHtml([a,b]);const host=document.createElement('div');host.innerHTML=html;document.body.appendChild(host);const branches=[...host.querySelectorAll('.proof-branch-v13>header strong')].map(x=>x.textContent.trim());const cols=[...host.querySelectorAll('.proof-branch-columns-v13 b')].map(x=>x.textContent.trim());const row=host.querySelector('.proof-grid-row-v13');const buttons=[...row.querySelectorAll('.proof-grid-btns-v13 button')].map(x=>{const s=getComputedStyle(x);return [s.width,s.height,x.textContent.trim()]});const font=parseFloat(getComputedStyle(row.querySelector('.proof-grid-route-v13 strong')).fontSize);const lane=host.querySelector('.proof-lane-head-v13 strong')?.textContent.trim();host.remove();return{branches,cols,buttons,font,lane,tech:[...document.querySelectorAll('body *')].filter(x=>x.children.length===0).map(x=>x.textContent||'').filter(t=>/background API|lineMode|MS state|cache 5|Fleet\/App/.test(t))};});if(out.branches.length<2)throw new Error('branch headers '+JSON.stringify(out));if(!out.cols.includes('บาร์รถ')||!out.cols.includes('คนขับ / โทรศัพท์')||!out.cols.includes('ซัพ / รถ'))throw new Error('columns '+JSON.stringify(out));if(out.buttons.length!==2||out.buttons[0][0]!==out.buttons[1][0]||out.buttons[0][1]!==out.buttons[1][1])throw new Error('button sizes '+JSON.stringify(out));if(out.font<16)throw new Error('font '+JSON.stringify(out));if(!out.lane?.startsWith('FD'))throw new Error('lane '+JSON.stringify(out));if(out.tech.length)throw new Error('technical copy '+JSON.stringify(out.tech));console.log('PROOF_V13_BROWSER=PASS');console.log('NESTED_BRANCH_HEADERS=PASS');console.log('GRID_COLUMNS=PASS');console.log('EQUAL_ACTION_BUTTONS=PASS');console.log('FONT_READABILITY=PASS');console.log('BACKGROUND_DETAIL_SEARCH_HISTORY=0');console.log('PRODUCTION_TOUCHED=NO');}finally{await browser.close();}})().catch(e=>{console.error(e);process.exit(1)});
          NODE
# final gate after cc5a4eaf DEV deploy
