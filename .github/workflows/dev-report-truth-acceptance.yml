name: DEV Report Truth Acceptance

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy Worker DEV"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-report-truth-acceptance.yml
      - .github/dev-tools/patch-dev-report-truth-state.mjs
      - .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify live DEV report truth state
        run: |
          node <<'NODE'
          (async()=>{
            const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
            const stamp=Date.now();
            async function text(path){
              const response=await fetch(`${base}/${path}?v=${stamp}`,{cache:'no-store'});
              const body=await response.text();
              if(!response.ok) throw new Error(`${path} HTTP ${response.status}`);
              return body;
            }
            const [html,js]=await Promise.all([text('ms-report.html'),text('ms-report.js')]);
            if(!html.includes('data-report-runtime-status="DEV_REPORT_TRUTH_STATE_V1"'))
              throw new Error('truth-state marker missing from live DEV report HTML');
            if(html.includes('<span class="badge badge-online">พร้อมใช้งาน</span>'))
              throw new Error('live DEV report still exposes static ready badge');
            if(!html.includes('ยังไม่ได้ตรวจสอบ'))
              throw new Error('live DEV report neutral initial state missing');
            if(!js.includes('DEV_REPORT_TRUTH_STATE_V1'))
              throw new Error('truth-state marker missing from live DEV report JS');
            if(!js.includes('setReportRuntimeStatus("พร้อมใช้งาน","online")'))
              throw new Error('live DEV report success-state transition missing');
            if(!js.includes('setReportRuntimeStatus("ต้องเข้าสู่ระบบ","offline")'))
              throw new Error('live DEV report auth-state transition missing');
            if(/setInterval\s*\(|new WebSocket\s*\(|EventSource\s*\(/.test(js))
              throw new Error('report truth-state introduced background transport');
            console.log('DEV_REPORT_TRUTH_STATE_LIVE=PASS');
            console.log('DEV_REPORT_STATIC_READY_BADGE=0');
            console.log('DEV_REPORT_BACKGROUND_TRANSPORT=0');
            console.log('PRODUCTION_TOUCHED=NO');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE
