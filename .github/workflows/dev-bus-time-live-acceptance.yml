name: DEV BusTime Live Acceptance

on:
  push:
    branches:
      - dev/bus-time-live-acceptance
    paths:
      - .github/workflows/dev-bus-time-live-acceptance.yml

permissions:
  contents: read

jobs:
  live-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
      ACCEPT_HUB: NE1

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Stage clean DEV runtime
        working-directory: worker
        run: |
          rm -rf .diag-assets .diag-clean .diag-runtime
          mkdir -p .diag-assets .diag-clean
          cp -R src .diag-clean/src
          cp ../waiting.html ../admin.html ../admin.js ../admin.css ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../ms-v4.css ../sw.js ../favicon.svg .diag-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .diag-assets/
          cp ../.github/dev-tools/safe-parity.html .diag-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .diag-assets/ms.js .diag-clean/src/index.js
          node ../.github/dev-tools/patch-dev-origin-manifest-session-v2.mjs .diag-assets/ms.js .diag-clean/src/origin-manifest-v1.js
          node --check .diag-assets/ms.js
          node --check .diag-clean/src/index.js
          node --check .diag-clean/src/origin-manifest-v1.js
          node --check .diag-clean/src/bus-time-hot-lane-v14.js
          grep -q 'BUS_TIME_HOT_LANE_V14' .diag-clean/src/index.js
          grep -q 'MS_REALTIME_WS_V1' .diag-clean/src/index.js
          grep -q 'DEV_ORIGIN_MANIFEST_SESSION_REPLAY_V2' .diag-clean/src/origin-manifest-v1.js
          cp -R .diag-clean .diag-runtime

      - name: Add one-off guarded DEV diagnostic route
        working-directory: worker
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const file = '.diag-runtime/src/index.js';
          let source = fs.readFileSync(file, 'utf8');

          const postAnchor = [
            'async function post(body, env) {',
            '  const action = String(body.action || "");',
          ].join('\n');
          if (!source.includes(postAnchor)) throw new Error('POST anchor missing');

          const postReplacement = [
            'async function post(body, env) {',
            '  const action = String(body.action || "");',
            '  if (action === "devBusLiveAcceptance") {',
            '    const expected = String(env.DEV_BUS_DIAG_TOKEN || "");',
            '    const supplied = String(body.diagToken || "");',
            '    if (!expected || !supplied || supplied !== expected)',
            '      fail("Forbidden", "FORBIDDEN", 403);',
            '    const hub = String(body.hub || "").trim().toUpperCase();',
            '    if (!/^[A-Z0-9]{2,10}$/.test(hub))',
            '      fail("Invalid HUB", "INVALID_HUB", 400);',
            '    const actor = { username: "DEV_BUS_DIAG", role: "admin", branches: ["*"] };',
            '    const live = await refreshMsIfStale(env, actor, hub);',
            '    let diagnostics = busTimeDiagnostics(hub);',
            '    if (env.MS_REFRESH_COORDINATOR) {',
            '      const id = env.MS_REFRESH_COORDINATOR.idFromName(hub);',
            '      const stub = env.MS_REFRESH_COORDINATOR.get(id);',
            '      const target = new URL("https://ms-refresh.internal/diagnostics");',
            '      target.searchParams.set("branch", hub);',
            '      const response = await stub.fetch(new Request(target));',
            '      if (response.ok) diagnostics = await response.json();',
            '    }',
            '    return ok({',
            '      hub,',
            '      syncStatus: String(live?.status || ""),',
            '      syncErrorPresent: Boolean(live?.error),',
            '      diagnostics,',
            '    });',
            '  }',
          ].join('\n');
          source = source.replace(postAnchor, postReplacement);

          const doAnchor = [
            '    const branch = String(url.searchParams.get("branch") || "").trim().toUpperCase();',
            '    if (url.pathname === "/stream") return this.openStream(request, branch);',
          ].join('\n');
          if (!source.includes(doAnchor)) throw new Error('Durable Object fetch anchor missing');

          const doReplacement = [
            '    const branch = String(url.searchParams.get("branch") || "").trim().toUpperCase();',
            '    if (url.pathname === "/diagnostics")',
            '      return Response.json(busTimeDiagnostics(branch));',
            '    if (url.pathname === "/stream") return this.openStream(request, branch);',
          ].join('\n');
          source = source.replace(doAnchor, doReplacement);

          if (!source.includes('action === "devBusLiveAcceptance"')) throw new Error('diagnostic action missing');
          if (!source.includes('url.pathname === "/diagnostics"')) throw new Error('diagnostic DO route missing');
          fs.writeFileSync(file, source);
          NODE
          node --check .diag-runtime/src/index.js

      - name: Install temporary DEV diagnostic secret
        id: diag-secret
        working-directory: worker
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          printf '%s' "$TOKEN" | npx wrangler secret put DEV_BUS_DIAG_TOKEN --config wrangler.dev.jsonc

      - name: Deploy one-off DEV diagnostic runtime
        working-directory: worker
        run: |
          rm -rf .dev-assets .dev-runtime
          cp -R .diag-assets .dev-assets
          cp -R .diag-runtime .dev-runtime
          npx wrangler deploy .dev-runtime/src/turso-index.js --config wrangler.dev.jsonc

      - name: Run 4-second live acceptance against stored BusTime session
        id: live
        env:
          DIAG_TOKEN: ${{ steps.diag-secret.outputs.token }}
        run: |
          node <<'NODE'
          const base = process.env.WORKER_ORIGIN;
          const hub = process.env.ACCEPT_HUB;
          const token = process.env.DIAG_TOKEN;
          if (!base || !hub || !token) throw new Error('acceptance env missing');

          async function cycle(index) {
            const started = Date.now();
            const response = await fetch(`${base}/api`, {
              method: 'POST',
              headers: {'content-type': 'application/json', 'cache-control': 'no-cache'},
              body: JSON.stringify({
                action: 'devBusLiveAcceptance',
                hub,
                diagToken: token,
              }),
              cache: 'no-store',
            });
            const payload = await response.json().catch(() => ({}));
            if (!response.ok || !payload?.ok)
              throw new Error(`cycle ${index} HTTP ${response.status}: ${JSON.stringify(payload)}`);
            const data = payload.data || payload;
            const d = data.diagnostics || {};
            return {
              index,
              latencyMs: Date.now() - started,
              syncStatus: data.syncStatus || '',
              syncErrorPresent: Boolean(data.syncErrorPresent),
              mode: d.mode || '',
              busCallsLastMinute: Number(d.busCallsLastMinute || 0),
              busHotCalls: Number(d.busHotCalls || 0),
              busBackgroundCalls: Number(d.busBackgroundCalls || 0),
              busPagesLastCycle: Number(d.busPagesLastCycle || 0),
              busCacheHits: Number(d.busCacheHits || 0),
              busCacheMisses: Number(d.busCacheMisses || 0),
              busRateLimitCount: Number(d.busRateLimitCount || 0),
              busLastSuccessAt: d.busLastSuccessAt || '',
              busLastError: d.busLastError || '',
              busActiveRows: Number(d.busActiveRows || 0),
              busCooldownUntil: d.busCooldownUntil || '',
            };
          }

          const rows = [];
          for (let i = 1; i <= 16; i += 1) {
            const row = await cycle(i);
            rows.push(row);
            console.log(
              `CYCLE=${i} LATENCY_MS=${row.latencyMs} STATUS=${row.syncStatus || '-'} ` +
              `CALLS_1M=${row.busCallsLastMinute} HOT=${row.busHotCalls} BG=${row.busBackgroundCalls} ` +
              `PAGES=${row.busPagesLastCycle} ACTIVE=${row.busActiveRows} ` +
              `RATE_LIMITS=${row.busRateLimitCount} LAST_ERROR=${row.busLastError || '-'}`
            );
            if (i < 16) await new Promise(resolve => setTimeout(resolve, 4000));
          }

          const first = rows[0], last = rows.at(-1);
          const hotDelta = last.busHotCalls - first.busHotCalls;
          const bgDelta = last.busBackgroundCalls - first.busBackgroundCalls;
          const rateDelta = last.busRateLimitCount - first.busRateLimitCount;
          const providerDelta = hotDelta + bgDelta;
          const latencies = rows.map(r => r.latencyMs).sort((a,b)=>a-b);
          const avg = Math.round(rows.reduce((sum, r) => sum + r.latencyMs, 0) / rows.length);
          const p95 = latencies[Math.min(latencies.length - 1, Math.floor(latencies.length * 0.95))];

          console.log(`ACCEPT_HUB=${hub}`);
          console.log(`BUS_MODE=${last.mode || '-'}`);
          console.log(`BUS_PROVIDER_CALL_DELTA=${providerDelta}`);
          console.log(`BUS_HOT_CALL_DELTA=${hotDelta}`);
          console.log(`BUS_BACKGROUND_CALL_DELTA=${bgDelta}`);
          console.log(`BUS_RATE_LIMIT_DELTA=${rateDelta}`);
          console.log(`BUS_CALLS_LAST_MINUTE_FINAL=${last.busCallsLastMinute}`);
          console.log(`BUS_ACTIVE_ROWS_FINAL=${last.busActiveRows}`);
          console.log(`BUS_LAST_SUCCESS_AT=${last.busLastSuccessAt || '-'}`);
          console.log(`BUS_LAST_ERROR=${last.busLastError || '-'}`);
          console.log(`BUS_COOLDOWN_UNTIL=${last.busCooldownUntil || '-'}`);
          console.log(`ACCEPT_LATENCY_AVG_MS=${avg}`);
          console.log(`ACCEPT_LATENCY_P95_MS=${p95}`);
          console.log(`ACCEPT_SYNC_ERRORS=${rows.filter(r => r.syncErrorPresent).length}`);

          if (last.mode !== 'BUS_TIME_HOT_LANE_V14')
            throw new Error(`unexpected BusTime mode: ${last.mode}`);
          if (!last.busLastSuccessAt)
            throw new Error('no successful live BusTime provider read observed');
          if (rateDelta > 0 || last.busLastError === 'BUS_TIME_RATE_LIMIT')
            throw new Error(`BusTime rate limit observed: delta=${rateDelta}`);
          if (rows.some(r => r.busPagesLastCycle > 3))
            throw new Error('BusTime exceeded 3-call hard cap in a cycle');
          if (last.busCallsLastMinute > 48)
            throw new Error(`unexpected provider amplification: ${last.busCallsLastMinute} calls/minute`);
          NODE

      - name: Remove temporary diagnostic secret
        if: always()
        working-directory: worker
        run: |
          yes | npx wrangler secret delete DEV_BUS_DIAG_TOKEN --config wrangler.dev.jsonc || true

      - name: Restore normal DEV runtime
        if: always()
        working-directory: worker
        run: |
          rm -rf .dev-assets .dev-runtime
          cp -R .diag-assets .dev-assets
          cp -R .diag-clean .dev-runtime
          npx wrangler deploy .dev-runtime/src/turso-index.js --config wrangler.dev.jsonc

      - name: Verify normal DEV runtime restored
        if: always()
        run: |
          node <<'NODE'
          (async()=>{
            const base=process.env.WORKER_ORIGIN;
            const health=await fetch(`${base}/api?action=health`,{cache:'no-store'});
            const body=await health.json();
            if(!health.ok||!body?.ok) throw new Error(`DEV health failed ${health.status}`);
            const account=process.env.CLOUDFLARE_ACCOUNT_ID;
            const token=process.env.CLOUDFLARE_API_TOKEN;
            const headers={Authorization:`Bearer ${token}`};
            const name='waiting-trucks-report-api-dev';
            const settingsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/script-settings`,{headers});
            const settings=await settingsRes.json();
            if(!settingsRes.ok||!settings.success) throw new Error('Cloudflare settings read failed');
            const d1=(settings.result?.bindings||[]).filter(x=>x.type==='d1'||x.type==='d1_database');
            if(d1.length) throw new Error('DEV D1 binding reappeared');
            console.log('DEV_HEALTH_AFTER_ACCEPTANCE=PASS');
            console.log('DEV_D1_BINDING_AFTER_ACCEPTANCE=0');
            console.log('PRODUCTION_TOUCHED=NO');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
