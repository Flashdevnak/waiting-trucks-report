name: Diagnose DEV MS connection

on:
  push:
    branches:
      - diag-ms-connection
    paths:
      - .github/workflows/diagnose-dev-ms.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Read DEV connection state only
        run: |
          npx wrangler d1 execute DB --remote --config wrangler.dev.jsonc --command "SELECT 'routes' AS source,hub,updated_at,last_success_at,last_error FROM ms_connections WHERE hub='NE1'; SELECT 'preEntry' AS source,hub,updated_at,last_success_at,last_error FROM ms_preentry_connections WHERE hub='NE1'; SELECT 'busTime' AS source,hub,updated_at,last_success_at,last_error FROM ms_bus_connections WHERE hub='NE1'; SELECT 'liveCache' AS source,hub,synced_at,length(rows_json) AS rows_json_bytes FROM ms_live_cache WHERE hub='NE1';"
      - name: Check public DEV health
        run: curl --fail --silent --show-error "https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api?action=health"
