name: One-shot Safe DEV Real Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-safe-dev-db-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_API: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api
    steps:
      - name: Call real NE1 Route shadow exactly once
        shell: bash
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token) throw new Error('Cloudflare credentials missing');
          const headers={Authorization:`Bearer ${token}`,'content-type':'application/json'};
          const settingsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/waiting-trucks-ms-browser-test/script-settings`,{headers});
          const settings=await settingsRes.json();
          if(!settingsRes.ok||settings.success===false) throw new Error(`script-settings ${settingsRes.status}`);
          const bindings=Array.isArray(settings.result?.bindings)?settings.result.bindings:[];
          const state=bindings.find(x=>x.name==='STATE'&&(x.type==='kv_namespace'||x.type==='kv_namespace_binding'));
          const namespace=state?.namespace_id||state?.id;
          if(!namespace) throw new Error(`STATE namespace not found: ${JSON.stringify(bindings.map(x=>({name:x.name,type:x.type})))}`);
          const key=encodeURIComponent('connector:NE1');
          const valueRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/storage/kv/namespaces/${namespace}/values/${key}`,{headers:{Authorization:`Bearer ${token}`}});
          const connectorToken=await valueRes.text();
          if(!valueRes.ok||connectorToken.trim().length<20) throw new Error(`connector token unavailable ${valueRes.status}`);
          console.log(`::add-mask::${connectorToken.trim()}`);
          const started=Date.now();
          const response=await fetch(process.env.WORKER_API,{
            method:'POST',headers:{'content-type':'application/json'},
            body:JSON.stringify({action:'connectorSync',hub:'NE1',connectorToken:connectorToken.trim(),shadowOnly:true,shadowPart:'routes'}),
          });
          const body=await response.json().catch(()=>({}));
          console.log(`ROUTE_SHADOW_HTTP=${response.status}`);
          console.log(`ROUTE_SHADOW_CODE=${body?.code||'-'}`);
          console.log(`ROUTE_SHADOW_MESSAGE=${body?.message||'-'}`);
          console.log(`ROUTE_SHADOW_DURATION_MS=${Date.now()-started}`);
          const data=body?.data||{};
          console.log(`ROUTE_SHADOW_STATUS=${data.status||'-'}`);
          console.log(`ROUTE_SHADOW_ROWS=${Array.isArray(data.rows)?data.rows.length:-1}`);
          console.log(`ROUTE_SHADOW_SYNCED_AT=${data.syncedAt||'-'}`);
          console.log(`ROUTE_SHADOW_TURSO_POINT_READS=${data.shadowQuota?.tursoPointReadsThisCall??'-'}`);
          console.log(`ROUTE_SHADOW_TURSO_WRITES=${data.shadowQuota?.tursoWritesPerCron??'-'}`);
          console.log('D1_QUERIES=0');
          if(!response.ok||body?.ok===false) throw new Error(`REAL_ROUTE_SOURCE_FAILED: ${body?.code||response.status} ${body?.message||''}`);
          if(!Array.isArray(data.rows)) throw new Error('REAL_ROUTE_SOURCE_INVALID');
          console.log('REAL_ROUTE_SOURCE_CALL=PASS');
          NODE
