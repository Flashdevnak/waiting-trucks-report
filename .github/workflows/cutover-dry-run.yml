name: Cutover Dry Run

# Post-cutover invariant check. The actual Turso cutover is already complete.
# This workflow performs source/config validation only: no Cloudflare writes,
# no secret changes, no deploy, no database access and no push.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/cutover-tools/**
      - .github/dev-tools/**
      - .github/workflows/cutover-dry-run.yml
      - .github/workflows/deploy-worker-dev.yml
      - worker/wrangler.dev.jsonc

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    env:
      CUTOVER_VERSION: 20260903-04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate post-cutover source and safety invariants
        run: |
          node --check ms.js
          node --check worker/src/index.js
          node --check cloudflare-browser-test/src/index.js
          git diff --check
          node <<'NODE'
          const fs = require('fs');
          const ms = fs.readFileSync('ms.js','utf8');
          const worker = fs.readFileSync('worker/src/index.js','utf8');
          const style = fs.readFileSync('style.css','utf8');
          const browser = fs.readFileSync('cloudflare-browser-test/src/index.js','utf8');
          const sw = fs.readFileSync('sw.js','utf8');
          const version = JSON.parse(fs.readFileSync('version.json','utf8'));
          const wrangler = fs.readFileSync('worker/wrangler.dev.jsonc','utf8');
          const deploy = fs.readFileSync('.github/workflows/deploy-worker-dev.yml','utf8');
          const expected = 'https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const old = 'https://waiting-trucks-report.alert-squid-6738.chatgpt.site';
          const dailyStart = worker.indexOf('async function msDailyArchive');
          const dailyEnd = worker.indexOf('async function msArchiveTotal', dailyStart);
          const daily = dailyStart >= 0 && dailyEnd > dailyStart ? worker.slice(dailyStart, dailyEnd) : '';
          const checks = [
            [ms.includes(expected), 'GitHub Pages targets promoted Turso Worker'],
            [!ms.includes(old), 'root ms.js does not target OLD API'],
            [/pollMs:\s*4000/.test(ms), 'frontend polling remains 4 seconds'],
            [ms.includes('requestTimeoutMs: 32000'), 'realtime recovery is integrated'],
            [ms.includes('msCompletedToday'), 'daily completed cache UI is integrated'],
            [ms.includes('const preserveObservedCompletion ='), 'completed view remains stable across live polls'],
            [ms.includes('MS_DAILY_HISTORY_V1'), 'daily-history frontend contract is integrated'],
            [ms.includes('apiGet("msDailyArchive"'), 'history reads use the daily Turso endpoint'],
            [ms.includes('เลือกวันอย่างเดียวไม่อ่านฐานข้อมูล จนกว่าจะกดค้นหา'), 'date selection alone does not read history'],
            [ms.includes('function metricSourceRows()'), 'metric cards use today or the explicit searched range'],
            [ms.includes('Export ช่วงวันที่'), 'full-history export is replaced by range export'],
            [worker.includes('action === "msDailyArchive"'), 'Worker exposes daily-history endpoint'],
            [worker.includes('MS_DAILY_HISTORY_V1: read-only daily history'), 'Worker daily history is explicitly read-only'],
            [daily.includes('TURSO_DAILY_HISTORY') && daily.includes('upstreamMsCalls: 0') && daily.includes('historyWrites: 0'), 'daily history never refreshes MS or writes history'],
            [!daily.includes('readMsRoutes(') && !daily.includes('syncMs(') && !daily.includes('refreshMsIfStale('), 'daily history cannot call upstream refresh paths'],
            [daily.includes('31 * 86400000'), 'history search is limited to 31 days per request'],
            [style.includes('/* DEV mobile MS card spacing */'), 'mobile spacing is integrated'],
            [browser.includes(`${expected}/api`), 'Browser Cron targets promoted Turso Worker'],
            [browser.includes('/api/bootstrap-connector'), 'Browser connector bootstrap route remains available behind secret gate'],
            [browser.includes('CONNECTOR_BOOTSTRAP_SECRET'), 'Browser bootstrap remains secret-gated'],
            [sw.includes(`VERSION="${process.env.CUTOVER_VERSION}"`), 'service worker release version remains current'],
            [version.version === process.env.CUTOVER_VERSION, 'version.json release version remains current'],
            [wrangler.includes('"main": "src/turso-index.js"'), 'promoted Worker entrypoint is Turso'],
            [wrangler.includes('"DB_BACKEND": "turso"'), 'promoted Worker backend is Turso'],
            [!wrangler.includes('d1_databases'), 'promoted Worker config has no D1 binding'],
            [deploy.includes('Reject any remaining D1 binding before deploy'), 'normal DEV deploy rejects D1 rebinding'],
            [deploy.includes('daily-history.test.mjs'), 'normal DEV deploy gates daily-history contract'],
            [deploy.includes('TURSO_DATABASE_URL'), 'normal DEV deploy requires Turso credentials'],
          ];
          for (const [pass,label] of checks) {
            console.log(`${pass ? 'PASS' : 'FAIL'} ${label}`);
            if (!pass) process.exitCode = 1;
          }
          NODE
          test -z "$(git diff --name-only)"
          echo "CUTOVER_STATE=ALREADY_COMPLETE"
          echo "CUTOVER_DRY_RUN_MUTATIONS=0"
          echo "CUTOVER_DRY_RUN_DATABASE_ACCESS=0"
