name: SUP-12 Acceptance Harness Check

on:
  push:
    branches:
      - codex/sup-12-acceptance-boundary-fix
    paths:
      - .github/tests/ms-queue-first-source-v1.test.mjs
      - .github/tests/ms-schedule-timing-degraded.test.mjs
      - .github/workflows/sup12-acceptance-harness-check.yml

permissions:
  contents: read

jobs:
  acceptance-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify only acceptance harness changed from SUP-12 runtime
        run: |
          changed="$(git diff --name-only ff4c25c4d93fa3e6a386959376b5ad55e3e50faf HEAD)"
          printf '%s\n' "$changed"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^\.github/tests/ms-queue-first-source-v1\.test\.mjs$|^\.github/workflows/sup12-acceptance-harness-check\.yml$' || true)"
          test -z "$unexpected"
      - name: Verify first-source queue and degraded schedule timing
        run: node --test .github/tests/ms-queue-first-source-v1.test.mjs .github/tests/ms-schedule-timing-degraded.test.mjs
