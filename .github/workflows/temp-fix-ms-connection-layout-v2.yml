name: TEMP DEV MS Connection Layout V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-fix-ms-connection-layout-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python3 .github/dev-tools/patch-ms-connection-layout-v2.py
      - name: Validate syntax and diff
        run: |
          node --check ms.js
          git diff --check
      - name: Run focused staging regressions
        run: |
          cd worker
          npm ci
          npm run check
          node --test ../.github/dev-tools/stage-dev-runtime.test.mjs
          node --test ../.github/dev-tools/ms-durable-coordinator.test.mjs
      - name: Commit tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ms.html style.css
          git commit -m 'fix(dev): center MS connection modal with viewport scroll shell'
          git push origin HEAD:main
