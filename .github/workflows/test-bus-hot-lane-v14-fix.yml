name: Test BusTime Hot Lane V14 Fix

on:
  push:
    branches:
      - fix/bus-time-hot-lane-v14-stage
    paths:
      - .github/dev-tools/patch-bus-time-hot-lane-v14.mjs
      - .github/dev-tools/bus-time-hot-lane-v14-runtime.mjs
      - .github/dev-tools/bus-time-hot-lane-v14.test.mjs
      - .github/dev-tools/stage-dev-runtime.mjs
      - .github/workflows/test-bus-hot-lane-v14-fix.yml

permissions:
  contents: read

jobs:
  full-stage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax and focused BusTime behavior
        run: |
          node --check .github/dev-tools/patch-bus-time-hot-lane-v14.mjs
          node --check .github/dev-tools/bus-time-hot-lane-v14-runtime.mjs
          node --test .github/dev-tools/bus-time-hot-lane-v14.test.mjs
      - name: Exercise exact full DEV staging order
        working-directory: worker
        run: |
          rm -rf .dev-assets .dev-runtime
          mkdir -p .dev-assets .dev-runtime
          cp -R src .dev-runtime/src
          cp ../waiting.html ../admin.html ../admin.js ../admin.css ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../ms-v4.css ../sw.js ../favicon.svg .dev-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js .dev-runtime/src/index.js
          node --check .dev-runtime/src/index.js
          node --check .dev-runtime/src/bus-time-hot-lane-v14.js
          grep -q 'BUS_TIME_HOT_LANE_V14' .dev-runtime/src/index.js
          grep -q 'readBusTimeData(env, branch, liveSourceDays(), routeRows)' .dev-runtime/src/index.js
          grep -q 'fetchFn: fetchWithTimeout' .dev-runtime/src/index.js
          grep -q 'data.sourceFailed = Boolean(data.sourceStale)' .dev-runtime/src/index.js
          ! grep -q 'BUS_TIME_SOURCE_TTL_MS = 60 \* 1000' .dev-runtime/src/index.js
          echo BUS_TIME_FULL_STAGE_V14=PASS
