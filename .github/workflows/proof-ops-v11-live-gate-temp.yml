name: Proof Ops V11 Browser Live Gate Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-ops-v11-live-gate-temp.yml

permissions:
  contents: read

jobs:
  browser-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chromium
        run: |
          mkdir -p /tmp/proof-v11-live && cd /tmp/proof-v11-live
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify Proof V11 live UX, grouping, quota and runtime
        run: |
          cd /tmp/proof-v11-live
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1440,height:1000}});
              const requests=[], errors=[], failed=[];
              page.on('request',r=>requests.push(r.url()));
              page.on('pageerror',e=>errors.push(String(e.stack||e)));
              page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||''}`));
              const response=await page.goto(`${base}/proof.html?v11live=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response||!response.ok()) throw new Error(`proof.html HTTP ${response?.status()}`);
              await page.waitForFunction(()=>window.__PROOF_V10_READY__===true,{timeout:15000});
              await page.waitForTimeout(1500);
              const check=await page.evaluate(()=>{
                const P=window.ProofV2;
                const fd={lineName:'FD-4W-NE1-2PMY-07:00-BD-RO',lineTypeText:'Feeder',routeTypeText:'FD',proofState:1,proofId:''};
                const lh={lineName:'LH-6W-NE1-BURT-08:00-1-RO',lineTypeText:'LH',routeTypeText:'LH',proofState:1,proofId:''};
                return {
                  ready:window.__PROOF_V10_READY__===true,
                  command:!!document.getElementById('proof-command-center-v10'),
                  alertRemoved:!document.getElementById('alert-panel'),
                  fdTab:!!document.querySelector('[data-proof-v11-lane="FD"]'),
                  lhTab:!!document.querySelector('[data-proof-v11-lane="LH"]'),
                  remaining:!!document.querySelector('[data-proof-v10-count="remaining"]'),
                  unprinted:!!document.querySelector('[data-proof-v10-count="unprinted"]'),
                  printed:!!document.querySelector('[data-proof-v10-count="printed"]'),
                  departed:!!document.querySelector('[data-proof-v10-count="departed"]'),
                  extra:!!document.querySelector('[data-proof-v10-count="extra"]'),
                  notArrived:!!document.querySelector('[data-proof-v10-count="not-arrived"]'),
                  fdScope:P.proofLaneScope(fd),
                  lhScope:P.proofLaneScope(lh),
                  fdGroup:P.destinationKey(fd),
                  lhGroup:P.destinationKey(lh),
                  search:(document.getElementById('search-input')?.placeholder||''),
                  history:!!document.getElementById('proof-history-dialog-v10'),
                  v11Style:!!document.getElementById('proof-v11-style')
                };
              });
              if(!check.ready||!check.command||!check.alertRemoved||!check.fdTab||!check.lhTab||!check.v11Style) throw new Error(`V11 shell mismatch ${JSON.stringify(check)}`);
              if(!check.remaining||!check.unprinted||!check.printed||!check.departed||!check.extra||!check.notArrived) throw new Error(`V11 KPI mismatch ${JSON.stringify(check)}`);
              if(check.fdScope!=='FD'||check.lhScope!=='LH'||check.fdGroup!=='proof-lane:FD'||check.lhGroup!=='proof-lane:LH') throw new Error(`FD/LH grouping mismatch ${JSON.stringify(check)}`);
              if(!check.search.includes('ทะเบียนรถ')||!check.history) throw new Error(`search/history mismatch ${JSON.stringify(check)}`);
              if(requests.some(u=>u.includes('/api/proof/history'))) throw new Error('history background request detected');
              if(requests.some(u=>u.includes('/api/proof/plate-options'))) throw new Error('plate background request detected');
              if(errors.length) throw new Error(`browser errors: ${errors.join(' | ')}`);
              if(failed.some(x=>/proof-(?:v5|v10)/.test(x))) throw new Error(`proof asset request failed: ${failed.join(' | ')}`);
              const responsive=await Promise.race([
                page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>queueMicrotask(()=>resolve(true))))),
                new Promise((_,reject)=>setTimeout(()=>reject(new Error('freeze')),2500))
              ]);
              if(!responsive) throw new Error('page not responsive');
              for(const other of ['ms.html','waiting.html','ms-report.html']){
                const r=await page.request.get(`${base}/${other}?scope=${Date.now()}`);
                if(!r.ok()) throw new Error(`${other} HTTP ${r.status()}`);
                if((await r.text()).includes('/proof-v10.js')) throw new Error(`${other} contains Proof V10 runtime`);
              }
              console.log('PROOF_V11_BROWSER_READY=PASS');
              console.log('PROOF_V11_ALERT_HEADER_REMOVED=PASS');
              console.log('PROOF_V11_GROUP_FD_LH=PASS');
              console.log('PROOF_V11_OPERATIONAL_KPI=PASS');
              console.log('PROOF_V11_COMPACT_UX=PASS');
              console.log('PROOF_V11_HISTORY_ON_DEMAND=PASS');
              console.log('PROOF_V11_PLATE_BACKGROUND_SEARCH=0');
              console.log('PROOF_V11_HISTORY_BACKGROUND_READ=0');
              console.log('PROOF_BROWSER_NO_FREEZE=PASS');
              console.log('PROOF_SCOPE_ONLY=PASS');
              console.log('NEW_BACKGROUND_API=0');
              console.log('NEW_POLLING=0');
              console.log('NEW_HISTORY_WRITES=0');
              console.log('MS_MUTATION_TESTED=NO');
              console.log('PRODUCTION_TOUCHED=NO');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
