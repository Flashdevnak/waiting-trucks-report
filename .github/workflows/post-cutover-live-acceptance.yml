name: Post Cutover Live Acceptance

# Read-only production acceptance after the Turso cutover.
# This workflow never queries D1 and never mutates Worker/KV/Turso application data.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/post-cutover-live-acceptance.yml

permissions:
  contents: read

jobs:
  accept:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      PROMOTED_API: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
      BROWSER_ORIGIN: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
      PUBLIC_ORIGIN: https://flashdevnak.github.io/waiting-trucks-report
    steps:
      - name: Verify public frontend and promoted health
        run: |
          node <<'NODE'
          const stamp=Date.now();
          const base=process.env.PUBLIC_ORIGIN;
          const api=process.env.PROMOTED_API;
          const [htmlRes,jsRes,verRes,healthRes,browserRes]=await Promise.all([
            fetch(`${base}/ms.html?v=${stamp}`,{cache:'no-store'}),
            fetch(`${base}/ms.js?v=${stamp}`,{cache:'no-store'}),
            fetch(`${base}/version.json?v=${stamp}`,{cache:'no-store'}),
            fetch(`${api}/api?action=health`,{cache:'no-store'}),
            fetch(`${process.env.BROWSER_ORIGIN}/api/config`,{cache:'no-store'}),
          ]);
          for (const [name,res] of [['ms.html',htmlRes],['ms.js',jsRes],['version',verRes],['health',healthRes],['browser',browserRes]]) {
            if(!res.ok) throw new Error(`${name} HTTP ${res.status}`);
          }
          const html=await htmlRes.text();
          const js=await jsRes.text();
          const ver=await verRes.json();
          const health=await healthRes.json();
          const browser=await browserRes.json();
          if(!html.includes('ms.js')) throw new Error('Public ms.html does not load ms.js');
          if(!js.includes(api)) throw new Error('Public ms.js is not targeting promoted Turso API');
          if(!/pollMs:\s*4000/.test(js)) throw new Error('Public polling interval is not 4000 ms');
          if(!js.includes('const preserveObservedCompletion =')) throw new Error('Completed-view stability patch missing');
          if(!health?.ok) throw new Error(`Promoted health failed: ${JSON.stringify(health)}`);
          if(!browser?.ok) throw new Error(`Browser config failed: ${JSON.stringify(browser)}`);
          console.log(`PUBLIC_VERSION=${ver.version||'-'}`);
          console.log('PUBLIC_TURSO_TARGET=PASS');
          console.log('PUBLIC_POLL_4S=PASS');
          console.log('COMPLETED_VIEW_PATCH=PASS');
          console.log('PROMOTED_HEALTH=PASS');
          console.log('BROWSER_ORIGIN=PASS');
          NODE

      - name: Verify Cloudflare runtime topology without D1 access
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          if(!account||!token) throw new Error('Cloudflare credentials missing');
          const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
          const base=`https://api.cloudflare.com/client/v4/accounts/${account}`;
          async function raw(path){
            const response=await fetch(`${base}${path}`,{headers});
            const body=await response.json().catch(()=>({}));
            return {response,body};
          }
          async function get(path){
            const {response,body}=await raw(path);
            if(!response.ok||body.success===false) throw new Error(`${path} HTTP ${response.status}: ${JSON.stringify(body.errors||body)}`);
            return body.result;
          }
          async function script(name){
            const [scriptSettings,secrets,deployments]=await Promise.all([
              get(`/workers/scripts/${name}/script-settings`),
              get(`/workers/scripts/${name}/secrets`),
              get(`/workers/scripts/${name}/deployments`),
            ]);
            const bindings=Array.isArray(scriptSettings?.bindings)?scriptSettings.bindings:[];
            const d1=bindings.filter(x=>x.type==='d1'||x.type==='d1_database');
            const secretNames=(Array.isArray(secrets)?secrets:[]).map(x=>x.name);
            if(d1.length) throw new Error(`${name} still has D1 binding`);
            if(secretNames.includes('CONNECTOR_BOOTSTRAP_SECRET')) throw new Error(`${name} still exposes one-time bootstrap secret`);
            const active=deployments?.deployments?.[0];
            const version=[...(active?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]?.version_id||'';
            console.log(`${name.toUpperCase().replaceAll('-','_')}_ACTIVE_VERSION=${version||'-'}`);
            console.log(`${name.toUpperCase().replaceAll('-','_')}_D1_BINDING=0`);
            console.log(`${name.toUpperCase().replaceAll('-','_')}_BOOTSTRAP_SECRET=0`);
          }
          await script('waiting-trucks-report-api-dev');
          await script('waiting-trucks-ms-browser-test');
          const browserSettings=await get('/workers/scripts/waiting-trucks-ms-browser-test/settings');
          const browserBindings=Array.isArray(browserSettings?.bindings)?browserSettings.bindings:[];
          const state=browserBindings.find(x=>x.name==='STATE'&&x.type==='kv_namespace');
          if(!state?.namespace_id) throw new Error(`Browser STATE KV binding missing: ${JSON.stringify(browserBindings.map(x=>({name:x.name,type:x.type})))}`);
          console.log('BROWSER_STATE_KV_BINDING=PASS');
          const {response:keyRes,body:keyBody}=await raw(`/storage/kv/namespaces/${state.namespace_id}/keys?limit=100`);
          if(keyRes.ok&&keyBody.success!==false){
            const names=(Array.isArray(keyBody.result)?keyBody.result:[]).map(x=>x.name);
            if(!names.includes('hubs')||!names.includes('connector:NE1')) throw new Error(`Browser connector keys missing: ${JSON.stringify(names.filter(x=>x==='hubs'||x.startsWith('connector:')))}`);
            console.log('BROWSER_KV_HUBS=PASS');
            console.log('BROWSER_KV_CONNECTOR_NE1=PASS');
          }else if(keyRes.status===401||keyRes.status===403){
            console.log(`BROWSER_KV_KEY_NAMES=UNVERIFIED_PERMISSION_${keyRes.status}`);
          }else{
            throw new Error(`Browser KV key listing HTTP ${keyRes.status}: ${JSON.stringify(keyBody.errors||keyBody)}`);
          }
          console.log('CLOUDFLARE_D1_API_CALLS=0');
          NODE

      - name: Inspect Turso live state and connection health
        run: |
          node <<'NODE'
          const org=process.env.TURSO_ORG, db=process.env.TURSO_DATABASE, platform=process.env.TURSO_PLATFORM_API_TOKEN;
          if(!platform) throw new Error('Turso platform token missing');
          const headers={Authorization:`Bearer ${platform}`};
          const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers});
          const dbJson=await dbRes.json();
          if(!dbRes.ok) throw new Error(`Turso DB lookup HTTP ${dbRes.status}: ${JSON.stringify(dbJson)}`);
          const database=dbJson.database||dbJson;
          const hostname=database.Hostname||database.hostname;
          if(!hostname) throw new Error('Turso hostname missing');
          const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,{method:'POST',headers});
          const tokenJson=await tokenRes.json();
          const dbToken=tokenJson.jwt;
          if(!tokenRes.ok||!dbToken) throw new Error(`Turso auth token HTTP ${tokenRes.status}`);
          console.log(`::add-mask::${dbToken}`);
          async function query(sql){
            const response=await fetch(`https://${hostname}/v2/pipeline`,{
              method:'POST',
              headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},
              body:JSON.stringify({requests:[{type:'execute',stmt:{sql}},{type:'close'}]}),
            });
            const payload=await response.json();
            const item=payload?.results?.[0];
            if(!response.ok||item?.type==='error') throw new Error(`Turso query failed: ${JSON.stringify(item?.error||payload)}`);
            return item?.response?.result;
          }
          const decode=v=>v==null?null:(typeof v==='object'&&v.type?v.value:v);
          const rows=result=>(result?.rows||[]).map(row=>row.map(decode));
          const [connectorResult,liveResult,connectionResult]=await Promise.all([
            query("SELECT hub,active,last_used_at FROM ms_connector_tokens WHERE hub='NE1' LIMIT 1"),
            query("SELECT hub,source_hash,synced_at,rows_json FROM ms_live_cache WHERE hub='NE1' LIMIT 1"),
            query("SELECT hub,updated_at,last_success_at,last_error FROM ms_connections WHERE hub='NE1' LIMIT 1"),
          ]);
          const connector=rows(connectorResult)[0]||[];
          const live=rows(liveResult)[0]||[];
          const connection=rows(connectionResult)[0]||[];
          if(String(connector[0]||'')!=='NE1'||Number(connector[1]||0)!==1) throw new Error('NE1 connector inactive or missing');
          if(String(live[0]||'')!=='NE1') throw new Error('NE1 live cache missing');
          let liveRows=[];
          try{liveRows=JSON.parse(String(live[3]||'[]'));}catch{throw new Error('NE1 live cache rows_json is invalid JSON');}
          if(!Array.isArray(liveRows)) throw new Error('NE1 live cache is not an array');
          const now=Date.now();
          const syncedAt=String(live[2]||'');
          const syncAgeMs=syncedAt?now-Date.parse(syncedAt):Infinity;
          const lastSuccess=String(connection[2]||'');
          const lastError=String(connection[3]||'');
          console.log(`TURSO_CONNECTOR_HUB=${connector[0]||'-'}`);
          console.log(`TURSO_CONNECTOR_ACTIVE=${Number(connector[1]||0)}`);
          console.log(`TURSO_CONNECTOR_LAST_USED=${connector[2]||'-'}`);
          console.log(`TURSO_LIVE_SYNCED_AT=${syncedAt||'-'}`);
          console.log(`TURSO_LIVE_SYNC_AGE_SECONDS=${Number.isFinite(syncAgeMs)?Math.max(0,Math.round(syncAgeMs/1000)):-1}`);
          console.log(`TURSO_LIVE_ROWS=${liveRows.length}`);
          console.log(`MS_CONNECTION_LAST_SUCCESS=${lastSuccess||'-'}`);
          console.log(`MS_CONNECTION_LAST_ERROR=${lastError||'-'}`);
          const byState={};
          const byAttendance={};
          for(const row of liveRows){
            const state=String(row?.unloadingState??row?.status??'unknown');
            const attendance=String(row?.attendanceType??row?.taskType??row?.workType??'unknown');
            byState[state]=(byState[state]||0)+1;
            byAttendance[attendance]=(byAttendance[attendance]||0)+1;
          }
          console.log(`TURSO_LIVE_STATE_COUNTS=${JSON.stringify(byState)}`);
          console.log(`TURSO_LIVE_ATTENDANCE_COUNTS=${JSON.stringify(byAttendance)}`);
          console.log('TURSO_READONLY_ACCEPTANCE=PASS');
          console.log('D1_QUERIES=0');
          NODE
