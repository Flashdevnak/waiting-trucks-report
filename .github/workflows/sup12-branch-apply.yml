name: SUP-12 Branch Apply

on:
  push:
    branches:
      - codex/sup-12-leak-circuit-backoff-kill-switch
    paths:
      - .github/dev-tools/apply-sup12.mjs
      - .github/workflows/sup12-branch-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sup-12-leak-circuit-backoff-kill-switch
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply SUP-12 forward patch
        run: node .github/dev-tools/apply-sup12.mjs
      - name: Syntax and full regression
        working-directory: worker
        run: |
          npm ci
          npm run check
      - name: Verify branch scope and diff
        run: |
          git diff --check
          git diff --name-only | sort
          test -z "$(git diff --name-only | grep -E '(^|/)(wrangler\.jsonc|wrangler\.toml)$|production|prod-' || true)"
      - name: Commit canonical SUP-12 branch result
        run: |
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git add worker/src/turso-d1.js .github/dev-tools/patch-supervisor-quota-instrumentation.mjs supervisor.js supervisor.html worker/tests worker/package.json
          git commit -m "SUP-12: add quota protection contracts [skip ci]"
          git push origin HEAD:codex/sup-12-leak-circuit-backoff-kill-switch
