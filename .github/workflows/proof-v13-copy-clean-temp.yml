name: Proof V13 Copy Clean Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v13-copy-clean-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  clean-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Clean visible system wording
        run: python3 .github/dev-tools/proof-v13-copy-clean-temp.py
      - name: Validate
        run: |
          ! grep -q 'MS state 7' proof.html
          ! grep -q 'MS state 3' proof.html
          ! grep -q 'lineMode รถเสริม' proof.html
          ! grep -q "class='privacy-note'" proof.html
          node --check worker/src/proof-ui-v10.js
          cd worker
          npm ci --no-audit --no-fund
          npm run check
          echo 'PROOF_V13_COPY=PASS'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit cleanup
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add proof.html
          git commit -m 'Clean Proof operator wording'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
