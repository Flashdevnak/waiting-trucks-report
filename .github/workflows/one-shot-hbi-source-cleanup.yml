# one-shot: source cleanup only; self-deletes after all regressions pass
name: One-shot HBI source cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-hbi-source-cleanup.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Replace authoritative source only
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          # Dedicated HBI photo request: successful CBI/Wujie HAR preflight proves
          # Authorization is required. It is the same location auth already stored
          # from the dedicated HBI HAR, so no second credential source is added.
          path = Path("worker/src/index.js")
          text = path.read_text()
          old = '    "BI-PLATFORM": "",\n    Origin: "https://cbi-fbi.flashexpress.com",'
          new = '    "BI-PLATFORM": "",\n    // HBI_WUJIE_AUTH_HEADER_V1: CBI sends authorization=<location auth>.\n    // HAR exports may redact this GET header even though its preflight exposes it.\n    Authorization: credentials?.auth || "",\n    Origin: "https://cbi-fbi.flashexpress.com",'
          path.write_text(replace_once(text, old, new, "HBI Authorization header"))

          # Remove the manifest component's runtime CSS owner. Its data/render/scheduler
          # behavior remains untouched; ms-v4.css becomes the single style owner.
          path = Path("worker/src/origin-manifest-v1.js")
          text = path.read_text()
          start_marker = '  function installStyle() {'
          end_marker = '  const manifestCache = new Map();'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise RuntimeError("origin manifest style boundaries are not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          text = text[:start] + text[end:]
          text = replace_once(text, '    installStyle();\n', '', "origin manifest init style call")
          path.write_text(text)

          # Replace the existing color-only badge fragment instead of appending another
          # override. Mobile badge explicitly spans both parent grid columns, then owns
          # its own 50/50 two-cell row.
          path = Path("ms-v4.css")
          text = path.read_text()
          start_marker = 'html body.ms-page .origin-manifest-badge { color: #5b6064 !important; background: transparent !important; }'
          end_marker = 'html body.ms-page .origin-manifest-badge strong { color: #151515 !important; }'
          if text.count(start_marker) != 1 or text.count(end_marker) != 1:
              raise RuntimeError("origin manifest CSS owner boundaries are not unique")
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''/* ORIGIN_MANIFEST_BADGE_V2 — single static style owner; no runtime style injection. */
          html body.ms-page .origin-manifest-badge {
            width: min(100%, 390px);
            max-width: 100%;
            margin: 8px auto 0;
            padding: 0;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
            background: transparent !important;
            color: #5b6064 !important;
            font-size: 12px;
            line-height: 1.25;
          }
          html body.ms-page .origin-manifest-badge > span {
            min-width: 0;
            min-height: 36px;
            padding: 7px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            border: 1px solid #d1d3d0 !important;
            border-radius: 7px;
            background: #ffffff !important;
            color: #5b6064 !important;
            text-align: center;
          }
          html body.ms-page .origin-manifest-badge > span:first-child { border-top: 3px solid #ffd400 !important; }
          html body.ms-page .origin-manifest-badge > span:last-child { border-top: 3px solid #202124 !important; }
          html body.ms-page .origin-manifest-badge strong { color: #151515 !important; font-weight: 900; }
          html body.ms-page .compact-card-head .origin-manifest-badge { margin-top: 8px; }
          @media (max-width: 700px) {
            html body.ms-page .compact-card-head .origin-manifest-badge {
              grid-column: 1 / -1;
              width: 100%;
              max-width: none;
              grid-template-columns: repeat(2, minmax(0, 1fr));
              gap: 8px;
              justify-self: stretch;
            }
            html body.ms-page .compact-card-head .origin-manifest-badge > span {
              flex-direction: column;
              gap: 2px;
              padding: 7px 6px;
              white-space: nowrap;
            }
            html body.ms-page .compact-card-head .origin-manifest-badge > span strong { white-space: nowrap; }
          }'''
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          path.write_text(text[:start] + replacement + text[end:])

          # Strengthen the existing focused test instead of creating a parallel suite.
          path = Path("worker/tests/hbi-truck-photos.test.mjs")
          text = path.read_text()
          anchor = '  assert.match(read, /"Accept-Language": credentials\\?\\.lang \\|\\| "th"/);\n'
          addition = (
              anchor
              + '  assert.match(read, /Authorization: credentials\\?\\.auth \\|\\| ""/);\n'
              + '  assert.equal((worker.match(/async function readHbiTruckPhotos/g) || []).length, 1);\n'
              + '  assert.equal((worker.match(/async function msTruckPhotos/g) || []).length, 1);\n'
          )
          text = replace_once(text, anchor, addition, "HBI focused assertions")

          mobile_start = 'test("mobile origin manifest keeps shipped parcels and weight on the same row", () => {'
          next_test = 'test("LH Manifest never marks HBI photos ready and worker never falls back to its session", () => {'
          if text.count(mobile_start) != 1 or text.count(next_test) != 1:
              raise RuntimeError("mobile manifest test boundaries are not unique")
          start = text.index(mobile_start)
          end = text.index(next_test, start)
          mobile_test = '''test("mobile origin manifest keeps shipped parcels and weight on one full-width 50/50 row", () => {
            const html = fs.readFileSync(new URL("../../ms.html", import.meta.url), "utf8");
            const baseStyle = fs.readFileSync(new URL("../../style.css", import.meta.url), "utf8");
            const msStyle = fs.readFileSync(new URL("../../ms-v4.css", import.meta.url), "utf8");
            const manifest = fs.readFileSync(new URL("../src/origin-manifest-v1.js", import.meta.url), "utf8");
            assert.doesNotMatch(html, /\\.ms-page \\.origin-manifest-badge/);
            assert.doesNotMatch(baseStyle, /origin-manifest-badge/);
            assert.doesNotMatch(manifest, /origin-manifest-style-v1|function installStyle\\(\\)|\\.origin-manifest-badge \\{/);
            assert.match(msStyle, /ORIGIN_MANIFEST_BADGE_V2/);
            assert.match(msStyle, /grid-template-columns: repeat\\(2, minmax\\(0, 1fr\\)\\)/);
            assert.match(msStyle, /@media \\(max-width: 700px\\)[\\s\\S]*?compact-card-head \\.origin-manifest-badge[\\s\\S]*?grid-column: 1 \\/ -1;[\\s\\S]*?width: 100%;[\\s\\S]*?max-width: none;/);
            assert.match(msStyle, /@media \\(max-width: 700px\\)[\\s\\S]*?white-space: nowrap;/);
          });

          '''
          mobile_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in mobile_test.splitlines()) + '\n'
          path.write_text(text[:start] + mobile_test + text[end:])

          print("SOURCE_CLEANUP=APPLIED")
          PY

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Focused source and quota regression
        run: |
          node --check worker/src/index.js
          node --check worker/src/origin-manifest-v1.js
          node --test worker/tests/hbi-truck-photos.test.mjs
          node .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs --self-test
          node --test .github/dev-tools/ms-durable-coordinator.test.mjs
          node --test .github/dev-tools/ms-quota-safe-live.test.mjs
          git diff --check

      - name: Full worker regression
        working-directory: worker
        run: npm run check

      - name: Commit source fix and self-delete
        run: |
          git rm .github/workflows/one-shot-hbi-source-cleanup.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/index.js worker/src/origin-manifest-v1.js worker/tests/hbi-truck-photos.test.mjs ms-v4.css
          git commit -m "fix(dev): clean HBI auth and manifest mobile source"
          git push origin HEAD:main

      - name: Dispatch existing DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --ref main
