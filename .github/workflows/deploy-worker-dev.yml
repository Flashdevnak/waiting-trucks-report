name: Deploy Worker DEV

# DEV-only pipeline. Runtime is Turso-only. The former D1 database is a frozen
# rollback snapshot and is never bound or queried by this normal deploy path.
# Trigger: MS_QUOTA_SAFE_LIVE_V1

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-worker-dev.yml
      - .github/dev-tools/**
      - ms.html
      - ms.js
      - proof.html
      - proof.js
      - 'proof-v2-*.js'
      - style.css
      - sw.js
      - favicon.svg
      - worker/src/**
      - worker/tests/**
      - worker/scripts/**
      - worker/package.json
      - worker/package-lock.json
      - worker/wrangler.dev.jsonc
      - worker/migrations/**

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Verify 100-device 180-day auth session resilience
        run: node --test tests/auth-session-resilience.test.mjs
      - run: node --test tests/dev-archive-patch.test.mjs
      - run: node --test ../.github/dev-tools/ms-realtime-recovery.test.mjs
      - run: node --test ../.github/dev-tools/ms-summary-filter.test.mjs
      - run: node --test ../.github/dev-tools/ms-multiclient-dedupe.test.mjs
      - run: node --test ../.github/dev-tools/ms-durable-coordinator.test.mjs
      - run: node --test ../.github/dev-tools/safe-parity.test.mjs
      - run: node --test ../.github/dev-tools/ms-connector-adoption.test.mjs
      - run: node --test ../.github/dev-tools/ms-route-cancellation.test.mjs
      - run: node --test ../.github/dev-tools/ms-archive-completeness.test.mjs
      - run: node --test ../.github/dev-tools/daily-history.test.mjs
      - run: node --test ../.github/dev-tools/ms-quota-safe-live.test.mjs
      - run: node --test ../.github/dev-tools/stage-dev-runtime.test.mjs
      - name: Reject any remaining D1 binding before deploy
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('wrangler.dev.jsonc', 'utf8');
          if (!text.includes('"main": "src/turso-index.js"'))
            throw new Error('DEV entrypoint is not Turso');
          if (!text.includes('"DB_BACKEND": "turso"'))
            throw new Error('DEV DB_BACKEND is not Turso');
          if (text.includes('d1_databases'))
            throw new Error('D1 binding is forbidden in the normal DEV deploy config');
          if (!text.includes('"crons": ["* * * * *"]'))
            throw new Error('DEV proof snapshot cron is missing');
          console.log('DEV_TURSO_CONFIG=PASS');
          console.log('DEV_D1_CONFIG_BINDING=0');
          console.log('DEV_PROOF_CRON=1_MINUTE');
          NODE
      - name: Stage DEV frontend assets and worker patch
        run: |
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../sw.js ../favicon.svg .dev-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js src/index.js
          node --check .dev-assets/ms.js
          node --check .dev-assets/proof.js
          node --check .dev-assets/proof-v2-core.js
          node --check .dev-assets/proof-v2-ui.js
          node --check .dev-assets/proof-v2-actions.js
          node --check src/index.js
          node --check src/turso-d1.js
          node --check src/turso-index.js
          node --check src/proof-control.js
          node --check src/proof-live-v2.js
          node <<'NODE'
          const fs=require('node:fs');
          const front=fs.readFileSync('.dev-assets/ms.js','utf8');
          const proofFront=fs.readFileSync('.dev-assets/proof.js','utf8');
          const proofHtml=fs.readFileSync('.dev-assets/proof.html','utf8');
          const proofWorker=fs.readFileSync('src/proof-control.js','utf8');
          const proofV2=fs.readFileSync('src/proof-live-v2.js','utf8');
          const proofV2Front=fs.readFileSync('.dev-assets/proof-v2-core.js','utf8')+fs.readFileSync('.dev-assets/proof-v2-ui.js','utf8')+fs.readFileSync('.dev-assets/proof-v2-actions.js','utf8');
          const worker=fs.readFileSync('src/index.js','utf8');
          for(const marker of ['MS_DAILY_HISTORY_V1','pollMs: 4000','apiGet("msDailyArchive"','เลือกวันอย่างเดียวไม่อ่านฐานข้อมูล จนกว่าจะกดค้นหา'])
            if(!front.includes(marker)) throw new Error(`staged frontend missing ${marker}`);
          if(!worker.includes('MS_DAILY_HISTORY_V1: read-only daily history')) throw new Error('staged worker missing daily-history contract');
          if(!worker.includes('upstreamMsCalls: 0') || !worker.includes('historyWrites: 0')) throw new Error('daily-history read-only evidence missing');
          if(!worker.includes('MS_QUOTA_SAFE_LIVE_V1')) throw new Error('staged worker missing quota-safe live contract');
          if(!worker.includes('baselineRows: (currentCache || cache)?.rows || null')) throw new Error('staged worker does not pass live-cache baseline');
          if(!worker.includes('AUTH_SESSION_RESILIENCE_V1')) throw new Error('staged worker lost auth-session resilience contract');
          if(!worker.includes('AUTH_VERIFY_UNAVAILABLE')) throw new Error('staged worker lost transient auth outage handling');
          for(const marker of ['/api/proof/routes','/api/proof/profile','/api/proof/print','pollMs: 30_000'])
            if(!proofFront.includes(marker)) throw new Error(`proof frontend missing ${marker}`);
          for(const marker of ['/api/proof/routes-v2','/api/proof/ack','standbyLeadMinutes:60','lineMode'])
            if(!proofV2Front.includes(marker)) throw new Error(`proof V2 frontend missing ${marker}`);
          for(const marker of ['/fleet/van/proof/find','estimate_end_time','estimate_start_time','ms_proof_details_v2'])
            if(!proofV2.includes(marker)) throw new Error(`proof V2 worker missing ${marker}`);
          if(!proofHtml.includes('ปุ่มยกเลิกรถยังปิดไว้')) throw new Error('proof cancel safety notice missing');
          for(const marker of ['ms_proof_snapshots','ms_proof_events','ms_proof_print_log','pageSize: \'100\''])
            if(!proofWorker.includes(marker)) throw new Error(`proof worker missing ${marker}`);
          if(proofWorker.includes('/fleet/van/proof/cancel_car') || proofV2.includes('/fleet/van/proof/cancel_car')) throw new Error('proof worker must not send cancel_car commands');
          console.log('STAGED_DAILY_HISTORY=PASS');
          console.log('STAGED_QUOTA_SAFE_LIVE=PASS');
          console.log('STAGED_AUTH_SESSION_RESILIENCE=PASS');
          console.log('STAGED_AUTH_TRANSIENT_OUTAGE_HANDLING=PASS');
          console.log('STAGED_POLL_MS=4000');
          console.log('STAGED_PROOF_CONTROL=PASS');
          console.log('STAGED_PROOF_V2=PASS');
          console.log('STAGED_PROOF_CANCEL_COMMANDS=0');
          NODE
      - name: Verify Turso and auth secrets exist on DEV Worker
        run: |
          npx wrangler secret list --config wrangler.dev.jsonc > /tmp/worker-secrets.json
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/worker-secrets.json', 'utf8');
          const required = ['TURSO_DATABASE_URL','TURSO_AUTH_TOKEN','AUTH_SECRET','PASSWORD_PEPPER'];
          const missing = required.filter((name) => !text.includes(name));
          if (missing.length) {
            console.error(`Missing required DEV Worker secrets: ${missing.join(', ')}`);
            process.exit(2);
          }
          console.log('DEV_TURSO_SECRETS=PASS');
          console.log('DEV_AUTH_SECRETS=PASS');
          NODE
      - name: Deploy DEV Worker on Turso
        run: npx wrangler deploy --config wrangler.dev.jsonc
      - name: Verify active Worker has zero D1 bindings
        working-directory: .
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const name='waiting-trucks-report-api-dev';
          const headers={Authorization:`Bearer ${token}`};
          const deploymentsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`,{headers});
          const deployments=await deploymentsRes.json();
          if(!deploymentsRes.ok || !deployments.success)
            throw new Error(`deployments HTTP ${deploymentsRes.status}: ${JSON.stringify(deployments.errors||deployments)}`);
          const active=deployments.result?.deployments?.[0];
          const versions=active?.versions||[];
          if(!versions.length) throw new Error('No active Worker version returned');
          const activeVersion=versions.sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]?.version_id;
          console.log(`ACTIVE_DEV_VERSION=${activeVersion}`);
          console.log(`ACTIVE_DEPLOYED_AT=${active.created_on}`);
          const settingsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/script-settings`,{headers});
          const settings=await settingsRes.json();
          if(!settingsRes.ok || !settings.success) throw new Error(`settings HTTP ${settingsRes.status}`);
          const bindings=settings.result?.bindings||[];
          const d1Bindings=bindings.filter(x=>x.type==='d1' || x.type==='d1_database');
          console.log(`D1_BINDING_COUNT=${d1Bindings.length}`);
          if(d1Bindings.length) throw new Error('Active DEV Worker exposes a D1 binding');
          console.log('WORKER_D1_BINDING_ZERO=PASS');
          console.log('TURSO_SECRET_NAMES_VERIFIED_PREDEPLOY=PASS');
          console.log('AUTH_SECRET_NAMES_VERIFIED_PREDEPLOY=PASS');
          NODE
      - name: Smoke DEV public health and proof page
        working-directory: .
        run: |
          sleep 3
          curl --fail --show-error --silent \
            'https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api?action=health' \
            | tee /tmp/dev-health.json
          curl --fail --show-error --silent \
            'https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/proof.html' \
            | grep -q 'จัดการเส้นทางเดินรถ MS'
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/dev-health.json','utf8'));
          if(!payload?.ok) throw new Error(`DEV health failed: ${JSON.stringify(payload)}`);
          console.log('DEV_HEALTH=PASS');
          console.log('DEV_PROOF_PAGE=PASS');
          console.log('DEV_DATABASE_BACKEND=TURSO');
          console.log('DEV_D1_RUNTIME_BINDING=0');
          NODE
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}