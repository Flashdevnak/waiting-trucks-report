name: TEMP DEV 401 Expiry Hint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python3 .github/dev-tools/patch-ms-401-expiry-hint.py
      - name: Test
        run: |
          node --check ms.js
          node --check .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          node --test .github/dev-tools/ms-self-healing-supervisor.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          grep -F 'action === "msRepairStatus"' .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          grep -F 'MS_SESSION_HTTP_401' ms.js
          grep -F 'source-expiry-hint' ms.css
          git diff --check
      - name: Commit tested DEV feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dev-tools/patch-ms-self-healing-supervisor.mjs ms.js ms.css
          git commit -m 'feat(dev): explain MS 401 expiry in connection dialog'
          git push origin HEAD:main

# trigger: backend anchor aligned
