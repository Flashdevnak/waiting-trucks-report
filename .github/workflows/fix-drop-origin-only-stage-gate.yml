name: Fix Drop Origin Only Stage Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-drop-origin-only-stage-gate.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch staged cancellation expectation
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const path='.github/dev-tools/stage-dev-runtime.test.mjs';
          let s=fs.readFileSync(path,'utf8');
          s=s.replace(
            'test("destination rows never expose or accept manual cancellation", () => {',
            'test("only origin rows expose manual cancellation", () => {'
          );
          s=s.replace(
            'assert.equal((first.match(/q\\.active && !isDestination\\(row\\)/g) || []).length, 2);',
            'assert.equal((first.match(/q\\.active && isOrigin\\(row\\)/g) || []).length, 2);\n  assert.doesNotMatch(first, /q\\.active && !isDestination\\(row\\)/);'
          );
          if(!s.includes('only origin rows expose manual cancellation')) throw new Error('test name patch failed');
          if(!s.includes('first.match(/q\\.active && isOrigin\\(row\\)/g)')) throw new Error('origin-only assertion patch failed');
          fs.writeFileSync(path,s);
          NODE
      - name: Run staged runtime tests
        run: node --test .github/dev-tools/stage-dev-runtime.test.mjs
      - name: Commit tested gate
        run: |
          if git diff --quiet -- .github/dev-tools/stage-dev-runtime.test.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dev-tools/stage-dev-runtime.test.mjs
          git commit -m "Test origin-only route cancellation UI"
          git push origin HEAD:main
