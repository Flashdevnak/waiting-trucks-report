name: Copy Sites data to Worker DEV

# Manual, DEV-only snapshot copy. This never targets the production D1 database.
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: waiting-trucks-dev-data-copy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Confirm exact DEV database configuration
        run: |
          grep -F '"database_name": "waiting-trucks-report-dev-db"' wrangler.dev.jsonc
          grep -F '"database_id": "798db282-46cd-4b2c-bfca-3d6d29596451"' wrangler.dev.jsonc
      - name: Apply additive schema migrations to DEV
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.dev.jsonc
      - name: Copy and verify the Sites snapshot
        run: node scripts/import-sites-dev.mjs
        env:
          MIGRATION_SOURCE_API: https://waiting-trucks-report.alert-squid-6738.chatgpt.site/api
          MIGRATION_TRANSFER_TOKEN: ${{ secrets.MIGRATION_TRANSFER_TOKEN }}
      - name: Deploy DEV shadow Worker with migrated secrets
        run: npx wrangler deploy --config wrangler.dev.jsonc
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
