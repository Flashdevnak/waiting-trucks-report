name: Proof V15 Live Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v15-live-temp.yml

permissions:
  contents: read

jobs:
  visual-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/proof-v15 && cd /tmp/proof-v15
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify Proof V15 desktop mobile and print selector
        run: |
          cd /tmp/proof-v15
          node <<'NODE'
          const { chromium } = require('playwright');
          const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const badChars=['•','→','—'];
          const sampleRows=[
            {lineId:'L1',departureDate:'2026-09-07',lineName:'FD-4WJ-NE1-SNRR-20:30-BD-RO',lineType:1,lineTypeText:'Feeder',lineMode:1,lineModeText:'ปกติ',plateNumber:'ยข3434(นครราชสีมา)',plateTypeText:'4WJ',driver:'โกเมนทร์ ภิรมย์นาค',driverPhone:'0653762402',fleetId:'22',fleetName:'2KL (2K LOGISTICS)',proofId:'',proofState:1,proofStateText:'รอเปิดบาร์โค้ด',startTime:1230,plannedDepartureTime:1230,standbyTime:1170,detailReady:true,destinationCode:'SNRR',destinationName:'SNRR_SP-สุรนารายณ์'},
            {lineId:'L2',departureDate:'2026-09-07',lineName:'LH-6W7.2-NE1-BKKC-23:00-BD-31-RS1',lineType:2,lineTypeText:'LH',lineMode:1,lineModeText:'ปกติ',plateNumber:'712286(ขอนแก่น)',plateTypeText:'6W7.2',driver:'จอมฤทธิ์ กอนแก้ว',driverPhone:'0956205748',fleetId:'37',fleetName:'AMR (AMARA)',proofId:'NAK1TEST001',proofState:7,proofStateText:'ถึงสาขาต้นทางแล้ว',startTime:1380,plannedDepartureTime:1380,standbyTime:1140,detailReady:true,destinationCode:'BKKC',destinationName:'27 KKC_BHUB-ขอนแก่น'},
            {lineId:'L3',departureDate:'2026-09-07',lineName:'LH-6W5.5-NE1-NO1-23:00-BD-3-RO',lineType:2,lineTypeText:'LH',lineMode:1,lineModeText:'ปกติ',plateNumber:'2ฒม8477(กรุงเทพ)',plateTypeText:'6W5.5',driver:'',driverPhone:'',fleetId:'33',fleetName:'9SM (9 SAMUKKI)',proofId:'',proofState:1,proofStateText:'รอเปิดบาร์โค้ด',startTime:1380,plannedDepartureTime:1380,standbyTime:1260,detailReady:true,destinationCode:'NO1',destinationName:'26 NAK_BHUB-นครราชสีมา'}
          ];
          function assert(cond,msg){if(!cond)throw new Error(msg)}
          async function openReady(browser,viewport){
            const page=await browser.newPage({viewport});
            const pageErrors=[];page.on('pageerror',e=>pageErrors.push(String(e)));
            let ready=false;
            for(let i=0;i<12;i++){
              const r=await page.goto(base+'/proof.html?v15gate='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              assert(r?.ok(),`proof.html HTTP ${r?.status()}`);
              try{await page.waitForFunction(()=>window.__PROOF_V15_READY__===true,{timeout:5000});ready=true;break;}catch{}
              await page.waitForTimeout(5000);
            }
            assert(ready,'Proof V15 did not become live on DEV');
            assert(pageErrors.length===0,'page errors: '+pageErrors.join(' | '));
            return page;
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await openReady(browser,{width:1680,height:950});
              const requests=[];page.on('request',r=>requests.push({url:r.url(),method:r.method()}));
              await page.evaluate(rows=>{
                const P=window.ProofV2;
                P.state.profile={name:'DEV QA',canPrint:true,canCreateProof:true,canCancelCar:false};
                P.state.branch='NE1';
                P.state.rows=rows;
                let host=document.getElementById('proof-v15-gate');
                if(!host){host=document.createElement('div');host.id='proof-v15-gate';host.style.margin='20px';document.body.appendChild(host);}
                host.innerHTML=P.groupedHtml(rows);
              },sampleRows);
              await page.waitForTimeout(100);

              const desktop=await page.evaluate(bad=>{
                const host=document.getElementById('proof-v15-gate');
                const branches=[...host.querySelectorAll('.proof-v15-branch')];
                const rows=[...host.querySelectorAll('.proof-v15-row')];
                const heads=[...host.querySelectorAll('.proof-v15-columns b')];
                const buttons=[...host.querySelectorAll('.proof-v15-actions')].flatMap(pair=>[...pair.querySelectorAll('.btn')]);
                return {
                  bodyW:document.documentElement.scrollWidth,viewport:innerWidth,
                  overflow:branches.some(x=>x.scrollWidth>x.clientWidth+2)||rows.some(x=>x.scrollWidth>x.clientWidth+2),
                  headWrap:heads.some(x=>x.scrollHeight>x.clientHeight+2||getComputedStyle(x).whiteSpace!=='nowrap'),
                  buttonWrap:buttons.some(x=>getComputedStyle(x).whiteSpace!=='nowrap'||x.scrollHeight>x.clientHeight+2),
                  suppliers:host.textContent.includes('2KL (2K LOGISTICS)')&&host.textContent.includes('AMR (AMARA)')&&host.textContent.includes('9SM (9 SAMUKKI)'),
                  bad:bad.filter(c=>host.textContent.includes(c)),
                  rowCount:rows.length,
                };
              },badChars);
              assert(desktop.rowCount===3,'synthetic table rows missing '+JSON.stringify(desktop));
              assert(!desktop.overflow,'desktop table overflow '+JSON.stringify(desktop));
              assert(!desktop.headWrap,'desktop header wraps '+JSON.stringify(desktop));
              assert(!desktop.buttonWrap,'desktop action wraps '+JSON.stringify(desktop));
              assert(desktop.suppliers,'supplier name not visible immediately '+JSON.stringify(desktop));
              assert(desktop.bad.length===0,'AI-like separators remain in table '+JSON.stringify(desktop));

              await page.evaluate(()=>{
                const P=window.ProofV2,row=P.state.rows[2];
                P.openEditor(row,{
                  lineId:row.lineId,departureDate:row.departureDate,lineName:row.lineName,
                  proofState:1,proofStateText:'รอเปิดบาร์โค้ด',proofId:'',
                  fleetId:'33',fleetName:'9SM (9 SAMUKKI)',originName:'02 NE1_HUB-นครราชสีมา',track:'NE1 NO1',
                  plateId:'284471',plateNumber:'2ฒม8477(กรุงเทพ)',plateType:203,plateTypeText:'6W5.5',
                  fmsDriverId:'',driver:'',driverPhone:'',plannedDepartureText:'23:00',
                  policy:{plateEditable:true,driverEditable:true,plateReason:'',driverReason:''}
                });
              });
              await page.waitForSelector('#proof-editor-dialog[open]');
              await page.evaluate(()=>{
                const P=window.ProofV2;
                const plates=Array.from({length:6},(_,i)=>({id:String(100+i),plateNumber:`2ฒม84${77+i}(กรุงเทพ)`,plateTypeText:'6W5.5'}));
                const drivers=Array.from({length:6},(_,i)=>({id:String(200+i),name:`คนขับทดสอบ ${i+1}`,phone:`08100000${String(i).padStart(2,'0')}`,auditStateText:i%2?'พร้อมใช้งาน':''}));
                P.renderEditorSearchItems('plate',document.getElementById('proof-editor-plate-results'),plates,'8477');
                P.renderEditorSearchItems('driver',document.getElementById('proof-editor-driver-results'),drivers,'คนขับ');
              });
              await page.waitForTimeout(250);

              const modal=await page.evaluate(bad=>{
                const d=document.getElementById('proof-editor-dialog'),r=d.getBoundingClientRect(),card=d.querySelector('.proof-editor-card');
                const countVisible=list=>{
                  const lr=list.getBoundingClientRect();
                  return [...list.querySelectorAll('.proof-option')].filter(el=>{const x=el.getBoundingClientRect();return Math.min(x.bottom,lr.bottom)-Math.max(x.top,lr.top)>30;}).length;
                };
                const plate=document.getElementById('proof-editor-plate-results'),driver=document.getElementById('proof-editor-driver-results');
                const footer=[...d.querySelectorAll('.proof-editor-actions .btn')];
                return {
                  center:Math.abs((r.left+r.right)/2-innerWidth/2),right:r.right,viewport:innerWidth,
                  overflow:card.scrollWidth>card.clientWidth+2,
                  plateVisible:countVisible(plate),driverVisible:countVisible(driver),plateH:plate.clientHeight,driverH:driver.clientHeight,
                  footerWrap:footer.some(x=>getComputedStyle(x).whiteSpace!=='nowrap'||x.scrollHeight>x.clientHeight+2),
                  bad:bad.filter(c=>d.textContent.includes(c)),
                  title:d.querySelector('h2')?.textContent||'',
                };
              },badChars);
              assert(modal.center<4&&modal.right<=modal.viewport+1,'modal not centered '+JSON.stringify(modal));
              assert(!modal.overflow,'modal horizontal overflow '+JSON.stringify(modal));
              assert(modal.plateVisible>=3&&modal.driverVisible>=3,'selector still shows too few items '+JSON.stringify(modal));
              assert(modal.plateH>=170&&modal.driverH>=170,'selector list too short '+JSON.stringify(modal));
              assert(!modal.footerWrap,'modal action wrapped '+JSON.stringify(modal));
              assert(modal.bad.length===0,'AI-like separators remain in modal '+JSON.stringify(modal));
              assert(modal.title==='ตรวจข้อมูลก่อนปริ้นบาร์รถ','modal title wrong '+JSON.stringify(modal));
              await page.evaluate(()=>window.ProofV2.closeEditor());

              const forbidden=requests.filter(r=>r.method!=='GET'&&/\/api\/proof\/(print-edit|print|ack)/.test(r.url));
              assert(forbidden.length===0,'MS mutation was triggered '+JSON.stringify(forbidden));

              const mobile=await openReady(browser,{width:390,height:844});
              await mobile.evaluate(rows=>{
                const P=window.ProofV2;
                P.state.profile={name:'DEV QA',canPrint:true,canCreateProof:true,canCancelCar:false};P.state.branch='NE1';P.state.rows=rows;
                let host=document.getElementById('proof-v15-gate-mobile');host=document.createElement('div');host.id='proof-v15-gate-mobile';document.body.appendChild(host);host.innerHTML=P.groupedHtml(rows);
                P.openEditor(rows[2],{lineId:rows[2].lineId,departureDate:rows[2].departureDate,lineName:rows[2].lineName,proofState:1,proofStateText:'รอเปิดบาร์โค้ด',fleetId:'33',fleetName:'9SM (9 SAMUKKI)',plateId:'284471',plateNumber:'2ฒม8477(กรุงเทพ)',plateType:203,plateTypeText:'6W5.5',driver:'',driverPhone:'',policy:{plateEditable:true,driverEditable:true,plateReason:'',driverReason:''}});
                const plates=Array.from({length:5},(_,i)=>({id:String(300+i),plateNumber:`847${i}(กรุงเทพ)`,plateTypeText:'6W5.5'}));
                P.renderEditorSearchItems('plate',document.getElementById('proof-editor-plate-results'),plates,'847');
              },sampleRows);
              await mobile.waitForTimeout(250);
              const mobileResult=await mobile.evaluate(bad=>{
                const d=document.getElementById('proof-editor-dialog'),card=d.querySelector('.proof-editor-card'),list=document.getElementById('proof-editor-plate-results');
                return {bodyW:document.documentElement.scrollWidth,viewport:innerWidth,dialogW:d.getBoundingClientRect().width,overflow:card.scrollWidth>card.clientWidth+2,listH:list.clientHeight,bad:bad.filter(c=>d.textContent.includes(c))};
              },badChars);
              assert(mobileResult.bodyW<=mobileResult.viewport+2,'mobile page horizontal overflow '+JSON.stringify(mobileResult));
              assert(mobileResult.dialogW<=mobileResult.viewport,'mobile modal wider than viewport '+JSON.stringify(mobileResult));
              assert(!mobileResult.overflow&&mobileResult.listH>=150,'mobile selector/modal cramped '+JSON.stringify(mobileResult));
              assert(mobileResult.bad.length===0,'AI-like separators remain mobile '+JSON.stringify(mobileResult));

              console.log('PROOF_V15_LIVE_UI=PASS');
              console.log('DESKTOP_GRID_SINGLE_LINE=PASS');
              console.log('SUPPLIER_VISIBLE_FROM_ROW=PASS');
              console.log('SELECTOR_MULTI_ITEM_VISIBLE=PASS');
              console.log('MODAL_CENTERED=PASS');
              console.log('MOBILE_MODAL=PASS');
              console.log('VISIBLE_BULLET_DASH_ARROW=0');
              console.log('CANCELLATION_ENABLED=NO');
              console.log('MS_MUTATION_TESTED=NO');
              console.log('PRODUCTION_TOUCHED=NO');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
