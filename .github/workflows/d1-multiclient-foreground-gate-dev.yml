name: D1 Multi Client Foreground Gate DEV

# One-shot read-only evidence collection for the two-foreground-client gate.
# It waits for Cloudflare analytics ingestion, then reads only DEV analytics/state.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/d1-multiclient-foreground-gate-dev.yml

permissions:
  contents: read

jobs:
  foreground-gate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
      FOREGROUND_START: 2026-09-02T11:52:00.000Z
    steps:
      - name: Wait for foreground sample and analytics ingestion
        run: sleep 150

      - name: Read foreground analytics and exact duplicate snapshots
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const db = process.env.DEV_D1_DATABASE_ID;
          const start = new Date(process.env.FOREGROUND_START);
          const analyticsEnd = new Date(Date.now() - 60_000);
          const gql = 'https://api.cloudflare.com/client/v4/graphql';
          const query = `query($accountTag:String!,$databaseId:String!,$start:String!,$end:String!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){sum{readQueries writeQueries rowsRead rowsWritten} dimensions{datetimeMinute}} d1QueriesAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){count sum{rowsRead rowsWritten} dimensions{datetimeMinute query}}}}}`;
          const response = await fetch(gql, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables: { accountTag: account, databaseId: db, start: start.toISOString(), end: analyticsEnd.toISOString() } }),
          });
          const payload = await response.json();
          if (!response.ok || payload.errors?.length) throw new Error(JSON.stringify(payload.errors || payload));
          const a = payload.data?.viewer?.accounts?.[0] || {};
          const totals = new Map();
          for (const g of a.d1AnalyticsAdaptiveGroups || []) {
            const minute = g.dimensions?.datetimeMinute;
            if (!minute) continue;
            totals.set(minute, {
              minute,
              readQueries: Number(g.sum?.readQueries || 0),
              writeQueries: Number(g.sum?.writeQueries || 0),
              rowsRead: Number(g.sum?.rowsRead || 0),
              rowsWritten: Number(g.sum?.rowsWritten || 0),
              authReads: 0,
              businessWrites: 0,
              cacheWrites: 0,
              claimWrites: 0,
            });
          }
          const auth = /SELECT username,role,branches,active FROM users WHERE username=\?/i;
          const business = /INSERT OR REPLACE INTO ms_routes|INSERT INTO ms_route_history|DELETE FROM ms_routes/i;
          const cache = /INSERT INTO ms_live_cache/i;
          const claim = /ms_sync_claims/i;
          for (const g of a.d1QueriesAdaptiveGroups || []) {
            const minute = g.dimensions?.datetimeMinute;
            if (!minute) continue;
            const row = totals.get(minute) || { minute, readQueries:0, writeQueries:0, rowsRead:0, rowsWritten:0, authReads:0, businessWrites:0, cacheWrites:0, claimWrites:0 };
            const q = String(g.dimensions?.query || '').replace(/\s+/g, ' ').trim();
            if (auth.test(q)) row.authReads += Number(g.sum?.rowsRead || g.count || 0);
            if (business.test(q)) row.businessWrites += Number(g.sum?.rowsWritten || 0);
            if (cache.test(q)) row.cacheWrites += Number(g.sum?.rowsWritten || 0);
            if (claim.test(q)) row.claimWrites += Number(g.sum?.rowsWritten || 0);
            totals.set(minute, row);
          }
          console.log(`FOREGROUND_START=${start.toISOString()}`);
          console.log(`ANALYTICS_END=${analyticsEnd.toISOString()}`);
          for (const row of [...totals.values()].sort((x,y)=>x.minute.localeCompare(y.minute))) console.log(`MINUTE=${JSON.stringify(row)}`);

          const d1 = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`;
          async function read(sql, params=[]) {
            if (!/^\s*SELECT\b/i.test(sql)) throw new Error('read-only SQL only');
            const r = await fetch(d1, { method:'POST', headers:{ Authorization:`Bearer ${token}`, 'Content-Type':'application/json' }, body:JSON.stringify({sql,params}) });
            const p = await r.json();
            if (!r.ok || p.success === false) throw new Error(JSON.stringify(p.errors || p));
            const result = Array.isArray(p.result) ? p.result[0] : p.result;
            return { rows: result?.results || [], rowsRead: Number(result?.meta?.rows_read || 0) };
          }
          const history = await read(
            'SELECT route_id,event_type,snapshot_at,payload_json FROM ms_route_history WHERE hub=? AND snapshot_at>=? ORDER BY snapshot_at ASC LIMIT 200',
            ['NE1', start.toISOString()],
          );
          const lastByRoute = new Map();
          const exactDuplicates = [];
          for (const row of history.rows) {
            const prev = lastByRoute.get(row.route_id);
            if (prev && String(prev.payload_json || '') === String(row.payload_json || '')) {
              exactDuplicates.push({ routeId: row.route_id, from: prev.snapshot_at, to: row.snapshot_at, eventType: row.event_type });
            }
            lastByRoute.set(row.route_id, row);
          }
          const claimState = await read('SELECT hub,source_hash,state,claimed_at,finished_at FROM ms_sync_claims WHERE hub=? LIMIT 1',['NE1']);
          const main = await read('SELECT hub,last_success_at,last_error FROM ms_connections WHERE hub=? LIMIT 1',['NE1']);
          const pre = await read('SELECT hub,last_success_at,last_error FROM ms_preentry_connections WHERE hub=? LIMIT 1',['NE1']);
          const bus = await read('SELECT hub,last_success_at,last_error FROM ms_bus_connections WHERE hub=? LIMIT 1',['NE1']);
          const cacheState = await read('SELECT hub,source_hash,synced_at FROM ms_live_cache WHERE hub=? LIMIT 1',['NE1']);
          console.log(`HISTORY_ROWS=${history.rows.length}`);
          console.log(`EXACT_DUPLICATE_COUNT=${exactDuplicates.length}`);
          console.log(`EXACT_DUPLICATES=${JSON.stringify(exactDuplicates.slice(0,20))}`);
          console.log(`CLAIM=${JSON.stringify(claimState.rows)}`);
          console.log(`MS=${JSON.stringify(main.rows)}`);
          console.log(`PREENTRY=${JSON.stringify(pre.rows)}`);
          console.log(`BUS=${JSON.stringify(bus.rows)}`);
          console.log(`CACHE=${JSON.stringify(cacheState.rows)}`);
          console.log(`D1_DIAGNOSTIC_ROWS_READ=${history.rowsRead + claimState.rowsRead + main.rowsRead + pre.rowsRead + bus.rowsRead + cacheState.rowsRead}`);
          console.log('D1_DIAGNOSTIC_ROWS_WRITTEN=0');
          NODE
