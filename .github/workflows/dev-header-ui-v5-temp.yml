name: DEV Header UI V5 Temp
# trigger: live-verify-v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-header-ui-v5-temp.yml

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DEV header V5 live on all pages
        run: |
          node <<'NODE'
          const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const pages=['ms.html','proof.html','waiting.html','ms-report.html'];
          async function text(path){
            const response=await fetch(`${base}/${path}`,{cache:'no-store',headers:{'cache-control':'no-cache'}});
            const body=await response.text();
            if(!response.ok) throw new Error(`${path} HTTP ${response.status}`);
            return body;
          }
          for(const page of pages){
            const html=await text(page);
            const header=html.match(/<header class="site-header dev-unified-header"[\s\S]*?<\/header>/)?.[0]||'';
            if(!header) throw new Error(`${page}: DEV header missing`);
            if(!header.includes('class="dev-utility-group"')) throw new Error(`${page}: utility group missing`);
            if(!html.includes('DEV_STATUS_LABEL_V5')) throw new Error(`${page}: status relabel behavior missing`);
            if(!html.includes('DEV_EXCLUSIVE_DROPDOWNS_V4')) throw new Error(`${page}: exclusive dropdown behavior missing`);
            const order=['dev-system-nav','dev-page-tools','dev-account-menu','dev-utility-group'];
            let cursor=-1;
            for(const marker of order){
              const next=header.indexOf(marker);
              if(next<=cursor) throw new Error(`${page}: header order wrong at ${marker}`);
              cursor=next;
            }
            if(!html.includes("'ออนไลน์')badge.textContent='พร้อมใช้งาน'")) throw new Error(`${page}: online label mapping missing`);
            console.log(`DEV_HEADER_V5_PAGE=${page}:PASS`);
          }
          const css=await text('style.css?v=20260905-dev-shell-v3');
          for(const marker of [
            'DEV_HEADER_LAYOUT_V5',
            'grid-template-columns:40px minmax(0,1fr);column-gap:14px',
            'width:40px;height:40px;border-radius:8px',
            'dev-utility-group{order:4;display:flex',
            'dev-shell-status>.badge-online::before'
          ]){
            if(!css.includes(marker)) throw new Error(`live CSS missing ${marker}`);
          }
          console.log('DEV_HEADER_SPACING_V5_LIVE=PASS');
          console.log('DEV_STATUS_LABEL_V5_LIVE=PASS');
          console.log('DEV_UTILITY_GROUP_V5_LIVE=PASS');
          console.log('DEV_DROPDOWN_EXCLUSIVE_V4_STILL_PASS');
          console.log('READ_ONLY=YES');
          console.log('MS_MUTATION_TESTED=NO');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
