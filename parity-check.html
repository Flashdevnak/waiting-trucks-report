<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiting Trucks API Parity Check</title>
<style>
  body{font:16px system-ui,sans-serif;max-width:920px;margin:32px auto;padding:0 16px;color:#171717}
  h1{font-size:24px}button{padding:12px 18px;border:0;border-radius:8px;background:#171717;color:#fff;font-weight:700}
  table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border:1px solid #ddd;text-align:left}
  .pass{color:#08783e;font-weight:700}.fail{color:#b42318;font-weight:700}.muted{color:#666}
  code{word-break:break-all}#summary{margin:16px 0;font-weight:700}
</style>
<h1>OLD API vs NEW Worker DEV</h1>
<p class="muted">เครื่องมือนี้ใช้ session ที่เก็บในเบราว์เซอร์เครื่องนี้ และแสดงเฉพาะผลเปรียบเทียบ ไม่แสดง token หรือข้อมูลพัสดุ</p>
<button id="run">ตรวจ API Parity</button>
<div id="summary"></div>
<table><thead><tr><th>Endpoint</th><th>ผล</th><th>Status</th><th>Field / Type / Row count</th><th>Data digest</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const OLD='https://waiting-trucks-report.alert-squid-6738.chatgpt.site/api';
const NEW='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api';
const AUTH_KEY='bnak_operator_auth_v2';
const DAY=new Date().toISOString().slice(0,10),HUB='NE1';
const CASES=[
 ['list',{}],['history',{}],['settings',{branch:HUB}],['msRoutes',{branch:HUB}],
 ['msHistory',{branch:HUB}],['msArchive',{branch:HUB}],['msRange',{branch:HUB,start:DAY,end:DAY}],
 ['preEntryTrips',{branch:HUB,day:DAY}],['msConnectionStatus',{branch:HUB}],
 ['msPairingStatus',{hub:HUB,pairingId:'parity-read-only'}]
];
function shape(v){if(Array.isArray(v))return{type:'array',count:v.length,item:v.length?shape(v[0]):null};if(v===null)return{type:'null'};if(typeof v!=='object')return{type:typeof v};return{type:'object',fields:Object.keys(v).sort().map(k=>[k,shape(v[k])])}}
function stable(v,key=''){if(Array.isArray(v))return v.map(x=>stable(x,key));if(v&&typeof v==='object'){const out={};for(const k of Object.keys(v).sort()){if(['updatedAt','serverTime','checkedAt'].includes(k))continue;out[k]=stable(v[k],k)}return out}return v}
async function digest(v){const b=new TextEncoder().encode(JSON.stringify(stable(v)));const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16)}
async function call(base,action,params,token){const u=new URL(base);u.searchParams.set('action',action);u.searchParams.set('token',token);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);const r=await fetch(u,{cache:'no-store'});let body;try{body=await r.json()}catch{body={parseError:true}}return{status:r.status,body}}
document.getElementById('run').onclick=async()=>{const summary=document.getElementById('summary'),tbody=document.getElementById('rows');tbody.innerHTML='';let auth;try{auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{}if(!auth?.token){summary.innerHTML='<span class="fail">ไม่พบ session — กรุณาเข้าสู่ระบบที่ ms.html ในเบราว์เซอร์นี้ก่อน</span>';return}summary.textContent='กำลังตรวจ...';let failures=0;for(const[action,params]of CASES){const[oldR,newR]=await Promise.all([call(OLD,action,params,auth.token),call(NEW,action,params,auth.token)]);const status=oldR.status===newR.status&&oldR.body?.ok===newR.body?.ok;const structure=JSON.stringify(shape(oldR.body))===JSON.stringify(shape(newR.body));const[od,nd]=await Promise.all([digest(oldR.body),digest(newR.body)]);const data=od===nd;const pass=status&&structure&&data;if(!pass)failures++;const tr=document.createElement('tr');tr.innerHTML=`<td>${action}</td><td class="${pass?'pass':'fail'}">${pass?'PASS':'FAIL'}</td><td>${oldR.status} / ${newR.status}</td><td class="${structure?'pass':'fail'}">${structure?'PASS':'FAIL'}</td><td class="${data?'pass':'fail'}">${data?'PASS':'DIFF'} <code>${od}/${nd}</code></td>`;tbody.appendChild(tr)}summary.innerHTML=failures?`<span class="fail">FAIL ${failures} endpoint — ห้าม Cutover</span>`:`<span class="pass">PASS ทั้งหมด ${CASES.length} endpoint</span>`}
</script>
</html>
