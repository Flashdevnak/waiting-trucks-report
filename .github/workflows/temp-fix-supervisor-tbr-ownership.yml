name: TEMP DEV Route Auth Classifier Fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-fix-supervisor-tbr-ownership.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply DEV-only auth classifier correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          tbr = Path('cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs')
          s = tbr.read_text()
          old = 'if ([401, 403].includes(Number(httpStatus)) || /session|token|auth|login|expired|unauthor/i.test(value))'
          new = 'if ([401, 403].includes(Number(httpStatus)))'
          if s.count(old) != 1:
              raise SystemExit(f'auth classifier anchor count={s.count(old)}')
          tbr.write_text(s.replace(old, new, 1))

          supervisor = Path('.github/dev-tools/patch-ms-self-healing-supervisor.mjs')
          s = supervisor.read_text()
          old = 'const MS_REPAIR_POLICY_VERSION = 3;'
          if s.count(old) != 1:
              raise SystemExit(f'policy anchor count={s.count(old)}')
          supervisor.write_text(s.replace(old, 'const MS_REPAIR_POLICY_VERSION = 4;', 1))

          test = Path('.github/dev-tools/ms-self-healing-supervisor.test.mjs')
          s = test.read_text()
          old = 'MS_REPAIR_POLICY_VERSION = 3'
          if s.count(old) != 1:
              raise SystemExit(f'policy test anchor count={s.count(old)}')
          test.write_text(s.replace(old, 'MS_REPAIR_POLICY_VERSION = 4', 1))
          PY

          grep -F 'if ([401, 403].includes(Number(httpStatus)))' cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          if grep -Fq '|| /session|token|auth|login|expired|unauthor/i.test(value)' cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs; then
            echo 'message-text auth heuristic still present' >&2
            exit 1
          fi
          grep -F 'const MS_REPAIR_POLICY_VERSION = 4;' .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          node --check cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          node --check .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          node --test .github/dev-tools/ms-self-healing-supervisor.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          git diff --check
      - name: Commit tested DEV fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs .github/dev-tools/patch-ms-self-healing-supervisor.mjs .github/dev-tools/ms-self-healing-supervisor.test.mjs
          git commit -m 'fix(dev): require HTTP auth proof for MS session expiry'
          git push origin HEAD:main
