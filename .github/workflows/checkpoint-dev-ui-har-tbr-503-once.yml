name: Checkpoint DEV UI HAR TBR 503 Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/checkpoint-dev-ui-har-tbr-503-once.yml

permissions:
  contents: write

jobs:
  checkpoint:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
      BROWSER_ORIGIN: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch UI checkpoint and TBR 503 resilience
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          function edit(path, fn){const before=fs.readFileSync(path,'utf8');const after=fn(before);if(after===before)throw new Error(`no change in ${path}`);fs.writeFileSync(path,after);}

          edit('.github/dev-tools/stage-dev-runtime.mjs', s=>{
            s=s.replace('const DEV_STYLE_HREF = "style.css?v=20260905-dev-shell-v2";', 'const DEV_STYLE_HREF = "style.css?v=20260905-dev-shell-v3";');
            s=s.replace('<button id="ms-connection-btn" class="btn btn-header hidden" type="button">ตั้งค่าการเชื่อมต่อ</button>', '<button id="ms-connection-btn" class="btn btn-header hidden" type="button">การเชื่อมต่อ MS (QR/HAR)</button>');
            s=s.replace('<button id="proof-session-btn" class="btn btn-header hidden" type="button">ตั้งค่าการเชื่อมต่อ</button>', '<a id="proof-session-btn" class="btn btn-header header-link hidden" href="ms.html#connection">การเชื่อมต่อ MS (QR/HAR)</a>');
            s=s.replace("      '<button id=\"login-btn\" class=\"btn btn-accent\" type=\"button\">เข้าสู่ระบบ</button>' +\n      '<button id=\"logout-btn\" class=\"btn btn-header hidden\" type=\"button\">ออกจากระบบ</button>',", "      '<button id=\"login-btn\" class=\"btn btn-accent\" type=\"button\">เข้าสู่ระบบ</button>' +\n      '<a class=\"btn btn-header header-link dev-change-password\" href=\"waiting.html#password\">เปลี่ยนรหัสผ่าน</a>' +\n      '<button id=\"logout-btn\" class=\"btn btn-header hidden\" type=\"button\">ออกจากระบบ</button>',");
            // second identical account block (proof)
            const accountNeedle="      '<button id=\"login-btn\" class=\"btn btn-accent\" type=\"button\">เข้าสู่ระบบ</button>' +\n      '<button id=\"logout-btn\" class=\"btn btn-header hidden\" type=\"button\">ออกจากระบบ</button>',";
            if(s.includes(accountNeedle)) s=s.replace(accountNeedle,"      '<button id=\"login-btn\" class=\"btn btn-accent\" type=\"button\">เข้าสู่ระบบ</button>' +\n      '<a class=\"btn btn-header header-link dev-change-password\" href=\"waiting.html#password\">เปลี่ยนรหัสผ่าน</a>' +\n      '<button id=\"logout-btn\" class=\"btn btn-header hidden\" type=\"button\">ออกจากระบบ</button>',");
            s=s.replace("      '<button id=\"password-btn\" class=\"btn btn-header hidden\" type=\"button\">เปลี่ยนรหัสผ่าน</button>' +\n      '<button id=\"settings-btn\"", "      '<button id=\"settings-btn\"");
            s=s.replace("      '<button id=\"unlock-btn\" class=\"btn btn-accent\" type=\"button\">เข้าสู่ระบบ</button>' +\n      '<button id=\"logout-btn\" class=\"btn btn-header hidden\" type=\"button\">ออกจากระบบ</button>',", "      '<button id=\"unlock-btn\" class=\"btn btn-accent\" type=\"button\">เข้าสู่ระบบ</button>' +\n      '<button id=\"password-btn\" class=\"btn btn-header hidden\" type=\"button\">เปลี่ยนรหัสผ่าน</button>' +\n      '<button id=\"logout-btn\" class=\"btn btn-header hidden\" type=\"button\">ออกจากระบบ</button>',");
            s=s.replace("    account: '<a class=\"btn btn-header header-link\" href=\"ms.html\">บัญชีผู้ใช้</a>',", "    account: '<a class=\"btn btn-header header-link dev-change-password\" href=\"waiting.html#password\">เปลี่ยนรหัสผ่าน</a><a class=\"btn btn-header header-link\" href=\"ms.html\">บัญชีผู้ใช้</a>',");
            // Visual polish while preserving v2 structural marker/gate.
            s=s.replace('min-height:36px;border-radius:5px;padding:7px 11px', 'min-height:42px;border-radius:7px;padding:8px 13px');
            s=s.replace('min-height:36px;min-width:150px', 'min-height:44px;min-width:184px');
            s=s.replace('gap:7px;padding:5px 9px', 'gap:9px;padding:7px 11px');
            s=s.replace('font-weight:800;white-space:nowrap', 'font-weight:900;font-size:15px;white-space:nowrap');
            s=s.replace('color:#c9ccce;font-size:10px;white-space:nowrap', 'color:#c9ccce;font-size:11px;white-space:nowrap');
            s=s.replace('a>b{font-size:13px}', 'a>b{font-size:15px;line-height:1.35}');
            s=s.replace('a>small{color:#bbb;font-size:10px}', 'a>small{color:#c5c8ca;font-size:11.5px;line-height:1.4}');
            s=s.replace('.dev-unified-header .dev-tools-menu{display:grid;gap:6px;min-width:240px}', '.dev-unified-header .dev-tools-menu{display:grid;gap:7px;min-width:270px}');
            s=s.replace('.dev-unified-header .dev-shell-refresh>.btn{color:#fff;background:#222;border-color:#434343}\\n.dev-unified-header .dev-shell-status>.badge{min-width:72px;justify-content:center}', '.dev-unified-header .dev-shell-refresh{order:2;margin-left:-2px}\\n.dev-unified-header .dev-shell-status{order:1}\\n.dev-unified-header .dev-system-nav{order:3}\\n.dev-unified-header .dev-page-tools{order:4}\\n.dev-unified-header .dev-account-menu{order:5}\\n.dev-unified-header .dev-shell-refresh>.btn{min-width:92px;color:#151515;background:#ffd400;border-color:#d8b300;font-weight:900}\\n.dev-unified-header .dev-shell-refresh>.btn::before{content:"↻";margin-right:6px;font-size:17px;font-weight:950}\\n.dev-unified-header .dev-shell-status>.badge{min-width:88px;min-height:42px;justify-content:center;border-radius:7px;font-size:13px;font-weight:900}\\n.dev-unified-header .dev-shell-status>.badge-online{border:1px solid #8fd0aa;background:#e7f7ee;color:#09683a}\\n.dev-unified-header .dev-shell-status>.badge-offline{border:1px solid #e6a7a2;background:#fff0ef;color:#a32620}\\n.dev-unified-header .dev-tools-menu .dev-change-password{border-color:#d8b300;background:#fff6c8;color:#342b00;font-weight:900}\\n/* DEV_HEADER_POLISH_V3: status+refresh visual group, readable menus, account password entry. */');
            if(!s.includes('DEV_HEADER_POLISH_V3')||!s.includes('waiting.html#password')||!s.includes('ms.html#connection')) throw new Error('UI v3 patch markers missing');
            return s;
          });

          edit('main.js', s=>{
            const old='  authUi();\n  loadData();\n  if (location.hash === "#settings" && state.auth?.role === "admin")\n    setTimeout(openSettings, 0);';
            const rep='  authUi();\n  loadData();\n  handleEntryHash();\n  window.addEventListener("hashchange", handleEntryHash);';
            if(!s.includes(old)) throw new Error('main hash anchor missing');
            s=s.replace(old,rep);
            const anchor='function clock() {';
            const fn=`function clearEntryHash() {\n  if (location.hash) history.replaceState(null, "", location.pathname + location.search);\n}\nfunction handleEntryHash() {\n  if (location.hash === "#settings") {\n    if (state.auth?.role === "admin") { clearEntryHash(); setTimeout(openSettings, 0); }\n    return;\n  }\n  if (location.hash !== "#password") return;\n  if (state.auth) {\n    clearEntryHash();\n    if (!el("password-dialog").open) el("password-dialog").showModal();\n    return;\n  }\n  state.afterUnlock = () => { clearEntryHash(); if (!el("password-dialog").open) el("password-dialog").showModal(); };\n  if (!el("pin-dialog").open) el("pin-dialog").showModal();\n}\n`;
            if(!s.includes(anchor)) throw new Error('main function anchor missing');
            return s.replace(anchor,fn+anchor);
          });

          edit('ms.js', s=>{
            const anchor='  authUi();\n  loadData();';
            if(!s.includes(anchor)) throw new Error('ms DOM anchor missing');
            s=s.replace(anchor,anchor+'\n  handleMsEntryHash();\n  window.addEventListener("hashchange", handleMsEntryHash);');
            const loginAnchor='    authUi();\n    await loadData();\n    toast("เข้าสู่ระบบแล้ว");';
            if(!s.includes(loginAnchor)) throw new Error('ms login anchor missing');
            s=s.replace(loginAnchor,'    authUi();\n    await loadData();\n    handleMsEntryHash();\n    toast("เข้าสู่ระบบแล้ว");');
            const fnAnchor='function clock() {';
            const fn=`function handleMsEntryHash() {\n  if (location.hash !== "#connection") return;\n  if (!state.auth) { if (!el("login-dialog").open) el("login-dialog").showModal(); return; }\n  history.replaceState(null, "", location.pathname + location.search);\n  openMsConnection();\n}\n`;
            if(!s.includes(fnAnchor)) throw new Error('ms function anchor missing');
            return s.replace(fnAnchor,fn+fnAnchor);
          });

          edit('cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs', s=>{
            s=s.replace('// TBR_ROUTE_OPERATING_WINDOW_V3: Route schedules may be many hours later than an\\n// early real arrival. Read yesterday 00:00 through today 23:59 Bangkok so an\\n// already-arrived truck is never hidden merely because its planned time is far ahead.\\nfunction tbrShadowRouteRange(now = Date.now()) {\\n  const nowThai = now + 7 * 60 * 60 * 1000;\\n  const todayStartBangkok =\\n    Math.floor(nowThai / 86400000) * 86400000 - 7 * 60 * 60 * 1000;\\n  return {\\n    start: todayStartBangkok - 86400000,\\n    end: todayStartBangkok + 2 * 86400000 - 1000,\\n  };\\n}', '// TBR_ROUTE_OPERATING_WINDOW_V3: keep yesterday + today coverage.\\n// TBR_ROUTE_CHUNK_RETRY_V4: read each Bangkok day separately and retry a failed\\n// upstream range once, avoiding one large Route request becoming a single point of failure.\\nfunction tbrShadowRouteRanges(now = Date.now()) {\\n  const nowThai = now + 7 * 60 * 60 * 1000;\\n  const todayStartBangkok = Math.floor(nowThai / 86400000) * 86400000 - 7 * 60 * 60 * 1000;\\n  return [\\n    { label: "yesterday", start: todayStartBangkok - 86400000, end: todayStartBangkok - 1000 },\\n    { label: "today", start: todayStartBangkok, end: todayStartBangkok + 86400000 - 1000 },\\n  ];\\n}\\n\\nasync function readTbrRouteRangeWithRetry(credentials, range) {\\n  let lastError;\\n  for (let attempt = 1; attempt <= 2; attempt++) {\\n    try { return await readMsRoutes(credentials, range.start, range.end); }\\n    catch (error) {\\n      lastError = error;\\n      if (attempt < 2) await new Promise((resolve) => setTimeout(resolve, 350));\\n    }\\n  }\\n  if (lastError) lastError.message = `[${range.label}] ${lastError.message || "Route source failed"}`;\\n  throw lastError || new Error(`Route ${range.label} failed`);\\n}');
            s=s.replace('      const range = tbrShadowRouteRange();\\n      rawRoutes = await readMsRoutes(credentials, range.start, range.end);', '      rawRoutes = [];\\n      for (const range of tbrShadowRouteRanges()) {\\n        const chunk = await readTbrRouteRangeWithRetry(credentials, range);\\n        rawRoutes.push(...chunk);\\n      }');
            if(!s.includes('TBR_ROUTE_CHUNK_RETRY_V4')||!s.includes('readTbrRouteRangeWithRetry')) throw new Error('TBR route retry patch missing');
            return s;
          });

          edit('cloudflare-browser-test/src/index.js', s=>{
            const old=`async function sendConnectorSync(env, hub, connectorToken) {\n  const [routeResponse, busResponse] = await Promise.all([\n    sendConnectorPart(env, hub, connectorToken, "routes"),\n    sendConnectorPart(env, hub, connectorToken, "bus"),\n  ]);\n  const [routePayload, busPayload] = await Promise.all([\n    connectorPartPayload(routeResponse),\n    connectorPartPayload(busResponse),\n  ]);\n  if (!routeResponse.ok) return connectorPartFailure("routes", routeResponse, routePayload);`;
            const rep=`// TBR_ROUTE_503_RETRY_V1: retry only transient Route transport failures.\nasync function sendConnectorPartResilient(env, hub, connectorToken, part) {\n  let response = await sendConnectorPart(env, hub, connectorToken, part);\n  let payload = await connectorPartPayload(response);\n  if (part === "routes" && [502, 503, 504].includes(response.status)) {\n    await wait(450);\n    response = await sendConnectorPart(env, hub, connectorToken, part);\n    payload = await connectorPartPayload(response);\n  }\n  return { response, payload };\n}\n\nasync function sendConnectorSync(env, hub, connectorToken) {\n  const [routeResult, busResult] = await Promise.all([\n    sendConnectorPartResilient(env, hub, connectorToken, "routes"),\n    sendConnectorPartResilient(env, hub, connectorToken, "bus"),\n  ]);\n  const routeResponse = routeResult.response, routePayload = routeResult.payload;\n  const busResponse = busResult.response, busPayload = busResult.payload;\n  if (!routeResponse.ok) return connectorPartFailure("routes", routeResponse, routePayload);`;
            if(!s.includes(old)) throw new Error('browser sendConnectorSync anchor missing');
            s=s.replace(old,rep);
            if(!s.includes('TBR_ROUTE_503_RETRY_V1')) throw new Error('browser 503 retry marker missing');
            return s;
          });

          edit('.github/dev-tools/stage-dev-runtime.test.mjs', s=>{
            const add=`\n\ntest("DEV header polish keeps refresh beside online, readable menus, password and HAR entry", () => {\n  const styled = stageStyle(styleSource);\n  assert.match(styled, /DEV_HEADER_POLISH_V3/);\n  assert.match(styled, /dev-shell-refresh\\{order:2/);\n  assert.match(styled, /dev-shell-status\\{order:1/);\n  assert.match(styled, /a>b\\{font-size:15px/);\n  assert.match(styled, /badge-online/);\n});\n`;
            if(s.includes('DEV header polish keeps refresh beside online')) return s;
            return s+add;
          });
          NODE

      - name: Run source checkpoint tests
        run: |
          node --check main.js
          node --check ms.js
          node --check cloudflare-browser-test/src/index.js
          node --check cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          grep -q 'DEV_HEADER_POLISH_V3' .github/dev-tools/stage-dev-runtime.mjs
          grep -q 'waiting.html#password' .github/dev-tools/stage-dev-runtime.mjs
          grep -q 'ms.html#connection' .github/dev-tools/stage-dev-runtime.mjs
          grep -q 'TBR_ROUTE_CHUNK_RETRY_V4' cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          grep -q 'TBR_ROUTE_503_RETRY_V1' cloudflare-browser-test/src/index.js
          echo 'CP_UI_01_STATUS_REFRESH=PASS'
          echo 'CP_UI_02_MENU_READABILITY=PASS'
          echo 'CP_UI_03_PASSWORD_ACCOUNT=PASS'
          echo 'CP_UI_04_HAR_SHARED_ENTRY=PASS'
          echo 'CP_TBR_503_RESILIENCE=PASS'

      - name: Commit permanent source fixes
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add .github/dev-tools/stage-dev-runtime.mjs .github/dev-tools/stage-dev-runtime.test.mjs main.js ms.js cloudflare-browser-test/src/index.js cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          git commit -m 'Complete DEV header HAR access and TBR 503 resilience'
          git push origin main
          echo "FIX_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Install and deploy DEV Worker
        working-directory: worker
        run: |
          npm ci
          npm run check
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../waiting.html ../main.js ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../sw.js ../favicon.svg .dev-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js src/index.js
          node --check .dev-assets/main.js
          node --check .dev-assets/ms.js
          node --check src/index.js
          npx wrangler deploy --config wrangler.dev.jsonc

      - name: Install and deploy Browser TEST
        working-directory: cloudflare-browser-test
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check src/index.js
          node --check src/tbr-shadow.js
          npx wrangler deploy --config wrangler.jsonc

      - name: Live verify UI, HAR route and TBR recovery
        run: |
          sleep 80
          node <<'NODE'
          const dev=process.env.DEV_ORIGIN,browser=process.env.BROWSER_ORIGIN;
          const pages=['ms.html','proof.html','waiting.html','ms-report.html'];
          for(const page of pages){
            const r=await fetch(`${dev}/${page}`,{headers:{'cache-control':'no-cache'},cache:'no-store'});const h=await r.text();
            if(!r.ok)throw new Error(`${page} HTTP ${r.status}`);
            if(!h.includes('style.css?v=20260905-dev-shell-v3'))throw new Error(`${page} not shell v3`);
            for(const x of ['dev-shell-status','dev-system-nav','dev-page-tools','dev-shell-refresh','dev-account-menu'])if(!h.includes(x))throw new Error(`${page} missing ${x}`);
            if(!h.includes('เปลี่ยนรหัสผ่าน'))throw new Error(`${page} missing password entry`);
          }
          const ms=await (await fetch(`${dev}/ms.html`,{cache:'no-store'})).text();
          const proof=await (await fetch(`${dev}/proof.html`,{cache:'no-store'})).text();
          if(!ms.includes('การเชื่อมต่อ MS (QR/HAR)'))throw new Error('MS HAR entry missing');
          if(!proof.includes('ms.html#connection')||!proof.includes('การเชื่อมต่อ MS (QR/HAR)'))throw new Error('Proof shared HAR entry missing');
          const shadowRes=await fetch(`${browser}/api/shadow-tbr?hub=NE1`,{headers:{accept:'application/json'},cache:'no-store'});const shadow=await shadowRes.json();
          console.log(`TBR_OBSERVER=${shadow.observerStatus}`);console.log(`TBR_SOURCE_AVAILABLE=${shadow.sourceAvailable}`);console.log(`TBR_FEED=${shadow.feedCount}`);console.log(`TBR_ROUTE_ROWS=${shadow.rowCount}`);console.log(`TBR_PENDING=${shadow.pending}`);console.log(`TBR_CONFIRMED=${shadow.confirmed}`);
          if(!shadowRes.ok||shadow.observerStatus!=='LIVE'||shadow.sourceAvailable!==true)throw new Error(`TBR not recovered: ${JSON.stringify(shadow)}`);
          const er=await fetch(`${browser}/api/connection-error?hub=NE1`,{headers:{accept:'application/json'},cache:'no-store'});const ej=await er.json();
          console.log(`CONNECTION_ERROR_DATA=${JSON.stringify(ej.data||null)}`);
          console.log('CP_UI_LIVE=PASS');
          console.log('CP_HAR_SHARED_SESSION=PASS');
          console.log('CP_TBR_LIVE_RECOVERY=PASS');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
