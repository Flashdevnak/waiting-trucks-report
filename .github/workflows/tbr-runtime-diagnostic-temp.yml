name: TBR Runtime Diagnostic Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tbr-runtime-diagnostic-temp.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Read live DEV and Browser status before tail
        run: |
          node <<'NODE'
          const dev='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const browser='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev';
          async function read(url) { const r=await fetch(url,{cache:'no-store',headers:{accept:'application/json','cache-control':'no-cache'}}); const t=await r.text(); let d=null; try{d=JSON.parse(t)}catch{} return {status:r.status,data:d}; }
          const [shadow,error,health]=await Promise.all([read(browser+'/api/shadow-tbr?hub=NE1'),read(browser+'/api/connection-error?hub=NE1'),read(dev+'/api?action=health')]);
          console.log('PRE_SHADOW='+JSON.stringify({http:shadow.status,observer:shadow.data?.observerStatus,sourceAvailable:shadow.data?.sourceAvailable,feed:shadow.data?.feedCount,rows:shadow.data?.rowCount,lastAttemptAt:shadow.data?.lastAttemptAt,lastObservedAt:shadow.data?.lastObservedAt,lastSkip:shadow.data?.lastSkip}));
          console.log('PRE_ERROR='+JSON.stringify(error.data));
          console.log('DEV_HEALTH='+JSON.stringify({http:health.status,data:health.data}));
          NODE
      - name: Tail DEV Worker across one Browser cron
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm ci --silent
          set +e
          timeout 85s npx wrangler tail waiting-trucks-report-api-dev --format json > /tmp/dev-tail.log 2>&1
          code=$?
          set -e
          echo "TAIL_EXIT=$code"
          echo "--- FILTERED DEV TAIL ---"
          grep -E 'api_error|TBR_|ROUTE_|MS_|subrequest|Too many|timeout|timed out|Route|503|1102|1101' /tmp/dev-tail.log | tail -n 160 || true
          echo "--- END FILTERED DEV TAIL ---"
      - name: Read live status after tail
        run: |
          node <<'NODE'
          const browser='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev';
          async function read(url){const r=await fetch(url,{cache:'no-store',headers:{accept:'application/json','cache-control':'no-cache'}});return {status:r.status,data:await r.json().catch(()=>null)}}
          const [shadow,error]=await Promise.all([read(browser+'/api/shadow-tbr?hub=NE1'),read(browser+'/api/connection-error?hub=NE1')]);
          console.log('POST_SHADOW='+JSON.stringify({http:shadow.status,observer:shadow.data?.observerStatus,sourceAvailable:shadow.data?.sourceAvailable,feed:shadow.data?.feedCount,rows:shadow.data?.rowCount,lastAttemptAt:shadow.data?.lastAttemptAt,lastObservedAt:shadow.data?.lastObservedAt,lastSkip:shadow.data?.lastSkip}));
          console.log('POST_ERROR='+JSON.stringify(error.data));
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
