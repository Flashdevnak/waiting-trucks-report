name: Fix Lower Completed Current-Day Truth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-lower-completed-current-day-v1.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Patch lower completed source
        run: |
          node .github/dev-tools/fix-lower-completed-current-day-v1.mjs
          node .github/dev-tools/fix-lower-numeric-zero-staging-v1.mjs
          node .github/dev-tools/fix-stage-lower-current-day-assertion-v1.mjs

      - name: Run lower completion regression
        run: |
          node --check ms.js
          node --test .github/dev-tools/ms-unload-completion-ui.test.mjs
          node --test .github/dev-tools/ms-summary-filter.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs

      - name: Run worker regression
        working-directory: worker
        run: |
          npm ci
          npm run check

      - name: Commit fix forward to main
        run: |
          if git diff --quiet; then
            echo 'No source change required'
            exit 0
          fi
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add ms.js .github/dev-tools/ms-unload-completion-ui.test.mjs .github/dev-tools/patch-ms-completed-view-stability.mjs .github/dev-tools/stage-dev-runtime.test.mjs
          git commit -m 'fix: align lower completed with accepted daily truth'
          git push origin HEAD:main

# rerun-v4: current-day completed truth, numeric-zero cards, and matching stage assertion
