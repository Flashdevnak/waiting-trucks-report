name: Go Live MS Preflight

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/go-live-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
      PUBLIC_MS: https://flashdevnak.github.io/waiting-trucks-report/ms.html
      PUBLIC_JS: https://flashdevnak.github.io/waiting-trucks-report/ms.js
      PUBLIC_VERSION: https://flashdevnak.github.io/waiting-trucks-report/version.json
      MAIN_API: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api
      BROWSER_API: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
    steps:
      - name: Verify public frontend release
        run: |
          node <<'NODE'
          (async()=>{
            const bust=Date.now();
            async function text(url){const r=await fetch(`${url}?__preflight=${bust}`,{cache:'no-store'});const b=await r.text();if(!r.ok)throw new Error(`${url} HTTP ${r.status}`);return b}
            const [html,js,vt]=await Promise.all([text(process.env.PUBLIC_MS),text(process.env.PUBLIC_JS),text(process.env.PUBLIC_VERSION)]);
            const v=JSON.parse(vt);
            for(const marker of ['LIVE_RESILIENCE_V1','pollMs: 4000','DEV: archive stays lazy','apiGet("msCompletedToday"','CONFIG.apiUrl = "https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api"','NON_JSON_RESPONSE','transportLastOkAt'])
              if(!js.includes(marker)) throw new Error(`public ms.js missing ${marker}`);
            if(js.includes('window.location.origin}/api')) throw new Error('same-origin API fallback remains');
            if(v.version!=='20260903-02') throw new Error(`public version=${v.version}`);
            if(!html.includes('ms.js')) throw new Error('ms.html does not load ms.js');
            console.log(`PUBLIC_VERSION=${v.version}`);
            console.log('PUBLIC_FRONTEND_HARDENED=PASS');
            console.log('PUBLIC_POLL_MS=4000');
            console.log('PUBLIC_ARCHIVE_LAZY=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify live API JSON contract
        run: |
          node <<'NODE'
          (async()=>{
            for(const action of ['msRoutes','msCompletedToday','msConnectionStatus']){
              const u=new URL(process.env.MAIN_API);u.searchParams.set('action',action);u.searchParams.set('branch','NE1');
              const r=await fetch(u,{headers:{Accept:'application/json'},cache:'no-store'});const b=await r.text();
              if(/^\s*</.test(b)) throw new Error(`${action} returned HTML HTTP ${r.status}`);
              let j;try{j=JSON.parse(b)}catch{throw new Error(`${action} invalid JSON HTTP ${r.status}`)}
              if(!j||typeof j!=='object') throw new Error(`${action} JSON envelope missing`);
              console.log(`${action.toUpperCase()}_JSON=PASS HTTP_${r.status}`);
            }
            console.log('BACKEND_API_REACHABLE=PASS');
            console.log('BACKEND_JSON_CONTRACT=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify Cloudflare Worker runtimes
        run: |
          node <<'NODE'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN;
            const headers={Authorization:`Bearer ${token}`,'Content-Type':'application/json'};
            async function get(script,path){const r=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${script}${path}`,{headers});const p=await r.json().catch(()=>({}));if(!r.ok||p.success===false)throw new Error(`${script}${path} HTTP ${r.status}`);return p.result}
            const browser='waiting-trucks-ms-browser-test',backend='waiting-trucks-report-api-dev';
            const [bd,bs,bsec,wd,ws]=await Promise.all([get(browser,'/deployments'),get(browser,'/script-settings'),get(browser,'/secrets'),get(backend,'/deployments'),get(backend,'/script-settings')]);
            const version=r=>{const d=r?.deployments?.[0];return [...(d?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]?.version_id||''};
            for(const [name,s] of [[browser,bs],[backend,ws]]){const bindings=Array.isArray(s?.bindings)?s.bindings:[];if(bindings.some(x=>x.type==='d1'||x.type==='d1_database'))throw new Error(`${name} has D1 binding`)}
            if((Array.isArray(bsec)?bsec:[]).some(x=>x.name==='CONNECTOR_BOOTSTRAP_SECRET'))throw new Error('Browser bootstrap secret remains');
            const cr=await fetch(`${process.env.BROWSER_API}/api/config`,{cache:'no-store'});const ct=await cr.text();if(/^\s*</.test(ct))throw new Error('Browser config returned HTML');const cj=JSON.parse(ct);if(!cr.ok)throw new Error(`Browser config HTTP ${cr.status}`);if(JSON.stringify(cj).includes('script.google.com'))throw new Error('Browser targets legacy API');
            console.log(`ACTIVE_BROWSER_VERSION=${version(bd)||'-'}`);
            console.log(`ACTIVE_BACKEND_VERSION=${version(wd)||'-'}`);
            console.log('ACTIVE_D1_BINDINGS=0');
            console.log('BROWSER_BOOTSTRAP_SECRET=0');
            console.log('BROWSER_CONFIG=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify all NE1 MS sessions and Turso live cache
        run: |
          node <<'NODE'
          (async()=>{
            const org=process.env.TURSO_ORG,db=process.env.TURSO_DATABASE,platform=process.env.TURSO_PLATFORM_API_TOKEN,ph={Authorization:`Bearer ${process.env.TURSO_PLATFORM_API_TOKEN}`};
            const dr=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers:ph});const dj=await dr.json();if(!dr.ok)throw new Error(`Turso DB HTTP ${dr.status}`);const database=dj.database||dj,hostname=database.Hostname||database.hostname;
            const tr=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,{method:'POST',headers:ph});const tj=await tr.json();if(!tr.ok||!tj.jwt)throw new Error(`Turso token HTTP ${tr.status}`);const dbToken=tj.jwt;console.log(`::add-mask::${dbToken}`);
            async function q(sql){const r=await fetch(`https://${hostname}/v2/pipeline`,{method:'POST',headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},body:JSON.stringify({requests:[{type:'execute',stmt:{sql}},{type:'close'}]})});const p=await r.json();const i=p?.results?.[0];if(!r.ok||i?.type==='error')throw new Error(`Turso query failed ${r.status}: ${JSON.stringify(i?.error||p).slice(0,300)}`);return i?.response?.result}
            const d=v=>v==null?null:(typeof v==='object'&&'value'in v?v.value:v),first=r=>(r?.rows?.[0]||[]).map(d),age=v=>{const t=Date.parse(String(v||''));return Number.isFinite(t)?Math.max(0,Math.round((Date.now()-t)/1000)):-1};
            const [rr,pr,br,cr,lr]=await Promise.all([
              q("SELECT last_success_at,last_error FROM ms_connections WHERE hub='NE1' LIMIT 1"),q("SELECT last_success_at,last_error FROM ms_preentry_connections WHERE hub='NE1' LIMIT 1"),q("SELECT last_success_at,last_error FROM ms_bus_connections WHERE hub='NE1' LIMIT 1"),q("SELECT active,last_used_at FROM ms_connector_tokens WHERE hub='NE1' LIMIT 1"),q("SELECT synced_at,json_valid(rows_json),json_type(rows_json),CASE WHEN json_type(rows_json)='object' THEN json_array_length(rows_json,'$.rows') ELSE json_array_length(rows_json) END,CASE WHEN json_type(rows_json)='object' THEN json_array_length(rows_json,'$.completedRows') ELSE 0 END FROM ms_live_cache WHERE hub='NE1' LIMIT 1")]);
            for(const [name,r] of Object.entries({route:rr,preentry:pr,bus:br})){const row=first(r),a=age(row[0]);if(String(row[1]||''))throw new Error(`${name} last_error=${row[1]}`);if(a<0||a>1200)throw new Error(`${name} stale ${a}s`);console.log(`${name.toUpperCase()}_SESSION_AGE_SECONDS=${a}`);console.log(`${name.toUpperCase()}_SESSION=PASS`)}
            const c=first(cr);if(Number(c[0]||0)!==1)throw new Error('connector inactive');console.log(`CONNECTOR_LAST_USED_AGE_SECONDS=${age(c[1])}`);console.log('CONNECTOR_ACTIVE=PASS');
            const l=first(lr);if(Number(l[1]||0)!==1)throw new Error('live cache JSON invalid');console.log(`LIVE_CACHE_SYNC_AGE_SECONDS=${age(l[0])}`);console.log(`LIVE_CACHE_FORMAT=${l[2]}`);console.log(`LIVE_ROUTE_ROWS=${Number(l[3]||0)}`);console.log(`COMPLETED_CACHE_ROWS=${Number(l[4]||0)}`);console.log('LIVE_CACHE=PASS');console.log('SENSITIVE_ROW_VALUES_LOGGED=0');console.log('D1_QUERIES=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE

      - name: Verify D1 inactive and pass go-live gate
        run: |
          node <<'NODE'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,databaseId=process.env.DEV_D1_DATABASE_ID,end=new Date(Date.now()-120000),start=new Date(Date.now()-720000);
            const query=`query($accountTag:String!,$databaseId:String!,$start:String!,$end:String!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:1000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){sum{rowsRead rowsWritten readQueries writeQueries}}}}}`;
            const r=await fetch('https://api.cloudflare.com/client/v4/graphql',{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{accountTag:account,databaseId,start:start.toISOString(),end:end.toISOString()}})});const p=await r.json();if(!r.ok||p.errors?.length)throw new Error(JSON.stringify(p.errors||p));const gs=p.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups||[];const t=gs.reduce((s,g)=>({rr:s.rr+Number(g.sum?.rowsRead||0),rw:s.rw+Number(g.sum?.rowsWritten||0),rq:s.rq+Number(g.sum?.readQueries||0),wq:s.wq+Number(g.sum?.writeQueries||0)}),{rr:0,rw:0,rq:0,wq:0});
            console.log(`D1_ROWS_READ=${t.rr}`);console.log(`D1_ROWS_WRITTEN=${t.rw}`);console.log(`D1_READ_QUERIES=${t.rq}`);console.log(`D1_WRITE_QUERIES=${t.wq}`);if(Object.values(t).some(Number))throw new Error(`D1 activity not zero ${JSON.stringify(t)}`);console.log('D1_RUNTIME_ACTIVITY=0');console.log('GO_LIVE_PREFLIGHT=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
