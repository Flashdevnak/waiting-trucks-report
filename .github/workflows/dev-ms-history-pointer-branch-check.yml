name: DEV MS History Pointer Branch Check
on:
  push:
    branches: [codex/dev-ms-history-pointer-v1]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pointer unit and syntax
        run: |
          node --check worker/src/ms-history-pointer-v1.js
          node --check worker/src/turso-index.js
          node --test worker/tests/ms-history-pointer-v1.test.mjs
      - name: Full worker regression
        working-directory: worker
        run: |
          npm ci
          npm run check
