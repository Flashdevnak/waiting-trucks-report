name: Apply UI fix once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-ui-fix-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply source edit
        run: node .github/ui-fix-once.mjs
      - name: Verify focused contracts
        run: |
          node --check ms.js
          node --test worker/tests/hbi-truck-photos.test.mjs
          node --test .github/dev-tools/realtime-quota-hardening.test.mjs
          git diff --check
      - name: Verify worker suite
        working-directory: worker
        run: |
          npm ci
          npm run check
      - name: Commit source edit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/ui-fix-once.mjs .github/workflows/apply-ui-fix-once.yml
          git add ms.js ms-v4.css worker/tests/hbi-truck-photos.test.mjs
          git diff --cached --check
          git commit -m "fix(ms): handle expired HBI session and pin barcode toggle"
          git push origin HEAD:main
