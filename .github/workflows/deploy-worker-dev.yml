name: Deploy Worker DEV

# DEV-only pipeline. Production remains on the legacy API until parity passes.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-worker-dev.yml
      - ms.html
      - ms.js
      - style.css
      - sw.js
      - favicon.svg
      - worker/src/**
      - worker/tests/**
      - worker/scripts/**
      - worker/package.json
      - worker/package-lock.json
      - worker/wrangler.dev.jsonc
      - worker/migrations/**

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --test tests/dev-archive-patch.test.mjs
      - name: Apply additive migrations to DEV D1
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.dev.jsonc
      - name: Validate DEV schema and row counts
        run: npx wrangler d1 execute DB --remote --config wrangler.dev.jsonc --file scripts/production-preflight.sql
      - name: Stage DEV frontend assets
        run: |
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../ms.html ../ms.js ../style.css ../sw.js ../favicon.svg .dev-assets/
          node scripts/patch-dev-ms-archive.mjs .dev-assets/ms.js
      - name: Deploy DEV shadow Worker
        run: npx wrangler deploy --config wrangler.dev.jsonc
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
