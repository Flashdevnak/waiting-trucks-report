name: Lower MS Production Ready Once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/lower-ms-production-ready-once.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  consolidate-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Lock frozen assets and baseline
        run: |
          echo "MS_HTML_SHA=$(sha256sum ms.html | awk '{print $1}')" >> "$GITHUB_ENV"
          echo "SW_SHA=$(sha256sum sw.js | awk '{print $1}')" >> "$GITHUB_ENV"
          git merge-base --is-ancestor 6a0c880a25ea85250048ce4c5bd4757b204ef1e8 HEAD
          test "$(git diff --numstat 6a0c880a25ea85250048ce4c5bd4757b204ef1e8 -- style.css | awk '{print $2}')" = "0"
          echo "REFERENCE_BASELINE_COMPARISON_ONLY=PASS"

      - name: Consolidate Lower MS source
        run: node .github/dev-tools/lower-ms-production-ready-once.mjs

      - name: Focused Lower UI checks
        run: |
          node --check ms.js
          node --test .github/dev-tools/ms-unload-completion-ui.test.mjs
          node --test worker/tests/ms-owner-live-v8.test.mjs

      - name: Full worker project check
        run: |
          npm ci --prefix worker
          npm --prefix worker run check
          node --test .github/dev-tools/ms-quota-safe-live.test.mjs
          node --test .github/dev-tools/ms-completion-burst-truth.test.mjs

      - name: Frozen and scope gates
        run: |
          test "$MS_HTML_SHA" = "$(sha256sum ms.html | awk '{print $1}')"
          test "$SW_SHA" = "$(sha256sum sw.js | awk '{print $1}')"
          node <<'NODE'
          const fs=require('node:fs');
          const cp=require('node:child_process');
          const sw=fs.readFileSync('sw.js','utf8');
          if(/String\.raw|MS_JS_HOTFIX|MS_CSS_HOTFIX|appendPatch|MS_OWNER_CORRECTION/.test(sw)) throw new Error('SW runtime patch detected');
          const changed=cp.execFileSync('git',['diff','--name-only'],{encoding:'utf8'}).trim().split(/\n/).filter(Boolean);
          const allowed=new Set(['ms.js','style.css','.github/dev-tools/ms-unload-completion-ui.test.mjs','worker/tests/ms-owner-live-v8.test.mjs']);
          const bad=changed.filter(x=>!allowed.has(x));
          if(bad.length) throw new Error(`unrelated files changed: ${bad.join(', ')}`);
          console.log('UPPER_CARDS_BYTE_LOCK=PASS');
          console.log('SW_FRESHNESS_ONLY=PASS');
          console.log('UNRELATED_CHANGES=0');
          NODE

      - name: Commit production-ready Lower MS source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ms.js style.css .github/dev-tools/ms-unload-completion-ui.test.mjs worker/tests/ms-owner-live-v8.test.mjs
          git commit -m "Consolidate production-ready MS lower tracking UI"
          git push origin HEAD:main
