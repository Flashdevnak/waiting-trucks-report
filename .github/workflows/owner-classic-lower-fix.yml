name: Owner Classic Lower Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-classic-lower-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run reviewed classic-lower patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess, textwrap
          source_commit = '9b3185ad62e5e85c203d9bf65e62685723f9e097'
          old = subprocess.check_output([
              'git','show',f'{source_commit}:.github/workflows/owner-classic-lower-fix.yml'
          ], text=True)
          anchor = '- name: Apply classic lower presentation on current logic'
          start = old.index('        run: |', old.index(anchor)) + len('        run: |')
          end = old.index('\n      - name: Validate patched frontend and regression gates', start)
          script = textwrap.dedent(old[start:end]).lstrip('\n')
          Path('/tmp/apply-owner-classic-lower.py').write_text(script)
          subprocess.run(['python','/tmp/apply-owner-classic-lower.py'], check=True)
          PY
      - name: Validate patched frontend and regression gates
        run: |
          node --check ms.js
          node --test .github/dev-tools/ms-unload-completion-ui.test.mjs
          node --test .github/dev-tools/ms-summary-filter.test.mjs
          node --test .github/dev-tools/daily-history.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
      - name: Commit fix-forward to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ms.js style.css ms.html sw.js .github/dev-tools/ms-unload-completion-ui.test.mjs .github/dev-tools/ms-summary-filter.test.mjs .github/dev-tools/daily-history.test.mjs .github/dev-tools/stage-dev-runtime.mjs .github/dev-tools/stage-dev-runtime.test.mjs
          git commit -m "fix: restore classic lower UI on current MS truth"
          git push origin HEAD:main
