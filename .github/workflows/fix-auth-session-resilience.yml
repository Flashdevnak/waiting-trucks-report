name: Fix Auth Session Resilience

on:
  push:
    branches:
      - fix/auth-session-180d-multidevice-20260904
    paths:
      - .github/dev-tools/patch-auth-session-resilience.mjs

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Apply auth session resilience patch
        run: node .github/dev-tools/patch-auth-session-resilience.mjs

      - name: Install worker tooling
        working-directory: worker
        run: npm ci

      - name: Run existing worker checks
        working-directory: worker
        run: npm run check

      - name: Test 100 concurrent devices and 180-day sessions
        working-directory: worker
        run: node --test tests/auth-session-resilience.test.mjs

      - name: Verify current DEV auth secrets are present
        working-directory: worker
        run: |
          npx wrangler secret list --config wrangler.dev.jsonc > /tmp/dev-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('/tmp/dev-secrets.json','utf8');
          const required=['TURSO_DATABASE_URL','TURSO_AUTH_TOKEN','AUTH_SECRET','PASSWORD_PEPPER'];
          const missing=required.filter((name)=>!text.includes(name));
          if(missing.length) throw new Error(`Missing required DEV secrets: ${missing.join(', ')}`);
          console.log('DEV_AUTH_SECRET_NAMES=PASS');
          console.log('DEV_TURSO_SECRET_NAMES=PASS');
          NODE

      - name: Verify patch scope
        run: |
          git diff --check
          git status --short
          node <<'NODE'
          const fs=require('node:fs');
          const worker=fs.readFileSync('worker/src/index.js','utf8');
          const test=fs.readFileSync('worker/tests/auth-session-resilience.test.mjs','utf8');
          const deploy=fs.readFileSync('.github/workflows/deploy-worker-dev.yml','utf8');
          if(!worker.includes('AUTH_SESSION_RESILIENCE_V1')) throw new Error('auth resilience marker missing');
          if(!worker.includes('AUTH_VERIFY_UNAVAILABLE')) throw new Error('transient auth error code missing');
          if(!test.includes('100 simultaneous device sessions remain independently valid')) throw new Error('100-device regression test missing');
          if(!deploy.includes("'AUTH_SECRET','PASSWORD_PEPPER'")) throw new Error('DEV auth secret deploy guard missing');
          console.log('AUTH_PATCH_SCOPE=PASS');
          NODE

      - name: Commit verified fix back to branch
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add worker/src/index.js worker/tests/auth-session-resilience.test.mjs .github/workflows/deploy-worker-dev.yml
          if git diff --cached --quiet; then
            echo 'NO_PATCH_CHANGES=1'
            exit 0
          fi
          git commit -m 'Keep 180-day sessions during transient auth outages'
          git push origin HEAD:fix/auth-session-180d-multidevice-20260904
