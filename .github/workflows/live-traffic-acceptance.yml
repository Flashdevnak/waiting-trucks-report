name: Live Traffic Acceptance

# Read-only post-cutover gate for the first real live queue rows.
# Turso reads + Cloudflare metadata/analytics only. Never queries D1 directly.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-traffic-acceptance.yml

permissions:
  contents: read

jobs:
  live-traffic:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
    steps:
      - name: Validate current live queue from Turso
        run: |
          node <<'NODE'
          (async()=>{
            const org=process.env.TURSO_ORG, db=process.env.TURSO_DATABASE, platform=process.env.TURSO_PLATFORM_API_TOKEN;
            if(!platform) throw new Error('Turso platform token missing');
            const platformHeaders={Authorization:`Bearer ${platform}`};
            const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            async function fetchJson(url,options={},label='request'){
              let lastError;
              for(let attempt=1;attempt<=4;attempt++){
                try{
                  const response=await fetch(url,options);
                  const text=await response.text();
                  let payload;
                  try{ payload=JSON.parse(text); }
                  catch{ throw new Error(`${label} returned non-JSON HTTP ${response.status}`); }
                  if(!response.ok) throw new Error(`${label} HTTP ${response.status}: ${JSON.stringify(payload).slice(0,300)}`);
                  return payload;
                }catch(error){
                  lastError=error;
                  if(attempt<4){
                    console.log(`${label} transient attempt ${attempt}/4: ${error.message}`);
                    await sleep(attempt*750);
                  }
                }
              }
              throw lastError;
            }
            const dbJson=await fetchJson(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers:platformHeaders},'Turso database lookup');
            const database=dbJson.database||dbJson;
            const hostname=database.Hostname||database.hostname;
            if(!hostname) throw new Error('Turso hostname missing');
            const tokenJson=await fetchJson(
              `https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,
              {method:'POST',headers:platformHeaders},
              'Turso auth token',
            );
            const dbToken=tokenJson.jwt;
            if(!dbToken) throw new Error('Turso auth token missing from response');
            console.log(`::add-mask::${dbToken}`);
            async function query(sql){
              const payload=await fetchJson(
                `https://${hostname}/v2/pipeline`,
                {
                  method:'POST',
                  headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},
                  body:JSON.stringify({requests:[{type:'execute',stmt:{sql}},{type:'close'}]}),
                },
                'Turso pipeline',
              );
              const item=payload?.results?.[0];
              if(item?.type==='error') throw new Error(`Turso query failed: ${JSON.stringify(item?.error||payload)}`);
              return item?.response?.result;
            }
            const decode=v=>v==null?null:(typeof v==='object'&&'value' in v?v.value:v);
            const first=result=>(result?.rows?.[0]||[]).map(decode);
            const ageSeconds=value=>{
              const parsed=Date.parse(String(value||''));
              return Number.isFinite(parsed)?Math.max(0,Math.round((Date.now()-parsed)/1000)):-1;
            };

            const [liveResult,routeResult,preentryResult,busResult]=await Promise.all([
              query("SELECT synced_at,rows_json FROM ms_live_cache WHERE hub='NE1' LIMIT 1"),
              query("SELECT last_success_at,last_error FROM ms_connections WHERE hub='NE1' LIMIT 1"),
              query("SELECT last_success_at,last_error FROM ms_preentry_connections WHERE hub='NE1' LIMIT 1"),
              query("SELECT last_success_at,last_error FROM ms_bus_connections WHERE hub='NE1' LIMIT 1"),
            ]);
            const live=first(liveResult), route=first(routeResult), preentry=first(preentryResult), bus=first(busResult);
            if(!live.length) throw new Error('NE1 live cache missing');
            for(const [name,row] of Object.entries({route,preentry,bus})){
              if(String(row?.[1]||'')) throw new Error(`${name} session error: ${row[1]}`);
              const age=ageSeconds(row?.[0]);
              if(age<0||age>20*60) throw new Error(`${name} session stale: ${age}s`);
            }
            let rows=[];
            try{ rows=JSON.parse(String(live[1]||'[]')); }
            catch{ throw new Error('ms_live_cache.rows_json is invalid JSON'); }
            if(!Array.isArray(rows)) throw new Error('ms_live_cache.rows_json is not an array');

            console.log(`LIVE_SNAPSHOT_AT=${live[0]||'-'}`);
            console.log(`LIVE_SNAPSHOT_AGE_SECONDS=${ageSeconds(live[0])}`);
            console.log(`LIVE_ROWS=${rows.length}`);
            console.log('ALL_MS_SESSIONS_HEALTHY=PASS');

            if(rows.length===0){
              console.log('TRAFFIC_GATE=WAITING_FOR_TRAFFIC');
              console.log('QUEUE_RULES=NOT_APPLICABLE_YET');
              console.log('D1_QUERIES=0');
              return;
            }

            const text=v=>String(v??'').trim();
            const attendance=row=>text(row.attendanceType||row.attendance_type).toLowerCase();
            const isDestination=row=>/ปลายทาง|destination/.test(attendance(row));
            const isDrop=row=>/จุดดรอป|ดรอป|drop/.test(attendance(row));
            const isOrigin=row=>/ต้นทาง|origin/.test(attendance(row));
            const idOf=row=>text(row.id||row.routeId||row.route_id);
            const actualArrival=row=>text(row.actualArrivalAt||row.actual_arrival_at);
            const actualDeparture=row=>text(row.actualDepartureAt||row.actual_departure_at);
            const unloadingState=row=>Number(row.unloadingState??row.unloading_state??-1);

            const ids=rows.map(idOf);
            const missingIds=ids.filter(id=>!id).length;
            const duplicateIds=ids.length-new Set(ids).size;
            const arrivalViolations=rows.filter(row=>!actualArrival(row)).length;
            const destinationDoneStillCurrent=rows.filter(row=>isDestination(row)&&unloadingState(row)===2).length;
            const dropDoneStillCurrent=rows.filter(row=>isDrop(row)&&unloadingState(row)===2&&actualDeparture(row)).length;
            const originDoneStillCurrent=rows.filter(row=>isOrigin(row)&&actualDeparture(row)).length;
            const unknownAttendance=rows.filter(row=>!isDestination(row)&&!isDrop(row)&&!isOrigin(row)).length;
            const over12h=rows.filter(row=>{
              const parsed=Date.parse(actualArrival(row));
              return Number.isFinite(parsed)&&Date.now()-parsed>12*60*60*1000;
            }).length;
            const counts={
              origin:rows.filter(isOrigin).length,
              destination:rows.filter(isDestination).length,
              drop:rows.filter(isDrop).length,
              unknown:unknownAttendance,
            };

            console.log(`ATTENDANCE_COUNTS=${JSON.stringify(counts)}`);
            console.log(`MISSING_IDS=${missingIds}`);
            console.log(`DUPLICATE_IDS=${duplicateIds}`);
            console.log(`QUEUE_ARRIVAL_VIOLATIONS=${arrivalViolations}`);
            console.log(`DESTINATION_DONE_STILL_CURRENT=${destinationDoneStillCurrent}`);
            console.log(`DROP_DONE_STILL_CURRENT=${dropDoneStillCurrent}`);
            console.log(`ORIGIN_DONE_STILL_CURRENT=${originDoneStillCurrent}`);
            console.log(`QUEUE_OVER_12H=${over12h}`);
            console.log('SENSITIVE_ROW_VALUES_LOGGED=0');

            const violations={missingIds,duplicateIds,arrivalViolations,destinationDoneStillCurrent,dropDoneStillCurrent,originDoneStillCurrent,unknownAttendance,over12h};
            if(Object.values(violations).some(Number))
              throw new Error(`Live queue invariant violation: ${JSON.stringify(violations)}`);

            console.log('QUEUE_RULES=PASS');
            console.log('TRAFFIC_GATE=PASS');
            console.log('D1_QUERIES=0');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Verify zero D1 runtime bindings
        if: always()
        run: |
          node <<'NODE'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
            if(!account||!token) throw new Error('Cloudflare credentials missing');
            const headers={Authorization:`Bearer ${token}`};
            for(const name of ['waiting-trucks-report-api-dev','waiting-trucks-ms-browser-test']){
              const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/script-settings`,{headers});
              const payload=await response.json();
              if(!response.ok||payload.success===false) throw new Error(`${name} settings HTTP ${response.status}`);
              const bindings=Array.isArray(payload.result?.bindings)?payload.result.bindings:[];
              const d1=bindings.filter(x=>x.type==='d1'||x.type==='d1_database');
              if(d1.length) throw new Error(`${name} exposes D1 binding`);
              console.log(`${name.toUpperCase().replaceAll('-','_')}_D1_BINDING=0`);
            }
            console.log('ACTIVE_D1_BINDINGS=0');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Verify recent D1 analytics remain zero
        if: always()
        run: |
          node <<'NODE'
          (async()=>{
            const endpoint='https://api.cloudflare.com/client/v4/graphql';
            const accountTag=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, databaseId=process.env.DEV_D1_DATABASE_ID;
            const end=new Date(Date.now()-2*60_000), start=new Date(end.getTime()-10*60_000);
            const query=`query($accountTag:String!,$databaseId:String!,$start:String!,$end:String!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:1000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){sum{rowsRead rowsWritten readQueries writeQueries}}}}}`;
            const response=await fetch(endpoint,{
              method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
              body:JSON.stringify({query,variables:{accountTag,databaseId,start:start.toISOString(),end:end.toISOString()}}),
            });
            const payload=await response.json();
            if(!response.ok||payload.errors?.length) throw new Error(JSON.stringify(payload.errors||payload));
            const groups=payload.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups||[];
            const total=groups.reduce((sum,g)=>({
              rowsRead:sum.rowsRead+Number(g.sum?.rowsRead||0), rowsWritten:sum.rowsWritten+Number(g.sum?.rowsWritten||0),
              readQueries:sum.readQueries+Number(g.sum?.readQueries||0), writeQueries:sum.writeQueries+Number(g.sum?.writeQueries||0),
            }),{rowsRead:0,rowsWritten:0,readQueries:0,writeQueries:0});
            console.log(`D1_RECENT_ROWS_READ=${total.rowsRead}`);
            console.log(`D1_RECENT_ROWS_WRITTEN=${total.rowsWritten}`);
            console.log(`D1_RECENT_READ_QUERIES=${total.readQueries}`);
            console.log(`D1_RECENT_WRITE_QUERIES=${total.writeQueries}`);
            if(total.rowsRead||total.rowsWritten||total.readQueries||total.writeQueries)
              throw new Error(`Recent D1 activity is not zero: ${JSON.stringify(total)}`);
            console.log('D1_RECENT_RUNTIME_ACTIVITY=0');
            console.log('ANALYTICS_ONLY=true');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE
