name: Proof Command Center V10 Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-command-center-v10-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply Proof V10 startup hotfix
        run: python3 .github/dev-tools/proof-v10-startup-fix-temp.py
      - name: Validate Proof V10 startup and permanent regressions
        run: |
          node --check worker/src/proof-ui-v10.js
          cd worker
          npm ci --no-audit --no-fund
          npm run check
          node --test tests/proof-smart-v8.test.mjs tests/auth-session-resilience.test.mjs
          ! grep -q '__PROOF_V8_READY__' src/proof-ui-v10.js
          grep -q "typeof P.installProofEditor !== 'function'" src/proof-ui-v10.js
          echo 'PROOF_V10_STARTUP_HOTFIX=PASS'
          echo 'PROOF_POLLING=60_SECONDS_UNCHANGED'
          echo 'HISTORY_BACKGROUND_WRITES_ADDED=0'
          echo 'TBR_CHANGED=NO'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit functional startup hotfix
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add worker/src/proof-ui-v10.js worker/tests/proof-command-center-v10.test.mjs
          git commit -m 'Fix Proof V10 browser startup gate'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
