name: Proof Ops Control V11 Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-ops-control-v11-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Repair temp patch anchor and apply Proof ops control V11
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/dev-tools/proof-ops-control-v11-temp.py')
          s = p.read_text()
          s = s.replace('anchor = "      document.head.appendChild(style);\\n"', 'anchor = "      `; document.head.appendChild(style);\\n"')
          s = s.replace("style_block = r'''      document.head.appendChild(style);", "style_block = r'''      `; document.head.appendChild(style);")
          p.write_text(s)
          PY
          python3 .github/dev-tools/proof-ops-control-v11-temp.py
      - name: Validate Proof only, quota safe, and browser asset guards
        run: |
          node --check worker/src/proof-ui-v10.js
          node --check worker/src/proof-ui-v5.js
          cd worker
          npm ci --no-audit --no-fund
          npm run check
          node --test tests/proof-command-center-v10.test.mjs tests/proof-smart-v8.test.mjs tests/auth-session-resilience.test.mjs
          ! grep -q 'setInterval' src/proof-ui-v10.js
          grep -q 'PROOF_OPS_CONTROL_V11' src/proof-ui-v10.js
          grep -q 'PROOF_ALERT_HEADER_REMOVED_V11' src/proof-ui-v10.js
          echo 'PROOF_OPS_CONTROL_V11=PASS'
          echo 'PROOF_GROUPS=FD,LH'
          echo 'PROOF_ALERT_HEADER_REMOVED=YES'
          echo 'NEW_BACKGROUND_API=0'
          echo 'NEW_POLLING=0'
          echo 'NEW_HISTORY_WRITES=0'
          echo 'TBR_CHANGED=NO'
          echo 'MS_MUTATION_TESTED=NO'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit functional Proof V11 changes
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add worker/src/proof-ui-v10.js worker/src/proof-ui-v5.js worker/tests/proof-command-center-v10.test.mjs
          git commit -m 'Redesign Proof as operational control center'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
