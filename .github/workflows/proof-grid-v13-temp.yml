name: Proof Grid V13 Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-grid-v13-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply Proof V13
        run: python3 .github/dev-tools/proof-grid-v13-temp.py
      - name: Validate Proof V13
        run: |
          node --check worker/src/proof-ui-v10.js
          node --check worker/src/proof-plate-search-v5.js
          cd worker
          npm ci --no-audit --no-fund
          npm run check
          node --test tests/proof-command-center-v10.test.mjs tests/proof-smart-v8.test.mjs tests/auth-session-resilience.test.mjs
          grep -q 'PROOF_GRID_V13' src/proof-ui-v10.js
          grep -q 'PROOF_PLATE_UNTYPED_FALLBACK_V13' src/proof-plate-search-v5.js
          ! grep -q 'setInterval' src/proof-ui-v10.js
          echo 'PROOF_V13=PASS'
          echo 'NEW_BACKGROUND_API=0'
          echo 'NEW_POLLING=0'
          echo 'TBR_CHANGED=NO'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit Proof V13
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add proof.html worker/src/proof-ui-v10.js worker/src/proof-plate-search-v5.js worker/tests/proof-command-center-v10.test.mjs
          git commit -m 'Refine Proof grid and plate fallback'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
