name: Proof TBR Live Acceptance Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: write

jobs:
  patch-confirmed-bus-503:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch confirmed transient Bus recovery only
        env:
          BUS_TEST_B64: 
        run: |
          python3 <<'PY'
          import base64, os
          from pathlib import Path
          index = Path('cloudflare-browser-test/src/index.js')
          source = index.read_text()
          old_comment = '// TBR_ROUTE_503_RETRY_V1: retry only transient Route transport failures.'
          new_comment = '// TBR_ROUTE_503_RETRY_V1 / TBR_BUS_503_RETRY_V7: retry transient Route/Bus transport failures once; steady state remains one call per part.'
          old_gate = 'if (part === "routes" && [502, 503, 504].includes(response.status)) {'
          new_gate = 'if (["routes", "bus"].includes(part) && [502, 503, 504].includes(response.status)) {'
          if old_comment not in source or old_gate not in source:
              raise SystemExit('confirmed Bus retry patch target not found')
          index.write_text(source.replace(old_comment, new_comment, 1).replace(old_gate, new_gate, 1))
          Path('cloudflare-browser-test/scripts/tbr-bus-retry.test.mjs').write_bytes(base64.b64decode(os.environ['BUS_TEST_B64']))
          for name, anchor in [
              ('.github/workflows/deploy-browser-worker.yml', '          node --check scripts/patch-dev-tbr-shadow-split-v2.mjs\n'),
              ('.github/workflows/tbr-test-runtime-regression.yml', '          node --check src/tbr-shadow.js\n'),
          ]:
              path = Path(name)
              text = path.read_text()
              if 'node scripts/tbr-bus-retry.test.mjs' not in text:
                  if anchor not in text:
                      raise SystemExit('workflow test anchor not found: ' + name)
                  text = text.replace(anchor, anchor + '          node scripts/tbr-bus-retry.test.mjs\n', 1)
              path.write_text(text)
          PY
      - name: Validate patch before commit
        working-directory: cloudflare-browser-test
        run: |
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check scripts/tbr-bus-retry.test.mjs
          grep -q 'TBR_BUS_503_RETRY_V7' src/index.js
          grep -Fq '["routes", "bus"].includes(part) && [502, 503, 504].includes(response.status)' src/index.js
          node scripts/tbr-bus-retry.test.mjs
          ! grep -q 'd1_databases' wrangler.jsonc
          echo 'BUS_TRANSIENT_RETRY_PATCH=PASS'
          echo 'STEADY_STATE_EXTRA_CALLS=0'
          echo 'BROWSER_D1_BINDING=0'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit fix-forward source and regressions
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add cloudflare-browser-test/src/index.js cloudflare-browser-test/scripts/tbr-bus-retry.test.mjs .github/workflows/deploy-browser-worker.yml .github/workflows/tbr-test-runtime-regression.yml
          git commit -m 'Retry transient TBR Bus source failures'
          git pull --rebase origin main
          git push origin HEAD:main
