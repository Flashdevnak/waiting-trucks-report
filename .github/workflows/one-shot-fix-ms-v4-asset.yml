name: One-shot Fix MS V4 Asset
on:
  push:
    branches: [main]
    paths:
      - '.github/dev-tools/ms-v4-asset-trigger.txt'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch DEV asset staging and smoke
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/deploy-worker-dev.yml')
          s=p.read_text()
          old="      - style.css\n      - sw.js"
          new="      - style.css\n      - ms-v4.css\n      - sw.js"
          if old not in s: raise SystemExit('paths anchor missing')
          s=s.replace(old,new,1)
          old="cp ../waiting.html ../main.js ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../sw.js ../favicon.svg .dev-assets/"
          new="cp ../waiting.html ../main.js ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../ms-v4.css ../sw.js ../favicon.svg .dev-assets/"
          if old not in s: raise SystemExit('asset copy anchor missing')
          s=s.replace(old,new,1)
          old="          const style=fs.readFileSync('.dev-assets/style.css','utf8');\n"
          new="          const style=fs.readFileSync('.dev-assets/style.css','utf8');\n          const msV4=fs.readFileSync('.dev-assets/ms-v4.css','utf8');\n          if(!msV4.includes('MS_UI_V4_VISUAL_CONTRACT')) throw new Error('staged MS UI V4 CSS missing');\n"
          if old not in s: raise SystemExit('stage style anchor missing')
          s=s.replace(old,new,1)
          old="          const msHtml=fs.readFileSync('.dev-assets/ms.html','utf8');\n"
          new="          const msHtml=fs.readFileSync('.dev-assets/ms.html','utf8');\n          if(!msHtml.includes('ms-v4.css?v=20260910-01')) throw new Error('staged MS UI V4 link missing');\n"
          if old not in s: raise SystemExit('stage html anchor missing')
          s=s.replace(old,new,1)
          old="      - name: Smoke DEV public pages and UI v3\n"
          new="      - name: Smoke DEV public pages and MS UI v4\n"
          if old not in s: raise SystemExit('smoke name anchor missing')
          s=s.replace(old,new,1)
          old="          const style='style.css?v=20260905-dev-shell-v3';\n"
          new="          const style='style.css?v=20260905-dev-shell-v3';\n          const msV4Style='ms-v4.css?v=20260910-01';\n"
          if old not in s: raise SystemExit('live style anchor missing')
          s=s.replace(old,new,1)
          old="          const ms=await get('ms.html');\n"
          new="          const ms=await get('ms.html');\n          if(!ms.includes(`href=\"${msV4Style}\"`)) throw new Error('live MS UI V4 link missing');\n"
          if old not in s: raise SystemExit('live html anchor missing')
          s=s.replace(old,new,1)
          old="          if(!cssResponse.ok||!css.includes('DEV_HEADER_POLISH_V3')) throw new Error('live UI v3 CSS missing');\n"
          new="          if(!cssResponse.ok||!css.includes('DEV_HEADER_POLISH_V3')) throw new Error('live UI v3 CSS missing');\n          const msV4Response=await fetch(`${base}/${msV4Style}`,{cache:'no-store'});\n          const msV4Css=await msV4Response.text();\n          if(!msV4Response.ok||!msV4Css.includes('MS_UI_V4_VISUAL_CONTRACT')) throw new Error('live MS UI V4 CSS missing');\n"
          if old not in s: raise SystemExit('live css anchor missing')
          s=s.replace(old,new,1)
          old="          console.log('DEV_UI_LIVE_AUDIT=PASS');\n"
          new="          console.log('DEV_UI_LIVE_AUDIT=PASS');\n          console.log('DEV_MS_UI_V4_ASSET=PASS');\n"
          if old not in s: raise SystemExit('live log anchor missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify patch
        run: |
          grep -q -- '- ms-v4.css' .github/workflows/deploy-worker-dev.yml
          grep -q '../ms-v4.css' .github/workflows/deploy-worker-dev.yml
          grep -q 'MS_UI_V4_VISUAL_CONTRACT' .github/workflows/deploy-worker-dev.yml
          grep -q 'DEV_MS_UI_V4_ASSET=PASS' .github/workflows/deploy-worker-dev.yml
      - name: Commit permanent pipeline fix
        run: |
          rm -f .github/workflows/one-shot-fix-ms-v4-asset.yml .github/dev-tools/ms-v4-asset-trigger.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(dev): stage and verify MS UI v4 asset'
          git push origin HEAD:main
