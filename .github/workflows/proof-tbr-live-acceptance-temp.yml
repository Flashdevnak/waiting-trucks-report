name: Proof TBR Live Acceptance Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: write

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture safe Proof and TBR live state read-only
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const dev='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const browser='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev';
          const markers=['HAR สำหรับปริ้นบาร์โค้ดรถ','proof-print-har-save','HAR เส้นทาง MS','HAR บันทึกแล้วและ Proof Session ใช้งานได้','proof-print-har-file-name'];
          async function ft(url){try{const r=await fetch(url,{cache:'no-store',headers:{'cache-control':'no-cache'}});return {status:r.status,text:await r.text()};}catch(e){return {status:0,text:'',error:String(e?.message||e)}}}
          async function fj(url){const x=await ft(url);let data=null;try{data=JSON.parse(x.text||'null')}catch{}return {...x,data};}
          const proof=await ft(dev+'/proof-v5.js?v=safe-diag');
          const shadow=await fj(browser+'/api/shadow-tbr?hub=NE1');
          const conn=await fj(browser+'/api/connection-error?hub=NE1');
          const s=shadow.data||{}; const c=conn.data?.data||conn.data||{};
          const lines=[
            'CHECKED_AT='+new Date().toISOString(),
            'READ_ONLY=YES',
            'PRODUCTION_TOUCHED=NO',
            'PROOF_HTTP='+proof.status,
            'PROOF_MISSING_MARKERS='+markers.filter(m=>!(proof.text||'').includes(m)).join('|'),
            'SHADOW_HTTP='+shadow.status,
            'TBR_OBSERVER='+String(s.observerStatus||''),
            'TBR_SOURCE_AVAILABLE='+String(s.sourceAvailable===true),
            'TBR_FEED='+String(Number(s.feedCount||0)),
            'TBR_ROUTE_ROWS='+String(Number(s.rowCount||0)),
            'TBR_HEARTBEAT='+String(s.heartbeatAt||s.heartbeat_at||s.lastHeartbeatAt||''),
            'TBR_MODE='+String(s.shadowQuota?.mode||''),
            'TBR_SOURCE_ERROR_CODE='+String(s.sourceErrorCode||s.errorCode||s.code||''),
            'TBR_SOURCE_ERROR_MESSAGE='+String(s.sourceErrorMessage||s.errorMessage||s.message||'').slice(0,240).replace(/[\r\n]/g,' '),
            'CONNECTION_HTTP='+String(conn.status),
            'CONNECTION_ERROR_CODE='+String(c.code||c.errorCode||''),
            'CONNECTION_ERROR_MESSAGE='+String(c.message||c.errorMessage||'').slice(0,240).replace(/[\r\n]/g,' '),
            'CONNECTION_RECOVERED_AT='+String(c.recoveredAt||'')
          ];
          fs.writeFileSync('.github/dev-tools/proof-tbr-live-diagnostic.txt',lines.join('\n')+'\n');
          NODE
      - name: Commit safe diagnostic only
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add .github/dev-tools/proof-tbr-live-diagnostic.txt
          git commit -m 'Capture safe Proof TBR live diagnostic'
          git pull --rebase origin main
          git push origin HEAD:main
