name: TEMP DEV MS HAR Browser Context

on:
  push:
    branches:
      - codex/dev-ms-har-browser-context-v1

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/dev-ms-har-browser-context-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Apply deterministic patch
        run: node .github/dev-tools/apply-ms-har-browser-context-v1.mjs

      - name: Keep DEV staging credential anchor compatible
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'worker/src/index.js';
          let source = fs.readFileSync(path, 'utf8');
          const generatedCredentials = `  if (row) {
            const rawDevice = await decryptMs(row.device_cipher, env);
            let deviceId = rawDevice, browserContext = {};
            try {
              const envelope = JSON.parse(rawDevice);
              if (envelope?.v === 2 && typeof envelope.deviceId === "string" && envelope.deviceId) {
                deviceId = envelope.deviceId;
                browserContext = normalizeMsBrowserContext(envelope.browserContext);
              }
            } catch {}
            const value = {
              sessionId: await decryptMs(row.session_cipher, env),
              deviceId,
              browserContext,
            };
            msCredentialCache.set(key, { until: Date.now() + MS_CREDENTIAL_CACHE_MS, value });
            return value;
          }`;
          const stagingCompatibleCredentials = `  if (row) {
            const value = {
              sessionId: await decryptMs(row.session_cipher, env),
              deviceId: await decryptMs(row.device_cipher, env),
            };
            msCredentialCache.set(key, { until: Date.now() + MS_CREDENTIAL_CACHE_MS, value });
            return value;
          }`;
          if (!source.includes(generatedCredentials)) throw new Error('generated msCredentials block not found');
          source = source.replace(generatedCredentials, stagingCompatibleCredentials);
          const helperStart = `function msBrowserRequestHeaders(credentials) {
            const context = normalizeMsBrowserContext(credentials?.browserContext);`;
          const helperReplacement = `function msBrowserRequestHeaders(credentials) {
            let deviceId = String(credentials?.deviceId || "");
            let context = normalizeMsBrowserContext(credentials?.browserContext);
            if (!Object.keys(context).length && deviceId.trim().startsWith("{")) {
              try {
                const envelope = JSON.parse(deviceId);
                if (envelope?.v === 2 && typeof envelope.deviceId === "string" && envelope.deviceId) {
                  deviceId = envelope.deviceId;
                  context = normalizeMsBrowserContext(envelope.browserContext);
                }
              } catch {}
            }`;
          if (!source.includes(helperStart)) throw new Error('browser request helper anchor not found');
          source = source.replace(helperStart, helperReplacement);
          if (!source.includes('"X-DEVICE-ID": credentials.deviceId,')) throw new Error('device header anchor not found');
          source = source.replace('"X-DEVICE-ID": credentials.deviceId,', '"X-DEVICE-ID": deviceId,');
          fs.writeFileSync(path, source);

          const testPath = 'worker/tests/ms-har-browser-context.test.mjs';
          let test = fs.readFileSync(testPath, 'utf8');
          const oldAssertion = '  assert.match(worker, /let deviceId = rawDevice, browserContext = \\{\\};/);';
          const newAssertions = '  assert.match(worker, /const envelope = JSON\\.parse\\(deviceId\\);/);\n  assert.match(worker, /"X-DEVICE-ID": deviceId/);';
          if (!test.includes(oldAssertion)) throw new Error('browser context test anchor not found');
          test = test.replace(oldAssertion, newAssertions);
          fs.writeFileSync(testPath, test);
          console.log('DEV staging compatibility preserved');
          NODE

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run worker full check
        working-directory: worker
        run: npm run check

      - name: Diff safety check
        run: git diff --check

      - name: Remove temporary runner
        run: |
          rm .github/dev-tools/apply-ms-har-browser-context-v1.mjs
          rm .github/workflows/temp-dev-ms-har-browser-context.yml

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ms.js worker/src/index.js worker/package.json worker/tests/ms-har-browser-context.test.mjs .github/dev-tools/apply-ms-har-browser-context-v1.mjs .github/workflows/temp-dev-ms-har-browser-context.yml
          git commit -m "fix(dev): preserve MS HAR browser context"
          git push origin HEAD:codex/dev-ms-har-browser-context-v1
