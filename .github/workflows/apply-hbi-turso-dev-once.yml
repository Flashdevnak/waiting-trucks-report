name: Apply HBI Turso DEV schema once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-hbi-turso-dev-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify migration source and apply only HBI table on DEV Turso
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const migration = fs.readFileSync('worker/migrations/0011_hbi_truck_photos.sql','utf8').trim();
          const expected = `CREATE TABLE IF NOT EXISTS ms_hbi_connections (\n  hub TEXT PRIMARY KEY,\n  credentials_cipher TEXT NOT NULL,\n  updated_at TEXT NOT NULL,\n  updated_by TEXT NOT NULL\n);`;
          if (migration !== expected) throw new Error('Unexpected HBI migration content; refusing DEV schema change');

          const platformToken = process.env.TURSO_PLATFORM_API_TOKEN;
          if (!platformToken) throw new Error('TURSO_PLATFORM_API_TOKEN missing');
          const org = process.env.TURSO_ORG;
          const db = process.env.TURSO_DATABASE;
          const headers = { Authorization: `Bearer ${platformToken}` };

          async function main() {
            const dbRes = await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`, { headers });
            const dbJson = await dbRes.json();
            if (!dbRes.ok) throw new Error(`DEV Turso lookup failed HTTP ${dbRes.status}`);
            const database = dbJson.database || dbJson;
            const hostname = database.Hostname || database.hostname;
            if (!hostname) throw new Error('DEV Turso hostname missing');

            const tokenRes = await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`, { method: 'POST', headers });
            const tokenJson = await tokenRes.json();
            const dbToken = tokenJson.jwt;
            if (!tokenRes.ok || !dbToken) throw new Error(`DEV Turso auth token failed HTTP ${tokenRes.status}`);
            console.log(`::add-mask::${dbToken}`);

            async function query(sql) {
              const response = await fetch(`https://${hostname}/v2/pipeline`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${dbToken}`, 'content-type': 'application/json' },
                body: JSON.stringify({ requests: [{ type: 'execute', stmt: { sql } }, { type: 'close' }] }),
              });
              const payload = await response.json();
              const item = payload?.results?.[0];
              if (!response.ok || item?.type === 'error') throw new Error(`DEV Turso query failed: ${JSON.stringify(item?.error || payload)}`);
              return item?.response?.result || {};
            }
            const decode = (v) => v == null ? null : (typeof v === 'object' && v.type ? v.value : v);

            const before = await query("SELECT name FROM sqlite_master WHERE type='table' AND name='ms_hbi_connections'");
            const existed = Array.isArray(before.rows) && before.rows.length > 0;
            await query(migration);
            const info = await query('PRAGMA table_info(ms_hbi_connections)');
            const names = (info.rows || []).map(row => String(decode(row[1]) || ''));
            const wanted = ['hub','credentials_cipher','updated_at','updated_by'];
            if (JSON.stringify(names) !== JSON.stringify(wanted)) throw new Error(`HBI DEV schema mismatch: ${names.join(',')}`);
            console.log(`HBI_TURSO_DEV_SCHEMA=${existed ? 'ALREADY_PRESENT' : 'CREATED'}`);
            console.log('HBI_TURSO_DEV_COLUMNS=PASS');
            console.log('HBI_TURSO_DEV_ONLY=PASS');
            console.log('PRODUCTION_TOUCHED=NO');
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Remove one-time migration workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/apply-hbi-turso-dev-once.yml
          git commit -m "chore(ci): remove one-time HBI DEV migration"
          git push origin HEAD:main
