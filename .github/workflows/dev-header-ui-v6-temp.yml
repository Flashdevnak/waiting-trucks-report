name: DEV Header UI V6 Temp
# trigger: live-v6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-header-ui-v6-temp.yml

permissions:
  contents: read

jobs:
  live-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DEV header V6 live on all pages
        run: |
          node <<'NODE'
          const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const pages=['ms.html','proof.html','waiting.html','ms-report.html'];
          async function text(path){
            const response=await fetch(`${base}/${path}`,{cache:'no-store',headers:{'cache-control':'no-cache'}});
            const body=await response.text();
            if(!response.ok) throw new Error(`${path} HTTP ${response.status}`);
            return body;
          }
          for(const page of pages){
            const html=await text(page);
            const header=html.match(/<header class="site-header dev-unified-header"[\s\S]*?<\/header>/)?.[0]||'';
            if(!header) throw new Error(`${page}: DEV header missing`);
            if(!html.includes('DEV_TOOLS_EMPTY_STATE_V6')) throw new Error(`${page}: tools empty-state V6 missing`);
            if(!html.includes('DEV_EXCLUSIVE_DROPDOWNS_V4')) throw new Error(`${page}: exclusive dropdown V4 missing`);
            if(!html.includes('DEV_STATUS_LABEL_V5')) throw new Error(`${page}: status label V5 missing`);
            if(!header.includes('dev-page-tools')) throw new Error(`${page}: tools dropdown missing`);
            if(!header.includes('dev-tools-menu')) throw new Error(`${page}: tools menu body missing`);
            console.log(`DEV_HEADER_V6_PAGE=${page}:PASS`);
          }
          const css=await text('style.css?v=20260905-dev-shell-v3');
          for(const marker of [
            'DEV_HEADER_ALIGNMENT_V6',
            'grid-template-columns:30px minmax(0,1fr) 30px',
            'text-align:center;overflow:hidden;text-overflow:ellipsis',
            'left:50%;bottom:6px;transform:translateX(-50%)',
            'dev-tools-auto-empty',
            'DEV_HEADER_LAYOUT_V5'
          ]){
            if(!css.includes(marker)) throw new Error(`live CSS missing ${marker}`);
          }
          console.log('DEV_HEADER_CENTER_V6_LIVE=PASS');
          console.log('DEV_TOOLS_EMPTY_STATE_V6_LIVE=PASS');
          console.log('DEV_DROPDOWN_EXCLUSIVE_V4_STILL_PASS');
          console.log('READ_ONLY=YES');
          console.log('MS_MUTATION_TESTED=NO');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
