name: One-shot compact table density V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-shot-table-density-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Verify latest main
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
      - name: Apply compact table source
        run: node .github/dev-tools/apply-ms-table-density-v2.mjs
      - name: Run focused MS UI regressions
        run: node --test .github/dev-tools/ms-unload-completion-ui.test.mjs worker/tests/ms-owner-live-v8.test.mjs
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Run full worker and frontend suite
        working-directory: worker
        run: npm run check
      - name: Verify density contract
        run: |
          grep -q 'MS_TABLE_DENSITY_V2' style.css
          grep -q 'col.col-schedule { width: 24%; }' style.css
          grep -q 'col.col-status { width: 31%; }' style.css
          grep -q 'table-layout: fixed' style.css
          grep -q 'pollMs: 4000' ms.js
      - name: Commit permanent source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-table-density-v2.yml .github/dev-tools/apply-ms-table-density-v2.mjs
          git add style.css
          git diff --cached --check
          git commit -m "feat: compact MS table columns and mobile cards"
          git push origin HEAD:main
