name: Verify Turso DEV Runtime No D1

on:
  push:
    branches: [turso-dev-migration]
    paths:
      - .github/workflows/verify-turso-runtime-no-d1.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      DEV_TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      TURSO_ORG: flashdevnak
    steps:
      - name: Wait for D1 analytics ingestion
        run: sleep 120
      - name: Verify no post-cutover D1 SQL queries
        run: |
          node <<'NODE'
          const endpoint = 'https://api.cloudflare.com/client/v4/graphql';
          const accountTag = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.DEV_D1_DATABASE_ID;
          const start = '2026-09-02T19:29:00.000Z';
          const end = new Date(Date.now() - 60_000).toISOString();
          const query = `query($accountTag:String!,$databaseId:String!,$start:String!,$end:String!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){sum{readQueries writeQueries rowsRead rowsWritten} dimensions{datetimeMinute}} d1QueriesAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){count sum{rowsRead rowsWritten} dimensions{datetimeMinute query}}}}}`;
          const response = await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{accountTag,databaseId,start,end}})});
          const payload = await response.json();
          if(!response.ok || payload.errors?.length) throw new Error(JSON.stringify(payload.errors||payload));
          const account = payload.data?.viewer?.accounts?.[0]||{};
          let rowsRead=0, rowsWritten=0, readQueries=0, writeQueries=0;
          for(const g of account.d1AnalyticsAdaptiveGroups||[]){rowsRead+=Number(g.sum?.rowsRead||0);rowsWritten+=Number(g.sum?.rowsWritten||0);readQueries+=Number(g.sum?.readQueries||0);writeQueries+=Number(g.sum?.writeQueries||0);}
          const runtimeQueries=(account.d1QueriesAdaptiveGroups||[]).filter(g=>Number(g.count||0)>0);
          console.log(`D1_VERIFY_START=${start}`);
          console.log(`D1_VERIFY_END=${end}`);
          console.log(`POST_TURSO_D1_READ_QUERIES=${readQueries}`);
          console.log(`POST_TURSO_D1_WRITE_QUERIES=${writeQueries}`);
          console.log(`POST_TURSO_D1_ROWS_READ=${rowsRead}`);
          console.log(`POST_TURSO_D1_ROWS_WRITTEN=${rowsWritten}`);
          for(const g of runtimeQueries.slice(0,20)) console.log(`D1_QUERY=${JSON.stringify({count:g.count,rowsRead:g.sum?.rowsRead,rowsWritten:g.sum?.rowsWritten,query:g.dimensions?.query})}`);
          console.log('ANALYTICS_ONLY=true');
          if(readQueries!==0 || writeQueries!==0 || rowsRead!==0 || rowsWritten!==0) process.exitCode=2;
          NODE
      - name: Verify Turso database is queryable and populated
        run: |
          node <<'NODE'
          const platformToken=process.env.TURSO_PLATFORM_API_TOKEN;
          const org=process.env.TURSO_ORG;
          const name=process.env.DEV_TURSO_DATABASE;
          const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${name}/auth/tokens?expiration=10m&authorization=read-only`,{method:'POST',headers:{Authorization:`Bearer ${platformToken}`}});
          const tokenPayload=await tokenRes.json();
          if(!tokenRes.ok || !tokenPayload.jwt) throw new Error(`token HTTP ${tokenRes.status}`);
          const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${name}`,{headers:{Authorization:`Bearer ${platformToken}`}});
          const db=await dbRes.json();
          const host=db?.database?.Hostname;
          if(!dbRes.ok || !host) throw new Error(`db HTTP ${dbRes.status}`);
          const response=await fetch(`https://${host}/v2/pipeline`,{method:'POST',headers:{Authorization:`Bearer ${tokenPayload.jwt}`,'Content-Type':'application/json'},body:JSON.stringify({requests:[{type:'execute',stmt:{sql:'SELECT COUNT(*) AS c FROM users'}},{type:'execute',stmt:{sql:'SELECT COUNT(*) AS c FROM ms_routes'}},{type:'close'}]})});
          const payload=await response.json();
          if(!response.ok || !Array.isArray(payload.results)) throw new Error(`query HTTP ${response.status}`);
          const val=(x)=>Number(x?.response?.result?.rows?.[0]?.[0]?.value ?? x?.response?.result?.rows?.[0]?.[0] ?? 0);
          const users=val(payload.results[0]), routes=val(payload.results[1]);
          console.log(`TURSO_USERS=${users}`);
          console.log(`TURSO_MS_ROUTES=${routes}`);
          if(users<1 || routes<1) throw new Error('Turso migrated data unexpectedly empty');
          console.log('TURSO_QUERY=PASS');
          NODE
