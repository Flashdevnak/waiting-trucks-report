name: DEV MS Fast First Paint V1

on:
  push:
    branches:
      - codex/dev-ms-fast-first-paint-v1

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/dev-ms-fast-first-paint-v1
          fetch-depth: 0

      - name: Apply deterministic fast first paint patch
        run: node .github/dev-tools/apply-ms-fast-first-paint-v1.mjs

      - name: Preserve intended final files
        run: |
          mkdir -p /tmp/fast-first-paint/worker/src /tmp/fast-first-paint/worker/tests
          cp ms.js /tmp/fast-first-paint/ms.js
          cp worker/src/index.js /tmp/fast-first-paint/worker/src/index.js
          cp worker/package.json /tmp/fast-first-paint/worker/package.json
          cp worker/tests/ms-fast-first-paint.test.mjs /tmp/fast-first-paint/worker/tests/ms-fast-first-paint.test.mjs

      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run full Worker checks
        working-directory: worker
        run: npm run check

      - name: Verify DEV staging compatibility
        run: |
          node .github/dev-tools/stage-dev-runtime.mjs ms.js worker/src/index.js
          grep -q 'MS_FAST_FIRST_PAINT_V1' ms.js
          grep -q 'MS_FAST_FIRST_PAINT_V1' worker/src/index.js
          echo 'DEV_STAGE_FAST_FIRST_PAINT=PASS'

      - name: Restore intended final tree only
        run: |
          git reset --hard HEAD
          git clean -fd
          cp /tmp/fast-first-paint/ms.js ms.js
          cp /tmp/fast-first-paint/worker/src/index.js worker/src/index.js
          cp /tmp/fast-first-paint/worker/package.json worker/package.json
          cp /tmp/fast-first-paint/worker/tests/ms-fast-first-paint.test.mjs worker/tests/ms-fast-first-paint.test.mjs
          rm -f .github/dev-tools/apply-ms-fast-first-paint-v1.mjs
          rm -f .github/workflows/dev-ms-fast-first-paint-v1.yml

      - name: Final syntax and regression check
        run: |
          node --check ms.js
          node --check worker/src/index.js
          node --test worker/tests/ms-fast-first-paint.test.mjs
          git diff --check
          echo 'UPSTREAM_POLLING_ADDED=0'
          echo 'DB_WRITES_ADDED=0'
          echo 'PRODUCTION_TOUCHED=NO'

      - name: Commit tested DEV fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(dev): render MS snapshot immediately on refresh"
          git push origin HEAD:codex/dev-ms-fast-first-paint-v1
