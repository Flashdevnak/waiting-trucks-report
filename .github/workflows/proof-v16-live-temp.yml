name: Proof V16 Live Temp
# Rerun after DEV deploy of Proof V16 mobile quick-date fix.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v16-live-temp.yml
      - worker/src/proof-ui-v16.js
      - worker/src/proof-route-meta-v16.js
      - worker/src/turso-index.js
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/proof-v16 && cd /tmp/proof-v16
          npm init -y >/dev/null 2>&1
          timeout 120s npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          timeout 240s npx playwright install chromium >/dev/null
      - name: Run Proof V16 live gate
        run: |
          cd /tmp/proof-v16
          cat > gate.cjs <<'NODE'
          const { chromium } = require('playwright');
          const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          const dayOffset=(baseDay,offset)=>{const [y,m,d]=baseDay.split('-').map(Number);return new Date(Date.UTC(y,m-1,d+offset,12)).toISOString().slice(0,10)};
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1680,height:950}});
              const editorRequests=[]; const mutations=[];
              page.on('request',r=>{if(r.url().includes('/api/proof/editor'))editorRequests.push(r.url());if(r.method()!=='GET'&&r.url().includes('/api/proof/'))mutations.push(`${r.method()} ${r.url()}`)});
              const res=await page.goto(base+'/proof.html?v16='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
              assert(res?.ok(),'proof HTTP '+res?.status());
              await page.waitForFunction(()=>window.__PROOF_V16_READY__===true,{timeout:10000});
              const initial=await page.evaluate(()=>({today:window.ProofV2.thaiDay(),buttons:[...document.querySelectorAll('[data-proof-day-offset]')].map(x=>x.textContent.trim()),active:document.querySelector('[data-proof-day-offset].is-active')?.textContent||'',value:document.getElementById('day-filter')?.value||''}));
              assert(initial.buttons.length===3,'quick buttons '+JSON.stringify(initial));
              assert(initial.buttons.some(x=>x.includes('เมื่อวาน'))&&initial.buttons.some(x=>x.includes('วันนี้'))&&initial.buttons.some(x=>x.includes('พรุ่งนี้')),'labels '+JSON.stringify(initial));
              assert(initial.value===initial.today,'initial day '+JSON.stringify(initial));
              await page.evaluate(()=>{window.__v16Loads=[];window.ProofV2.loadRoutes=async silent=>{window.__v16Loads.push(silent);};});
              await page.click('[data-proof-day-offset="1"]');
              const tomorrow=await page.evaluate(()=>({day:window.ProofV2.state.day,value:document.getElementById('day-filter').value,loads:window.__v16Loads.slice(),today:window.ProofV2.thaiDay()}));
              assert(tomorrow.day===dayOffset(tomorrow.today,1)&&tomorrow.value===tomorrow.day,'tomorrow '+JSON.stringify(tomorrow));
              assert(tomorrow.loads.length===1&&tomorrow.loads[0]===false,'tomorrow load '+JSON.stringify(tomorrow));
              await page.evaluate(()=>{window.__v16Loads=[];});
              await page.click('[data-proof-day-offset="-1"]');
              const yesterday=await page.evaluate(()=>({day:window.ProofV2.state.day,value:document.getElementById('day-filter').value,loads:window.__v16Loads.slice(),today:window.ProofV2.thaiDay()}));
              assert(yesterday.day===dayOffset(yesterday.today,-1)&&yesterday.value===yesterday.day,'yesterday '+JSON.stringify(yesterday));
              const supplier=await page.evaluate(()=>{
                const P=window.ProofV2; P.state.branch='NE1';P.state.profile={canPrint:true,canCreateProof:true};
                const row={lineId:'S1',departureDate:P.state.day,lineName:'LH-6W7.2-NE1-EA1-23:00-BD-193-RS2',lineType:2,lineTypeText:'LH',lineMode:1,plateNumber:'',plateTypeText:'6W7.2',driver:'',driverPhone:'',fleetId:'654',fleetName:'KAMO (KAMOL)',proofId:'',proofState:1,startTime:1380,plannedDepartureTime:1380,standbyTime:1140,detailReady:true,destinationCode:'EA1',destinationName:'19 EA1_HUB-พานทอง'};
                const host=document.createElement('div');host.id='v16-supplier-test';host.innerHTML=P.groupedHtml([row]);document.body.appendChild(host);return host.textContent;
              });
              assert(supplier.includes('KAMO (KAMOL)'),'supplier not visible '+supplier);
              assert(editorRequests.length===0,'editor request before print '+JSON.stringify(editorRequests));
              assert(mutations.length===0,'mutation '+JSON.stringify(mutations));
              const mobile=await browser.newPage({viewport:{width:390,height:844}});
              await mobile.goto(base+'/proof.html?v16m='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
              await mobile.waitForFunction(()=>window.__PROOF_V16_READY__===true,{timeout:10000});
              const mob=await mobile.evaluate(()=>{const q=document.getElementById('proof-quick-day-v16');return {body:document.documentElement.scrollWidth,viewport:innerWidth,quick:q?.scrollWidth||0,client:q?.clientWidth||0,count:q?.querySelectorAll('[data-proof-day-offset]').length||0};});
              assert(mob.count===3&&mob.body<=mob.viewport+2&&mob.quick<=mob.client+2,'mobile '+JSON.stringify(mob));
              console.log('PROOF_V16_LIVE=PASS');
              console.log('QUICK_DAY_YESTERDAY_TODAY_TOMORROW=PASS');
              console.log('SUPPLIER_VISIBLE_WITHOUT_EDITOR=PASS');
              console.log('MOBILE_QUICK_DAY_OVERFLOW=0');
              console.log('MS_MUTATION_TESTED=NO');
              console.log('PRODUCTION_TOUCHED=NO');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 90s node gate.cjs
