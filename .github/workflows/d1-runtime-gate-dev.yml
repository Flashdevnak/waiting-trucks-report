name: D1 Runtime Gate DEV

# Read-only diagnostics for DEV D1. Never deploys, migrates, or writes D1.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/d1-runtime-gate-dev.yml

permissions:
  contents: read

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
      MULTICLIENT_DEPLOY_AT: 2026-09-02T06:07:08.000Z
    steps:
      - name: Query DEV D1 runtime analytics
        run: |
          node <<'NODE'
          const endpoint = 'https://api.cloudflare.com/client/v4/graphql';
          const accountTag = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.DEV_D1_DATABASE_ID;
          if (!accountTag || !token || !databaseId) process.exit(2);

          const query = `query($accountTag:String!,$databaseId:String!,$start:String!,$end:String!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){sum{readQueries writeQueries rowsRead rowsWritten} dimensions{datetimeMinute}} d1QueriesAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){count sum{rowsRead rowsWritten} dimensions{datetimeMinute query}}}}}`;
          const end = new Date(Date.now() - 2 * 60_000);
          const start = new Date(end.getTime() - 20 * 60_000);
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ query, variables: { accountTag, databaseId, start: start.toISOString(), end: end.toISOString() } }),
          });
          const payload = await response.json();
          if (!response.ok || payload.errors?.length) throw new Error(JSON.stringify(payload.errors || payload));
          const account = payload.data?.viewer?.accounts?.[0] || {};
          const totals = new Map();
          for (const group of account.d1AnalyticsAdaptiveGroups || []) {
            const minute = group.dimensions?.datetimeMinute;
            if (!minute) continue;
            const sum = group.sum || {};
            totals.set(minute, {
              minute,
              readQueries: Number(sum.readQueries || 0),
              writeQueries: Number(sum.writeQueries || 0),
              rowsRead: Number(sum.rowsRead || 0),
              rowsWritten: Number(sum.rowsWritten || 0),
            });
          }
          const details = new Map();
          for (const group of account.d1QueriesAdaptiveGroups || []) {
            const minute = group.dimensions?.datetimeMinute;
            if (!minute) continue;
            if (!details.has(minute)) details.set(minute, []);
            details.get(minute).push({
              count: Number(group.count || 0),
              rowsRead: Number(group.sum?.rowsRead || 0),
              rowsWritten: Number(group.sum?.rowsWritten || 0),
              query: String(group.dimensions?.query || '').replace(/\s+/g, ' ').trim(),
            });
          }
          const business = /INSERT OR REPLACE INTO ms_routes|INSERT INTO ms_route_history|DELETE FROM ms_routes/i;
          const cache = /INSERT INTO ms_live_cache/i;
          const claim = /ms_sync_claims/i;
          console.log(`RUNTIME_MINUTE_GATE_START=${start.toISOString()}`);
          console.log(`RUNTIME_MINUTE_GATE_END=${end.toISOString()}`);
          for (const row of [...totals.values()].sort((a,b)=>a.minute.localeCompare(b.minute))) {
            const qs = details.get(row.minute) || [];
            const sumWrites = (pattern) => qs.filter(x => x.rowsWritten > 0 && pattern.test(x.query)).reduce((n,x)=>n+x.rowsWritten,0);
            console.log(JSON.stringify({
              ...row,
              businessWrites: sumWrites(business),
              cacheWrites: sumWrites(cache),
              claimWrites: sumWrites(claim),
              topQueries: qs.sort((a,b)=>(b.rowsRead+b.rowsWritten)-(a.rowsRead+a.rowsWritten)).slice(0,8),
            }));
          }
          NODE

      - name: Read latest cross-isolate claim only
        run: |
          node <<'NODE'
          const account = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const db = process.env.DEV_D1_DATABASE_ID;
          const endpoint = `https://api.cloudflare.com/client/v4/accounts/${account}/d1/database/${db}/query`;
          const sql = 'SELECT hub,source_hash,state,claimed_at,finished_at FROM ms_sync_claims ORDER BY hub LIMIT 20';
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ sql }),
          });
          const payload = await response.json();
          if (!response.ok || payload.success === false) throw new Error(JSON.stringify(payload.errors || payload));
          const result = Array.isArray(payload.result) ? payload.result[0] : payload.result;
          console.log(`MULTICLIENT_DEPLOY_AT=${process.env.MULTICLIENT_DEPLOY_AT}`);
          console.log(`MS_SYNC_CLAIMS=${JSON.stringify(result?.results || [])}`);
          console.log(`CLAIM_DIAGNOSTIC_ROWS_READ=${Number(result?.meta?.rows_read || 0)}`);
          console.log('CLAIM_DIAGNOSTIC_ROWS_WRITTEN=0');
          NODE
