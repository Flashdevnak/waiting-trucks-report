name: Fix HBI photo fresh time once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-photo-fresh-time-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard expected checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=b145968c3762cdd9bad72eeca68bcadd62099ca8
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }

      - name: Align photo request with captured HBI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('worker/src/index.js')
          text = worker.read_text(encoding='utf-8')
          start = text.index('async function readHbiTruckPhotos')
          end = text.index('async function readBusTimeData', start)
          read = text[start:end]
          old = 'const value = credentials?.[key];'
          new = 'const value = key === "time" ? String(Date.now()) : credentials?.[key];'
          if read.count(old) != 1:
              raise SystemExit(f'HBI photo time anchor expected 1, got {read.count(old)}')
          read = read.replace(old, new, 1)
          if '"BI-PLATFORM": ""' not in read or '"Accept-Language": credentials?.lang || "th"' not in read:
              raise SystemExit('HBI HAR-confirmed headers missing')
          text = text[:start] + read + text[end:]
          worker.write_text(text, encoding='utf-8')

          manifest = Path('worker/src/origin-manifest-v1.js')
          manifest_text = manifest.read_text(encoding='utf-8')
          mstart = manifest_text.index('export async function originManifestHbiCredentials')
          mend = manifest_text.index('export async function readManifestPage', mstart)
          block = manifest_text[mstart:mend]
          old_manifest = 'time: credentialValue(credentials.time, 100),'
          new_manifest = 'time: String(Date.now()),'
          if block.count(old_manifest) != 1:
              raise SystemExit(f'manifest fallback time anchor expected 1, got {block.count(old_manifest)}')
          block = block.replace(old_manifest, new_manifest, 1)
          manifest_text = manifest_text[:mstart] + block + manifest_text[mend:]
          manifest.write_text(manifest_text, encoding='utf-8')

          test_file = Path('worker/tests/hbi-truck-photos.test.mjs')
          tests = test_file.read_text(encoding='utf-8')
          tests = tests.replace(
              'assert.match(read, /const value = credentials\\?\\.\\[key\\];/);\n  assert.doesNotMatch(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\)/);',
              'assert.match(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\) : credentials\\?\\.\\[key\\]/);',
              1,
          )
          tests = tests.replace(
              'test("LH Manifest HBI fallback preserves the captured auth time", () => {',
              'test("LH Manifest HBI fallback refreshes HBI request time without extra polling", () => {',
              1,
          )
          tests = tests.replace(
              'assert.match(fallback, /time: credentialValue\\(credentials\\.time, 100\\)/);\n  assert.doesNotMatch(fallback, /time: String\\(Date\\.now\\(\\)\\)/);',
              'assert.match(fallback, /time: String\\(Date\\.now\\(\\)\\)/);',
              1,
          )
          test_file.write_text(tests, encoding='utf-8')

          trigger = Path('.github/dev-tools/source-integration-trigger-20260910.txt')
          trigger_text = trigger.read_text(encoding='utf-8')
          trigger_text = trigger_text.replace('HBI_PHOTO_AUTH_REPLAY=CAPTURED_TIME_HEADERS_V3', 'HBI_PHOTO_AUTH_REPLAY=FRESH_TIME_HAR_HEADERS_V4')
          trigger.write_text(trigger_text, encoding='utf-8')
          PY

          node --check worker/src/index.js
          node --check worker/src/origin-manifest-v1.js
          cd worker
          npm ci
          node --test tests/hbi-truck-photos.test.mjs
          npm run check
          node ../.github/dev-tools/patch-dev-origin-manifest-session-v2.mjs --self-test
          cd ..
          git diff --check

      - name: Commit source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-photo-fresh-time-once.yml
          git add worker/src/index.js worker/src/origin-manifest-v1.js worker/tests/hbi-truck-photos.test.mjs .github/dev-tools/source-integration-trigger-20260910.txt
          git diff --cached --check
          git commit -m "fix(ms): keep HBI photo auth time fresh"
          git push origin HEAD:main
