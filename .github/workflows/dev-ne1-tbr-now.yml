name: DEV NE1 TBR Now
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-ne1-tbr-now.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Read current public NE1 TBR shadow only
        run: |
          node <<'NODE'
          const url='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev/api/shadow-tbr?hub=NE1';
          const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
          const j=await r.json();
          if(!r.ok||j?.ok===false) throw new Error(`shadow HTTP ${r.status}`);
          const now=Date.now();
          const rows=(Array.isArray(j.records)?j.records:[]).map(x=>({
            id:String(x.id||''),
            attendanceType:String(x.attendanceType||''),
            status:String(x.status||''),
            tbrAt:String(x.tbrAt||''),
            kitAt:String(x.kitAt||''),
            routeActualArrivalAt:String(x.routeActualArrivalAt||''),
            routeSeen:Boolean(x.routeSeen),
            leadMinutes:x.leadMinutes??null,
          }));
          const recent=rows.filter(x=>{
            const t=Date.parse(x.tbrAt||'');
            return Number.isFinite(t)&&now-t<=30*60*1000&&now-t>=-5*60*1000;
          }).sort((a,b)=>Date.parse(b.tbrAt)-Date.parse(a.tbrAt));
          const pending=recent.filter(x=>x.status==='pending'&&!x.routeActualArrivalAt);
          console.log(`NE1_TBR_OBSERVER_STATUS=${j.observerStatus||''}`);
          console.log(`NE1_TBR_LAST_ATTEMPT_AT=${j.lastAttemptAt||''}`);
          console.log(`NE1_TBR_SOURCE_AVAILABLE=${String(j.sourceAvailable??'')}`);
          console.log(`NE1_TBR_FEED_COUNT=${j.feedCount??''}`);
          console.log(`NE1_TBR_ROUTE_ROW_COUNT=${j.rowCount??''}`);
          console.log(`NE1_TBR_RECENT_30M=${JSON.stringify(recent)}`);
          console.log(`NE1_TBR_PENDING_30M=${JSON.stringify(pending)}`);
          console.log('NE1_TBR_CHECK_MS_UPSTREAM_CALLS=0');
          console.log('NE1_TBR_CHECK_TURSO_WRITES=0');
          NODE
