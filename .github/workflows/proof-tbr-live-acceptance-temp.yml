name: Proof TBR Live Acceptance Temp
# checkpoint-trigger: bus-daily-v9b

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: write

jobs:
  patch-bus-daily-cpu-split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply functional patch
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('.tmp-tbr-bus-v9.py')
          s=p.read_text()
          start=s.index("\nanchor='      status:")
          end=s.index("\nq.write_text(t)", start)
          p.write_text(s[:start] + s[end:])
          PY
          python3 .tmp-tbr-bus-v9.py
      - name: Validate functional patch before commit
        run: |
          node --check cloudflare-browser-test/src/index.js
          node --check cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          node --check cloudflare-browser-test/scripts/tbr-bus-retry.test.mjs
          node --check cloudflare-browser-test/scripts/tbr-bus-daily-split.test.mjs
          cd cloudflare-browser-test
          npm install --no-audit --no-fund
          node scripts/tbr-bus-retry.test.mjs
          node scripts/tbr-bus-daily-split.test.mjs
          cd ..
          cp worker/src/index.js /tmp/tbr-dev-index.js
          node cloudflare-browser-test/scripts/patch-dev-tbr-shadow-readonly.mjs /tmp/tbr-dev-index.js
          node cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs /tmp/tbr-dev-index.js
          node --check /tmp/tbr-dev-index.js
          grep -q 'TBR_BUS_DAILY_SPLIT_V9' /tmp/tbr-dev-index.js
          grep -q 'shadowDay' /tmp/tbr-dev-index.js
          ! grep -q 'd1_databases' cloudflare-browser-test/wrangler.jsonc
          echo 'TBR_BUS_CPU_SPLIT_CHECKPOINT=PASS'
          echo 'TBR_CRON=1_MINUTE_UNCHANGED'
          echo 'TBR_TURSO_WRITES=0'
          echo 'BROWSER_D1_BINDING=0'
          echo 'MS_MUTATION_TESTED=NO'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit functional source and regressions
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add cloudflare-browser-test/src/index.js \
                  cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs \
                  cloudflare-browser-test/scripts/tbr-bus-retry.test.mjs \
                  cloudflare-browser-test/scripts/tbr-bus-daily-split.test.mjs \
                  cloudflare-browser-test/package.json
          git commit -m 'Split TBR Bus operating days across DEV CPU budgets'
          git pull --rebase origin main
          git push origin HEAD:main
