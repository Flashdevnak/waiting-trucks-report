name: TEMP DEV MS Connection 401 Toast V2

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temp-fix-ms-connection-401-toast-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded 401 toast patch
        run: python3 .github/temp-tools/patch-ms-connection-401-toast-v2.py
      - name: Validate syntax and diff
        run: |
          node --check ms.js
          git diff --check
          grep -q 'MS_CONNECTION_401_TOAST_V2' ms.js
          grep -q 'MS_CONNECTION_401_TOAST_V2' style.css
          ! grep -q 'statusBox.insertAdjacentElement("afterend", sessionAlert)' ms.js
      - name: Run focused regressions
        run: |
          cd worker
          npm ci
          npm run check
          node --test ../.github/dev-tools/ms-self-healing-supervisor.test.mjs
          node --test ../.github/dev-tools/stage-dev-runtime.test.mjs
          node --test ../.github/dev-tools/realtime-quota-hardening.test.mjs
      - name: Verify staged UI uses native toast only
        run: |
          cd worker
          rm -rf .tmp-toast-assets .tmp-toast-runtime
          mkdir -p .tmp-toast-assets .tmp-toast-runtime
          cp ../ms.html ../ms.js ../style.css ../ms-v4.css ../proof.html .tmp-toast-assets/
          cp -R src .tmp-toast-runtime/src
          node ../.github/dev-tools/stage-dev-runtime.mjs .tmp-toast-assets/ms.js .tmp-toast-runtime/src/index.js
          node ../.github/dev-tools/patch-dev-origin-manifest-session-v2.mjs .tmp-toast-assets/ms.js .tmp-toast-runtime/src/origin-manifest-v1.js
          node --check .tmp-toast-assets/ms.js
          grep -q 'MS_CONNECTION_401_TOAST_V2' .tmp-toast-assets/ms.js
          grep -q 'toast(' .tmp-toast-assets/ms.js
          ! grep -q 'statusBox.insertAdjacentElement("afterend", sessionAlert)' .tmp-toast-assets/ms.js
          rm -rf .tmp-toast-assets .tmp-toast-runtime
      - name: Commit tested source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ms.js style.css
          git commit -m 'fix(dev): show MS 401 guidance in bottom-right toast'
          git push origin HEAD:main
