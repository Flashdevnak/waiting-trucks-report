name: Fix connection source numbering once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-connection-source-numbering-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard expected source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=b93d1d8d57a0c8416d8291717c3b49e73dd370bf
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }

      - name: Fix final six-source numbering in authoritative DEV composer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          responsive = Path('.github/dev-tools/patch-ms-connection-error-kv.mjs')
          text = responsive.read_text(encoding='utf-8')
          replacements = [
              ('if (summary) summary.textContent = "อัปโหลด HAR ทั้ง 5 แหล่ง";',
               'if (summary) summary.textContent = "อัปโหลด HAR ทั้ง 6 แหล่ง";'),
              ('if (node.textContent.includes("ทั้ง 4 หน้าด้านล่าง")) node.textContent = node.textContent.replace("ทั้ง 4 หน้าด้านล่าง", "ทั้ง 5 หน้าด้านล่าง");',
               'if (/ทั้ง [45] หน้าด้านล่าง/.test(node.textContent)) node.textContent = node.textContent.replace(/ทั้ง [45] หน้าด้านล่าง/, "ทั้ง 6 หน้าด้านล่าง");'),
              ('if (proofStatus) proofStatus.textContent = "4. ปริ้นบาร์โค้ดรถ";',
               'if (proofStatus) proofStatus.textContent = "5. ปริ้นบาร์โค้ดรถ";'),
              ('if (manifestStatus) manifestStatus.textContent = "5. LH Manifest (พัสดุออกจริง / น้ำหนัก Kg)";',
               'if (manifestStatus) manifestStatus.textContent = "6. LH Manifest (พัสดุออกจริง / น้ำหนัก Kg)";'),
              ('manifestLink.textContent = "5. เปิด LH Manifest (หลังเข้า HBI SSO)";',
               'manifestLink.textContent = "6. เปิด LH Manifest (หลังเข้า HBI SSO)";'),
              ('if (proofLabel) proofLabel.textContent = "4. HAR ปริ้นบาร์โค้ดรถ";',
               'if (proofLabel) proofLabel.textContent = "5. HAR ปริ้นบาร์โค้ดรถ";'),
              ('if (manifestLabel) manifestLabel.textContent = "5. HAR LH Manifest · พัสดุออกจริง + น้ำหนัก Kg";',
               'if (manifestLabel) manifestLabel.textContent = "6. HAR LH Manifest · พัสดุออกจริง + น้ำหนัก Kg";'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one numbering anchor, got {count}: {old}')
              text = text.replace(old, new)
          responsive.write_text(text, encoding='utf-8')

          test_path = Path('.github/dev-tools/ms-durable-coordinator.test.mjs')
          text = test_path.read_text(encoding='utf-8')
          replacements = [
              ('test("five-source HAR setup stacks every source on its own row across devices without extra polling", () => {',
               'test("six-source HAR setup stacks every source on its own row across devices without extra polling", () => {'),
              ('"อัปโหลด HAR ทั้ง 5 แหล่ง",', '"อัปโหลด HAR ทั้ง 6 แหล่ง",'),
              ('"5. LH Manifest (พัสดุออกจริง / น้ำหนัก Kg)",', '"6. LH Manifest (พัสดุออกจริง / น้ำหนัก Kg)",'),
              ('"5. HAR LH Manifest · พัสดุออกจริง + น้ำหนัก Kg",', '"6. HAR LH Manifest · พัสดุออกจริง + น้ำหนัก Kg",'),
              ('"5. เปิด LH Manifest (หลังเข้า HBI SSO)",', '"6. เปิด LH Manifest (หลังเข้า HBI SSO)",'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one test anchor, got {count}: {old}')
              text = text.replace(old, new)
          proof_anchor = '    "อัปโหลด HAR ทั้ง 6 แหล่ง",\n'
          if proof_anchor not in text:
              raise SystemExit('six-source test anchor missing after replacement')
          text = text.replace(
              proof_anchor,
              proof_anchor + '    "5. ปริ้นบาร์โค้ดรถ",\n    "5. HAR ปริ้นบาร์โค้ดรถ",\n',
              1,
          )
          test_path.write_text(text, encoding='utf-8')

          manifest_patch = Path('.github/dev-tools/patch-dev-origin-manifest-session-v4-base.mjs')
          text = manifest_patch.read_text(encoding='utf-8')
          count = text.count('ข้อ 5')
          if count < 2:
              raise SystemExit(f'Expected LH Manifest reconnect references to source 5, got {count}')
          text = text.replace('ข้อ 5', 'ข้อ 6')
          manifest_patch.write_text(text, encoding='utf-8')
          print(f'UPDATED_MANIFEST_RECONNECT_REFERENCES={count}')
          PY

          node --check .github/dev-tools/patch-ms-connection-error-kv.mjs
          node --check .github/dev-tools/patch-dev-origin-manifest-session-v4-base.mjs
          node --test .github/dev-tools/ms-durable-coordinator.test.mjs
          node .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs --self-test
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          git diff --check

      - name: Commit clean source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-connection-source-numbering-once.yml
          git add .github/dev-tools/patch-ms-connection-error-kv.mjs .github/dev-tools/ms-durable-coordinator.test.mjs .github/dev-tools/patch-dev-origin-manifest-session-v4-base.mjs
          git diff --cached --check
          git commit -m "fix(dev): correct six-source connection numbering"
          git push origin HEAD:main
