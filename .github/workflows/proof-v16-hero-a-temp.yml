name: Proof V16 Hero A Temp
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v16-hero-a-temp.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  visual-live:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/proof-hero && cd /tmp/proof-hero
          npm init -y >/dev/null 2>&1
          timeout 120s npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          timeout 240s npx playwright install chromium >/dev/null
      - name: Run Proof hero A gate
        run: |
          cd /tmp/proof-hero
          cat > gate.cjs <<'NODE'
          const { chromium } = require('playwright');
          const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const assert=(v,m)=>{if(!v)throw new Error(m)};
          async function openSynthetic(page){
            await page.evaluate(()=>{
              const P=window.ProofV2;
              P.state.profile={name:'นาย จิรายุ ตากงูเหลือม',canPrint:true,canCreateProof:true};
              const row={lineId:'HERO-A',departureDate:'2026-09-07',lineName:'FD-6W7.2-NE1-2JHO-05:30-BD-1-RS1',proofState:1,detailReady:true,standbyTime:210,plannedDepartureTime:330,startTime:330,plateTypeText:'6W7.2',plateNumber:'',driver:'',driverPhone:'',proofId:''};
              const detail={lineId:'HERO-A',departureDate:'2026-09-07',lineName:row.lineName,proofState:1,proofStateText:'รอเปิดบาร์โค้ด',plateTypeText:'6W7.2',plateNumber:'',driver:'',driverPhone:'',fleetName:'AMR (AMARA)',fleetId:'37',policy:{plateEditable:true,driverEditable:true}};
              P.editorState={row,detail,selection:{plateId:'',fmsDriverId:''}};
              P.openEditor(row,detail);
            });
            await page.waitForSelector('.proof-v16-editor-hero',{state:'visible',timeout:5000});
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1680,height:950}});
              const mutations=[]; page.on('request',r=>{if(r.method()!=='GET'&&r.url().includes('/api/proof/'))mutations.push(`${r.method()} ${r.url()}`)});
              const res=await page.goto(base+'/proof.html?heroA='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
              assert(res?.ok(),'HTTP '+res?.status());
              await page.waitForFunction(()=>window.__PROOF_V16_READY__===true,{timeout:10000});
              await openSynthetic(page);
              const desk=await page.evaluate(()=>{
                const hero=document.querySelector('.proof-v16-editor-hero');
                const route=document.getElementById('proof-editor-route');
                const status=document.getElementById('proof-editor-status');
                const grid=document.querySelector('.proof-v16-editor-meta-grid');
                const cards=[...document.querySelectorAll('.proof-v16-editor-meta-card')];
                const plan=document.getElementById('proof-editor-plan');
                const user=document.getElementById('proof-editor-ms-user');
                return {hero:!!hero,route:route?.textContent.trim(),status:status?.textContent.trim(),cols:getComputedStyle(grid).gridTemplateColumns,cards:cards.length,plan:plan?.textContent.trim(),user:user?.textContent.trim(),routeAlign:getComputedStyle(route).textAlign,statusRadius:getComputedStyle(status).borderRadius};
              });
              assert(desk.hero&&desk.cards===2,'hero/cards '+JSON.stringify(desk));
              assert(desk.route==='FD-6W7.2-NE1-2JHO-05:30-BD-1-RS1','route '+JSON.stringify(desk));
              assert(desk.status==='รอเปิดบาร์โค้ด','status '+JSON.stringify(desk));
              assert(desk.plan.includes('Standby 03:30')&&desk.plan.includes('ปล่อย 05:30'),'plan '+JSON.stringify(desk));
              assert(desk.user==='นาย จิรายุ ตากงูเหลือม','user '+JSON.stringify(desk));
              assert(desk.cols.trim().split(/\s+/).length===2,'desktop cols '+desk.cols);
              assert(mutations.length===0,'mutation '+JSON.stringify(mutations));

              const mobile=await browser.newPage({viewport:{width:390,height:844}});
              await mobile.goto(base+'/proof.html?heroAm='+Date.now(),{waitUntil:'domcontentloaded',timeout:20000});
              await mobile.waitForFunction(()=>window.__PROOF_V16_READY__===true,{timeout:10000});
              await openSynthetic(mobile);
              const mob=await mobile.evaluate(()=>{
                const grid=document.querySelector('.proof-v16-editor-meta-grid');
                const dialog=document.getElementById('proof-editor-dialog');
                return {cols:getComputedStyle(grid).gridTemplateColumns,body:document.documentElement.scrollWidth,viewport:innerWidth,dialog:dialog?.getBoundingClientRect().width||0};
              });
              assert(mob.cols.trim().split(/\s+/).length===1,'mobile cols '+JSON.stringify(mob));
              assert(mob.body<=mob.viewport+2,'mobile overflow '+JSON.stringify(mob));
              console.log('PROOF_HERO_A_LIVE=PASS');
              console.log('ROUTE_CENTERED=PASS');
              console.log('STATUS_BADGE_SEPARATE=PASS');
              console.log('TIME_USER_CARDS_DESKTOP_2=PASS');
              console.log('TIME_USER_CARDS_MOBILE_1=PASS');
              console.log('MS_MUTATION_TESTED=NO');
              console.log('PRODUCTION_TOUCHED=NO');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          timeout 90s node gate.cjs
