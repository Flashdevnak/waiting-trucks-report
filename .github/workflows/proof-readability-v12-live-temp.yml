name: Proof Readability V12 Browser Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-readability-v12-live-temp.yml

permissions:
  contents: read

jobs:
  browser-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chromium
        run: |
          mkdir -p /tmp/proof-v12-live && cd /tmp/proof-v12-live
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify Proof V12 live rendering and quota behavior
        run: |
          cd /tmp/proof-v12-live
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage({viewport:{width:1680,height:1050}});
              const errors=[], requests=[];
              page.on('pageerror',e=>errors.push(String(e.stack||e)));
              page.on('request',r=>requests.push(r.url()));
              const response=await page.goto(`${base}/proof.html?v12=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response||!response.ok()) throw new Error(`proof HTTP ${response?.status()}`);
              await page.waitForFunction(()=>window.__PROOF_V10_READY__===true,{timeout:15000});
              await page.waitForTimeout(700);
              const initialForbidden=requests.filter(u=>u.includes('/api/proof/history')||u.includes('/api/proof/plate-options')||u.includes('/api/proof/editor'));
              if(initialForbidden.length) throw new Error(`background Proof detail/history/search request: ${initialForbidden.join(',')}`);
              const result=await page.evaluate(async()=>{
                const P=window.ProofV2;
                const fd={lineId:'FD1',departureDate:'2026-09-06',lineName:'FD-4WJ-NE1-SNRR-07:00-BD-RS1',lineTypeText:'Feeder',routeTypeText:'FD',lineMode:1,proofState:1,proofId:'',plateNumber:'บล3393(บุรีรัมย์)',plateTypeText:'4WJ',driver:'ณัฐภาส เขตเขว้า',driverPhone:'0802074190',plannedDepartureTime:420,standbyTime:300,detailReady:true};
                const lh={lineId:'LH1',departureDate:'2026-09-06',lineName:'LH-6W5.5-NE1-BURT-08:00-1-RO',lineTypeText:'LH',routeTypeText:'LH',lineMode:1,proofState:2,proofId:'NAKTEST',plannedDepartureTime:480,standbyTime:360,detailReady:true};
                const grouped=P.groupedHtml([fd,lh]);
                const oldRows=P.state.rows, oldAuth=P.state.auth, oldBranch=P.state.branch, oldApi=P.apiGet, oldProfile=P.state.profile;
                P.state.rows=[fd];P.state.auth={token:'test',username:'tester'};P.state.branch='NE1';P.state.profile={canPrint:true,canCreateProof:true,name:'tester'};
                let detailCalls=0;
                const full={lineName:fd.lineName,proofState:1,proofStateText:'รอเปิดบาร์โค้ด',fleetId:'32',fleetName:'2KL (2K LOGISTICS)',originName:'02 NE1_HUB-นครราชสีมา',track:'NE1-SNRR',plateId:'262730',plateNumber:'บล-3393(บุรีรัมย์)',plateTypeText:'4WJ',fmsDriverId:'7',driver:'ณัฐภาส เขตเขว้า',driverPhone:'0802074190',proofId:null,policy:{plateEditable:true,driverEditable:true}};
                P.apiGet=async(path)=>{if(path==='/api/proof/editor'){detailCalls++;return full;}return {};};
                const host=document.getElementById('grouped-routes');host.innerHTML=P.groupRouteCard(fd);host.classList.remove('hidden');
                const detailBtn=host.querySelector('[data-proof-v11-detail]');const printBtn=host.querySelector('[data-proof-print]');
                const beforeDetail=detailCalls;
                detailBtn.click();await new Promise(r=>setTimeout(r,30));
                const panel=host.querySelector('[data-proof-v11-detail-panel]');const firstSupplier=panel.textContent.includes('2KL (2K LOGISTICS)');
                detailBtn.click();detailBtn.click();await new Promise(r=>setTimeout(r,30));
                const cached=detailCalls===1;
                P.openEditor(fd,full);await new Promise(r=>setTimeout(r,20));
                const modalContext=document.getElementById('proof-editor-context-v12');
                const selectedIcon=document.querySelector('.proof-selected-value>span');
                const detailStyle=getComputedStyle(detailBtn), printStyle=getComputedStyle(printBtn);
                const groupHost=document.createElement('div');groupHost.innerHTML=grouped;document.body.appendChild(groupHost);
                const groupTitles=[...groupHost.querySelectorAll('.proof-group-name strong')].map(x=>x.textContent.trim());
                const groupFont=parseFloat(getComputedStyle(groupHost.querySelector('.proof-group-name strong')).fontSize);
                const rowFont=parseFloat(getComputedStyle(host.querySelector('.proof-v11-route>strong')).fontSize);
                const tableLabels=[...document.querySelectorAll('.proof-table thead th')].map(x=>x.textContent.trim());
                const out={
                  ready:window.__PROOF_V10_READY__===true,
                  v12Style:!!document.getElementById('proof-v12-style'),
                  groupTitles,groupFont,rowFont,tableLabels,
                  fdLabel:P.destinationGroupLabel(fd),lhLabel:P.destinationGroupLabel(lh),
                  firstSupplier,cached,detailCalls,
                  equalActions:detailStyle.width===printStyle.width&&detailStyle.height===printStyle.height,
                  actionWidth:detailStyle.width,actionHeight:detailStyle.height,
                  modalSupplier:modalContext?.textContent.includes('2KL (2K LOGISTICS)')||false,
                  emojiHidden:selectedIcon?getComputedStyle(selectedIcon).display==='none':true,
                  groupButton:document.getElementById('group-view-btn')?.textContent.trim(),
                  listButton:document.getElementById('list-view-btn')?.textContent.trim()
                };
                try{document.getElementById('proof-editor-dialog')?.close();}catch{}
                P.apiGet=oldApi;P.state.rows=oldRows;P.state.auth=oldAuth;P.state.branch=oldBranch;P.state.profile=oldProfile;groupHost.remove();
                return out;
              });
              if(errors.length) throw new Error(`browser errors: ${errors.join(' | ')}`);
              if(!result.ready||!result.v12Style) throw new Error(`V12 not ready ${JSON.stringify(result)}`);
              if(result.fdLabel!=='FD • Feeder / รถเสริม / อื่น ๆ'||result.lhLabel!=='LH • HUB TO HUB') throw new Error(`labels ${JSON.stringify(result)}`);
              if(!result.groupTitles.some(x=>x.startsWith('FD'))||!result.groupTitles.some(x=>x.startsWith('LH'))) throw new Error(`rendered group titles ${JSON.stringify(result.groupTitles)}`);
              if(result.groupTitles.some(x=>/^PTB|^NE4/.test(x))) throw new Error(`old destination group leaked ${JSON.stringify(result.groupTitles)}`);
              if(result.groupFont<17||result.rowFont<15) throw new Error(`fonts too small ${JSON.stringify(result)}`);
              if(!result.firstSupplier||!result.cached||result.detailCalls!==1) throw new Error(`on-demand detail cache ${JSON.stringify(result)}`);
              if(!result.equalActions) throw new Error(`action buttons mismatch ${JSON.stringify(result)}`);
              if(!result.modalSupplier||!result.emojiHidden) throw new Error(`modal readability mismatch ${JSON.stringify(result)}`);
              if(result.groupButton!=='แยกกลุ่ม FD / LH'||result.listButton!=='ตารางรวม') throw new Error(`view labels ${JSON.stringify(result)}`);
              if(!result.tableLabels.includes('คนขับ / โทรศัพท์')||!result.tableLabels.includes('ตรวจ / ปริ้น')) throw new Error(`table labels ${JSON.stringify(result.tableLabels)}`);
              for(const other of ['ms.html','waiting.html','ms-report.html']){const r=await page.request.get(`${base}/${other}?scope=${Date.now()}`);if(!r.ok())throw new Error(`${other} ${r.status()}`);if((await r.text()).includes('/proof-v10.js'))throw new Error(`${other} contains Proof runtime`);}
              console.log('PROOF_V12_BROWSER_READY=PASS');
              console.log('PROOF_V12_VISIBLE_GROUP_HEADERS=FD,LH');
              console.log('PROOF_V12_FONT_100_PERCENT=PASS');
              console.log('PROOF_V12_EQUAL_ACTION_BUTTONS=PASS');
              console.log('PROOF_V12_SUPPLIER_ON_DEMAND_CACHE=PASS');
              console.log('PROOF_V12_MODAL_NEUTRAL_NO_EMOJI=PASS');
              console.log('PROOF_V12_BACKGROUND_EDITOR_READ=0');
              console.log('PROOF_V12_BACKGROUND_PLATE_SEARCH=0');
              console.log('PROOF_V12_BACKGROUND_HISTORY_READ=0');
              console.log('PROOF_SCOPE_ONLY=PASS');
              console.log('PRODUCTION_TOUCHED=NO');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
