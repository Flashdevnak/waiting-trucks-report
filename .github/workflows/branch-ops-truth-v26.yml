name: Branch Ops Truth V26

on:
  pull_request:
    paths:
      - .github/workflows/branch-ops-truth-v26.yml
      - .github/dev-tools/**
      - ms.js
      - ms.html
      - style.css
      - worker/src/**
      - worker/tests/**
      - worker/package.json
      - worker/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Source syntax
        run: |
          node --check ms.js
          node --check worker/src/index.js
          node --check .github/dev-tools/bus-time-hot-lane-v14-runtime.mjs
          node --check .github/dev-tools/stage-dev-runtime.mjs

      - name: Stage and operational truth gates
        run: |
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          node --test .github/dev-tools/ms-unloading-start-truth-v2.test.mjs
          node --test .github/dev-tools/ms-lower-card-truth-v1.test.mjs
          node --test .github/dev-tools/bus-time-hot-lane-v14.test.mjs
          node --test .github/dev-tools/pno-approved-modal-v18.test.mjs

      - name: Realtime and quota gates
        run: |
          node --test .github/dev-tools/realtime-quota-hardening.test.mjs
          node --test .github/dev-tools/ms-quota-safe-live.test.mjs
          node --test .github/dev-tools/ms-realtime-recovery.test.mjs
          node --test .github/dev-tools/ms-multiclient-dedupe.test.mjs
          node --test .github/dev-tools/ms-durable-coordinator.test.mjs

      - name: Daily and filter regression gates
        run: |
          node --test .github/dev-tools/daily-history.test.mjs
          node --test .github/dev-tools/ms-archive-completeness.test.mjs
          node --test .github/dev-tools/ms-summary-filter.test.mjs
          node --test .github/dev-tools/ms-drop-lifecycle.test.mjs

      - name: Worker full check
        working-directory: worker
        run: |
          npm ci
          npm run check

      - name: Safety invariants
        run: |
          ! grep -q "wrangler deploy" .github/workflows/branch-ops-truth-v26.yml
          ! grep -q "turso db shell" .github/workflows/branch-ops-truth-v26.yml
          ! grep -q "workers.dev" .github/workflows/branch-ops-truth-v26.yml
          grep -q "pollMs: 4000" ms.js
          grep -q "BUS_TIME_HAR_SEED_TRUTH_V26" ms.js
          grep -q "MS_UNLOAD_SLA_WARNING_V26" ms.js
          echo "BRANCH_OPS_TRUTH_V26=PASS"
          echo "DEPLOYS=0"
          echo "DB_MUTATIONS_FROM_GATE=0"
