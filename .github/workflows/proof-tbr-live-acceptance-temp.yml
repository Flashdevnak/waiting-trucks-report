name: Proof TBR Live Acceptance Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: read

jobs:
  live-check:
    runs-on: ubuntu-latest
    steps:
      - name: Capture Proof and TBR live diagnostics read-only
        id: diag
        continue-on-error: true
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const dev='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const browser='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev';
          const markers=['HAR สำหรับปริ้นบาร์โค้ดรถ','proof-print-har-save','HAR เส้นทาง MS','HAR บันทึกแล้วและ Proof Session ใช้งานได้','proof-print-har-file-name'];
          const out={checkedAt:new Date().toISOString(),productionTouched:'NO',readOnly:true};
          async function fetchText(url){try{const r=await fetch(url,{cache:'no-store',headers:{'cache-control':'no-cache'}});return {status:r.status,text:await r.text()};}catch(e){return {status:0,error:String(e?.message||e)}}}
          async function fetchJson(url){const x=await fetchText(url);let data=null;try{data=JSON.parse(x.text||'null')}catch{}return {...x,data};}
          const proof=await fetchText(dev+'/proof-v5.js?v=live-diag');
          out.proof={http:proof.status,missingMarkers:markers.filter(m=>!(proof.text||'').includes(m))};
          const shadow=await fetchJson(browser+'/api/shadow-tbr?hub=NE1');
          const s=shadow.data||{};
          out.shadow={http:shadow.status,observerStatus:String(s.observerStatus||''),sourceAvailable:s.sourceAvailable===true,feedCount:Number(s.feedCount||0),rowCount:Number(s.rowCount||0),heartbeatAt:s.heartbeatAt||s.heartbeat_at||s.lastHeartbeatAt||null,sourceErrorCode:s.sourceErrorCode||s.errorCode||s.code||null,sourceErrorMessage:s.sourceErrorMessage||s.errorMessage||s.message||null,mode:s.shadowQuota?.mode||null};
          const ce=await fetchJson(browser+'/api/connection-error?hub=NE1');
          const d=ce.data?.data||ce.data||{};
          out.connection={http:ce.status,code:d.code||d.errorCode||null,message:d.message||d.errorMessage||null,recoveredAt:d.recoveredAt||null,hasData:Boolean(ce.data?.data)};
          fs.writeFileSync('live-acceptance-diagnostic.json',JSON.stringify(out,null,2));
          const ok=out.proof.http===200&&out.proof.missingMarkers.length===0&&out.shadow.http===200&&out.shadow.observerStatus==='LIVE'&&out.shadow.sourceAvailable&&out.shadow.feedCount>0&&out.shadow.rowCount>0;
          if(!ok)process.exitCode=1;
          NODE
      - name: Upload safe diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-tbr-live-diagnostic
          path: live-acceptance-diagnostic.json
          if-no-files-found: error
          retention-days: 1
      - name: Enforce live acceptance
        if: steps.diag.outcome != 'success'
        run: exit 1
