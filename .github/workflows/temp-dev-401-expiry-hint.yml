name: TEMP DEV Live MS Outer Scroll Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare lightweight headless Chrome probe
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$chrome"
          echo "CHROME_PATH=$chrome" >> "$GITHUB_ENV"
          mkdir -p /tmp/outer-scroll-probe && cd /tmp/outer-scroll-probe
          npm init -y >/dev/null 2>&1
          npm install --no-save --no-audit --no-fund puppeteer-core@24.16.0 >/dev/null
      - name: Measure deployed DEV modal geometry and capture evidence
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/outer-scroll-probe
          node <<'NODE'
          const puppeteer = require('puppeteer-core');
          const base = 'https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/ms.html';
          const browser = await puppeteer.launch({
            executablePath: process.env.CHROME_PATH,
            headless: true,
            args: ['--no-sandbox','--disable-dev-shm-usage']
          });
          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 1366, height: 720, deviceScaleFactor: 1 });
            await page.goto(base, { waitUntil: 'networkidle2', timeout: 60000 });
            const marker = await page.evaluate(async () => {
              const r = await fetch('style.css?v=20260905-dev-shell-v3', { cache: 'no-store' });
              return (await r.text()).includes('MS_CONNECTION_OUTER_SCROLL_V1');
            });
            if (!marker) throw new Error('live DEV CSS marker missing');
            await page.evaluate(() => {
              const dialog = document.getElementById('ms-connection-dialog');
              if (!dialog) throw new Error('ms-connection-dialog missing');
              if (!dialog.open) dialog.showModal();
            });
            await new Promise(r => setTimeout(r, 250));
            const m = await page.evaluate(() => {
              const dialog = document.getElementById('ms-connection-dialog');
              const card = dialog.querySelector('.connector-setup-card');
              const dr = dialog.getBoundingClientRect();
              const cr = card.getBoundingClientRect();
              const ds = getComputedStyle(dialog);
              return {
                viewport: { width: innerWidth, height: innerHeight },
                dialog: { left: dr.left, right: dr.right, width: dr.width, top: dr.top, bottom: dr.bottom, height: dr.height, overflowX: ds.overflowX, overflowY: ds.overflowY, position: ds.position, scrollHeight: dialog.scrollHeight, clientHeight: dialog.clientHeight },
                card: { left: cr.left, right: cr.right, width: cr.width, overflowY: getComputedStyle(card).overflowY },
                bodyOverflow: getComputedStyle(document.body).overflow,
                htmlOverflow: getComputedStyle(document.documentElement).overflow,
              };
            });
            console.log('LIVE_MODAL_GEOMETRY=' + JSON.stringify(m));
            const tol = 2;
            if (Math.abs(m.dialog.left) > tol) throw new Error('dialog scroll shell does not start at viewport left');
            if (Math.abs(m.dialog.right - m.viewport.width) > tol) throw new Error('dialog scroll shell does not reach viewport right edge');
            if (Math.abs(m.dialog.width - m.viewport.width) > tol) throw new Error('dialog scroll shell is not viewport width');
            if (m.dialog.position !== 'fixed') throw new Error('dialog is not viewport-fixed');
            if (m.dialog.overflowY !== 'auto') throw new Error('outer dialog does not own vertical scroll');
            if (m.dialog.overflowX !== 'hidden') throw new Error('outer dialog x overflow is not hidden');
            if (m.card.right >= m.viewport.width - 40) throw new Error('white card still reaches scrollbar edge');
            if (m.card.width > 722) throw new Error('white card exceeds intended centered width');
            if (m.bodyOverflow !== 'hidden' || m.htmlOverflow !== 'hidden') throw new Error('page behind modal is still scrollable');
            await page.screenshot({ path: '/tmp/ms-outer-scroll-live.png' });
            console.log('MS_CONNECTION_OUTER_SCROLL_LIVE=PASS');
            console.log('SCROLL_OWNER=FULL_VIEWPORT_DIALOG');
            console.log('WHITE_CARD_IS_INNER_SCROLL_OWNER=NO');
            console.log('TURSO_READS_FOR_PROBE=0');
            console.log('MS_UPSTREAM_CALLS_FOR_PROBE=0');
          } finally {
            await browser.close();
          }
          NODE
      - name: Upload one-day visual evidence
        uses: actions/upload-artifact@v4
        with:
          name: ms-outer-scroll-live
          path: /tmp/ms-outer-scroll-live.png
          retention-days: 1
