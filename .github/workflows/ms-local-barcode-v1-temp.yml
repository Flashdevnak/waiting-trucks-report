name: MS Local Barcode V1 Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/ms-local-barcode-v1-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch local Code 128 barcode UI
        run: python3 .github/dev-tools/ms-local-barcode-v1-temp.py
      - name: Validate local-only barcode contract
        run: |
          node --check ms.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('ms.js','utf8');
          for(const m of ['LOCAL_ROUTE_BARCODE_V1','function code128Svg','data-local-barcode-toggle','isDestination(row) || isDrop(row)','localBarcodeButton(row)']) if(!s.includes(m)) throw new Error('missing '+m);
          const block=s.slice(s.indexOf('// LOCAL_ROUTE_BARCODE_V1'),s.indexOf('function tableRow(row)'));
          if(/fetch\s*\(|apiGet\s*\(|apiPost\s*\(|XMLHttpRequest|script\.src/.test(block)) throw new Error('barcode block must remain local-only');
          if((s.match(/\$\{localBarcodeButton\(row\)\}/g)||[]).length!==2) throw new Error('barcode must render in desktop and mobile only');
          console.log('LOCAL_CODE128=PASS');
          console.log('DESTINATION_DROP_ONLY=PASS');
          console.log('BARCODE_API_CALLS=0');
          console.log('TURSO_READS_ADDED=0');
          console.log('TURSO_WRITES_ADDED=0');
          console.log('MS_REQUESTS_ADDED=0');
          NODE
          cd worker
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ms.js
          git diff --cached --quiet && exit 0
          git commit -m "Add local barcode viewer for inbound routes"
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --ref main
