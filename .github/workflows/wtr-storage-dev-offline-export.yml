name: WTR Storage DEV Offline Export Pilot (Manual Only)

# No PR, push or schedule trigger. Draft PR creation cannot run this.
# This is NOT a deploy or database migration path.
on:
  workflow_dispatch:
    inputs:
      approved_dev_sha:
        description: 'Exact reviewed DEV SHA (40 hex)'
        required: true
        type: string
      approved_database:
        description: 'Exact Turso DEV database name'
        required: true
        type: string
      export_consent:
        description: 'Type EXPORT_DEV_OFFLINE_ONLY after separate approval'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: wtr-storage-export-dev-sole-runner
  cancel-in-progress: false

jobs:
  offline-export:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify source and manual Owner inputs (no secrets)
        env:
          APPROVED_SHA: ${{ inputs.approved_dev_sha }}
          APPROVED_DATABASE: ${{ inputs.approved_database }}
          OWNER_CONSENT: ${{ inputs.export_consent }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/codex/dev-recovery-contract-v2'
          test "$(git rev-parse HEAD)" = "$APPROVED_SHA"
          test "$APPROVED_DATABASE" = 'waiting-trucks-dev-turso-20260902192750'
          test "$OWNER_CONSENT" = 'EXPORT_DEV_OFFLINE_ONLY'
          test -f .github/storage-opt/export_snapshot_pilot.py
          python3 -m py_compile .github/storage-opt/export_snapshot_pilot.py
          test "$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')" -ge 8388608
          printf 'SOURCE_PIN=PASS\nOWNER_CONSENT=PASS\nDISK_GATE=PASS\n'
      - name: Install SHA256-pinned official Turso CLI (no credentials)
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/wtr-cli" "$RUNNER_TEMP/wtr-export" "$RUNNER_TEMP/wtr-test"
          curl --fail --location --silent --show-error --retry 2 \
            'https://github.com/tursodatabase/turso-cli/releases/download/v1.0.34/turso-cli_Linux_x86_64.tar.gz' \
            --output "$RUNNER_TEMP/wtr-cli/cli.tar.gz"
          printf '%s  %s\n' \
            '9eb67f3efece578a6407d1fa535a75e8d7b5cde4f6af3ac1dd79929e99768dc9' \
            "$RUNNER_TEMP/wtr-cli/cli.tar.gz" | sha256sum --check --status
          tar -xzf "$RUNNER_TEMP/wtr-cli/cli.tar.gz" -C "$RUNNER_TEMP/wtr-cli"
          CLI=$(find "$RUNNER_TEMP/wtr-cli" -type f -name turso -print -quit)
          test -n "$CLI"
          install -m 700 "$CLI" "$RUNNER_TEMP/wtr-cli/turso"
          printf 'OFFICIAL_TURSO_CLI_DIGEST=PASS\n'
      - name: Export exact DEV snapshot (secret scoped to this step)
        env:
          TURSO_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$TURSO_API_TOKEN"
          # CLI stdout/stderr stays in ephemeral private files; never print it.
          if ! "$RUNNER_TEMP/wtr-cli/turso" db export \
             waiting-trucks-dev-turso-20260902192750 \
             --output-file "$RUNNER_TEMP/wtr-export/wtr-source.db" \
             > "$RUNNER_TEMP/wtr-cli/stdout-private.log" \
             2> "$RUNNER_TEMP/wtr-cli/stderr-private.log"; then
             printf 'TURSO_EXPORT=BLOCKED (private logs not published)\n' >&2
             exit 1
          fi
          test -s "$RUNNER_TEMP/wtr-export/wtr-source.db"
          test -s "$RUNNER_TEMP/wtr-export/wtr-source.db-wal"
          test ! -e "$RUNNER_TEMP/wtr-export/wtr-source.db-log"
          printf 'TURSO_SQLITE_EXPORT_WITH_WAL=PASS\n'
      - name: Inspect and compact PRIVATE offline copy (no credentials)
        run: |
          set -euo pipefail
          python3 .github/storage-opt/export_snapshot_pilot.py \
            --export-db "$RUNNER_TEMP/wtr-export/wtr-source.db" \
            --output-dir "$RUNNER_TEMP/wtr-test"
      - name: Cleanup private export and copy even on failure
        if: always()
        run: |
          rm -rf -- "$RUNNER_TEMP/wtr-export" "$RUNNER_TEMP/wtr-test" "$RUNNER_TEMP/wtr-cli"
          printf 'TEMPORARY_COPY_CLEANUP_REQUESTED=YES\n'

# No artifact upload, cache, PR comment, token creation, database mutation,
# deployment, upload of business data, or cutover.
