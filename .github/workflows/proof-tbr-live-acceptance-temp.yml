name: Proof TBR Live Acceptance Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: read

jobs:
  diagnose-browser-cron:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture only safe Browser cron events
        working-directory: cloudflare-browser-test
        run: |
          npm install --no-audit --no-fund >/dev/null 2>&1
          timeout 90s npx wrangler tail waiting-trucks-ms-browser-test --format=json > /tmp/browser-tail.log 2>&1 || true
          node <<'NODE'
          const fs=require('node:fs');
          const raw=fs.readFileSync('/tmp/browser-tail.log','utf8').split(/\r?\n/);
          let count=0;
          for(const line of raw){
            if(!/(connector_sync_|tbr_shadow_|tbr_route_|Exception|error)/i.test(line)) continue;
            const safe=line
              .replace(/(session|token|authorization|cookie|device)[^,}\]]*/ig,'$1:[REDACTED]')
              .slice(0,1200);
            console.log(safe); count++;
          }
          console.log(`SAFE_EVENT_LINES=${count}`);
          console.log('READ_ONLY=YES');
          console.log('MS_MUTATION_TESTED=NO');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
