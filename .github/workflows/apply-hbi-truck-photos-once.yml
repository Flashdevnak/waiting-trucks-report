name: Apply quota-safe HBI truck photos once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-hbi-truck-photos-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Guard source-only staging commits
        shell: bash
        run: |
          set -euo pipefail
          BASE=615d57a61346d6ade3bf9af545a526e3494b516f
          git cat-file -e "$BASE^{commit}"
          EXTRA=$(git diff --name-only "$BASE"..HEAD | grep -v -E '^(\.github/workflows/apply-hbi-truck-photos-once\.yml|\.tmp-hbi-patch\.py)$' || true)
          test -z "$EXTRA" || { echo "Unexpected source changes since base:"; echo "$EXTRA"; exit 1; }
      - name: Apply first-class source changes
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp-hbi-patch.py
          node --check ms.js
          node --check worker/src/index.js
          node --test worker/tests/hbi-truck-photos.test.mjs
          grep -q 'pollMs: 4000' ms.js
          grep -q 'HBI_TRUCK_PHOTO_LAZY_V1' ms.js
          grep -q 'HBI_PHOTO_ON_DEMAND_V1' worker/src/index.js
          git diff --check
      - name: Commit clean source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git rm .github/workflows/apply-hbi-truck-photos-once.yml .tmp-hbi-patch.py
          git add ms.html ms.js ms-v4.css worker/src/index.js worker/migrations/0011_hbi_truck_photos.sql worker/tests/hbi-truck-photos.test.mjs
          git commit -m "feat(ms): add quota-safe on-demand rear truck photos"
          git push origin HEAD:main
