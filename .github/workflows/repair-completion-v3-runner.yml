name: Repair Completion V3 Runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-completion-v3-runner.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix literal marker quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path=Path('.github/workflows/fix-completion-burst-v3.yml')
          text=path.read_text()
          text,n1=re.subn(r'\\+\$\{FRONTEND_BURST_MARKER\}', 'MS_COMPLETION_BURST_TRUTH_UI_V3', text)
          text,n2=re.subn(r'\\+\$\{COMPLETION_BURST_MARKER\}', 'MS_COMPLETION_BURST_TRUTH_V3', text)
          if n1 != 1 or n2 != 1:
              raise SystemExit(f'expected one replacement each, got frontend={n1} worker={n2}')
          path.write_text(text)
          PY
      - name: Commit fix-forward runner repair
        run: |
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git rm .github/workflows/repair-completion-v3-runner.yml
          git add .github/workflows/fix-completion-burst-v3.yml
          git commit -m "Fix completion V3 runner literal markers"
          git push origin main
