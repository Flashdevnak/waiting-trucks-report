name: Persist Intelligence UI Source

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/persist-intelligence-ui-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Persist Intelligence UI into committed source
        working-directory: cloudflare-browser-test
        run: |
          node scripts/patch-intelligence-ui-v3.mjs
          node scripts/patch-intelligence-ui-v3-hotfix.mjs
          node --check src/connection-error.js
          node --check src/tbr-intelligence-entry.js
          grep -q 'HUB ในระบบ' src/connection-error.js
          grep -q 'HUB ในระบบ' src/tbr-intelligence-entry.js
          grep -q 'Error Intelligence' src/connection-error.js
          grep -q 'TBR Intelligence' src/tbr-intelligence-entry.js
          echo 'PERSIST_INTELLIGENCE_UI_SOURCE=PASS'
          echo 'EXTRA_MS_POLLING=0'
      - name: Commit persisted source and remove temporary repair workflows
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-browser-test/src/connection-error.js cloudflare-browser-test/src/tbr-intelligence-entry.js
          git rm -f .github/workflows/repair-intelligence-ui-live.yml .github/workflows/verify-intelligence-ui-live.yml .github/workflows/persist-intelligence-ui-source.yml
          git diff --cached --check
          git commit -m 'fix(browser): make intelligence HUB UI persistent'
          git push origin HEAD:main
