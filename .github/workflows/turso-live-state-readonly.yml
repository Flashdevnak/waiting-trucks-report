name: Turso Live State Readonly

# DEV-only observation. One Turso SELECT, no MS upstream call and no write.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/dev-tools/hub-runtime-readonly.mjs
      - .github/workflows/turso-live-state-readonly.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      WORKER_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Inspect every configured HUB through one contract
        run: node .github/dev-tools/hub-runtime-readonly.mjs
