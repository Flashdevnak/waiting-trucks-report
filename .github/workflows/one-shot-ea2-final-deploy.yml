name: One-shot EA2 Final Deploy

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-ea2-final-deploy.yml

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Verify committed source fix
        run: |
          grep -q 'MS_FRESHNESS_TRUTH_V1' ms.js
          ! grep -q 'เซสชันยังไม่อัปเดต' ms.js
          grep -q 'syncedAt: fallback.syncedAt || ""' .github/dev-tools/patch-ms-realtime-recovery.mjs
          grep -q 'เซสชัน MS ต้องอัปเดต' .github/dev-tools/patch-ms-realtime-recovery.mjs
          grep -q 'MS_SESSION_EXPIRED' cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          grep -q 'pollMs: 4000' ms.js
          node --check ms.js
          node --check .github/dev-tools/patch-ms-realtime-recovery.mjs
          node --check cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Final regression and exact staging gate
        run: |
          node --test worker/tests/ms-session-resilience.test.mjs
          node --test .github/dev-tools/ms-live-resilience.test.mjs
          node --test .github/dev-tools/ms-durable-coordinator.test.mjs
          node --test .github/dev-tools/ms-quota-safe-live.test.mjs
          node --test .github/dev-tools/ms-multiclient-dedupe.test.mjs
          node --test worker/tests/hbi-truck-photos.test.mjs
          (cd worker && npm run check)
          cd worker
          rm -rf .ea2-final && mkdir -p .ea2-final
          cp ../waiting.html ../main.js ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../ms-v4.css ../sw.js ../favicon.svg .ea2-final/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .ea2-final/
          cp ../.github/dev-tools/safe-parity.html .ea2-final/safe-parity.html
          cp src/index.js .ea2-final/index.js
          node ../.github/dev-tools/stage-dev-runtime.mjs .ea2-final/ms.js .ea2-final/index.js
          node --check .ea2-final/ms.js
          node --check .ea2-final/index.js
          grep -q 'MS_FRESHNESS_TRUTH_V1' .ea2-final/ms.js
          ! grep -q 'เซสชันยังไม่อัปเดต' .ea2-final/ms.js
          grep -q 'MS_SESSION_EXPIRED' .ea2-final/index.js
          grep -q 'syncedAt: fallback.syncedAt || ""' .ea2-final/index.js
          grep -q 'เซสชัน MS ต้องอัปเดต' .ea2-final/index.js
          rm -rf .ea2-final

      - name: Remove temporary workflow and checkpoint final clean HEAD
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-shot-ea2-final-deploy.yml
          git diff --cached --check
          git commit -m 'chore(dev): close EA2 session resilience checkpoint'
          git push origin HEAD:main
          echo "FINAL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch DEV deployment explicitly
        run: |
          BEFORE=$(gh run list --workflow deploy-worker-dev.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run deploy-worker-dev.yml --ref main
          RUN_ID=''
          for i in $(seq 1 90); do
            RUN_ID=$(gh run list --workflow deploy-worker-dev.yml --branch main --limit 20 --json databaseId,headSha,event --jq ".[] | select(.headSha == \"$FINAL_HEAD\" and .event == \"workflow_dispatch\" and .databaseId != $BEFORE) | .databaseId" | head -n1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          echo "DEV_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Dispatch current-system acceptance explicitly
        run: |
          BEFORE=$(gh run list --workflow current-system-acceptance.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId // 0')
          gh workflow run current-system-acceptance.yml --ref main
          RUN_ID=''
          for i in $(seq 1 90); do
            RUN_ID=$(gh run list --workflow current-system-acceptance.yml --branch main --limit 20 --json databaseId,headSha,event --jq ".[] | select(.headSha == \"$FINAL_HEAD\" and .event == \"workflow_dispatch\" and .databaseId != $BEFORE) | .databaseId" | head -n1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          echo "ACCEPT_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Final checkpoint
        run: |
          echo "FINAL_HEAD=$FINAL_HEAD"
          echo "DEV_RUN_ID=$DEV_RUN_ID"
          echo "ACCEPT_RUN_ID=$ACCEPT_RUN_ID"
          echo "REALTIME_CADENCE=4000ms"
          echo "EA2_SESSION_STATUS_TRUTH_SAFE=PASS"
          echo "PRODUCTION_TOUCHED=NO"
