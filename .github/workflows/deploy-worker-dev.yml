name: Deploy Worker DEV

# DEV-only pipeline. Production remains on the legacy API until parity passes.
# DEV runtime uses Turso; the legacy D1 binding remains only for the one-time migration/export path.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-worker-dev.yml
      - .github/dev-tools/**
      - ms.html
      - ms.js
      - style.css
      - sw.js
      - favicon.svg
      - worker/src/**
      - worker/tests/**
      - worker/scripts/**
      - worker/package.json
      - worker/package-lock.json
      - worker/wrangler.dev.jsonc
      - worker/migrations/**

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: node --test tests/dev-archive-patch.test.mjs
      - run: node --test ../.github/dev-tools/ms-realtime-recovery.test.mjs
      - run: node --test ../.github/dev-tools/ms-summary-filter.test.mjs
      - run: node --test ../.github/dev-tools/ms-multiclient-dedupe.test.mjs
      - run: node --test ../.github/dev-tools/ms-durable-coordinator.test.mjs
      - run: node --test ../.github/dev-tools/safe-parity.test.mjs
      - run: node --test ../.github/dev-tools/ms-connector-adoption.test.mjs
      - run: node --test ../.github/dev-tools/ms-route-cancellation.test.mjs
      - run: node --test ../.github/dev-tools/stage-dev-runtime.test.mjs
      - name: Stage DEV frontend assets and worker patch
        run: |
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../ms.html ../ms.js ../style.css ../sw.js ../favicon.svg .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js src/index.js
          node --check .dev-assets/ms.js
          node --check src/index.js
          node --check src/turso-d1.js
          node --check src/turso-index.js
      - name: Verify Turso secrets exist on DEV Worker
        run: |
          npx wrangler secret list --config wrangler.dev.jsonc > /tmp/worker-secrets.json
          node <<'NODE'
          const fs = require('node:fs');
          const text = fs.readFileSync('/tmp/worker-secrets.json', 'utf8');
          const missing = ['TURSO_DATABASE_URL', 'TURSO_AUTH_TOKEN'].filter((name) => !text.includes(name));
          if (missing.length) {
            console.error(`Missing DEV Worker Turso secrets: ${missing.join(', ')}`);
            process.exit(2);
          }
          NODE
      - name: Deploy DEV Worker on Turso
        run: npx wrangler deploy --config wrangler.dev.jsonc
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
