name: TEMP DEV Live Intelligence HUB Catalog Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live Error and TBR Intelligence HUB selectors
        shell: bash
        run: |
          set -euo pipefail
          base='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev'
          for path in shadow-tbr api/connection-error; do
            for hub in NE1 EA2; do
              url="${base}/${path}?hub=${hub}"
              html="$(curl -fsS -H 'Accept: text/html' --retry 2 --connect-timeout 10 "$url")"
              options="$(printf '%s' "$html" | grep -oE '<option[^>]*value="[^"]+"[^>]*>[^<]*</option>' || true)"
              echo "--- ${path} ${hub} ---"
              printf '%s\n' "$options"
              count="$(printf '%s\n' "$options" | grep -c '<option' || true)"
              echo "HUB_OPTION_COUNT_${path//\//_}_${hub}=$count"
              test "$count" -ge 2
              printf '%s\n' "$options" | grep -q '>NE1</option>'
              printf '%s\n' "$options" | grep -q '>EA2</option>'
            done
          done
          echo 'INTELLIGENCE_HUB_CATALOG_V5_LIVE=PASS'
          echo 'LIVE_PROBE_TURSO_WRITES=0 LIVE_PROBE_MS_POLLING=0'
