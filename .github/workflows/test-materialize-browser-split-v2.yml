name: Test Materialize Browser Split V2

on:
  push:
    branches:
      - test/tbr-shadow-final-20260904
    paths:
      - .github/workflows/test-materialize-browser-split-v2.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/tbr-shadow-final-20260904
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Materialize the exact tested Browser Split V2 source
        working-directory: cloudflare-browser-test
        run: |
          node scripts/patch-connector-recovery.mjs src/index.js
          node scripts/patch-tbr-actual-arrival.mjs src/tbr-shadow.js
          node scripts/patch-tbr-route-dedupe.mjs src/tbr-shadow.js
          node scripts/normalize-tbr-inbound-anchor.mjs src/tbr-shadow.js
          node scripts/patch-tbr-inbound-quota.mjs src/index.js src/tbr-shadow.js
          node scripts/patch-tbr-stale-split-browser-v2.mjs src/index.js src/tbr-shadow.js src/connection-error.js
          node --check src/index.js
          node --check src/tbr-shadow.js
          node --check src/connection-error.js
          grep -q 'TBR_STALE_SPLIT_BROWSER_V2' src/index.js
          grep -q 'SHADOW_READONLY_SPLIT_V2' src/index.js
          grep -q 'STALE · ข้อมูลหยุดอัปเดตเกิน 7 นาที' src/tbr-shadow.js
          grep -q 'recordConnectionErrorKv' src/index.js
          echo 'MATERIALIZED_BROWSER_SPLIT_V2=PASS'
      - name: Commit materialized source only to TEST branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-browser-test/src/index.js cloudflare-browser-test/src/tbr-shadow.js cloudflare-browser-test/src/connection-error.js
          if git diff --cached --quiet; then
            echo 'MATERIALIZED_SOURCE_ALREADY_CURRENT=PASS'
            exit 0
          fi
          git commit -m 'Persist tested Browser Split V2 runtime source'
          git push origin HEAD:test/tbr-shadow-final-20260904
          echo 'MATERIALIZED_SOURCE_PUSH=PASS'
