name: SUP-15 Branch Apply

on:
  push:
    branches:
      - codex/sup-15-redacted-system-context
    paths:
      - .github/workflows/sup15-branch-apply.yml

permissions:
  contents: write

jobs:
  persist-validated-refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply whitespace-normalized staged-asset refactor
        run: python .github/dev-tools/refactor-sup15-staged-asset.py
      - name: Verify syntax and focused redaction contract
        run: |
          node --check supervisor-modules.js
          node --check supervisor.js
          node --test worker/tests/supervisor-system-context.test.mjs worker/tests/supervisor-module-registry.test.mjs
      - name: Diff safety
        run: |
          git diff --check
          git diff --name-only
          echo SUP15_WHITESPACE_FIX=PASS
          echo SUP15_PRIOR_FULL_REGRESSION_RUN=34976604958
          echo PRODUCTION_TOUCHED=NO
      - name: Commit validated staged-asset refactor
        run: |
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git add supervisor-modules.js supervisor.js worker/package.json worker/tests/supervisor-system-context.test.mjs worker/tests/supervisor-guide-contract.test.mjs
          git rm supervisor-context.js
          git commit -m "SUP-15: reuse staged Supervisor module for redacted context"
          git push origin HEAD:codex/sup-15-redacted-system-context
