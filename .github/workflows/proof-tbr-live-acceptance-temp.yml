name: Proof TBR Live Acceptance Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: read

jobs:
  proof-current-head-checkpoint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Proof frontend and worker syntax
        run: |
          node --check proof-v2-core.js
          node --check proof-v2-ui.js
          node --check proof-v2-actions.js
          node --check worker/src/proof-ui-v5.js
          node --check worker/src/proof-plate-search-v5.js
          node --check worker/src/proof-editor.js
      - name: Proof persistent regressions
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          npm run check
          node --test tests/proof-smart-v8.test.mjs tests/auth-session-resilience.test.mjs
      - name: Proof quota and safety contract
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const core=fs.readFileSync('proof-v2-core.js','utf8');
          const actions=fs.readFileSync('proof-v2-actions.js','utf8');
          const plate=fs.readFileSync('worker/src/proof-plate-search-v5.js','utf8');
          const editor=fs.readFileSync('worker/src/proof-editor.js','utf8');
          const proofUi=fs.readFileSync('worker/src/proof-ui-v5.js','utf8');
          const proofHtml=fs.readFileSync('proof.html','utf8');
          if(!core.includes('pollMs:60_000')) throw new Error('Proof 60s polling contract changed');
          for(const marker of ['PROOF_EDITOR_SEARCH_CACHE_V8','กด Enter หรือปุ่ม “ค้นหา”']) if(!actions.includes(marker)) throw new Error(`Proof explicit search/cache marker missing: ${marker}`);
          for(const marker of ['PROOF_PRINT_HAR_UPLOAD_V9','PROOF_PRINT_HAR_POLISH_V9_1','HAR บันทึกแล้วและ Proof Session ใช้งานได้']) if(!proofUi.includes(marker)) throw new Error(`Proof HAR marker missing: ${marker}`);
          if(/setInterval|scheduled|cron/i.test(plate)) throw new Error('Plate search gained background polling');
          if(editor.includes('cancel_car')) throw new Error('Proof cancellation command returned');
          if(!proofHtml.includes('ปุ่มยกเลิกรถยังปิดไว้')) throw new Error('Proof cancellation safety notice missing');
          const repoText=[core,actions,plate,editor,proofUi].join('\n');
          if(repoText.includes('/proof/bi/drivers')) throw new Error('Unverified special BI driver contract must not be guessed');
          console.log('CP_PROOF_01_SYNTAX=PASS');
          console.log('CP_PROOF_02_SMART_SEARCH=PASS');
          console.log('CP_PROOF_03_EXPLICIT_PLATE_DRIVER_SEARCH=PASS');
          console.log('CP_PROOF_04_SEARCH_CACHE=PASS');
          console.log('CP_PROOF_05_HAR_V9_1=PASS');
          console.log('CP_PROOF_06_POLL_60S=PASS');
          console.log('CP_PROOF_07_BACKGROUND_PLATE_POLLING=0');
          console.log('CP_PROOF_08_CANCELLATION_ENABLED=NO');
          console.log('CP_PROOF_09_SPECIAL_BI_DRIVER_GUESSED=NO');
          console.log('MS_MUTATION_TESTED=NO');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
      - name: Proof DEV live read-only smoke
        run: |
          node <<'NODE'
          const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          for(const path of ['proof.html','proof-v2-core.js','proof-v2-ui.js','proof-v2-actions.js','proof-v5.js']){
            const r=await fetch(`${base}/${path}`,{cache:'no-store'});
            if(!r.ok) throw new Error(`${path} HTTP ${r.status}`);
            const body=await r.text();
            if(!body.length) throw new Error(`${path} empty`);
          }
          console.log('CP_PROOF_10_DEV_LIVE_SMOKE=PASS');
          console.log('READ_ONLY=YES');
          console.log('MS_MUTATION_TESTED=NO');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
