name: TEMP DEV MS Connection Outer Scroll

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply guarded connection outer-scroll patch
        run: python3 .github/dev-tools/patch-ms-connection-outer-scroll.py
      - name: Validate dialog layout contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css=Path('style.css').read_text()
          html=Path('ms.html').read_text()
          assert 'MS_CONNECTION_OUTER_SCROLL_V1' in css
          assert 'position: fixed;\n  inset: 0;\n  width: 100vw;' in css
          assert 'height: 100dvh;' in css
          assert 'overflow-y: auto;' in css
          assert 'overflow-x: hidden;' in css
          assert 'scrollbar-gutter: stable;' in css
          assert 'width: min(100%, 720px);' in css
          assert 'margin: 0 auto;' in css
          assert 'html:has(.connector-dialog[open])' in css
          assert 'max-height: 92vh;' not in css
          assert 'width: calc(100vw - 20px);' not in css
          assert 'id="ms-connection-dialog"' in html
          assert 'class="dialog-card connector-setup-card"' in html
          print('MS_CONNECTION_OUTER_SCROLL_V1=PASS')
          print('SCROLL_OWNER=VIEWPORT_DIALOG_SHELL')
          print('INNER_CARD_SCROLLBAR=REMOVED')
          print('MS_LOGIC_CHANGED=0')
          PY
          git diff --check
      - name: Commit tested layout only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add style.css
          git commit -m 'fix(dev): move MS connection scroll to outer viewport edge'
          git push origin HEAD:main
