name: Test Final TBR Shadow E2E v2

on:
  push:
    branches:
      - test/tbr-shadow-repair-20260904
    paths:
      - .github/workflows/test-final-tbr-e2e-v2.yml

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      DEV_API: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api
      BROWSER_ORIGIN: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
      BROWSER_SCRIPT: waiting-trucks-ms-browser-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Browser TEST tooling
        working-directory: cloudflare-browser-test
        run: npm install --no-audit --no-fund

      - name: Force-clean any stale bootstrap binding on Browser TEST
        working-directory: cloudflare-browser-test
        run: |
          sed 's/"keep_vars": true/"keep_vars": false/' wrangler.jsonc > wrangler.preclean.jsonc
          grep -q '"name": "waiting-trucks-ms-browser-test"' wrangler.preclean.jsonc
          grep -q '"keep_vars": false' wrangler.preclean.jsonc
          npx wrangler deploy --config wrangler.preclean.jsonc
          echo "BROWSER_TEST_PRECLEAN_DEPLOY=PASS"

      - name: Verify stale bootstrap binding is gone before pairing
        run: |
          node <<'NODE'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID;
            const token=process.env.CLOUDFLARE_API_TOKEN;
            const script=process.env.BROWSER_SCRIPT;
            if(script!=='waiting-trucks-ms-browser-test') throw new Error('Refusing non-test Browser Worker');
            const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${script}/settings`,{headers:{Authorization:`Bearer ${token}`}});
            const body=await response.json().catch(()=>({}));
            if(!response.ok||body.success===false) throw new Error(`Browser TEST settings HTTP ${response.status}`);
            const bindings=Array.isArray(body.result?.bindings)?body.result.bindings:[];
            if(bindings.some(x=>x.name==='CONNECTOR_BOOTSTRAP_SECRET')) throw new Error('Stale bootstrap binding still active');
            if(bindings.some(x=>x.type==='d1'||x.type==='d1_database')) throw new Error('Browser TEST unexpectedly exposes D1');
            console.log('BROWSER_TEST_PRECLEAN=PASS');
            console.log('BROWSER_TEST_D1_BINDING=0');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Generate one atomic TEST connector pair
        run: |
          umask 077
          openssl rand -hex 32 > /tmp/tbr-connector-token
          openssl rand -hex 32 > /tmp/tbr-bootstrap-secret
          echo "::add-mask::$(cat /tmp/tbr-connector-token)"
          echo "::add-mask::$(cat /tmp/tbr-bootstrap-secret)"
          echo "ATOMIC_TEST_MATERIAL=GENERATED"

      - name: Pair connector hash in Turso DEV only
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {createHash}=require('node:crypto');
          (async()=>{
            const connectorToken=fs.readFileSync('/tmp/tbr-connector-token','utf8').trim();
            console.log(`::add-mask::${connectorToken}`);
            const tokenHash=createHash('sha256').update(connectorToken).digest('hex');
            const platform=process.env.TURSO_PLATFORM_API_TOKEN;
            const org=process.env.TURSO_ORG;
            const db=process.env.TURSO_DATABASE;
            if(db!=='waiting-trucks-dev-turso-20260902192750') throw new Error('Refusing non-DEV Turso database');
            const headers={Authorization:`Bearer ${platform}`};
            const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers});
            const dbJson=await dbRes.json().catch(()=>({}));
            if(!dbRes.ok) throw new Error(`DEV Turso lookup HTTP ${dbRes.status}`);
            const info=dbJson.database||dbJson;
            const hostname=info.Hostname||info.hostname;
            if(!hostname) throw new Error('DEV Turso hostname missing');
            const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,{method:'POST',headers});
            const tokenJson=await tokenRes.json().catch(()=>({}));
            const dbToken=tokenJson.jwt;
            if(!tokenRes.ok||!dbToken) throw new Error(`DEV Turso auth token HTTP ${tokenRes.status}`);
            console.log(`::add-mask::${dbToken}`);
            const now=new Date().toISOString();
            const sql=`INSERT INTO ms_connector_tokens(hub,token_hash,created_at,last_used_at,active) VALUES('NE1','${tokenHash}','${now}','',1) ON CONFLICT(hub) DO UPDATE SET token_hash=excluded.token_hash,created_at=excluded.created_at,last_used_at='',active=1`;
            const response=await fetch(`https://${hostname}/v2/pipeline`,{
              method:'POST',headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},
              body:JSON.stringify({requests:[{type:'execute',stmt:{sql}},{type:'close'}]}),
            });
            const payload=await response.json().catch(()=>({}));
            const item=payload?.results?.[0];
            if(!response.ok||item?.type==='error') throw new Error(`DEV Turso connector write failed: ${JSON.stringify(item?.error||payload)}`);
            console.log('DEV_TURSO_CONNECTOR_HASH=PASS');
            console.log('D1_QUERIES=0');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Deploy temporary bootstrap on Browser TEST only
        working-directory: cloudflare-browser-test
        run: |
          BOOTSTRAP_SECRET="$(cat /tmp/tbr-bootstrap-secret)"
          echo "::add-mask::$BOOTSTRAP_SECRET"
          grep -q '"name": "waiting-trucks-ms-browser-test"' wrangler.jsonc
          npx wrangler deploy --config wrangler.jsonc --var CONNECTOR_BOOTSTRAP_SECRET:"$BOOTSTRAP_SECRET"
          echo "BROWSER_TEST_TEMP_BOOTSTRAP=PASS"

      - name: Wait until deployed Browser TEST runtime accepts the bootstrap secret
        id: bootstrap
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const origin=process.env.BROWSER_ORIGIN;
            if(!origin.includes('waiting-trucks-ms-browser-test.26nak-testdev.workers.dev')) throw new Error('Refusing non-test Browser origin');
            const connectorToken=fs.readFileSync('/tmp/tbr-connector-token','utf8').trim();
            const secret=fs.readFileSync('/tmp/tbr-bootstrap-secret','utf8').trim();
            console.log(`::add-mask::${connectorToken}`);
            console.log(`::add-mask::${secret}`);
            let last={status:0,body:{}};
            for(let attempt=1;attempt<=12;attempt++){
              await new Promise(r=>setTimeout(r,5000));
              const response=await fetch(`${origin}/api/bootstrap-connector`,{
                method:'POST',headers:{'content-type':'application/json','cache-control':'no-store'},
                body:JSON.stringify({hub:'NE1',connectorToken,bootstrapSecret:secret}),
              });
              const body=await response.json().catch(()=>({}));
              last={status:response.status,body};
              console.log(`BOOTSTRAP_ATTEMPT_${attempt}_HTTP=${response.status}`);
              if(response.ok&&body?.ok!==false&&body?.stored===true&&body?.hub==='NE1'){
                console.log(`BOOTSTRAP_ACCEPTED_ON_ATTEMPT=${attempt}`);
                console.log('BROWSER_TEST_CONNECTOR_TOKEN_MATCHED=PASS');
                return;
              }
            }
            throw new Error(`Browser TEST bootstrap never became active: HTTP ${last.status} ${JSON.stringify(last.body)}`);
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Remove bootstrap binding without keeping temporary vars
        if: always()
        working-directory: cloudflare-browser-test
        run: |
          sed 's/"keep_vars": true/"keep_vars": false/' wrangler.jsonc > wrangler.final-clean.jsonc
          grep -q '"name": "waiting-trucks-ms-browser-test"' wrangler.final-clean.jsonc
          grep -q '"keep_vars": false' wrangler.final-clean.jsonc
          npx wrangler deploy --config wrangler.final-clean.jsonc
          echo "BROWSER_TEST_NORMAL_RUNTIME_RESTORED=PASS"

      - name: Verify Browser TEST runtime clean
        if: always()
        run: |
          node <<'NODE'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID;
            const token=process.env.CLOUDFLARE_API_TOKEN;
            const script=process.env.BROWSER_SCRIPT;
            const headers={Authorization:`Bearer ${token}`};
            const base=`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${script}`;
            async function get(path){
              const response=await fetch(base+path,{headers});
              const body=await response.json().catch(()=>({}));
              if(!response.ok||body.success===false) throw new Error(`${path} HTTP ${response.status}: ${JSON.stringify(body.errors||body)}`);
              return body.result;
            }
            const [settings,deployments]=await Promise.all([get('/settings'),get('/deployments')]);
            const bindings=Array.isArray(settings?.bindings)?settings.bindings:[];
            if(bindings.some(x=>x.name==='CONNECTOR_BOOTSTRAP_SECRET')) throw new Error('Temporary Browser bootstrap binding remains active');
            if(bindings.some(x=>x.type==='d1'||x.type==='d1_database')) throw new Error('Browser TEST unexpectedly exposes D1');
            const active=deployments?.deployments?.[0];
            const version=[...(active?.versions||[])].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]?.version_id||'';
            console.log(`ACTIVE_BROWSER_VERSION=${version||'-'}`);
            console.log('BROWSER_BOOTSTRAP_BINDING=0');
            console.log('BROWSER_TEST_D1_BINDING=0');
            console.log('BROWSER_TEST_RUNTIME_CLEAN=PASS');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Verify the same connector against active DEV Worker
        if: steps.bootstrap.outcome == 'success'
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const connectorToken=fs.readFileSync('/tmp/tbr-connector-token','utf8').trim();
            console.log(`::add-mask::${connectorToken}`);
            const api=process.env.DEV_API;
            if(!api.includes('waiting-trucks-report-api-dev.26nak-testdev.workers.dev')) throw new Error('Refusing non-DEV API');
            const response=await fetch(api,{
              method:'POST',headers:{'content-type':'application/json'},
              body:JSON.stringify({action:'connectorSync',hub:'NE1',connectorToken}),
            });
            const body=await response.json().catch(()=>({}));
            const code=String(body?.code||body?.data?.code||'');
            console.log(`DEV_CONNECTOR_HTTP=${response.status}`);
            console.log(`DEV_CONNECTOR_OK=${String(body?.ok)}`);
            console.log(`DEV_CONNECTOR_CODE=${code||'-'}`);
            console.log(`DEV_ROW_COUNT=${Array.isArray(body?.data?.rows)?body.data.rows.length:'-'}`);
            console.log(`DEV_TBR_FEED_COUNT=${Array.isArray(body?.data?.tbrShadowFeed)?body.data.tbrShadowFeed.length:'-'}`);
            if(!response.ok||body?.ok===false||code==='INVALID_CONNECTOR') throw new Error(`DEV connector rejected atomic token: HTTP ${response.status} CODE=${code||'-'}`);
            if(!Array.isArray(body?.data?.rows)||!Array.isArray(body?.data?.tbrShadowFeed)) throw new Error('DEV TBR source contract missing');
            console.log('DEV_ATOMIC_CONNECTOR=PASS');
            console.log('DEV_TBR_SOURCE_CONTRACT=PASS');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Wait for live one-minute cron and require TBR Shadow LIVE
        if: steps.bootstrap.outcome == 'success'
        run: |
          sleep 180
          node <<'NODE'
          (async()=>{
            const origin=process.env.BROWSER_ORIGIN;
            const response=await fetch(`${origin}/api/shadow-tbr?hub=NE1`,{headers:{accept:'application/json','cache-control':'no-store'},cache:'no-store'});
            const shadow=await response.json().catch(()=>({}));
            console.log(`TBR_OBSERVER_STATUS=${shadow?.observerStatus||'-'}`);
            console.log(`TBR_SOURCE_AVAILABLE=${String(shadow?.sourceAvailable)}`);
            console.log(`TBR_FEED_COUNT=${shadow?.feedCount ?? '-'}`);
            console.log(`TBR_ROUTE_ROWS=${shadow?.rowCount ?? '-'}`);
            console.log(`TBR_LAST_ATTEMPT_AT=${shadow?.lastAttemptAt||'-'}`);
            console.log(`TBR_LAST_OBSERVED_AT=${shadow?.lastObservedAt||'-'}`);
            console.log(`TBR_TOTAL=${shadow?.total ?? '-'}`);
            console.log(`TBR_PENDING=${shadow?.pending ?? '-'}`);
            console.log(`TBR_CONFIRMED=${shadow?.confirmed ?? '-'}`);
            console.log(`TBR_EXPIRED=${shadow?.expired ?? '-'}`);
            console.log(`TBR_SHADOW_TURSO_READS=${shadow?.tursoReads ?? '-'}`);
            console.log(`TBR_SHADOW_TURSO_WRITES=${shadow?.tursoWrites ?? '-'}`);
            if(!response.ok||shadow?.ok===false) throw new Error(`Shadow health HTTP ${response.status}`);
            if(shadow?.shadowOnly!==true) throw new Error('TBR report is not shadow-only');
            if(shadow?.tursoReads!==0||shadow?.tursoWrites!==0) throw new Error('TBR Shadow unexpectedly uses Turso');
            if(shadow?.observerStatus!=='LIVE'||shadow?.sourceAvailable!==true||!shadow?.lastAttemptAt||!shadow?.lastObservedAt)
              throw new Error(`TBR observer not LIVE: ${JSON.stringify({observerStatus:shadow?.observerStatus,sourceAvailable:shadow?.sourceAvailable,lastSkip:shadow?.lastSkip,lastAttemptAt:shadow?.lastAttemptAt,lastObservedAt:shadow?.lastObservedAt,feedCount:shadow?.feedCount,rowCount:shadow?.rowCount})}`);
            console.log('TBR_OBSERVER_LIVE=PASS');
            console.log('TBR_SHADOW_ONLY=PASS');
            console.log('END_TO_END_TEST_CHAIN=PASS');
            console.log('PRODUCTION_TOUCHED=NO');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE
