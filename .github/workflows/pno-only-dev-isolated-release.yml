name: PNO-only DEV Isolated Release
on:
  push:
    branches: [codex/pno-only-actions-20261015]
    paths:
      - '.github/workflows/pno-only-dev-isolated-release.yml'
      - '.github/dev-tools/**'
      - '.github/pno-only-dev-deploy-approval.txt'
permissions:
  contents: read
concurrency:
  group: pno-only-dev-isolated-release
  cancel-in-progress: false
jobs:
  pno_only:
    if: "${{ github.event.head_commit.message != 'ci(dev): install isolated PNO Actions without deployment' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Verify sealed PNO source and unchanged Worker
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          parent='9e8ce9305289b25a78d3881e0f175515e8e74b10'
          candidate='b4284d6badf0f72d0e955fecac24197b4f77fc04'
          test "$GITHUB_REF" = 'refs/heads/codex/pno-only-actions-20261015'
          test "$(git rev-parse "$candidate^")" = "$parent"
          test "$(git rev-parse "$candidate^{tree}")" = '6ac8faf868c47b9026867b8b83eb3c78218faac4'
          git merge-base --is-ancestor "$candidate" HEAD
          git diff --quiet "$parent" "$candidate" -- worker
          git diff --quiet "$candidate" HEAD -- . ':(exclude).github/workflows/pno-only-dev-isolated-release.yml' ':(exclude).github/pno-only-dev-deploy-approval.txt'
          test "$(git diff --name-only "$parent" "$candidate" | wc -l | tr -d ' ')" = '17'
          echo PNO_SOURCE_TREE_AND_SCOPE=PASS
      - name: Install pinned Wrangler
        run: npm ci --no-audit --no-fund
      - name: Stage and verify exact DEV assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .dev-assets .dev-runtime
          mkdir -p .dev-assets .dev-runtime
          cp -R src .dev-runtime/src
          cp ../waiting.html ../admin.html ../admin.js ../admin.css ../supervisor.html ../supervisor.js ../supervisor-context.js ../supervisor-i18n.js ../supervisor-modules.js ../supervisor-view.js ../supervisor.css ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../ms-v4.css ../sw.js ../favicon.svg .dev-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js .dev-runtime/src/index.js
          node ../.github/dev-tools/patch-dev-origin-manifest-session-v2.mjs .dev-assets/ms.js .dev-runtime/src/origin-manifest-v1.js
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          if(fs.readdirSync('.dev-assets').length!==28) throw Error('DEV asset count is not 28');
          const html=fs.readFileSync('.dev-assets/ms.html','utf8');
          if(!html.includes('ms.js?v=20261014-rev98-pno-only-delivery-v1')) throw Error('PNO version mismatch');
          const h=crypto.createHash('sha256').update(fs.readFileSync('.dev-assets/ms.js')).digest('hex');
          if(h!=='7866a1b31de1f6bce79e24a488a0a0fe1fc25c9efe3eb4ae9f889d37cc351ea4') throw Error('PNO asset hash mismatch');
          console.log('PNO_ASSETS_28_AND_SHA=PASS');
          NODE
          node --check .dev-runtime/src/turso-index.js
      - name: Wrangler DEV dry-run only
        run: |
          if grep -q d1_databases wrangler.dev.jsonc; then echo 'D1 forbidden' >&2; exit 1; fi
          npx --no-install wrangler deploy .dev-runtime/src/turso-index.js --config wrangler.dev.jsonc --dry-run
      - name: Check explicit one-shot approval file
        id: approval
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          f='.github/pno-only-dev-deploy-approval.txt'
          if test -f "$f" && git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq "$f" &&
             grep -Fxq 'PNO_DEV_COMMIT=b4284d6badf0f72d0e955fecac24197b4f77fc04' "$f" &&
             grep -Fxq 'ROLLBACK_VERSION=320a065e-0a14-4dfb-a749-d65e5b9e7aea' "$f" &&
             grep -Fxq 'TARGET=waiting-trucks-report-api-dev' "$f"; then
            echo 'approved=true' >> "$GITHUB_OUTPUT"
          else
            echo 'approved=false' >> "$GITHUB_OUTPUT"
            echo 'PREFLIGHT ONLY; no deploy authorized.'
          fi
      - name: Verify existing DEV secrets
        if: steps.approval.outputs.approved == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          secrets_list="$(npx --no-install wrangler secret list --name waiting-trucks-report-api-dev --config wrangler.dev.jsonc)"
          for key in TURSO_DATABASE_URL TURSO_AUTH_TOKEN AUTH_SECRET PASSWORD_PEPPER; do
            printf '%s' "$secrets_list" | grep -Fq "$key" || { echo "Missing DEV secret: $key" >&2; exit 1; }
          done
          echo DEV_SECRET_NAMES=PASS
      - name: Deploy only DEV Worker
        if: steps.approval.outputs.approved == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy .dev-runtime/src/turso-index.js --config wrangler.dev.jsonc
