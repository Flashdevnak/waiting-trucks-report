name: TEMP DEV TBR HUB Catalog V4

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded TBR HUB catalog patch
        run: python3 .github/dev-tools/patch-tbr-hub-catalog-v4.py
      - name: Validate Browser intelligence contracts
        run: |
          cd cloudflare-browser-test
          npm install --no-audit --no-fund
          npm run check
          node --test scripts/connection-error-intelligence.test.mjs
          grep -F 'TBR_INTELLIGENCE_HUB_CATALOG_V4' src/tbr-intelligence-entry.js
          grep -F 'INTELLIGENCE_HUB_FILTER_V4' src/connection-error.js
          git diff --check
      - name: Commit tested TBR catalog V4
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-browser-test/src/tbr-intelligence-entry.js
          git commit -m 'fix(dev): unify TBR Intelligence HUB catalog'
          git push origin HEAD:main
