name: Live Traffic Acceptance

# Read-only post-cutover gate for the first real current-queue rows.
# Turso reads + Cloudflare metadata/analytics only. Never queries D1 directly.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/live-traffic-acceptance.yml

permissions:
  contents: read

jobs:
  live-traffic:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
    steps:
      - name: Validate current queue using the frontend queue rules
        run: |
          node <<'NODE'
          (async()=>{
            const org=process.env.TURSO_ORG, db=process.env.TURSO_DATABASE, platform=process.env.TURSO_PLATFORM_API_TOKEN;
            if(!platform) throw new Error('Turso platform token missing');
            const platformHeaders={Authorization:`Bearer ${platform}`};
            const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
            async function fetchJson(url,options={},label='request'){
              let lastError;
              for(let attempt=1;attempt<=4;attempt++){
                try{
                  const response=await fetch(url,options);
                  const text=await response.text();
                  let payload;
                  try{ payload=JSON.parse(text); }
                  catch{ throw new Error(`${label} returned non-JSON HTTP ${response.status}`); }
                  if(!response.ok) throw new Error(`${label} HTTP ${response.status}: ${JSON.stringify(payload).slice(0,300)}`);
                  return payload;
                }catch(error){
                  lastError=error;
                  if(attempt<4){
                    console.log(`${label} transient attempt ${attempt}/4: ${error.message}`);
                    await sleep(attempt*750);
                  }
                }
              }
              throw lastError;
            }
            const dbJson=await fetchJson(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers:platformHeaders},'Turso database lookup');
            const database=dbJson.database||dbJson;
            const hostname=database.Hostname||database.hostname;
            if(!hostname) throw new Error('Turso hostname missing');
            const tokenJson=await fetchJson(
              `https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,
              {method:'POST',headers:platformHeaders},
              'Turso auth token',
            );
            const dbToken=tokenJson.jwt;
            if(!dbToken) throw new Error('Turso auth token missing from response');
            console.log(`::add-mask::${dbToken}`);
            async function query(sql){
              const payload=await fetchJson(
                `https://${hostname}/v2/pipeline`,
                {
                  method:'POST',
                  headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},
                  body:JSON.stringify({requests:[{type:'execute',stmt:{sql}},{type:'close'}]}),
                },
                'Turso pipeline',
              );
              const item=payload?.results?.[0];
              if(item?.type==='error') throw new Error(`Turso query failed: ${JSON.stringify(item?.error||payload)}`);
              return item?.response?.result;
            }
            const decode=v=>v==null?null:(typeof v==='object'&&'value' in v?v.value:v);
            const first=result=>(result?.rows?.[0]||[]).map(decode);
            const ageSeconds=value=>{
              const parsed=Date.parse(String(value||''));
              return Number.isFinite(parsed)?Math.max(0,Math.round((Date.now()-parsed)/1000)):-1;
            };

            const metaResult=await query(`
              SELECT
                synced_at,
                json_valid(rows_json),
                json_type(rows_json),
                CASE
                  WHEN json_type(rows_json)='array' THEN json_array_length(rows_json)
                  ELSE COALESCE(json_array_length(rows_json,'$.rows'),0)
                END AS route_count,
                CASE
                  WHEN json_type(rows_json)='array' THEN 1
                  ELSE COALESCE(CAST(json_extract(rows_json,'$.version') AS INTEGER),0)
                END AS cache_version,
                CASE
                  WHEN json_type(rows_json)='object' THEN COALESCE(json_array_length(rows_json,'$.completedRows'),0)
                  ELSE 0
                END AS completed_cache_count
              FROM ms_live_cache
              WHERE hub='NE1'
              LIMIT 1
            `);
            const meta=first(metaResult);
            if(!meta.length) throw new Error('NE1 live cache missing');
            if(Number(meta[1]||0)!==1 || !['array','object'].includes(String(meta[2]||'')))
              throw new Error(`NE1 live cache JSON shape invalid valid=${meta[1]} type=${meta[2]}`);

            const [queueResult,routeResult,preentryResult,busResult]=await Promise.all([
              query(`
                WITH cache AS (
                  SELECT
                    CASE
                      WHEN json_type(rows_json)='array' THEN rows_json
                      ELSE json_extract(rows_json,'$.rows')
                    END AS live_json
                  FROM ms_live_cache
                  WHERE hub='NE1'
                  LIMIT 1
                ), raw AS (
                  SELECT
                    trim(COALESCE(json_extract(value,'$.id'),json_extract(value,'$.proofId'),json_extract(value,'$.routeId'),json_extract(value,'$.route_id'),'')) AS row_id,
                    lower(trim(COALESCE(json_extract(value,'$.attendanceType'),json_extract(value,'$.attendance_type'),''))) AS attendance_raw,
                    trim(COALESCE(json_extract(value,'$.actualArrivalAt'),json_extract(value,'$.actual_arrival_at'),'')) AS actual_arrival,
                    trim(COALESCE(json_extract(value,'$.scheduleKitArrivalAt'),json_extract(value,'$.schedule_kit_arrival_at'),'')) AS kit_arrival,
                    trim(COALESCE(json_extract(value,'$.scheduleTbrArrivalAt'),json_extract(value,'$.schedule_tbr_arrival_at'),'')) AS tbr_arrival,
                    trim(COALESCE(json_extract(value,'$.actualDepartureAt'),json_extract(value,'$.actual_departure_at'),'')) AS actual_departure,
                    trim(COALESCE(json_extract(value,'$.queueCancelledAt'),json_extract(value,'$.queue_cancelled_at'),'')) AS cancelled_at,
                    CAST(COALESCE(json_extract(value,'$.unloadingState'),json_extract(value,'$.unloading_state'),-1) AS INTEGER) AS unloading_state
                  FROM cache, json_each(COALESCE(cache.live_json,'[]'))
                ), classified AS (
                  SELECT *,
                    CASE
                      WHEN instr(attendance_raw,'จุดดร')>0 THEN 'drop'
                      WHEN instr(attendance_raw,'ปลายทาง')>0 THEN 'destination'
                      WHEN instr(attendance_raw,'ต้นทาง')>0 THEN 'origin'
                      ELSE attendance_raw
                    END AS attendance,
                    min(
                      COALESCE(julianday(actual_arrival),9999999),
                      COALESCE(julianday(kit_arrival),9999999),
                      COALESCE(julianday(tbr_arrival),9999999)
                    ) AS effective_arrival_jd
                  FROM raw
                ), flags AS (
                  SELECT *,
                    CASE
                      WHEN attendance='destination' THEN unloading_state=2
                      WHEN attendance='drop' THEN unloading_state=2 AND actual_departure<>''
                      ELSE actual_departure<>''
                    END AS done,
                    CASE
                      WHEN attendance IN ('destination','drop') AND unloading_state IN (1,2) THEN 1
                      ELSE 0
                    END AS started
                  FROM classified
                ), active AS (
                  SELECT *
                  FROM flags
                  WHERE actual_arrival<>''
                    AND COALESCE(julianday(actual_arrival),0)>0
                    AND NOT done
                    AND cancelled_at=''
                    AND effective_arrival_jd<9999999
                    AND (julianday('now')-effective_arrival_jd)*24.0<=12.0
                )
                SELECT
                  COUNT(*) AS queue_count,
                  SUM(CASE WHEN row_id='' THEN 1 ELSE 0 END) AS missing_ids,
                  COUNT(DISTINCT NULLIF(row_id,'')) AS distinct_ids,
                  SUM(CASE WHEN attendance='origin' THEN 1 ELSE 0 END) AS origin_count,
                  SUM(CASE WHEN attendance='destination' THEN 1 ELSE 0 END) AS destination_count,
                  SUM(CASE WHEN attendance='drop' THEN 1 ELSE 0 END) AS drop_count,
                  SUM(CASE WHEN attendance NOT IN ('origin','destination','drop') THEN 1 ELSE 0 END) AS unknown_count,
                  SUM(CASE WHEN started=1 THEN 1 ELSE 0 END) AS started_count,
                  SUM(CASE WHEN started=0 THEN 1 ELSE 0 END) AS waiting_count,
                  SUM(CASE WHEN effective_arrival_jd>julianday('now') THEN 1 ELSE 0 END) AS future_effective_arrival_count
                FROM active
              `),
              query("SELECT last_success_at,last_error FROM ms_connections WHERE hub='NE1' LIMIT 1"),
              query("SELECT last_success_at,last_error FROM ms_preentry_connections WHERE hub='NE1' LIMIT 1"),
              query("SELECT last_success_at,last_error FROM ms_bus_connections WHERE hub='NE1' LIMIT 1"),
            ]);
            const queue=first(queueResult), route=first(routeResult), preentry=first(preentryResult), bus=first(busResult);
            for(const [name,row] of Object.entries({route,preentry,bus})){
              if(String(row?.[1]||'')) throw new Error(`${name} session error: ${row[1]}`);
              const age=ageSeconds(row?.[0]);
              if(age<0||age>20*60) throw new Error(`${name} session stale: ${age}s`);
            }

            const queueCount=Number(queue[0]||0);
            const missingIds=Number(queue[1]||0);
            const distinctIds=Number(queue[2]||0);
            const duplicateIds=Math.max(0,queueCount-missingIds-distinctIds);
            const counts={
              origin:Number(queue[3]||0),
              destination:Number(queue[4]||0),
              drop:Number(queue[5]||0),
              unknown:Number(queue[6]||0),
            };
            const started=Number(queue[7]||0);
            const waiting=Number(queue[8]||0);
            const futureEffectiveArrival=Number(queue[9]||0);

            console.log(`LIVE_SNAPSHOT_AT=${meta[0]||'-'}`);
            console.log(`LIVE_SNAPSHOT_AGE_SECONDS=${ageSeconds(meta[0])}`);
            console.log(`LIVE_ROUTE_ROWS=${Number(meta[3]||0)}`);
            console.log(`CURRENT_QUEUE_ROWS=${queueCount}`);
            console.log(`LIVE_CACHE_FORMAT=${meta[2]}`);
            console.log(`LIVE_CACHE_VERSION=${Number(meta[4]||0)}`);
            console.log(`COMPLETED_CACHE_ROWS=${Number(meta[5]||0)}`);
            console.log(`QUEUE_ATTENDANCE_COUNTS=${JSON.stringify(counts)}`);
            console.log(`QUEUE_WAITING_COUNT=${waiting}`);
            console.log(`QUEUE_STARTED_COUNT=${started}`);
            console.log(`QUEUE_MISSING_IDS=${missingIds}`);
            console.log(`QUEUE_DUPLICATE_IDS=${duplicateIds}`);
            console.log(`QUEUE_FUTURE_EFFECTIVE_ARRIVAL=${futureEffectiveArrival}`);
            console.log('LIVE_CACHE_JSON_VALID=PASS');
            console.log('ALL_MS_SESSIONS_HEALTHY=PASS');
            console.log('SENSITIVE_ROW_VALUES_LOGGED=0');

            if(missingIds||duplicateIds||counts.unknown)
              throw new Error(`Current queue identity/type invariant failed missing=${missingIds} duplicates=${duplicateIds} unknown=${counts.unknown}`);

            if(queueCount===0){
              console.log('TRAFFIC_GATE=WAITING_FOR_TRAFFIC');
              console.log('CURRENT_QUEUE=EMPTY');
              console.log('QUEUE_RULES=PASS');
              console.log('D1_QUERIES=0');
              return;
            }

            console.log('CURRENT_QUEUE=HAS_TRAFFIC');
            console.log('QUEUE_RULES=PASS');
            console.log('TRAFFIC_GATE=PASS');
            console.log('D1_QUERIES=0');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Verify zero D1 runtime bindings
        if: always()
        run: |
          node <<'NODE'
          (async()=>{
            const account=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN;
            if(!account||!token) throw new Error('Cloudflare credentials missing');
            const headers={Authorization:`Bearer ${token}`};
            for(const name of ['waiting-trucks-report-api-dev','waiting-trucks-ms-browser-test']){
              const response=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/script-settings`,{headers});
              const payload=await response.json();
              if(!response.ok||payload.success===false) throw new Error(`${name} settings HTTP ${response.status}`);
              const bindings=Array.isArray(payload.result?.bindings)?payload.result.bindings:[];
              const d1=bindings.filter(x=>x.type==='d1'||x.type==='d1_database');
              if(d1.length) throw new Error(`${name} exposes D1 binding`);
              console.log(`${name.toUpperCase().replaceAll('-','_')}_D1_BINDING=0`);
            }
            console.log('ACTIVE_D1_BINDINGS=0');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Verify recent D1 analytics remain zero
        if: always()
        run: |
          node <<'NODE'
          (async()=>{
            const endpoint='https://api.cloudflare.com/client/v4/graphql';
            const accountTag=process.env.CLOUDFLARE_ACCOUNT_ID, token=process.env.CLOUDFLARE_API_TOKEN, databaseId=process.env.DEV_D1_DATABASE_ID;
            const end=new Date(Date.now()-2*60_000), start=new Date(end.getTime()-10*60_000);
            const query=`query($accountTag:String!,$databaseId:String!,$start:String!,$end:String!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:1000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){sum{rowsRead rowsWritten readQueries writeQueries}}}}}`;
            const response=await fetch(endpoint,{
              method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},
              body:JSON.stringify({query,variables:{accountTag,databaseId,start:start.toISOString(),end:end.toISOString()}}),
            });
            const payload=await response.json();
            if(!response.ok||payload.errors?.length) throw new Error(JSON.stringify(payload.errors||payload));
            const groups=payload.data?.viewer?.accounts?.[0]?.d1AnalyticsAdaptiveGroups||[];
            const total=groups.reduce((sum,g)=>({
              rowsRead:sum.rowsRead+Number(g.sum?.rowsRead||0), rowsWritten:sum.rowsWritten+Number(g.sum?.rowsWritten||0),
              readQueries:sum.readQueries+Number(g.sum?.readQueries||0), writeQueries:sum.writeQueries+Number(g.sum?.writeQueries||0),
            }),{rowsRead:0,rowsWritten:0,readQueries:0,writeQueries:0});
            console.log(`D1_RECENT_ROWS_READ=${total.rowsRead}`);
            console.log(`D1_RECENT_ROWS_WRITTEN=${total.rowsWritten}`);
            console.log(`D1_RECENT_READ_QUERIES=${total.readQueries}`);
            console.log(`D1_RECENT_WRITE_QUERIES=${total.writeQueries}`);
            if(total.rowsRead||total.rowsWritten||total.readQueries||total.writeQueries)
              throw new Error(`Recent D1 activity is not zero: ${JSON.stringify(total)}`);
            console.log('D1_RECENT_RUNTIME_ACTIVITY=0');
            console.log('ANALYTICS_ONLY=true');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE
