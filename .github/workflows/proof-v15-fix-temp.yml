name: Proof V15 Fix Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v15-fix-temp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace continuous DOM observer with event-scoped polish
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('worker/src/proof-ui-v15.js')
          s=p.read_text()
          old="""    const editorObserver = new MutationObserver(() => {\n      if (document.getElementById('proof-editor-dialog')?.open) polishEditor();\n    });\n    editorObserver.observe(document.body, { childList:true, subtree:true, characterData:true });\n"""
          new="""    // PROOF_EDITOR_EVENT_POLISH_V15: polish only when search results are rendered; no continuous DOM observer.\n    const baseRenderEditorSearchItems = P.renderEditorSearchItems;\n    if (typeof baseRenderEditorSearchItems === 'function') {\n      P.renderEditorSearchItems = (...args) => {\n        const result = baseRenderEditorSearchItems(...args);\n        queueMicrotask(polishEditor);\n        return result;\n      };\n    }\n"""
          if old not in s:
              if 'PROOF_EDITOR_EVENT_POLISH_V15' in s:
                  print('already patched')
              else:
                  raise SystemExit('observer anchor missing')
          else:
              p.write_text(s.replace(old,new,1))
              print('patched observer')
          PY
      - name: Validate V15
        run: |
          cd worker
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/proof-ui-v15.js
          git diff --cached --quiet && exit 0
          git commit -m "Scope Proof V15 popup polish to UI events"
          git pull --rebase origin main
          git push origin HEAD:main
