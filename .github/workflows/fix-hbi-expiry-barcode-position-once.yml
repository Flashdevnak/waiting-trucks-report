name: Fix HBI expiry UX and barcode position once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-hbi-expiry-barcode-position-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard expected main parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7bb9d59afd34bee8f6f247c93790103c45245ec7"

      - name: Fix authoritative UI sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          front = Path('ms.js')
          old = '''  } catch (error) {
    body.innerHTML = `<div class="truck-photo-empty is-error">${esc(error.message || "โหลดรูปท้ายรถไม่สำเร็จ")}</div>`;
  }
}'''
          new = '''  } catch (error) {
    if (error?.code === "HBI_PHOTO_SESSION_EXPIRED") {
      body.innerHTML = `<div class="truck-photo-empty is-error"><strong>Session รูปท้ายรถหมดอายุ</strong><span>HBI ต้องยืนยันตัวตนใหม่ก่อนดูรูป · การเชื่อมต่อ Route/Realtime ยังทำงานตามปกติ</span><button type="button" class="btn btn-accent" data-hbi-session-reconnect>เชื่อมต่อรูปท้ายรถใหม่</button></div>`;
      const reconnect = body.querySelector("[data-hbi-session-reconnect]");
      if (reconnect) reconnect.onclick = () => {
        if (dialog.open) dialog.close();
        openMsConnection();
      };
      return;
    }
    body.innerHTML = `<div class="truck-photo-empty is-error">${esc(error.message || "โหลดรูปท้ายรถไม่สำเร็จ")}</div>`;
  }
}'''
          replace_once(front, old, new, 'HBI expiry UX')

          css = Path('ms-v4.css')
          old = '''  .ms-page .compact-card-head .local-route-barcode:has(.local-barcode-panel:not(.hidden)) { grid-column: 1 / -1 !important; width: 100% !important; margin-top: 4px; }
  .ms-page .compact-card-head .local-route-barcode:has(.local-barcode-panel:not(.hidden)) .local-barcode-toggle { width: min(100%, 220px); align-self: center; }
  .ms-page .compact-card-head .local-barcode-panel { align-self: stretch; width: 100%; }'''
          new = '''  /* Keep the barcode toggle in its original header cell. Only the expanded panel spans the full card. */
  .ms-page .compact-card-head:has(.expected-parcels-badge) .local-route-barcode { display: contents; }
  .ms-page .compact-card-head:has(.expected-parcels-badge) .local-route-barcode .local-barcode-toggle {
    grid-column: 2;
    width: 100%;
    margin: 2px 0 0;
    align-self: stretch;
  }
  .ms-page .compact-card-head:has(.expected-parcels-badge) .local-route-barcode .local-barcode-panel {
    grid-column: 1 / -1;
    width: 100%;
    margin-top: 7px;
    align-self: stretch;
  }
  .ms-page .compact-card-head:not(:has(.expected-parcels-badge)) .local-route-barcode:has(.local-barcode-panel:not(.hidden)) {
    grid-column: 1 / -1 !important;
    width: 100% !important;
    margin-top: 4px;
  }
  .ms-page .compact-card-head:not(:has(.expected-parcels-badge)) .local-route-barcode:has(.local-barcode-panel:not(.hidden)) .local-barcode-toggle {
    width: min(100%, 220px);
    align-self: center;
  }'''
          replace_once(css, old, new, 'mobile barcode stable position')

          old = '.truck-photo-empty { display: flex; min-height: 150px; align-items: center; justify-content: center; padding: 18px; text-align: center; color: #5b6064; }'
          new = '.truck-photo-empty { display: flex; min-height: 150px; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 18px; text-align: center; color: #5b6064; }'
          replace_once(css, old, new, 'truck photo expiry panel layout')

          test = Path('worker/tests/hbi-truck-photos.test.mjs')
          old = '''  assert.match(front, /apiGetOnce\\("msTruckPhotos"/);
  assert.doesNotMatch(front, /apiGet\\("msTruckPhotos"/);'''
          new = '''  assert.match(front, /apiGetOnce\\("msTruckPhotos"/);
  assert.doesNotMatch(front, /apiGet\\("msTruckPhotos"/);
  assert.match(front, /HBI_PHOTO_SESSION_EXPIRED/);
  assert.match(front, /data-hbi-session-reconnect/);'''
          replace_once(test, old, new, 'HBI expiry UI regression')

          marker = '''test("worker keeps HBI out of live refresh and caps each cold click at one page", () => {'''
          insert = '''test("mobile barcode keeps its toggle cell while only the opened panel spans full width", () => {
  const style = fs.readFileSync(new URL("../../ms-v4.css", import.meta.url), "utf8");
  assert.match(style, /compact-card-head:has\\(\\.expected-parcels-badge\\) \\.local-route-barcode \\{ display: contents; \\}/);
  assert.match(style, /local-route-barcode \\.local-barcode-toggle \\{[\\s\\S]*?grid-column: 2;/);
  assert.match(style, /local-route-barcode \\.local-barcode-panel \\{[\\s\\S]*?grid-column: 1 \\/ -1;/);
});

'''
          text = test.read_text(encoding='utf-8')
          if text.count(marker) != 1:
              raise SystemExit('barcode regression insertion anchor changed')
          test.write_text(text.replace(marker, insert + marker, 1), encoding='utf-8')
          PY

      - name: Focused regression
        shell: bash
        run: |
          set -euo pipefail
          node --check ms.js
          node --test worker/tests/hbi-truck-photos.test.mjs
          node --test .github/dev-tools/realtime-quota-hardening.test.mjs
          git diff --check

      - name: Full worker regression
        working-directory: worker
        run: |
          npm ci
          npm run check

      - name: Commit source fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/fix-hbi-expiry-barcode-position-once.yml
          git add ms.js ms-v4.css worker/tests/hbi-truck-photos.test.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix(ms): handle expired HBI session and pin barcode toggle"
          git push origin HEAD:main
