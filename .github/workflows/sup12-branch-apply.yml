name: SUP-12 Branch Apply

on:
  push:
    branches:
      - codex/sup-12-leak-circuit-backoff-kill-switch
    paths:
      - .github/dev-tools/apply-sup12.py
      - .github/dev-tools/fix-sup12-harness.py
      - .github/dev-tools/fix-sup12-regression.py
      - .github/workflows/sup12-branch-apply.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sup-12-leak-circuit-backoff-kill-switch
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply SUP-12 forward patch
        run: python3 .github/dev-tools/apply-sup12.py
      - name: Fix deterministic SUP-12 harness
        run: python3 .github/dev-tools/fix-sup12-harness.py
      - name: Align SUP-12 regression guards
        run: python3 .github/dev-tools/fix-sup12-regression.py
      - name: Install DEV test dependencies
        working-directory: worker
        run: npm ci
      - name: Focused SUP-12 and full regression
        working-directory: worker
        shell: bash
        run: |
          set +e
          set -o pipefail
          (
            set -e
            echo '=== SUP-12 FOCUSED ==='
            node --test tests/supervisor-quota-protection.test.mjs
            echo '=== FULL NPM CHECK ==='
            npm run check
          ) 2>&1 | tee ../.github/dev-tools/sup12-last-check.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            git config user.name "Flashdevnak"
            git config user.email "26nak.testdev@gmail.com"
            git add ../.github/dev-tools/sup12-last-check.log
            git commit -m "test(dev): capture SUP-12 regression failure [skip ci]"
            git push origin HEAD:codex/sup-12-leak-circuit-backoff-kill-switch
            exit "$status"
          fi
          rm -f ../.github/dev-tools/sup12-last-check.log
      - name: Verify branch scope and diff
        run: |
          git diff --check
          git diff --name-only | sort
          test -z "$(git diff --name-only | grep -E '(^|/)(wrangler\.jsonc|wrangler\.toml)$|production|prod-' || true)"
      - name: Commit canonical SUP-12 branch result
        run: |
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git add worker/src/turso-d1.js .github/dev-tools/patch-supervisor-quota-instrumentation.mjs supervisor.js supervisor.html worker/tests worker/package.json
          git commit -m "SUP-12: add quota protection contracts [skip ci]"
          git push origin HEAD:codex/sup-12-leak-circuit-backoff-kill-switch
