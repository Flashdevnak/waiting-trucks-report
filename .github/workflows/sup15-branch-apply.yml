name: SUP-15 Branch Apply

on:
  push:
    branches:
      - codex/sup-15-redacted-system-context
    paths:
      - .github/workflows/sup15-branch-apply.yml

permissions:
  contents: write

jobs:
  validate-staged-asset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply staged-asset refactor
        run: python .github/dev-tools/refactor-sup15-staged-asset.py
      - name: Install worker dependencies
        working-directory: worker
        run: npm ci
      - name: Focused SUP-15 contracts
        working-directory: worker
        run: node --test tests/supervisor-system-context.test.mjs tests/supervisor-guide-contract.test.mjs tests/supervisor-language-contract.test.mjs tests/supervisor-module-registry.test.mjs tests/supervisor-core-shell.test.mjs
      - name: Full regression
        working-directory: worker
        run: npm run check
      - name: Diff safety
        run: |
          git diff --check
          git diff --name-only
          echo SUP15_REFACTOR_DIFF_SAFETY=PASS
          echo PRODUCTION_TOUCHED=NO
      - name: Commit validated staged-asset refactor
        run: |
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git add supervisor-modules.js supervisor.js worker/package.json worker/tests/supervisor-system-context.test.mjs worker/tests/supervisor-guide-contract.test.mjs
          git rm supervisor-context.js
          git commit -m "SUP-15: reuse staged Supervisor module for redacted context"
          git push origin HEAD:codex/sup-15-redacted-system-context
