name: TBR Test Runtime Regression

on:
  push:
    branches:
      - main
    paths:
      - cloudflare-browser-test/**
      - .github/dev-tools/stage-dev-runtime.mjs
      - .github/workflows/tbr-test-runtime-regression.yml
  pull_request:
    paths:
      - cloudflare-browser-test/**
      - .github/dev-tools/stage-dev-runtime.mjs
      - .github/workflows/tbr-test-runtime-regression.yml

permissions:
  contents: read

jobs:
  test-runtime-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify persisted Browser TEST Split V2 source
        working-directory: cloudflare-browser-test
        run: |
          npm install --no-audit --no-fund
          node --check src/index.js
          node --check src/tbr-shadow.js
          node --check src/connection-error.js
          grep -q 'TBR_STALE_SPLIT_BROWSER_V2' src/index.js
          grep -q 'SHADOW_READONLY_SPLIT_V2' src/index.js
          grep -q 'TBR_ROUTE_STALE_FALLBACK_V6' src/index.js
          grep -q 'TBR_ROUTE_CACHE_HEARTBEAT_MS = 5 \* 60 \* 1000' src/index.js
          grep -q 'TBR_ROUTE_CACHE_MAX_AGE_MS = 30 \* 60 \* 1000' src/index.js
          grep -q 'normalTursoPointReadsPerCron: 4' src/index.js
          grep -q 'browserKvRouteCacheWritesMaxPerDay: 288' src/index.js
          grep -q 'route_fallback' src/tbr-shadow.js
          grep -q 'Route ใช้ snapshot ล่าสุดชั่วคราว' src/tbr-shadow.js
          grep -q 'STALE · ข้อมูลหยุดอัปเดตเกิน 7 นาที' src/tbr-shadow.js
          grep -q 'TBR_SAME_CRON_TIMESTAMP_V1' src/tbr-shadow.js
          ! grep -Fq 'if (routeActualMs !== null || now - tbrMs > SHADOW_PENDING_MS) continue;' src/tbr-shadow.js
          grep -q 'recordConnectionErrorKv' src/index.js
          grep -q '"binding": "DEV_API"' wrangler.jsonc
          grep -q '"service": "waiting-trucks-report-api-dev"' wrangler.jsonc
          ! grep -q 'd1_databases' wrangler.jsonc
          npx wrangler deploy --dry-run --config wrangler.jsonc >/tmp/tbr-browser-dry-run.log
          grep -q 'waiting-trucks-report-api-dev' /tmp/tbr-browser-dry-run.log
          echo 'PERSISTED_BROWSER_SPLIT_V2=PASS'
          echo 'PERSISTED_TBR_SAME_CRON=PASS'
          echo 'PERSISTED_TBR_ROUTE_FALLBACK_V6=PASS'
          echo 'BROWSER_TEST_D1_BINDING=0'

      - name: Regression test same-cron timestamp ordering
        run: |
          node --input-type=module <<'NODE'
          import { observeTbrShadow, readTbrShadowReport } from './cloudflare-browser-test/src/tbr-shadow.js';
          class KV {
            constructor(){ this.m=new Map(); }
            async get(k){ return this.m.get(k) ?? null; }
            async put(k,v){ this.m.set(k,v); }
          }
          const quota={mode:'SHADOW_READONLY_SPLIT_V2',tursoPointReadsPerCron:4,tursoWritesPerCron:0};
          async function runCase(name,tbr,actual,type='ปลายทาง'){
            const STATE=new KV();
            const now=Date.parse('2026-09-05T09:50:00+07:00');
            await observeTbrShadow({STATE},'NE1',{
              shadowQuota:quota,
              tbrShadowFeed:[{proofId:name,scheduleTbrArrivalAt:tbr,scheduleKitArrivalAt:''}],
              rows:[{proofId:name,attendanceType:type,actualArrivalAt:actual}],
            },now);
            return readTbrShadowReport({STATE},'NE1');
          }
          const earlier=await runCase('SAMECRON-A','2026-09-05T09:48:05+07:00','2026-09-05T09:48:35+07:00');
          if(earlier.total!==1 || earlier.confirmed!==1) throw new Error('TBR earlier than Route in same cron was discarded');
          const later=await runCase('SAMECRON-B','2026-09-05T09:48:35+07:00','2026-09-05T09:48:05+07:00');
          if(later.total!==0) throw new Error('TBR after Route must be excluded');
          const origin=await runCase('SAMECRON-C','2026-09-05T09:48:05+07:00','2026-09-05T09:49:05+07:00','ต้นทาง');
          if(origin.total!==0) throw new Error('Origin route entered inbound Shadow');
          const drop=await runCase('SAMECRON-D','2026-09-05T09:48:05+07:00','2026-09-05T09:49:05+07:00','จุดดรอป');
          if(drop.total!==1 || drop.confirmed!==1) throw new Error('Drop route same-cron capture failed');
          console.log('SAME_CRON_TBR_BEFORE_ROUTE=PASS');
          console.log('TBR_AFTER_ROUTE_EXCLUDED=PASS');
          console.log('ORIGIN_EXCLUDED=PASS');
          console.log('DROP_INCLUDED=PASS');
          NODE

      - name: Regression test Route 503 keeps current TBR feed alive
        run: |
          node --input-type=module <<'NODE'
          import { sendConnectorSync } from './cloudflare-browser-test/src/index.js';
          class KV {
            constructor(){ this.m=new Map(); }
            async get(k){ return this.m.get(k) ?? null; }
            async put(k,v){ this.m.set(k,v); }
          }
          const STATE=new KV();
          let failRoute=false;
          const make=(obj,status=200)=>new Response(JSON.stringify(obj),{status,headers:{'content-type':'application/json'}});
          const DEV_API={fetch:async request=>{
            const body=await request.json();
            if(body.shadowPart==='routes'){
              if(failRoute)return make({ok:false},503);
              return make({ok:true,data:{rows:[{proofId:'FALLBACK-REG',attendanceType:'ปลายทาง',actualArrivalAt:''}]}});
            }
            return make({ok:true,data:{tbrShadowFeed:[{proofId:'FALLBACK-REG',scheduleTbrArrivalAt:'2026-09-05T23:00:00+07:00'}]}});
          }};
          const env={STATE,DEV_API};
          let response=await sendConnectorSync(env,'NE1','connector-token');
          let body=await response.json();
          if(!response.ok||body.data.routeFallback||body.data.rows.length!==1) throw new Error('initial last-good Route snapshot was not seeded');
          failRoute=true;
          response=await sendConnectorSync(env,'NE1','connector-token');
          body=await response.json();
          if(!response.ok) throw new Error('transient Route 503 still blanked the combined source');
          if(body.data.routeFallback!==true) throw new Error('Route fallback flag missing');
          if(body.data.rows.length!==1||body.data.tbrShadowFeed.length!==1) throw new Error('current TBR feed was not combined with last-good Route snapshot');
          if(body.data.shadowQuota.normalTursoPointReadsPerCron!==4||body.data.shadowQuota.tursoWritesPerCron!==0) throw new Error('fallback changed normal Turso quota');
          console.log('TBR_ROUTE_503_FALLBACK=PASS');
          console.log('TBR_CURRENT_BUS_FEED_PRESERVED=PASS');
          console.log('TBR_NORMAL_TURSO_POINT_READS=4');
          console.log('TBR_TURSO_WRITES=0');
          NODE

      - name: Verify normal DEV staging preserves Split V2 and adaptive Route recovery
        working-directory: worker
        run: |
          npm ci --no-audit --no-fund
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../waiting.html ../main.js ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../sw.js ../favicon.svg .dev-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js src/index.js
          node --check src/index.js
          grep -q 'TBR_SHADOW_READONLY_V1' src/index.js
          grep -q 'TBR_SHADOW_SPLIT_V2' src/index.js
          grep -q 'TBR_ROUTE_OPERATING_WINDOW_V3' src/index.js
          grep -q 'TBR_ROUTE_CHUNK_RETRY_V4' src/index.js
          grep -q 'TBR_ROUTE_ADAPTIVE_RETRY_V5' src/index.js
          grep -q 'readTbrRouteRangeAdaptive' src/index.js
          grep -q 'depth >= 2' src/index.js
          grep -q 'todayStartBangkok - 86400000' src/index.js
          grep -q 'todayStartBangkok + 86400000 - 1000' src/index.js
          grep -q 'shadowPart = text(body.shadowPart' src/index.js
          grep -q 'tursoPointReadsPerCron: 4' src/index.js
          for page in ms.html proof.html waiting.html ms-report.html; do
            grep -q 'data-dev-shell="20260905-v2"' ".dev-assets/$page"
            grep -q 'style.css?v=20260905-dev-shell-v3' ".dev-assets/$page"
            grep -q 'dev-shell-status' ".dev-assets/$page"
            grep -q 'dev-system-nav' ".dev-assets/$page"
            grep -q 'dev-page-tools' ".dev-assets/$page"
            grep -q 'dev-shell-refresh' ".dev-assets/$page"
            grep -q 'dev-account-menu' ".dev-assets/$page"
          done
          grep -q 'DEV_UNIFIED_HEADER_V2' .dev-assets/style.css
          grep -q 'DEV_HEADER_POLISH_V3' .dev-assets/style.css
          ! grep -q 'd1_databases' wrangler.dev.jsonc
          echo 'NORMAL_DEV_STAGING_SPLIT_V2=PASS'
          echo 'TBR_ROUTE_ADAPTIVE_RETRY_V5=PASS'
          echo 'DEV_UI_HEADER_V3=PASS'
          echo 'DEV_D1_BINDING=0'
          echo 'PRODUCTION_TOUCHED=NO'
