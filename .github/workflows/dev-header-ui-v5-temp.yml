name: DEV Header UI V5 Temp
# trigger: run-v5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-header-ui-v5-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply DEV header V5 patch
        run: python3 .github/dev-tools/dev-header-v5-patch-temp.py
      - name: Validate DEV header V5
        run: |
          node --check .github/dev-tools/stage-dev-runtime.mjs
          node --check .github/dev-tools/stage-dev-runtime.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          grep -q 'DEV_HEADER_LAYOUT_V5' .github/dev-tools/stage-dev-runtime.mjs
          grep -q 'DEV_STATUS_LABEL_V5' .github/dev-tools/stage-dev-runtime.mjs
          echo 'DEV_HEADER_SPACING_V5=PASS'
          echo 'DEV_STATUS_LABEL_V5=PASS'
          echo 'DEV_UTILITY_GROUP_V5=PASS'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit functional changes
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add .github/dev-tools/stage-dev-runtime.mjs .github/dev-tools/stage-dev-runtime.test.mjs
          git commit -m 'Refine DEV header status and menu spacing'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
