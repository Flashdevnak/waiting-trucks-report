name: DEV BusTime Fixed Cadence

on:
  push:
    branches: [dev/bus-time-live-acceptance]
    paths: [.github/workflows/dev-bus-time-fixed-cadence.yml]

permissions:
  contents: read

jobs:
  fixed-cadence:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
      ACCEPT_HUB: NE1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Install Worker dependencies
        working-directory: worker
        run: npm ci
      - name: Stage clean DEV runtime
        working-directory: worker
        run: |
          rm -rf .diag-assets .diag-clean .diag-runtime
          mkdir -p .diag-assets .diag-clean
          cp -R src .diag-clean/src
          cp ../waiting.html ../admin.html ../admin.js ../admin.css ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../ms-v4.css ../sw.js ../favicon.svg .diag-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .diag-assets/
          cp ../.github/dev-tools/safe-parity.html .diag-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .diag-assets/ms.js .diag-clean/src/index.js
          node ../.github/dev-tools/patch-dev-origin-manifest-session-v2.mjs .diag-assets/ms.js .diag-clean/src/origin-manifest-v1.js
          node --check .diag-clean/src/index.js
          node --check .diag-clean/src/bus-time-hot-lane-v14.js
          cp -R .diag-clean .diag-runtime
      - name: Add guarded cadence diagnostics
        working-directory: worker
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const file='.diag-runtime/src/index.js';
          let source=fs.readFileSync(file,'utf8');
          const post='async function post(body, env) {\n  const action = String(body.action || "");';
          if(!source.includes(post)) throw new Error('POST anchor missing');
          const replacement=`async function post(body, env) {
            const action = String(body.action || "");
            if (action === "devBusCadenceReady" || action === "devBusCadenceAcceptance") {
              const expected = String(env.DEV_BUS_DIAG_TOKEN || "");
              const supplied = String(body.diagToken || "");
              if (!expected || !supplied || supplied !== expected) fail("Forbidden", "FORBIDDEN", 403);
              if (action === "devBusCadenceReady") return ok({ ready: true, marker: "BUS_TIME_FIXED_CADENCE_READY_V1" });
              const hub = String(body.hub || "").trim().toUpperCase();
              if (!/^[A-Z0-9]{2,10}$/.test(hub)) fail("Invalid HUB", "INVALID_HUB", 400);
              const actor = { username: "DEV_BUS_CADENCE", role: "admin", branches: ["*"] };
              const live = await refreshMsIfStale(env, actor, hub);
              const routeRows = Array.isArray(live?.rows) ? live.rows : [];
              const routeSummary = routeRows.reduce((acc,row)=>{
                const type=String(row?.attendanceType||"UNKNOWN").trim()||"UNKNOWN";
                const state=String(row?.unloadingState??"UNKNOWN");
                acc.total+=1; acc.byAttendance[type]=(acc.byAttendance[type]||0)+1; acc.byState[state]=(acc.byState[state]||0)+1; return acc;
              },{total:0,byAttendance:{},byState:{}});
              let diagnostics=busTimeDiagnostics(hub);
              if(env.MS_REFRESH_COORDINATOR){
                const id=env.MS_REFRESH_COORDINATOR.idFromName(hub), stub=env.MS_REFRESH_COORDINATOR.get(id);
                const target=new URL("https://ms-refresh.internal/diagnostics"); target.searchParams.set("branch",hub);
                const response=await stub.fetch(new Request(target)); if(response.ok) diagnostics=await response.json();
              }
              return ok({hub,syncStatus:String(live?.status||""),syncErrorPresent:Boolean(live?.error),routeSummary,diagnostics});
            }`;
          source=source.replace(post,replacement);
          const doAnchor='    const branch = String(url.searchParams.get("branch") || "").trim().toUpperCase();\n    if (url.pathname === "/stream") return this.openStream(request, branch);';
          if(!source.includes(doAnchor)) throw new Error('DO anchor missing');
          source=source.replace(doAnchor,'    const branch = String(url.searchParams.get("branch") || "").trim().toUpperCase();\n    if (url.pathname === "/diagnostics") return Response.json(busTimeDiagnostics(branch));\n    if (url.pathname === "/stream") return this.openStream(request, branch);');
          fs.writeFileSync(file,source);
          NODE
          node --check .diag-runtime/src/index.js
      - name: Install temporary diagnostic secret
        id: diag-secret
        working-directory: worker
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          printf '%s' "$TOKEN" | npx wrangler secret put DEV_BUS_DIAG_TOKEN --config wrangler.dev.jsonc
      - name: Deploy temporary diagnostic runtime
        working-directory: worker
        run: |
          rm -rf .dev-assets .dev-runtime
          cp -R .diag-assets .dev-assets
          cp -R .diag-runtime .dev-runtime
          npx wrangler deploy .dev-runtime/src/turso-index.js --config wrangler.dev.jsonc
      - name: Wait for diagnostic route propagation
        env:
          DIAG_TOKEN: ${{ steps.diag-secret.outputs.token }}
        run: |
          node <<'NODE'
          const base=process.env.WORKER_ORIGIN, token=process.env.DIAG_TOKEN;
          let last='';
          for(let i=1;i<=20;i++){
            try{
              const r=await fetch(`${base}/api`,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'devBusCadenceReady',diagToken:token}),cache:'no-store'});
              const j=await r.json();
              if(r.ok&&j?.ok&&(j.data||j)?.marker==='BUS_TIME_FIXED_CADENCE_READY_V1'){console.log(`DIAG_READY_AFTER_ATTEMPT=${i}`);process.exit(0);}
              last=`HTTP ${r.status} ${JSON.stringify(j)}`;
            }catch(e){last=e.message||String(e);}
            await new Promise(r=>setTimeout(r,1000));
          }
          throw new Error(`diagnostic route not ready: ${last}`);
          NODE
      - name: Measure fixed wall-clock 4-second cadence
        env:
          DIAG_TOKEN: ${{ steps.diag-secret.outputs.token }}
        run: |
          node <<'NODE'
          const base=process.env.WORKER_ORIGIN, hub=process.env.ACCEPT_HUB, token=process.env.DIAG_TOKEN;
          const count=16, cadenceMs=4000, testStarted=Date.now();
          async function cycle(index){
            const scheduledAt=testStarted+(index-1)*cadenceMs;
            const wait=Math.max(0,scheduledAt-Date.now()); if(wait) await new Promise(r=>setTimeout(r,wait));
            const started=Date.now();
            const response=await fetch(`${base}/api`,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify({action:'devBusCadenceAcceptance',hub,diagToken:token}),cache:'no-store'});
            const payload=await response.json().catch(()=>({}));
            if(!response.ok||!payload?.ok) throw new Error(`cycle ${index} HTTP ${response.status}: ${JSON.stringify(payload)}`);
            const data=payload.data||payload,d=data.diagnostics||{};
            return {index,scheduledOffsetMs:scheduledAt-testStarted,startedOffsetMs:started-testStarted,completedOffsetMs:Date.now()-testStarted,latencyMs:Date.now()-started,syncErrorPresent:Boolean(data.syncErrorPresent),routeSummary:data.routeSummary||{},mode:d.mode||'',busCallsLastMinute:Number(d.busCallsLastMinute||0),busHotCalls:Number(d.busHotCalls||0),busBackgroundCalls:Number(d.busBackgroundCalls||0),busPagesLastCycle:Number(d.busPagesLastCycle||0),busRateLimitCount:Number(d.busRateLimitCount||0),busLastSuccessAt:d.busLastSuccessAt||'',busLastError:d.busLastError||'',busActiveRows:Number(d.busActiveRows||0),busTotalKnownRows:Number(d.busTotalKnownRows||0)};
          }
          const rows=await Promise.all(Array.from({length:count},(_,i)=>cycle(i+1))); rows.sort((a,b)=>a.index-b.index);
          for(const r of rows) console.log(`CYCLE=${r.index} SCHEDULED_MS=${r.scheduledOffsetMs} STARTED_MS=${r.startedOffsetMs} COMPLETED_MS=${r.completedOffsetMs} LATENCY_MS=${r.latencyMs} CALLS_1M=${r.busCallsLastMinute} HOT=${r.busHotCalls} BG=${r.busBackgroundCalls} PAGES=${r.busPagesLastCycle} ACTIVE=${r.busActiveRows} RATE_LIMITS=${r.busRateLimitCount} SUCCESS_AT=${r.busLastSuccessAt||'-'} ERROR=${r.busLastError||'-'}`);
          const jitter=rows.map(r=>Math.abs(r.startedOffsetMs-r.scheduledOffsetMs));
          const success=[...new Set(rows.map(r=>r.busLastSuccessAt).filter(Boolean))].map(Date.parse).filter(Number.isFinite).sort((a,b)=>a-b);
          const gaps=success.slice(1).map((v,i)=>v-success[i]);
          const lat=rows.map(r=>r.latencyMs).sort((a,b)=>a-b),p95=a=>a.length?a[Math.min(a.length-1,Math.floor(a.length*.95))]:0;
          const first=rows[0],last=rows.at(-1),hotDelta=last.busHotCalls-first.busHotCalls,bgDelta=last.busBackgroundCalls-first.busBackgroundCalls,rateDelta=last.busRateLimitCount-first.busRateLimitCount,s=last.routeSummary||{};
          console.log(`FIXED_CADENCE_MS=${cadenceMs}`);
          console.log(`FIXED_CADENCE_START_JITTER_MAX_MS=${Math.max(...jitter)}`);
          console.log(`BUS_MODE=${last.mode||'-'}`);
          console.log(`BUS_PROVIDER_CALL_DELTA=${hotDelta+bgDelta}`);
          console.log(`BUS_HOT_CALL_DELTA=${hotDelta}`);
          console.log(`BUS_BACKGROUND_CALL_DELTA=${bgDelta}`);
          console.log(`BUS_CALLS_LAST_MINUTE_FINAL=${last.busCallsLastMinute}`);
          console.log(`BUS_RATE_LIMIT_DELTA=${rateDelta}`);
          console.log(`BUS_LAST_ERROR=${last.busLastError||'-'}`);
          console.log(`BUS_SUCCESS_OBSERVATIONS=${success.length}`);
          console.log(`BUS_SUCCESS_GAP_AVG_MS=${gaps.length?Math.round(gaps.reduce((a,b)=>a+b,0)/gaps.length):0}`);
          console.log(`BUS_SUCCESS_GAP_MAX_MS=${gaps.length?Math.max(...gaps):0}`);
          console.log(`RESPONSE_LATENCY_P95_MS=${p95(lat)}`);
          console.log(`ROUTE_ROWS_TOTAL=${Number(s.total||0)}`);
          console.log(`ROUTE_BY_ATTENDANCE=${JSON.stringify(s.byAttendance||{})}`);
          console.log(`ROUTE_BY_STATE=${JSON.stringify(s.byState||{})}`);
          console.log(`BUS_ACTIVE_ROWS_FINAL=${last.busActiveRows}`);
          console.log(`BUS_KNOWN_ROWS_FINAL=${last.busTotalKnownRows}`);
          console.log(`SYNC_ERROR_RESPONSES=${rows.filter(r=>r.syncErrorPresent).length}`);
          if(Math.max(...jitter)>1000) throw new Error('caller 4s cadence drifted');
          if(last.mode!=='BUS_TIME_HOT_LANE_V14') throw new Error(`unexpected mode ${last.mode}`);
          if(!success.length) throw new Error('no live BusTime success observed');
          if(rateDelta>0||last.busLastError==='BUS_TIME_RATE_LIMIT') throw new Error('rate limit observed');
          if(rows.some(r=>r.busPagesLastCycle>3)) throw new Error('per-cycle hard cap exceeded');
          if(last.busCallsLastMinute>48) throw new Error(`provider amplification ${last.busCallsLastMinute}/min`);
          NODE
      - name: Remove temporary diagnostic secret
        if: always()
        working-directory: worker
        run: yes | npx wrangler secret delete DEV_BUS_DIAG_TOKEN --config wrangler.dev.jsonc || true
      - name: Restore clean DEV runtime
        if: always()
        working-directory: worker
        run: |
          rm -rf .dev-assets .dev-runtime
          cp -R .diag-assets .dev-assets
          cp -R .diag-clean .dev-runtime
          npx wrangler deploy .dev-runtime/src/turso-index.js --config wrangler.dev.jsonc
      - name: Verify cleanup
        if: always()
        run: |
          node <<'NODE'
          (async()=>{
            const health=await fetch(`${process.env.WORKER_ORIGIN}/api?action=health`,{cache:'no-store'}),body=await health.json(); if(!health.ok||!body?.ok) throw new Error('DEV health failed');
            const account=process.env.CLOUDFLARE_ACCOUNT_ID,token=process.env.CLOUDFLARE_API_TOKEN,headers={Authorization:`Bearer ${token}`},name='waiting-trucks-report-api-dev';
            const sr=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/script-settings`,{headers}),settings=await sr.json(); if(!sr.ok||!settings.success) throw new Error('settings read failed');
            if((settings.result?.bindings||[]).some(x=>x.type==='d1'||x.type==='d1_database')) throw new Error('D1 binding reappeared');
            const xr=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/secrets`,{headers}),secrets=await xr.json(); if(!xr.ok||!secrets.success) throw new Error('secrets read failed');
            if((secrets.result||[]).some(x=>x.name==='DEV_BUS_DIAG_TOKEN')) throw new Error('diagnostic secret survived');
            console.log('DEV_HEALTH_AFTER_FIXED_CADENCE=PASS');
            console.log('DEV_DIAGNOSTIC_SECRET_AFTER_FIXED_CADENCE=0');
            console.log('DEV_D1_BINDING_AFTER_FIXED_CADENCE=0');
            console.log('PRODUCTION_TOUCHED=NO');
          })().catch(e=>{console.error(e);process.exit(1);});
          NODE
