name: TEMP DEV Live UI Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe DEV 401 repair time
        shell: bash
        run: |
          set -euo pipefail
          url='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api?action=msRepairHealthDev&branch=EA2'
          body="$(curl -fsS --retry 2 --connect-timeout 10 "$url")"
          echo "$body" | jq -c '{branch:.data.branch,repair:.data.repair,quota:.data.quota}'
          echo "$body" | jq -e '
            .ok == true and
            .data.repair.code == "MS_SESSION_HTTP_401" and
            ((.data.repair.changedAt // "") | length) > 0 and
            .data.quota.tursoReads == 0 and
            .data.quota.tursoWrites == 0 and
            .data.quota.upstreamCalls == 0
          ' >/dev/null
      - name: Probe Connection Intelligence NE1 selector
        shell: bash
        run: |
          set -euo pipefail
          url='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev/api/connection-error?hub=NE1'
          html="$(curl -fsS -H 'Accept: text/html' --retry 2 --connect-timeout 10 "$url")"
          options="$(printf '%s' "$html" | grep -oE '<option[^>]*value="[^"]+"[^>]*>[^<]*</option>' || true)"
          printf '%s\n' "$options"
          count="$(printf '%s\n' "$options" | grep -c '<option' || true)"
          echo "HUB_OPTION_COUNT=$count"
          test "$count" -ge 2
          printf '%s\n' "$options" | grep -q '>NE1</option>'
          other="$(printf '%s\n' "$options" | grep -v '>NE1</option>' | head -n 1 || true)"
          test -n "$other"
          echo "OTHER_HUB_OPTION=$other"
