name: Proof Print HAR V9 Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-print-har-v9-temp.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Polish Proof print HAR V9.1 only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/src/proof-ui-v5.js')
          s=p.read_text()
          if 'PROOF_PRINT_HAR_UPLOAD_V9' not in s:
            raise SystemExit('Proof V9 base marker missing')
          if 'PROOF_PRINT_HAR_POLISH_V9_1' not in s:
            old="status.textContent=`พร้อมปริ้น • ตรวจพบ request MS ${c.msRequestCount||0} รายการ`;"
            new="status.textContent='พร้อมปริ้น • HAR บันทึกแล้วและ Proof Session ใช้งานได้'; /* PROOF_PRINT_HAR_POLISH_V9_1 */"
            if old not in s: raise SystemExit('Proof print success text anchor missing')
            s=s.replace(old,new,1)
            old_css=".proof-har-upload small,#proof-session-file-name,.proof-session-status{font-size:10px;color:#777}"
            new_css=".proof-har-upload small,#proof-session-file-name,#proof-print-har-file-name,.proof-session-status{font-size:10px;color:#777}"
            if old_css not in s: raise SystemExit('Proof HAR filename style anchor missing')
            s=s.replace(old_css,new_css,1)
            old_grid=".proof-har-upload .btn-full,#proof-session-file-name{grid-column:1/-1}"
            new_grid=".proof-har-upload .btn-full,#proof-session-file-name,#proof-print-har-file-name{grid-column:1/-1}"
            if old_grid not in s: raise SystemExit('Proof HAR filename grid anchor missing')
            s=s.replace(old_grid,new_grid,1)
            old_open="document.getElementById('proof-session-hub').textContent = P.state.branch; document.getElementById('proof-session-har').value = ''; document.getElementById('proof-session-status').textContent = 'HAR ไฟล์เดียว ใช้ทั้งเส้นทาง MS และปริ้นบาร์โค้ด';"
            new_open="document.getElementById('proof-session-hub').textContent = P.state.branch; document.getElementById('proof-session-har').value = ''; const printHar=document.getElementById('proof-print-har'); if(printHar) printHar.value=''; const printHarName=document.getElementById('proof-print-har-file-name'); if(printHarName) printHarName.textContent='ยังไม่ได้เลือกไฟล์'; const printHarSave=document.getElementById('proof-print-har-save'); if(printHarSave) printHarSave.disabled=true; document.getElementById('proof-session-status').textContent = 'HAR ไฟล์เดียว ใช้ทั้งเส้นทาง MS และปริ้นบาร์โค้ด';"
            if old_open not in s: raise SystemExit('Proof open-session reset anchor missing')
            s=s.replace(old_open,new_open,1)
            p.write_text(s)
          PY
      - name: Extend persistent Proof V9.1 contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('worker/tests/proof-smart-v8.test.mjs')
          s=p.read_text()
          if 'PROOF_PRINT_HAR_POLISH_V9_1' not in s:
            anchor="  assert.match(proofUi,/PROOF_PRINT_HAR_UPLOAD_V9/);\n"
            if anchor not in s: raise SystemExit('Proof V9 test anchor missing')
            s=s.replace(anchor,anchor+"  assert.match(proofUi,/PROOF_PRINT_HAR_POLISH_V9_1/);\n  assert.match(proofUi,/HAR บันทึกแล้วและ Proof Session ใช้งานได้/);\n  assert.match(proofUi,/#proof-print-har-file-name/);\n",1)
            p.write_text(s)
          PY
      - name: Syntax and Proof regression
        run: |
          node --check worker/src/proof-ui-v5.js
          cd worker
          npm ci --no-audit --no-fund
          npm run check
          node --test tests/proof-smart-v8.test.mjs tests/auth-session-resilience.test.mjs
      - name: Scope and quota guard
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={'worker/src/proof-ui-v5.js','worker/tests/proof-smart-v8.test.mjs'}
          changed=[x for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x]
          bad=[x for x in changed if x not in allowed]
          if bad: raise SystemExit('Out-of-scope files: '+', '.join(bad))
          if not changed: raise SystemExit('No Proof changes produced')
          print('PROOF_V9_1_SCOPE_ONLY=PASS')
          print('PROOF_BACKGROUND_REQUESTS_ADDED=0')
          print('PROOF_POLL_60S_UNCHANGED=PASS')
          print('PRODUCTION_TOUCHED=NO')
          PY
      - name: Commit Proof V9.1 polish
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add worker/src/proof-ui-v5.js worker/tests/proof-smart-v8.test.mjs
          git commit -m 'Polish dedicated Proof HAR upload UX'
          git pull --rebase origin main
          git push origin HEAD:main
