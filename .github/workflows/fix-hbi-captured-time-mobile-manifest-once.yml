name: Fix HBI captured time and mobile manifest row once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-captured-time-mobile-manifest-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard latest verified checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=d5906094497b8429ee25c39d8f8c59df2f8f33bc
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }

      - name: Patch authoritative HBI replay and mobile manifest layout
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          worker = Path('worker/src/index.js')
          replace_once(
              worker,
              '    const value = key === "time" ? String(Date.now()) : credentials?.[key];',
              '    const value = credentials?.[key];',
              'HBI photo captured-time replay',
          )

          manifest = Path('worker/src/origin-manifest-v1.js')
          replace_once(
              manifest,
              '    fbid: credentialValue(credentials.fbid, 100),\n    time: String(Date.now()),\n    webSign: credentialValue(credentials.webSign || "hbi", 50),',
              '    fbid: credentialValue(credentials.fbid, 100),\n    time: credentialValue(credentials.time, 100),\n    webSign: credentialValue(credentials.webSign || "hbi", 50),',
              'LH Manifest photo fallback captured-time replay',
          )
          replace_once(
              manifest,
              '@media(max-width:700px){.origin-manifest-badge{font-size:12px;width:100%;justify-content:space-between}}',
              '@media(max-width:700px){.origin-manifest-badge{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-size:12px;width:100%;gap:8px;justify-content:stretch}.origin-manifest-badge span{display:flex;align-items:center;justify-content:center;min-width:0;gap:4px}}',
              'mobile manifest same-row layout',
          )

          staging = Path('.github/dev-tools/patch-dev-origin-manifest-session-v2.mjs')
          replace_once(
              staging,
              '  assert.equal((patchedOrigin.match(/time: String\\(Date\\.now\\(\\)\\),/g) || []).length, 3);',
              '  assert.equal((patchedOrigin.match(/time: String\\(Date\\.now\\(\\)\\),/g) || []).length, 2);\n  const photoFallbackStart = patchedOrigin.indexOf("export async function originManifestHbiCredentials");\n  const photoFallbackEnd = patchedOrigin.indexOf("export async function readManifestPage", photoFallbackStart);\n  const photoFallback = patchedOrigin.slice(photoFallbackStart, photoFallbackEnd);\n  assert.match(photoFallback, /time: credentialValue\\(credentials\\.time, 100\\)/);',
              'DEV staging fresh-time count/photo fallback contract',
          )

          tests = Path('worker/tests/hbi-truck-photos.test.mjs')
          replace_once(
              tests,
              '  assert.match(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\) : credentials\\?\\.\\[key\\]/);',
              '  assert.match(read, /const value = credentials\\?\\.\\[key\\];/);\n  assert.doesNotMatch(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\)/);',
              'HBI worker test captured-time assertion',
          )
          replace_once(
              tests,
              'test("LH Manifest HBI fallback refreshes HBI request time without extra polling", () => {\n  const manifest = fs.readFileSync(new URL("../src/origin-manifest-v1.js", import.meta.url), "utf8");\n  const start = manifest.indexOf("export async function originManifestHbiCredentials");\n  const end = manifest.indexOf("export async function readManifestPage", start);\n  const fallback = manifest.slice(start, end);\n  assert.match(fallback, /time: String\\(Date\\.now\\(\\)\\)/);\n});',
              'test("LH Manifest HBI photo fallback replays the captured HBI time without extra polling", () => {\n  const manifest = fs.readFileSync(new URL("../src/origin-manifest-v1.js", import.meta.url), "utf8");\n  const start = manifest.indexOf("export async function originManifestHbiCredentials");\n  const end = manifest.indexOf("export async function readManifestPage", start);\n  const fallback = manifest.slice(start, end);\n  assert.match(fallback, /time: credentialValue\\(credentials\\.time, 100\\)/);\n  assert.doesNotMatch(fallback, /Date\\.now/);\n});\n\ntest("mobile origin manifest keeps shipped parcels and weight on the same row", () => {\n  const manifest = fs.readFileSync(new URL("../src/origin-manifest-v1.js", import.meta.url), "utf8");\n  assert.match(manifest, /@media\\(max-width:700px\\)\\{\\.origin-manifest-badge\\{display:grid;grid-template-columns:minmax\\(0,1fr\\) minmax\\(0,1fr\\)/);\n  assert.match(manifest, /origin-manifest-badge span\\{display:flex;align-items:center;justify-content:center;min-width:0;gap:4px\\}/);\n});',
              'HBI fallback/mobile layout regression tests',
          )
          PY

          node --check worker/src/index.js
          node --check worker/src/origin-manifest-v1.js
          node --check .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs
          node .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs --self-test
          cd worker
          npm ci
          node --test tests/hbi-truck-photos.test.mjs
          npm run check
          cd ..
          git diff --check

      - name: Commit safe source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-captured-time-mobile-manifest-once.yml
          git add worker/src/index.js worker/src/origin-manifest-v1.js .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs worker/tests/hbi-truck-photos.test.mjs
          git diff --cached --check
          git commit -m "fix(ms): replay HBI photo time and align mobile manifest"
          git push origin HEAD:main
