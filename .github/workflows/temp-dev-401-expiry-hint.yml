name: TEMP DEV Live TBR HUB Selector Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe live TBR Intelligence selectors
        shell: bash
        run: |
          set -euo pipefail
          for hub in NE1 EA2; do
            url="https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev/shadow-tbr?hub=${hub}"
            html="$(curl -fsS -H 'Accept: text/html' --retry 2 --connect-timeout 10 "$url")"
            options="$(printf '%s' "$html" | grep -oE '<option[^>]*value="[^"]+"[^>]*>[^<]*</option>' || true)"
            echo "--- ${hub} ---"
            printf '%s\n' "$options"
            count="$(printf '%s\n' "$options" | grep -c '<option' || true)"
            echo "HUB_OPTION_COUNT_${hub}=$count"
            test "$count" -ge 2
            printf '%s\n' "$options" | grep -q '>NE1</option>'
            printf '%s\n' "$options" | grep -q '>EA2</option>'
            printf '%s\n' "$options" | grep -q "hub=${hub}\" selected>${hub}</option>"
          done
          echo 'TBR_HUB_SELECTOR_SYMMETRY=PASS'
          echo 'TURSO_READS_ADDED=0 TURSO_WRITES_ADDED=0 EXTRA_MS_POLLING=0'
