name: SUP-15 Branch Apply

on:
  push:
    branches:
      - codex/sup-15-redacted-system-context

permissions:
  contents: write

jobs:
  persist-validated:
    if: !startsWith(github.event.head_commit.message, 'SUP-15:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize temporary patcher embedded templates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/dev-tools/apply-sup15.mjs')
          s=p.read_text()
          replacements={
            '  return `WAITING_TRUCKS_SUPERVISOR_CONTEXT_V1\\\\n${redactSensitiveText(body)}`;':'  return "WAITING_TRUCKS_SUPERVISOR_CONTEXT_V1\\\\n" + redactSensitiveText(body);',
            '    assert.equal(contextModule.includes(forbidden), false, `context module must not contain ${forbidden}`);':'    assert.equal(contextModule.includes(forbidden), false, "context module must not contain " + forbidden);',
            '  state.className = `status-tag ${context ? "healthy" : "unknown"}`;':'  state.className = "status-tag " + (context ? "healthy" : "unknown");',
          }
          for old,new in replacements.items():
            if old not in s:
              raise SystemExit(f'missing patcher escape anchor: {old}')
            s=s.replace(old,new)
          p.write_text(s)
          print('SUP15_PATCHER_ESCAPING=PASS')
          PY
          node --check .github/dev-tools/apply-sup15.mjs
      - name: Recreate already-validated canonical SUP-15 diff
        run: node .github/dev-tools/apply-sup15.mjs
      - name: Restore temporary patcher
        run: git checkout -- .github/dev-tools/apply-sup15.mjs
      - name: Align already-validated historical JS cache harnesses
        run: |
          python - <<'PY'
          from pathlib import Path
          files = [
            'worker/tests/supervisor-core-shell.test.mjs',
            'worker/tests/supervisor-event-console.test.mjs',
            'worker/tests/supervisor-incident-action-center.test.mjs',
            'worker/tests/supervisor-quota-protection.test.mjs',
            'worker/tests/supervisor-shared-quota-center.test.mjs',
          ]
          for name in files:
            p = Path(name)
            lines = p.read_text().splitlines(keepends=True)
            changed = 0
            out = []
            for line in lines:
              js_cache_line = 'supervisor.js' in line or 'supervisor\\.js' in line
              if js_cache_line and '20260915-sup14' in line:
                line = line.replace('20260915-sup14', '20260915-sup15')
                changed += 1
              out.append(line)
            if changed == 0:
              raise SystemExit(f'{name}: no supervisor.js sup14 cache expectation found')
            p.write_text(''.join(out))
          print('SUP15_HISTORICAL_JS_CACHE_HARNESS=PASS')
          PY
      - name: Verify deterministic diff only
        run: |
          git diff --check
          node <<'NODE'
          const {execSync}=require('node:child_process');
          const files=execSync('git diff --name-only', {encoding:'utf8'}).trim().split(/\r?\n/).filter(Boolean);
          const allowed=new Set([
            'supervisor.html',
            'supervisor.js',
            'worker/package.json',
            'worker/tests/supervisor-guide-contract.test.mjs',
            'worker/tests/supervisor-language-contract.test.mjs',
            'worker/tests/supervisor-core-shell.test.mjs',
            'worker/tests/supervisor-event-console.test.mjs',
            'worker/tests/supervisor-incident-action-center.test.mjs',
            'worker/tests/supervisor-quota-protection.test.mjs',
            'worker/tests/supervisor-shared-quota-center.test.mjs',
            '.github/workflows/deploy-worker-dev.yml',
          ]);
          const bad=files.filter((file)=>!allowed.has(file));
          if(bad.length) throw new Error(`Unexpected SUP-15 files: ${bad.join(', ')}`);
          console.log(`SUP15_TRACKED_CHANGED_FILES=${files.length}`);
          console.log('SUP15_VALIDATED_OUTPUT_RECREATED=PASS');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
      - name: Persist canonical runtime and tests
        run: |
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git add supervisor.html supervisor.js supervisor-context.js worker/package.json worker/tests/supervisor-system-context.test.mjs worker/tests/supervisor-guide-contract.test.mjs worker/tests/supervisor-language-contract.test.mjs worker/tests/supervisor-core-shell.test.mjs worker/tests/supervisor-event-console.test.mjs worker/tests/supervisor-incident-action-center.test.mjs worker/tests/supervisor-quota-protection.test.mjs worker/tests/supervisor-shared-quota-center.test.mjs
          git commit -m "SUP-15: Redacted System Context copy contract"
          git push origin HEAD:codex/sup-15-redacted-system-context
