name: SUP-11 Branch Apply

# Branch-only verification helper; no deploy and no production access.
on:
  push:
    branches:
      - codex/sup-11-shared-quota-center
    paths:
      - .github/workflows/sup11-branch-apply.yml
      - .github/dev-tools/apply-sup11-shared-quota-center.mjs
      - worker/tests/supervisor-shared-quota-center.test.mjs

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sup-11-shared-quota-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply canonical SUP-11 changes
        run: node .github/dev-tools/apply-sup11-shared-quota-center.mjs
      - name: Syntax check Supervisor
        run: node --check supervisor.js
      - name: Full worker regression
        working-directory: worker
        run: |
          npm ci
          npm run check
      - name: Commit verified canonical changes to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supervisor.js supervisor.html worker/tests/supervisor-core-shell.test.mjs worker/package.json
          if git diff --cached --quiet; then
            echo "SUP11_CANONICAL_ALREADY_APPLIED=true"
            exit 0
          fi
          git commit -m "SUP-11: render shared Quota Center"
          git push origin HEAD:codex/sup-11-shared-quota-center
