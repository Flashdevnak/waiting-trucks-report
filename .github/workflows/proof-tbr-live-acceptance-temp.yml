name: Proof TBR Live Acceptance Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: read

jobs:
  diagnose-live-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read current TBR live health safely
        run: |
          node <<'NODE'
          const origin='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function read(path){
            const response=await fetch(origin+path,{headers:{accept:'application/json'},cache:'no-store'});
            const body=await response.json().catch(()=>({}));
            return {status:response.status,body};
          }
          for(let attempt=1;attempt<=3;attempt++){
            const shadow=await read('/api/shadow-tbr?hub=NE1');
            const connection=await read('/api/connection-error?hub=NE1');
            const s=shadow.body||{}, i=connection.body?.data||null;
            console.log(JSON.stringify({
              attempt,
              shadowHttp:shadow.status,
              observerStatus:s.observerStatus||'',
              sourceAvailable:s.sourceAvailable??null,
              lastAttemptAt:s.lastAttemptAt||'',
              lastObservedAt:s.lastObservedAt||'',
              lastSkip:s.lastSkip||'',
              feedCount:s.feedCount??null,
              rowCount:s.rowCount??null,
              routeFallback:Boolean(s.routeFallback),
              routeSourceCode:s.routeSourceError?.code||'',
              incidentSource:i?.source||'',
              incidentCode:i?.code||'',
              incidentRecoveredAt:i?.recoveredAt||'',
              tursoReads:s.tursoReads,
              tursoWrites:s.tursoWrites,
            }));
            if(s.observerStatus==='LIVE'&&s.sourceAvailable===true&&s.lastObservedAt) break;
            if(attempt<3) await sleep(15000);
          }
          console.log('READ_ONLY=YES');
          console.log('MS_MUTATION_TESTED=NO');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
