name: DEV Apply Unloading State Truth V2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-fix-unloading-state-v2.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify latest remote main
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          echo "BASE_HEAD=$(git rev-parse HEAD)"
          git status --short
          git log -5 --oneline

      - name: Apply runtime wiring
        run: |
          python3 <<'PY'
          from pathlib import Path
          patch = Path('.github/dev-tools/patch-ms-unloading-start-truth-v2.mjs')
          text = patch.read_text(encoding='utf-8')
          old = "    `    start = parseDate(row.scheduleUnloadingStartedAt),`,\n    `    start =\n      parseDate(row.scheduleUnloadingStartedAt) ||\n      parseDate(row.unloadingStartedAt) ||\n      parseDate(row.unloadingStartedObservedAt),`,"
          new = "    `  const start = parseDate(row.scheduleUnloadingStartedAt);`,\n    `  const start =\n    parseDate(row.scheduleUnloadingStartedAt) ||\n    parseDate(row.unloadingStartedAt) ||\n    parseDate(row.unloadingStartedObservedAt);`,"
          if old not in text: raise SystemExit('unloadTiming anchor patch source missing')
          patch.write_text(text.replace(old, new, 1), encoding='utf-8')
          stage = Path('.github/dev-tools/stage-dev-runtime.mjs')
          text = stage.read_text(encoding='utf-8')
          import_anchor = 'import { patchMsLiveResilienceFrontend } from "./patch-ms-live-resilience.mjs";\n'
          import_block = import_anchor + 'import {\n  patchMsUnloadingStartTruthFrontend,\n  patchMsUnloadingStartTruthWorker,\n} from "./patch-ms-unloading-start-truth-v2.mjs";\n'
          if 'patchMsUnloadingStartTruthFrontend' not in text:
              if import_anchor not in text: raise SystemExit('stage import anchor missing')
              text = text.replace(import_anchor, import_block, 1)
          front_anchor = '  output = patchMsLiveResilienceFrontend(output);\n'
          front_call = '  output = patchMsUnloadingStartTruthFrontend(output);\n'
          if front_call not in text:
              if front_anchor not in text: raise SystemExit('frontend staging anchor missing')
              text = text.replace(front_anchor, front_anchor + front_call, 1)
          worker_anchor = '  output = patchMsScheduleCompletionV4(output);\n'
          worker_call = '  output = patchMsUnloadingStartTruthWorker(output);\n'
          if worker_call not in text:
              if worker_anchor not in text: raise SystemExit('worker staging anchor missing')
              text = text.replace(worker_anchor, worker_anchor + worker_call, 1)
          stage.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git status --short

      - name: Focused regression
        run: |
          node --test .github/dev-tools/ms-unloading-start-truth-v2.test.mjs
          node --test .github/dev-tools/ms-summary-filter.test.mjs
          node --test .github/dev-tools/ms-unload-completion-ui.test.mjs
          node --test .github/dev-tools/ms-drop-lifecycle.test.mjs
          node --test .github/dev-tools/bus-time-hot-lane-v14.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          node --test .github/dev-tools/ms-quota-safe-live.test.mjs

      - name: Exact staged runtime syntax
        run: |
          rm -rf /tmp/unload-v2-assets /tmp/unload-v2-worker
          mkdir -p /tmp/unload-v2-assets /tmp/unload-v2-worker
          cp ms.js style.css ms.html proof.html ms-report.html admin.html admin.js admin.css ms-report.js proof.js ms-v4.css sw.js favicon.svg /tmp/unload-v2-assets/
          cp -R worker/src /tmp/unload-v2-worker/src
          node .github/dev-tools/stage-dev-runtime.mjs /tmp/unload-v2-assets/ms.js /tmp/unload-v2-worker/src/index.js
          node --check /tmp/unload-v2-assets/ms.js
          node --check /tmp/unload-v2-worker/src/index.js
          grep -q 'MS_UNLOADING_OPERATIONAL_TRUTH_V2' /tmp/unload-v2-assets/ms.js
          grep -q 'MS_UNLOADING_START_TRUTH_V2' /tmp/unload-v2-worker/src/index.js
          grep -q 'MS_SCHEDULE_UNLOAD_TIMING_PARSE_V2' /tmp/unload-v2-worker/src/index.js
          echo 'UNLOADING_STATE_TRUTH_V2_STAGED=PASS'

      - name: Commit and push runtime fix
        run: |
          git fetch origin main
          test "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)"
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git add .github/dev-tools/patch-ms-unloading-start-truth-v2.mjs .github/dev-tools/stage-dev-runtime.mjs
          git diff --cached --check
          git commit -m "fix(dev): restore unloading operational truth"
          git push origin HEAD:main
          echo "PUSHED_HEAD=$(git rev-parse HEAD)"
