name: Proof Smart V8 Checkpoint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-smart-v8-checkpoint.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch Proof Smart V8 only
        run: python3 .github/dev-tools/proof-smart-v8-patch.py
      - name: Syntax checks
        run: |
          node --check proof-v2-ui.js
          node --check proof-v2-actions.js
          node --check worker/src/proof-editor.js
          node --check worker/src/proof-plate-search-v5.js
          node --check worker/src/proof-ui-v5.js
      - name: Proof and auth regression tests
        run: |
          cd worker
          npm ci
          npm run check
          node --test tests/proof-smart-v8.test.mjs tests/auth-session-resilience.test.mjs
      - name: Scope and quota guard
        run: |
          python3 - <<'PY'
          import subprocess
          allowed={
            'proof-v2-ui.js','proof-v2-actions.js',
            'worker/src/proof-editor.js','worker/src/proof-plate-search-v5.js',
            'worker/src/proof-ui-v5.js','worker/tests/proof-smart-v8.test.mjs'
          }
          changed=[x for x in subprocess.check_output(['git','diff','--name-only'],text=True).splitlines() if x]
          bad=[x for x in changed if x not in allowed]
          if bad: raise SystemExit('Out-of-scope files: '+', '.join(bad))
          if not changed: raise SystemExit('No Proof changes produced')
          print('PROOF_SCOPE_ONLY=PASS')
          print('PROOF_POLL_INTERVAL=60S_UNCHANGED')
          print('BACKGROUND_SEARCH_REQUESTS_ADDED=0')
          print('PRODUCTION_TOUCHED=NO')
          PY
      - name: Commit Proof Smart V8
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add proof-v2-ui.js proof-v2-actions.js worker/src/proof-editor.js worker/src/proof-plate-search-v5.js worker/src/proof-ui-v5.js worker/tests/proof-smart-v8.test.mjs
          git commit -m 'Complete Proof Smart V8 search and HAR UX'
          git push origin HEAD:main
