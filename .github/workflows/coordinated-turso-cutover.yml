name: Coordinated Turso Cutover

on:
  push:
    branches: [main]
    paths:
      - .github/cutover-execute-trigger.txt

permissions:
  contents: write

jobs:
  cutover:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      CUTOVER_VERSION: 20260903-01
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      PROMOTED_API: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Reconfirm Turso-only DEV and exact cutover preparation
        run: |
          node .github/cutover-tools/prepare-cutover.mjs "$GITHUB_WORKSPACE"
          node --check ms.js
          node --check cloudflare-browser-test/src/index.js
          git diff --check
          node <<'NODE'
          const fs=require('node:fs');
          const wrangler=fs.readFileSync('worker/wrangler.dev.jsonc','utf8');
          const ms=fs.readFileSync('ms.js','utf8');
          const browser=fs.readFileSync('cloudflare-browser-test/src/index.js','utf8');
          const expected=process.env.PROMOTED_API;
          if(!wrangler.includes('"main": "src/turso-index.js"') || !wrangler.includes('"DB_BACKEND": "turso"') || wrangler.includes('d1_databases'))
            throw new Error('Turso/no-D1 invariant failed before cutover');
          if(!ms.includes(expected) || !browser.includes(`${expected}/api`))
            throw new Error('Cutover targets are not the promoted Turso Worker');
          if(!ms.includes('const preserveObservedCompletion ='))
            throw new Error('Latest completed-view stability patch is missing');
          const changed=String(require('child_process').execSync('git diff --name-only')).trim().split(/\r?\n/).filter(Boolean).sort();
          const wanted=['cloudflare-browser-test/src/index.js','ms.js','style.css','sw.js','version.json'].sort();
          if(JSON.stringify(changed)!==JSON.stringify(wanted))
            throw new Error(`Unexpected cutover files: ${changed.join(',')}`);
          console.log('CUTOVER_PREPARE=PASS');
          console.log('CUTOVER_DATABASE_BACKEND=TURSO');
          console.log('CUTOVER_D1_BINDING=0');
          NODE
          cp cloudflare-browser-test/src/index.js /tmp/browser-cutover.js
          git show HEAD:cloudflare-browser-test/src/index.js > /tmp/browser-old.js

      - name: Install Worker and Browser tooling
        run: |
          (cd worker && npm ci)
          (cd cloudflare-browser-test && npm install --no-audit --no-fund)
          (cd cloudflare-browser-test && npm run check)

      - name: Generate one-time connector bootstrap secret
        run: |
          umask 077
          openssl rand -hex 32 > /tmp/connector-bootstrap-secret
          test "$(wc -c < /tmp/connector-bootstrap-secret)" -ge 64
          echo "CONNECTOR_BOOTSTRAP_SECRET=GENERATED"

      - name: Enable one-time connector adoption on promoted backend
        working-directory: worker
        run: |
          cat /tmp/connector-bootstrap-secret | npx wrangler secret put CONNECTOR_BOOTSTRAP_SECRET --config wrangler.dev.jsonc
          echo "BACKEND_CONNECTOR_BOOTSTRAP=ENABLED"

      - name: Enable same one-time bootstrap secret on Browser Worker
        working-directory: cloudflare-browser-test
        run: |
          cat /tmp/connector-bootstrap-secret | npx wrangler secret put CONNECTOR_BOOTSTRAP_SECRET --config wrangler.jsonc
          echo "BROWSER_CONNECTOR_BOOTSTRAP=ENABLED"

      - name: Deploy Browser Cron to promoted Turso backend first
        working-directory: cloudflare-browser-test
        run: |
          cp /tmp/browser-cutover.js src/index.js
          npx wrangler deploy --config wrangler.jsonc
          echo "BROWSER_TURSO_TARGET_DEPLOYED=PASS"

      - name: Verify Browser connector adoption in Turso before frontend cutover
        id: connector
        continue-on-error: true
        run: |
          node <<'NODE'
          const org=process.env.TURSO_ORG;
          const db=process.env.TURSO_DATABASE;
          const platformToken=process.env.TURSO_PLATFORM_API_TOKEN;
          if(!platformToken) throw new Error('TURSO_PLATFORM_API_TOKEN missing');
          const headers={Authorization:`Bearer ${platformToken}`};
          const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers});
          const dbJson=await dbRes.json();
          if(!dbRes.ok) throw new Error(`Turso database lookup HTTP ${dbRes.status}: ${JSON.stringify(dbJson)}`);
          const database=dbJson.database||dbJson;
          const hostname=database.Hostname||database.hostname;
          if(!hostname) throw new Error('Turso hostname missing');
          const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,{method:'POST',headers});
          const tokenJson=await tokenRes.json();
          const dbToken=tokenJson.jwt;
          if(!tokenRes.ok||!dbToken) throw new Error(`Turso auth token failed HTTP ${tokenRes.status}`);
          console.log(`::add-mask::${dbToken}`);
          async function query(sql,args=[]){
            const response=await fetch(`https://${hostname}/v2/pipeline`,{
              method:'POST',
              headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},
              body:JSON.stringify({requests:[{type:'execute',stmt:{sql,args}},{type:'close'}]})
            });
            const payload=await response.json();
            const item=payload?.results?.[0];
            if(!response.ok||item?.type==='error') throw new Error(`Turso query failed: ${JSON.stringify(item?.error||payload)}`);
            return item?.response?.result;
          }
          const started=Date.now();
          let last=null;
          for(let attempt=1;attempt<=8;attempt++){
            const result=await query("SELECT hub,active,last_used_at FROM ms_connector_tokens WHERE hub='NE1' LIMIT 1");
            const row=result?.rows?.[0]||[];
            const decode=v=>v==null?null:(typeof v==='object'&&v.type?v.value:v);
            last={hub:decode(row[0]),active:Number(decode(row[1])||0),lastUsed:String(decode(row[2])||'')};
            console.log(`CONNECTOR_ATTEMPT=${attempt} HUB=${last.hub||'-'} ACTIVE=${last.active} LAST_USED=${last.lastUsed||'-'}`);
            if(last.hub==='NE1'&&last.active===1&&last.lastUsed){
              console.log('TURSO_CONNECTOR_ADOPTION=PASS');
              break;
            }
            if(attempt<8) await new Promise(r=>setTimeout(r,20000));
          }
          if(!last||last.hub!=='NE1'||last.active!==1||!last.lastUsed)
            throw new Error(`Connector adoption not observed after ${Math.round((Date.now()-started)/1000)}s`);
          const live=await query("SELECT synced_at FROM ms_live_cache WHERE hub='NE1' LIMIT 1");
          const decode=v=>v==null?null:(typeof v==='object'&&v.type?v.value:v);
          const synced=String(decode(live?.rows?.[0]?.[0])||'');
          if(!synced) throw new Error('Turso live cache missing after connector adoption');
          console.log(`TURSO_LIVE_CACHE_SYNCED_AT=${synced}`);
          NODE

      - name: Roll Browser back to OLD API if connector adoption failed
        if: steps.connector.outcome == 'failure'
        working-directory: cloudflare-browser-test
        run: |
          cp /tmp/browser-old.js src/index.js
          npx wrangler deploy --config wrangler.jsonc
          echo "BROWSER_ROLLBACK_TO_OLD=PASS"
          exit 1

      - name: Commit coordinated GitHub Pages and Browser source cutover
        run: |
          cp /tmp/browser-cutover.js cloudflare-browser-test/src/index.js
          git config user.name "Flashdevnak Cutover Bot"
          git config user.email "26nak.testdev@gmail.com"
          git add ms.js style.css sw.js version.json cloudflare-browser-test/src/index.js
          git diff --cached --check
          git commit -m "Cut over MS frontend and Browser Cron to Turso backend"
          git push origin HEAD:main
          echo "GITHUB_PAGES_CUTOVER_COMMIT=$(git rev-parse HEAD)"

      - name: Verify GitHub Pages publishes Turso target
        run: |
          node <<'NODE'
          const expected=process.env.PROMOTED_API;
          const version=process.env.CUTOVER_VERSION;
          let ok=false;
          for(let attempt=1;attempt<=18;attempt++){
            const stamp=Date.now();
            const [msRes,verRes]=await Promise.all([
              fetch(`https://flashdevnak.github.io/waiting-trucks-report/ms.js?v=${stamp}`,{cache:'no-store'}),
              fetch(`https://flashdevnak.github.io/waiting-trucks-report/version.json?v=${stamp}`,{cache:'no-store'})
            ]);
            const ms=await msRes.text();
            const ver=await verRes.json().catch(()=>({}));
            console.log(`PAGES_ATTEMPT=${attempt} MS_HTTP=${msRes.status} VERSION_HTTP=${verRes.status} VERSION=${ver.version||'-'}`);
            if(msRes.ok&&verRes.ok&&ms.includes(expected)&&ver.version===version){ok=true;break;}
            if(attempt<18) await new Promise(r=>setTimeout(r,10000));
          }
          if(!ok) throw new Error('GitHub Pages did not publish Turso cutover in time');
          console.log('GITHUB_PAGES_TURSO_TARGET=PASS');
          NODE

      - name: Verify promoted backend health after public cutover
        run: |
          curl --fail --show-error --silent "$PROMOTED_API/api?action=health" | tee /tmp/cutover-health.json
          node <<'NODE'
          const fs=require('node:fs');
          const payload=JSON.parse(fs.readFileSync('/tmp/cutover-health.json','utf8'));
          if(!payload?.ok) throw new Error('Promoted backend health failed');
          console.log('POST_CUTOVER_BACKEND_HEALTH=PASS');
          NODE

      - name: Disable one-time connector bootstrap on backend
        working-directory: worker
        run: |
          printf 'y\n' | npx wrangler secret delete CONNECTOR_BOOTSTRAP_SECRET --config wrangler.dev.jsonc || true
          echo "BACKEND_CONNECTOR_BOOTSTRAP=DISABLED_OR_ALREADY_GONE"

      - name: Disable one-time connector bootstrap on Browser Worker
        working-directory: cloudflare-browser-test
        run: |
          printf 'y\n' | npx wrangler secret delete CONNECTOR_BOOTSTRAP_SECRET --config wrangler.jsonc || true
          echo "BROWSER_CONNECTOR_BOOTSTRAP=DISABLED_OR_ALREADY_GONE"

      - name: Final cutover summary
        run: |
          echo "CUTOVER=YES"
          echo "PUBLIC_FRONTEND=https://flashdevnak.github.io/waiting-trucks-report/ms.html"
          echo "DATABASE_BACKEND=TURSO"
          echo "D1_RUNTIME=DISABLED"
          echo "BROWSER_CRON_TARGET=$PROMOTED_API/api"
          echo "PRODUCTION_TOUCHED=YES"
