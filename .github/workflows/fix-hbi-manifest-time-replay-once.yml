name: Fix HBI manifest time replay once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-manifest-time-replay-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard expected checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=e54ac8d5c059064ceccee1a5fc9db37c46a59ee6
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }

      - name: Preserve captured HBI time in manifest fallback
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('worker/src/origin-manifest-v1.js')
          text = manifest.read_text(encoding='utf-8')
          start = text.index('export async function originManifestHbiCredentials')
          end = text.index('export async function readManifestPage', start)
          block = text[start:end]
          old = 'time: String(Date.now()),'
          new = 'time: credentialValue(credentials.time, 100),'
          if block.count(old) != 1:
              raise SystemExit(f'manifest fallback time anchor expected 1, got {block.count(old)}')
          block = block.replace(old, new, 1)
          text = text[:start] + block + text[end:]
          manifest.write_text(text, encoding='utf-8')

          test_file = Path('worker/tests/hbi-truck-photos.test.mjs')
          tests = test_file.read_text(encoding='utf-8')
          marker = 'test("HBI schema is migration-owned and never created from request runtime", () => {'
          if tests.count(marker) != 1:
              raise SystemExit(f'test marker expected 1, got {tests.count(marker)}')
          addition = '''test("LH Manifest HBI fallback preserves the captured auth time", () => {\n  const manifest = fs.readFileSync(new URL("../src/origin-manifest-v1.js", import.meta.url), "utf8");\n  const start = manifest.indexOf("export async function originManifestHbiCredentials");\n  const end = manifest.indexOf("export async function readManifestPage", start);\n  const fallback = manifest.slice(start, end);\n  assert.match(fallback, /time: credentialValue\\(credentials\\.time, 100\\)/);\n  assert.doesNotMatch(fallback, /time: String\\(Date\\.now\\(\\)\\)/);\n});\n\n'''
          tests = tests.replace(marker, addition + marker, 1)
          test_file.write_text(tests, encoding='utf-8')

          trigger = Path('.github/dev-tools/source-integration-trigger-20260910.txt')
          trigger_text = trigger.read_text(encoding='utf-8')
          line = 'HBI_PHOTO_AUTH_REPLAY=CAPTURED_TIME_HEADERS_V3\n'
          if 'HBI_PHOTO_AUTH_REPLAY=' in trigger_text:
              import re
              trigger_text = re.sub(r'^HBI_PHOTO_AUTH_REPLAY=.*$', line.rstrip(), trigger_text, flags=re.M)
              if not trigger_text.endswith('\n'):
                  trigger_text += '\n'
          else:
              trigger_text += line
          trigger.write_text(trigger_text, encoding='utf-8')
          PY

          node --check worker/src/index.js
          node --check worker/src/origin-manifest-v1.js
          cd worker
          npm ci
          node --test tests/hbi-truck-photos.test.mjs
          npm run check
          cd ..
          git diff --check

      - name: Commit source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-manifest-time-replay-once.yml
          git add worker/src/origin-manifest-v1.js worker/tests/hbi-truck-photos.test.mjs .github/dev-tools/source-integration-trigger-20260910.txt
          git diff --cached --check
          git commit -m "fix(ms): preserve captured HBI auth time"
          git push origin HEAD:main
