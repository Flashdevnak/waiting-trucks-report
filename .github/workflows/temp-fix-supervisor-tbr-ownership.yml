name: TEMP DEV Supervisor TBR Compatibility Fix

# one-shot trigger commit v2
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-supervisor-tbr-ownership.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove duplicate runMsRefresh errorCode ownership
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('.github/dev-tools/patch-ms-self-healing-supervisor.mjs')
          text = path.read_text()
          marker = '"preserve refresh error code",'
          if text.count(marker) != 1:
              raise SystemExit(f'expected one compatibility marker, found {text.count(marker)}')
          marker_at = text.index(marker)
          start = text.rfind('  output = replaceOnce(\n', 0, marker_at)
          end = text.index('  );\n', marker_at) + len('  );\n')
          if start < 0 or end <= start:
              raise SystemExit('compatibility block boundary not found')
          if text[end:end+1] == '\n':
              end += 1
          path.write_text(text[:start] + text[end:])
          PY
          node --check .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          git diff --check
          grep -q 'MS_REPAIR_POLICY_VERSION = 2' .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          ! grep -q 'preserve refresh error code' .github/dev-tools/patch-ms-self-healing-supervisor.mjs
      - name: Commit compatibility fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          git commit -m "fix(dev): keep TBR error-code ownership"
          git push origin HEAD:main
