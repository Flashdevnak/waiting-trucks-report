name: Proof TBR Live Acceptance Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-tbr-live-acceptance-temp.yml

permissions:
  contents: read
  actions: write

jobs:
  dispatch-v9-deployments:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch DEV Worker deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Dispatch Browser Worker deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-browser-worker.yml --repo "$GITHUB_REPOSITORY" --ref main
      - name: Safety checkpoint
        run: |
          echo 'TBR_V9_DEPLOY_DISPATCH=PASS'
          echo 'MS_MUTATION_TESTED=NO'
          echo 'PRODUCTION_TOUCHED=NO'
