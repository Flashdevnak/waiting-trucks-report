name: TEMP DEV Split 401 403 Auth Truth

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-supervisor-tbr-ownership.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Split Route 401 from 403 safely
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          p = Path('cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs')
          s = p.read_text()
          marker = '  if ([401, 403].includes(Number(httpStatus)))'
          if s.count(marker) != 1:
              raise SystemExit(f'HTTP classifier marker count={s.count(marker)}')
          start = s.index(marker)
          tail = '  return { code: \\"MS_ROUTE_SOURCE_ERROR\\", status: 502 };'
          end = s.index(tail, start)
          segment = s[start:end]
          if segment.count('MS_SESSION_EXPIRED') != 1:
              raise SystemExit('HTTP classifier segment mismatch')
          bs = chr(92)
          new = (
              '  if (Number(httpStatus) === 401)' + bs + '\n'
              '    return { code: ' + bs + '"MS_SESSION_HTTP_401' + bs + '", status: 502 };' + bs + '\n'
              '  if (Number(httpStatus) === 403)' + bs + '\n'
              '    return { code: ' + bs + '"MS_ROUTE_FORBIDDEN' + bs + '", status: 502 };' + bs + '\n'
          )
          p.write_text(s[:start] + new + s[end:])

          p = Path('.github/dev-tools/patch-ms-self-healing-supervisor.mjs')
          s = p.read_text()
          if s.count('const MS_REPAIR_POLICY_VERSION = 4;') != 1:
              raise SystemExit('policy anchor mismatch')
          s = s.replace('const MS_REPAIR_POLICY_VERSION = 4;', 'const MS_REPAIR_POLICY_VERSION = 5;', 1)
          marker = 'const authSignal = resultCode === '
          start = s.index(marker)
          end = s.index(';', start) + 1
          line = s[start:end]
          if line.count('MS_SESSION_EXPIRED') != 1:
              raise SystemExit('auth signal line mismatch')
          line = line.replace('MS_SESSION_EXPIRED', 'MS_SESSION_HTTP_401', 1)
          p.write_text(s[:start] + line + s[end:])

          p = Path('.github/dev-tools/ms-self-healing-supervisor.test.mjs')
          s = p.read_text()
          if s.count('MS_REPAIR_POLICY_VERSION = 4') != 1:
              raise SystemExit('policy test mismatch')
          s = s.replace('MS_REPAIR_POLICY_VERSION = 4', 'MS_REPAIR_POLICY_VERSION = 5', 1)
          if s.count('MS_SESSION_EXPIRED') != 1:
              raise SystemExit(f'auth test code count={s.count("MS_SESSION_EXPIRED")}')
          s = s.replace('MS_SESSION_EXPIRED', 'MS_SESSION_HTTP_401', 1)
          p.write_text(s)
          PY
          node --check cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          node --check .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          node --test .github/dev-tools/ms-self-healing-supervisor.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          grep -F 'MS_SESSION_HTTP_401' cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          grep -F 'MS_ROUTE_FORBIDDEN' cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          git diff --check
      - name: Commit tested truth-safe classifier
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs .github/dev-tools/patch-ms-self-healing-supervisor.mjs .github/dev-tools/ms-self-healing-supervisor.test.mjs
          git commit -m 'fix(dev): distinguish MS 401 from forbidden 403'
          git push origin HEAD:main
