name: Proof V16 Responsive DEV

# Permanent read-only DEV visual gate. No login, no DB writes, no MS mutation.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/proof-v16-responsive-dev.yml
      - .github/dev-tools/proof-v16-live-responsive-smoke.mjs
      - .github/dev-tools/proof-service-date-live-smoke.mjs
      - proof.html
      - 'proof-v2-*.js'
      - worker/src/proof-service-date-dev.js
      - worker/src/proof-ui-v15.js
      - worker/src/proof-ui-v16.js
      - worker/src/turso-index.js
      - worker/tests/proof-quick-day-v16.test.mjs
      - worker/tests/proof-service-date-dev.test.mjs
      - .github/dev-tools/ms-proof-ui-v16.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify smoke source syntax
        run: |
          node --check .github/dev-tools/proof-v16-live-responsive-smoke.mjs
          node --check .github/dev-tools/proof-service-date-live-smoke.mjs
      - name: Verify exact live Proof service-date response
        env:
          PROOF_DEV_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
        run: |
          node <<'NODE'
          const origin=process.env.PROOF_DEV_ORIGIN;
          const date='2026-09-06';
          const url=`${origin}/proof.html?date=${date}&responseGate=${Date.now()}`;
          const response=await fetch(url,{redirect:'manual',cache:'no-store',headers:{'cache-control':'no-cache'}});
          const text=await response.text();
          const location=response.headers.get('location')||'';
          const marker=text.includes('DEV_PROOF_SERVICE_DATE_HTML_V1');
          const cleanup=text.includes("if(location.search)history.replaceState(null,'',location.pathname+location.hash);");
          console.log(`PROOF_DATE_RESPONSE_STATUS=${response.status}`);
          console.log(`PROOF_DATE_RESPONSE_LOCATION=${location||'NONE'}`);
          console.log(`PROOF_DATE_HTML_MARKER=${marker?'PASS':'MISSING'}`);
          console.log(`PROOF_DATE_QUERY_CLEANUP=${cleanup?'PRESENT':'ABSENT'}`);
          if(response.status!==200) throw new Error(`Proof date response must be 200, got ${response.status} location=${location}`);
          if(location) throw new Error(`Proof date response unexpectedly redirects to ${location}`);
          if(!marker) throw new Error('Proof date HTML marker missing from live response');
          if(cleanup) throw new Error('Proof date HTML still contains query cleanup');
          NODE
      - name: Verify live V16 dropdown patch
        env:
          PROOF_DEV_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
          PROOF_V16_ASSET: proof-v16.js?v=20260907-06
        run: |
          node <<'NODE'
          const origin=process.env.PROOF_DEV_ORIGIN;
          const asset=process.env.PROOF_V16_ASSET;
          const url=`${origin}/${asset}&shellCheck=${Date.now()}`;
          const response=await fetch(url,{cache:'no-store',headers:{'cache-control':'no-cache'}});
          const text=await response.text();
          if(!response.ok) throw new Error(`Proof V16 asset HTTP ${response.status}`);
          if(!text.includes('__PROOF_V16_DROPDOWN_SWITCH_FIX__')) throw new Error('live Proof V16 dropdown switch patch missing');
          if(text.includes('proof-v17')||text.includes('PROOF_V17')) throw new Error('V17 marker returned by live Proof V16 asset');
          console.log('PROOF_V16_DROPDOWN_ASSET=PASS');
          console.log('PROOF_V17_LIVE_MARKER=0');
          NODE
      - name: Smoke live DEV Proof at desktop tablet mobile
        env:
          PROOF_DEV_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
          PROOF_V16_ASSET: proof-v16.js?v=20260907-06
        run: node .github/dev-tools/proof-v16-live-responsive-smoke.mjs
      - name: Verify live DEV Proof service-date contract
        env:
          PROOF_DEV_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
        run: node .github/dev-tools/proof-service-date-live-smoke.mjs
