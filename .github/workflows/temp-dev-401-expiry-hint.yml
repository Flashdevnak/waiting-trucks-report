name: TEMP DEV Intelligence Gate Compat

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add compatibility marker
        run: python3 .github/dev-tools/patch-intelligence-v3-compat.py
      - name: Validate Browser gate
        run: |
          cd cloudflare-browser-test
          npm install --no-audit --no-fund
          npm run check
          node --test scripts/connection-error-intelligence.test.mjs
          grep -F 'INTELLIGENCE_HUB_FILTER_V3' src/connection-error.js
          grep -F 'INTELLIGENCE_HUB_FILTER_V4' src/connection-error.js
          git diff --check
      - name: Commit tested compatibility marker
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cloudflare-browser-test/src/connection-error.js
          git commit -m 'fix(dev): preserve intelligence V3 deploy gate marker'
          git push origin HEAD:main

# trigger: compatibility gate only
