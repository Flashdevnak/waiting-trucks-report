name: Trigger DEV Header V4 Temp
# trigger: run-v4c-runner

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-dev-header-v4-temp.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch minimal DEV Header V4 runner
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run dev-header-ui-v4c-runner-temp.yml --repo "$GITHUB_REPOSITORY" --ref main
