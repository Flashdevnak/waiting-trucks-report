name: DEV First Source Diagnostics

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/dev-first-source-diagnostics.yml

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Capture local-only fully staged refresh diagnostics
        shell: bash
        run: |
          set +e
          rm -rf /tmp/first-source-stage
          mkdir -p /tmp/first-source-stage/frontend /tmp/first-source-stage/worker/src
          cp ms.js style.css /tmp/first-source-stage/frontend/
          cp worker/src/index.js /tmp/first-source-stage/worker/src/index.js
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "=== queue-regression ==="
            node --test .github/tests/ms-queue-first-source-v1.test.mjs
            echo "QUEUE_EXIT=$?"
            echo "=== full-stage ==="
            node .github/dev-tools/stage-dev-runtime.mjs /tmp/first-source-stage/frontend/ms.js /tmp/first-source-stage/worker/src/index.js
            echo "FULL_STAGE_EXIT=$?"
            echo "=== staged-runMsRefresh ==="
            node --input-type=module <<'NODE'
          import { readFile } from 'node:fs/promises';
          const worker = await readFile('/tmp/first-source-stage/worker/src/index.js','utf8');
          const start = worker.indexOf('async function runMsRefresh(env, branch) {');
          const end = worker.indexOf('\nasync function readMsLiveCache(', start);
          if (start < 0 || end <= start) {
            console.log('RUN_MS_REFRESH_SECTION=NOT_FOUND');
            process.exit(0);
          }
          console.log(worker.slice(start, end));
          console.log('HAS_HOT_LANE=', worker.includes('BUS_TIME_HOT_LANE_V14'));
          console.log('HAS_FIRST_SOURCE=', worker.includes('MS_QUEUE_FIRST_SOURCE_V1'));
          NODE
          } 2>&1 | tee first-source-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: first-source-diagnostics
          path: first-source-diagnostics.txt
          if-no-files-found: error
