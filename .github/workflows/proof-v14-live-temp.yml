name: Proof V14 Live Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v14-live-temp.yml

permissions:
  contents: read

jobs:
  browser-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install Chromium
        run: |
          mkdir -p /tmp/proof-v14 && cd /tmp/proof-v14
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify desktop and mobile Proof V14
        run: |
          cd /tmp/proof-v14
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
            const browser=await chromium.launch({headless:true});
            const errors=[];
            try{
              // Desktop
              const page=await browser.newPage({viewport:{width:1680,height:950}});
              page.on('pageerror',e=>errors.push(String(e)));
              const requests=[]; page.on('request',r=>requests.push(r.url()));
              const res=await page.goto(base+'/proof.html?v14='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              if(!res?.ok()) throw new Error('proof.html '+res?.status());
              await page.waitForFunction(()=>window.__PROOF_V14_READY__===true,{timeout:20000});
              await page.waitForTimeout(400);
              if(errors.length) throw new Error('desktop pageerror '+errors.join('|'));
              const bg=requests.filter(u=>/\/api\/proof\/(editor|plate-options|history)(?:\?|$)/.test(u));
              if(bg.length) throw new Error('background detail/plate/history request '+bg.join(','));
              await page.evaluate(()=>{
                const P=window.ProofV2;
                P.state.profile={canPrint:true,canCreateProof:true,canCancelCar:false};
                const rows=[
                  {lineId:'L1',departureDate:'2026-09-07',lineName:'FD-6W7.2-NE1-2JHO-07:00-BD-1-RS1',lineType:1,lineTypeText:'Feeder',lineMode:1,lineModeText:'ปกติ',plateNumber:'70-6484(มหาสารคาม)',plateTypeText:'6W7.2',driver:'ประจักร์ คดจันทึก',driverPhone:'0828722550',proofId:'NAK1TD3U54',proofState:7,proofStateText:'ถึงสาขาต้นทางแล้ว',startTime:420,plannedDepartureTime:420,standbyTime:300,detailReady:true,destinationCode:'2JHO',destinationName:'2JHO_BDC-จอหอ',_proofDetailV14:{fleetName:'AMR (AMARA)',fleetId:'37',originName:'02 NE1_HUB-นครราชสีมา',track:'NE1-2JHO',driver:'ประจักร์ คดจันทึก',driverPhone:'0828722550',plateNumber:'70-6484(มหาสารคาม)',plateTypeText:'6W7.2',proofId:'NAK1TD3U54'}},
                  {lineId:'L2',departureDate:'2026-09-07',lineName:'FD-4WJ-NE1-2TES-07:00-BD-1-RO',lineType:1,lineTypeText:'Feeder',lineMode:1,lineModeText:'ปกติ',plateNumber:'3ฒผ766(กรุงเทพ)',plateTypeText:'4WJ',driver:'นิ่ม เติมสูงเนิน',driverPhone:'0886345679',proofId:'',proofState:1,proofStateText:'รอเปิดบาร์โค้ด',startTime:420,plannedDepartureTime:420,standbyTime:300,detailReady:true,destinationCode:'2TES',destinationName:'2TES_BDC-เทพสถิต'}
                ];
                P.state.rows=rows;
                let host=document.getElementById('proof-v14-test-host');
                if(!host){host=document.createElement('div');host.id='proof-v14-test-host';document.body.appendChild(host);}
                host.innerHTML=P.groupedHtml(rows);
              });
              const layout=await page.evaluate(()=>{
                const host=document.getElementById('proof-v14-test-host');
                const branch=host.querySelector('.proof-v14-branch');
                const row=host.querySelector('.proof-v14-row');
                const pair=host.querySelector('.proof-v14-action-pair');
                const buttons=[...pair.querySelectorAll('.btn')].map(el=>el.getBoundingClientRect());
                return {
                  hostW:host.getBoundingClientRect().width,
                  branchW:branch.getBoundingClientRect().width,
                  rowW:row.getBoundingClientRect().width,
                  scrollW:branch.scrollWidth,
                  clientW:branch.clientWidth,
                  btnW:buttons.map(x=>Math.round(x.width)), btnH:buttons.map(x=>Math.round(x.height)),
                  cancelDisabled:pair.querySelector('.btn-danger-soft')?.disabled,
                  detailsText:host.textContent.includes('รายละเอียด')
                };
              });
              if(layout.scrollW>layout.clientW+2||layout.rowW>layout.branchW+2) throw new Error('desktop grid overflow '+JSON.stringify(layout));
              if(layout.btnW.length!==2||layout.btnW[0]!==layout.btnW[1]||layout.btnH[0]!==layout.btnH[1]) throw new Error('action buttons unequal '+JSON.stringify(layout));
              if(!layout.cancelDisabled) throw new Error('cancel must stay disabled');
              if(layout.detailsText) throw new Error('visible Details button/copy remains');

              // Modal with synthetic data, no mutation.
              await page.evaluate(()=>{
                const P=window.ProofV2, row=P.state.rows[0];
                P.openEditor(row,{lineId:row.lineId,departureDate:row.departureDate,lineName:row.lineName,proofState:7,proofStateText:'ถึงสาขาต้นทางแล้ว',proofId:'NAK1TD3U54',fleetId:'37',fleetName:'AMR (AMARA)',originName:'02 NE1_HUB-นครราชสีมา',track:'NE1-2JHO',driver:'ประจักร์ คดจันทึก',driverPhone:'0828722550',plateId:'284471',plateNumber:'70-6484(มหาสารคาม)',plateType:203,plateTypeText:'6W7.2',fmsDriverId:'3836',policy:{plateEditable:true,driverEditable:false,driverReason:'MS ล็อก'}});
              });
              await page.waitForSelector('#proof-editor-dialog[open]');
              const modal=await page.evaluate(()=>{
                const d=document.getElementById('proof-editor-dialog'), card=d.querySelector('.proof-editor-card'), r=d.getBoundingClientRect();
                const selected=[...d.querySelectorAll('.proof-selected-value>span,.proof-option>span')].filter(el=>getComputedStyle(el).display!=='none');
                return {w:Math.round(r.width),right:Math.round(r.right),viewport:innerWidth,cardScrollW:card.scrollWidth,cardClientW:card.clientWidth,title:d.querySelector('h2')?.textContent||'',emojiVisible:selected.length,warning:!!d.querySelector('.proof-editor-warning')};
              });
              if(modal.right>modal.viewport+1||modal.cardScrollW>modal.cardClientW+2) throw new Error('modal horizontal overflow '+JSON.stringify(modal));
              if(modal.title!=='ตรวจข้อมูลก่อนปริ้นบาร์รถ'||modal.emojiVisible||modal.warning) throw new Error('modal cleanup failed '+JSON.stringify(modal));
              await page.evaluate(()=>window.ProofV2.closeEditor());

              // Mobile
              const mobile=await browser.newPage({viewport:{width:390,height:844}});
              const mobileErrors=[]; mobile.on('pageerror',e=>mobileErrors.push(String(e)));
              const mres=await mobile.goto(base+'/proof.html?mobileV14='+Date.now(),{waitUntil:'domcontentloaded',timeout:30000});
              if(!mres?.ok()) throw new Error('mobile proof '+mres?.status());
              await mobile.waitForFunction(()=>window.__PROOF_V14_READY__===true,{timeout:20000});
              await mobile.evaluate(()=>{const spacer=document.createElement('div');spacer.style.height='1800px';document.body.appendChild(spacer);});
              const menu=mobile.locator('.topbar-actions details').first();
              if(await menu.count()) {
                await menu.locator('summary').click();
                await mobile.waitForTimeout(100);
              }
              const mobileLayout=await mobile.evaluate(()=>{
                const header=document.querySelector('.site-header');
                const top=document.querySelector('.topbar-actions');
                const open=document.querySelector('.topbar-actions details[open]');
                const panel=open?.querySelector('.app-nav-menu,.header-menu-panel');
                const bodyW=document.documentElement.scrollWidth;
                const before=scrollY; scrollTo(0,700); const after=scrollY;
                return {headerPos:getComputedStyle(header).position,topRight:top?.getBoundingClientRect().right||0,viewport:innerWidth,bodyW,before,after,panelPos:panel?getComputedStyle(panel).position:'none',panelW:panel?.getBoundingClientRect().width||0};
              });
              if(mobileLayout.headerPos==='fixed'||mobileLayout.headerPos==='sticky') throw new Error('mobile header still locked '+JSON.stringify(mobileLayout));
              if(mobileLayout.bodyW>390+2||mobileLayout.topRight>390+2) throw new Error('mobile horizontal overflow '+JSON.stringify(mobileLayout));
              if(mobileLayout.after<=mobileLayout.before) throw new Error('mobile scroll locked '+JSON.stringify(mobileLayout));
              if(mobileLayout.panelPos!=='none'&&mobileLayout.panelPos!=='static') throw new Error('mobile menu overlays content '+JSON.stringify(mobileLayout));
              if(mobileLayout.panelW>390+2) throw new Error('mobile menu too wide '+JSON.stringify(mobileLayout));
              if(mobileErrors.length) throw new Error('mobile pageerror '+mobileErrors.join('|'));

              console.log('PROOF_V14_BROWSER=PASS');
              console.log('DESKTOP_GRID_NO_OVERFLOW=PASS');
              console.log('ACTION_PAIR_EQUAL=PASS');
              console.log('CANCELLATION_ENABLED=NO');
              console.log('MODAL_FIT_CLEAN=PASS');
              console.log('MOBILE_MENU_FLOW=PASS');
              console.log('MOBILE_SCROLL_UNLOCKED=PASS');
              console.log('BACKGROUND_DETAIL_PLATE_HISTORY=0');
              console.log('MS_MUTATION_TESTED=NO');
              console.log('PRODUCTION_TOUCHED=NO');
            } finally { await browser.close(); }
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
