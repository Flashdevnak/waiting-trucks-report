name: Test Tail DEV Shadow Exception

on:
  push:
    branches:
      - test/tbr-shadow-final-20260904
    paths:
      - .github/workflows/test-tail-dev-shadow-exception.yml

permissions:
  contents: read

jobs:
  tail-dev:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install DEV tooling
        working-directory: worker
        run: npm ci --no-audit --no-fund
      - name: Capture exact DEV TEST console and exceptions
        working-directory: worker
        run: |
          set +e
          timeout 75s npx wrangler tail waiting-trucks-report-api-dev --config wrangler.dev.jsonc --format json > /tmp/dev-tail.jsonl 2>&1
          set -e
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/dev-tail.jsonl')
          print('DEV_EXACT_EVENTS_BEGIN')
          for raw in p.read_text(errors='replace').splitlines() if p.exists() else []:
              raw=raw.strip()
              if not raw.startswith('{'): continue
              try: obj=json.loads(raw)
              except Exception: continue
              logs=obj.get('logs') or []
              exc=obj.get('exceptions') or []
              outcome=obj.get('outcome')
              event=obj.get('event') or {}
              req=(event.get('request') or {}) if isinstance(event,dict) else {}
              if logs or exc or outcome not in (None,'ok'):
                  safe={
                    'outcome':outcome,
                    'method':req.get('method'),
                    'url':(req.get('url') or '').split('?')[0],
                    'logs':logs,
                    'exceptions':exc,
                  }
                  print(json.dumps(safe,ensure_ascii=False)[:12000])
          print('DEV_EXACT_EVENTS_END')
          print('MUTATIONS=0')
          print('PRODUCTION_TOUCHED=NO')
          PY
