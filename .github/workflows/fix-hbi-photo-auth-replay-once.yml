name: Fix HBI photo auth replay once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-photo-auth-replay-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard expected checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=f2d8e996a943a2852989298081af5681083c59f4
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }

      - name: Replay captured HBI auth exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('worker/src/index.js')
          text = worker.read_text(encoding='utf-8')
          start = text.index('async function readHbiTruckPhotos')
          end = text.index('async function readBusTimeData', start)
          read = text[start:end]

          old_time = 'const value = key === "time" ? String(Date.now()) : credentials?.[key];'
          new_time = 'const value = credentials?.[key];'
          if read.count(old_time) != 1:
            raise SystemExit(f'HBI time replay anchor expected 1, got {read.count(old_time)}')
          read = read.replace(old_time, new_time, 1)

          accept = '    Accept: "application/json, text/plain, */*",\n'
          if read.count(accept) != 1:
            raise SystemExit(f'HBI Accept header anchor expected 1, got {read.count(accept)}')
          read = read.replace(
            accept,
            accept + '    "Accept-Language": credentials?.lang || "th",\n    "BI-PLATFORM": "",\n',
            1,
          )

          text = text[:start] + read + text[end:]
          worker.write_text(text, encoding='utf-8')

          test_file = Path('worker/tests/hbi-truck-photos.test.mjs')
          test_text = test_file.read_text(encoding='utf-8')
          needle = '  assert.equal((read.match(/await fetch\\(/g) || []).length, 1);\n'
          if test_text.count(needle) != 1:
            raise SystemExit(f'HBI regression test anchor expected 1, got {test_text.count(needle)}')
          addition = (
            needle
            + '  assert.match(read, /const value = credentials\\?\\.\\[key\\];/);\n'
            + '  assert.doesNotMatch(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\)/);\n'
            + '  assert.match(read, /"BI-PLATFORM": ""/);\n'
            + '  assert.match(read, /"Accept-Language": credentials\\?\\.lang \\|\\| "th"/);\n'
          )
          test_text = test_text.replace(needle, addition, 1)
          test_file.write_text(test_text, encoding='utf-8')
          PY

          node --check worker/src/index.js
          cd worker
          npm ci
          node --test tests/hbi-truck-photos.test.mjs
          npm run check
          cd ..
          git diff --check

      - name: Commit source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-photo-auth-replay-once.yml
          git add worker/src/index.js worker/tests/hbi-truck-photos.test.mjs
          git diff --cached --check
          git commit -m "fix(ms): replay HBI photo session exactly"
          git push origin HEAD:main
