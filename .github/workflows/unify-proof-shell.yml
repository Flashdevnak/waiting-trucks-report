name: Unify Proof Shell

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/unify-proof-shell.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply shell integration patch
        run: python .github/dev-tools/unify-proof-shell.py
      - name: Verify JavaScript
        run: node --check worker/src/proof-ui-v5.js
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ms.html proof.html worker/src/proof-ui-v5.js
          git commit -m "Integrate proof page with existing MS shell" || exit 0
          git push origin HEAD:main
