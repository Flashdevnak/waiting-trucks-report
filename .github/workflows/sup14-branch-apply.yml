name: SUP-14 Branch Apply

on:
  push:
    branches:
      - codex/sup-14-supervisor-guide
    paths:
      - '.github/dev-tools/apply-sup14.py'
      - '.github/workflows/sup14-branch-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/sup-14-supervisor-guide
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply SUP-14 patch
        run: python3 .github/dev-tools/apply-sup14.py

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Focused SUP-14 guide contract
        working-directory: worker
        run: node --test tests/supervisor-guide-contract.test.mjs tests/supervisor-language-contract.test.mjs

      - name: Full regression
        working-directory: worker
        run: npm run check

      - name: Diff safety
        shell: bash
        run: |
          git diff --check
          changed="$(git diff --name-only)"
          printf '%s\n' "$changed"
          bad="$(printf '%s\n' "$changed" | grep -Ev '^(supervisor\.html|supervisor\.js|supervisor-i18n\.js|worker/package\.json|worker/tests/supervisor-[A-Za-z0-9._-]+\.test\.mjs)$' || true)"
          if [ -n "$bad" ]; then
            echo "Unexpected SUP-14 working-tree path(s):"
            printf '%s\n' "$bad"
            exit 1
          fi
          if git diff | grep -E '^\+.*(setInterval\(|new WebSocket|EventSource\(|fetch\(|data-repair|repairMs|openai)' ; then
            echo 'SUP-14 introduced forbidden runtime work'
            exit 1
          fi
          echo 'SUP14_DIFF_SAFETY=PASS'
          echo 'PRODUCTION_TOUCHED=NO'

      - name: Commit canonical SUP-14 files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supervisor.html supervisor.js supervisor-i18n.js worker/package.json worker/tests/supervisor-*.test.mjs
          if git diff --cached --quiet; then
            echo 'No canonical SUP-14 changes to commit'
            exit 1
          fi
          git commit -m 'SUP-14: add read-only Supervisor Guide contract [skip ci]'
          git push origin HEAD:codex/sup-14-supervisor-guide
