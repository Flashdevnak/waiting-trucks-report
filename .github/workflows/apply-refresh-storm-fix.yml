name: Apply refresh storm fix

on:
  push:
    branches:
      - fix-dev-refresh-storm
    paths:
      - .github/workflows/apply-refresh-storm-fix.yml

permissions:
  contents: write

jobs:
  fix-test-deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply non-blocking archive patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match, got {count}")
              return text.replace(old, new, 1)

          p = Path('ms.js')
          s = p.read_text()

          s = replace_once(
              s,
              'const AUTH_KEY = "bnak_operator_auth_v2";',
              'const ARCHIVE_LOAD_DELAY_MS = 1500;\nconst AUTH_KEY = "bnak_operator_auth_v2";',
              'archive delay constant',
          )

          s = replace_once(
              s,
              '''  archiveLoaded: false,\n};''',
              '''  archiveLoaded: false,\n};\nlet archiveLoadTimer = null;\nlet archiveLoadPromise = null;''',
              'archive loader globals',
          )

          s = replace_once(
              s,
              '''  el("branch-filter").onchange = (event) => {\n    state.branch = event.target.value;\n    state.summary = "all";\n    loadData();\n  };''',
              '''  el("branch-filter").onchange = (event) => {\n    state.branch = event.target.value;\n    state.summary = "all";\n    resetArchiveState();\n    loadData();\n  };''',
              'branch archive reset',
          )

          s = replace_once(
              s,
              '''  el("queue-filter").onchange = (event) => {\n    state.queue = event.target.value;\n    state.summary = "all";\n    render();\n  };''',
              '''  el("queue-filter").onchange = async (event) => {\n    state.queue = event.target.value;\n    state.summary = "all";\n    if (state.queue === "all") await ensureArchiveLoaded(true);\n    render();\n  };''',
              'queue all lazy archive',
          )

          old_load = '''    const result = await apiGet("msRoutes", { branch: state.branch });\n    const archive =\n      !silent && !state.archiveLoaded\n        ? await apiGet("msArchive", { branch: state.branch })\n        : null;\n    state.currentRows = Array.isArray(result?.rows) ? result.rows : [];\n    if (archive) {\n      state.archiveRows = Array.isArray(archive?.rows) ? archive.rows : [];\n      state.archiveTotal = Number.isFinite(Number(archive?.totalDistinct))\n        ? Number(archive.totalDistinct)\n        : state.archiveRows.length;\n      state.archiveLoaded = true;\n    } else {\n      state.archiveRows = mergeLatest(state.archiveRows, state.currentRows);\n      state.archiveTotal = Math.max(state.archiveTotal, state.archiveRows.length);\n    }\n    state.rows = state.archiveRows;'''
          new_load = '''    const result = await apiGet("msRoutes", { branch: state.branch });\n    state.currentRows = Array.isArray(result?.rows) ? result.rows : [];\n    state.archiveRows = mergeLatest(state.archiveRows, state.currentRows);\n    state.archiveTotal = Math.max(state.archiveTotal, state.archiveRows.length);\n    state.rows = state.archiveRows;'''
          s = replace_once(s, old_load, new_load, 'non-blocking loadData')

          s = replace_once(
              s,
              '''    render();\n  } catch (error) {''',
              '''    render();\n    if (!silent && !state.archiveLoaded) scheduleArchiveLoad();\n  } catch (error) {''',
              'schedule archive after current render',
          )

          anchor = '''function mergeLatest(archive, current) {'''
          helpers = '''function resetArchiveState() {\n  if (archiveLoadTimer) clearTimeout(archiveLoadTimer);\n  archiveLoadTimer = null;\n  state.archiveRows = [];\n  state.archiveTotal = 0;\n  state.archiveLoaded = false;\n  state.rows = [];\n}\n\nfunction scheduleArchiveLoad(delay = ARCHIVE_LOAD_DELAY_MS) {\n  if (!state.auth || state.archiveLoaded || archiveLoadTimer) return;\n  const branch = state.branch;\n  archiveLoadTimer = setTimeout(() => {\n    archiveLoadTimer = null;\n    if (state.auth && state.branch === branch && !state.archiveLoaded)\n      void ensureArchiveLoaded(false);\n  }, delay);\n}\n\nasync function ensureArchiveLoaded(userInitiated = false) {\n  if (!state.auth || state.archiveLoaded) return true;\n  const branch = state.branch;\n  if (archiveLoadTimer) {\n    clearTimeout(archiveLoadTimer);\n    archiveLoadTimer = null;\n  }\n  if (archiveLoadPromise?.branch === branch) return archiveLoadPromise.promise;\n  const promise = (async () => {\n    try {\n      const archive = await apiGet("msArchive", { branch });\n      if (state.branch !== branch) return false;\n      state.archiveRows = Array.isArray(archive?.rows) ? archive.rows : [];\n      state.archiveTotal = Number.isFinite(Number(archive?.totalDistinct))\n        ? Number(archive.totalDistinct)\n        : state.archiveRows.length;\n      state.archiveLoaded = true;\n      state.rows = mergeLatest(state.archiveRows, state.currentRows);\n      fillFilters();\n      render();\n      return true;\n    } catch (error) {\n      if (userInitiated) toast(`โหลดรายการสะสมไม่สำเร็จ: ${error.message}`, true);\n      return false;\n    } finally {\n      if (archiveLoadPromise?.promise === promise) archiveLoadPromise = null;\n    }\n  })();\n  archiveLoadPromise = { branch, promise };\n  return promise;\n}\n\n'''
          s = replace_once(s, anchor, helpers + anchor, 'archive helper insertion')

          s = replace_once(
              s,
              '''function applyMetricFilter(metric) {\n  state.summary = "all";''',
              '''async function applyMetricFilter(metric) {\n  if (["all", "completed", "arrival-ontime", "arrival-late", "departure-ontime", "departure-late"].includes(metric))\n    await ensureArchiveLoaded(true);\n  state.summary = "all";''',
              'metric archive lazy load',
          )

          p.write_text(s)

          t = Path('worker/tests/frontend-requirements.test.mjs')
          tests = t.read_text()
          tests = replace_once(
              tests,
              '''  assert.match(source, /!silent && !state\\.archiveLoaded/);\n  assert.doesNotMatch(source, /!silent \\|\\| !state\\.archiveLoaded/);''',
              '''  assert.match(source, /ARCHIVE_LOAD_DELAY_MS\\s*=\\s*1500/);\n  assert.match(source, /async function ensureArchiveLoaded/);\n  assert.match(source, /if \\(!silent && !state\\.archiveLoaded\\) scheduleArchiveLoad\\(\\)/);\n  assert.match(source, /state\\.rows = mergeLatest\\(state\\.archiveRows, state\\.currentRows\\)/);\n  assert.doesNotMatch(source, /!silent \\|\\| !state\\.archiveLoaded/);''',
              'archive regression assertions',
          )
          t.write_text(tests)
          PY

      - name: Run checks
        working-directory: worker
        run: |
          npm ci
          npm run check
      - name: Commit fix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-refresh-storm-fix.yml
          git add ms.js worker/tests/frontend-requirements.test.mjs
          git diff --cached --check
          git commit -m "Keep current MS view responsive during archive load"
          git push origin HEAD:main
      - name: Stage DEV frontend assets
        working-directory: worker
        run: |
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../ms.html ../ms.js ../style.css ../sw.js ../favicon.svg .dev-assets/
      - name: Deploy DEV Worker assets
        working-directory: worker
        run: npx wrangler deploy --config wrangler.dev.jsonc
