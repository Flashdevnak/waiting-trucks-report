name: Fix HBI-aware DEV HAR staging once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-stage-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard expected source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=1f9ae4968bed0fad021342fda4c0a2c1c7d7123d
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }
      - name: Apply and test staging fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp-fix-hbi-stage.py
          node --check .github/dev-tools/stage-dev-runtime.mjs
          cd worker
          node --test tests/dev-archive-patch.test.mjs
          cd ..
          git diff --check
      - name: Commit clean staging fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-stage-once.yml .tmp-fix-hbi-stage.py
          git add .github/dev-tools/stage-dev-runtime.mjs
          git commit -m "fix(dev): stage Proof HAR after HBI source"
          git push origin HEAD:main
