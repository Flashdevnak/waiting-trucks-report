name: D1 Runtime Gate DEV

# Read-only diagnostics for the DEV D1 database. This workflow never deploys,
# migrates, writes D1 data, or touches the production backend.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/d1-runtime-gate-dev.yml

permissions:
  contents: read

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Query DEV D1 runtime analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
        run: |
          node <<'NODE'
          const endpoint = 'https://api.cloudflare.com/client/v4/graphql';
          const accountTag = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.DEV_D1_DATABASE_ID;

          if (!accountTag || !token) {
            console.error('Missing Cloudflare GitHub Actions secrets.');
            process.exit(2);
          }

          const query = `
            query D1RuntimeMinuteGate($accountTag: String!, $databaseId: String!, $start: String!, $end: String!) {
              viewer {
                accounts(filter: { accountTag: $accountTag }) {
                  d1AnalyticsAdaptiveGroups(
                    limit: 10000
                    filter: {
                      databaseId: $databaseId
                      datetime_geq: $start
                      datetime_leq: $end
                    }
                  ) {
                    sum {
                      readQueries
                      writeQueries
                      rowsRead
                      rowsWritten
                    }
                    dimensions {
                      datetimeMinute
                      databaseId
                    }
                  }
                  d1QueriesAdaptiveGroups(
                    limit: 10000
                    filter: {
                      databaseId: $databaseId
                      datetime_geq: $start
                      datetime_leq: $end
                    }
                  ) {
                    count
                    sum {
                      rowsRead
                      rowsWritten
                    }
                    dimensions {
                      datetimeMinute
                      query
                    }
                  }
                }
              }
            }
          `;

          async function gql(start, end) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                query,
                variables: { accountTag, databaseId, start, end },
              }),
            });
            const payload = await response.json();
            if (!response.ok || payload.errors?.length) {
              throw new Error(JSON.stringify(payload.errors || payload));
            }
            return payload.data?.viewer?.accounts?.[0] || {};
          }

          function compactSql(value) {
            return String(value || '').replace(/\s+/g, ' ').trim();
          }

          const end = new Date();
          // Leave room for analytics ingestion delay.
          end.setUTCMinutes(end.getUTCMinutes() - 2);
          const start = new Date(end.getTime() - 20 * 60_000);
          const account = await gql(start.toISOString(), end.toISOString());

          const minuteTotals = new Map();
          for (const group of account.d1AnalyticsAdaptiveGroups || []) {
            const minute = group.dimensions?.datetimeMinute;
            if (!minute) continue;
            const sum = group.sum || {};
            const prior = minuteTotals.get(minute) || {
              minute,
              readQueries: 0,
              writeQueries: 0,
              rowsRead: 0,
              rowsWritten: 0,
            };
            prior.readQueries += Number(sum.readQueries || 0);
            prior.writeQueries += Number(sum.writeQueries || 0);
            prior.rowsRead += Number(sum.rowsRead || 0);
            prior.rowsWritten += Number(sum.rowsWritten || 0);
            minuteTotals.set(minute, prior);
          }

          const byMinuteQuery = new Map();
          for (const group of account.d1QueriesAdaptiveGroups || []) {
            const minute = group.dimensions?.datetimeMinute;
            if (!minute) continue;
            const item = {
              count: Number(group.count || 0),
              rowsRead: Number(group.sum?.rowsRead || 0),
              rowsWritten: Number(group.sum?.rowsWritten || 0),
              query: compactSql(group.dimensions?.query),
            };
            if (!byMinuteQuery.has(minute)) byMinuteQuery.set(minute, []);
            byMinuteQuery.get(minute).push(item);
          }

          const businessWritePattern = /INSERT OR REPLACE INTO ms_routes|INSERT INTO ms_route_history|DELETE FROM ms_routes/i;
          const cacheWritePattern = /INSERT INTO ms_live_cache/i;
          const heartbeatPattern = /UPDATE ms_(?:preentry_|bus_)?connections SET last_success_at/i;
          const rows = [...minuteTotals.values()].sort((a, b) => a.minute.localeCompare(b.minute));

          console.log(`RUNTIME_MINUTE_GATE_START=${start.toISOString()}`);
          console.log(`RUNTIME_MINUTE_GATE_END=${end.toISOString()}`);
          console.log('RUNTIME_MINUTES=');

          for (const row of rows) {
            const queries = (byMinuteQuery.get(row.minute) || []).sort(
              (a, b) => (b.rowsRead + b.rowsWritten) - (a.rowsRead + a.rowsWritten),
            );
            const businessWrites = queries
              .filter((x) => x.rowsWritten > 0 && businessWritePattern.test(x.query))
              .reduce((sum, x) => sum + x.rowsWritten, 0);
            const cacheWrites = queries
              .filter((x) => x.rowsWritten > 0 && cacheWritePattern.test(x.query))
              .reduce((sum, x) => sum + x.rowsWritten, 0);
            const heartbeatWrites = queries
              .filter((x) => x.rowsWritten > 0 && heartbeatPattern.test(x.query))
              .reduce((sum, x) => sum + x.rowsWritten, 0);
            const cleanBusiness = businessWrites === 0;
            console.log(JSON.stringify({
              ...row,
              businessWrites,
              cacheWrites,
              heartbeatWrites,
              cleanBusiness,
              topQueries: queries.slice(0, 8),
            }));
          }

          // Report the longest contiguous streak whose query details show no
          // route/history/delete write. Heartbeat/cache writes remain visible.
          let best = [], current = [], previous = null;
          for (const row of rows) {
            const queries = byMinuteQuery.get(row.minute) || [];
            const businessWrites = queries
              .filter((x) => x.rowsWritten > 0 && businessWritePattern.test(x.query))
              .reduce((sum, x) => sum + x.rowsWritten, 0);
            const time = Date.parse(row.minute);
            const contiguous = previous === null || time - previous === 60_000;
            if (businessWrites === 0) {
              current = contiguous ? [...current, row] : [row];
              if (current.length > best.length) best = current;
            } else {
              current = [];
            }
            previous = time;
          }

          const clean = best.reduce((acc, row) => {
            acc.rowsRead += row.rowsRead;
            acc.rowsWritten += row.rowsWritten;
            acc.readQueries += row.readQueries;
            acc.writeQueries += row.writeQueries;
            return acc;
          }, { rowsRead: 0, rowsWritten: 0, readQueries: 0, writeQueries: 0 });

          console.log(`CLEAN_STREAK_MINUTES=${best.length}`);
          console.log(`CLEAN_STREAK_START=${best[0]?.minute || ''}`);
          console.log(`CLEAN_STREAK_END=${best.at(-1)?.minute || ''}`);
          console.log(`NO_CHANGE_RUNTIME_READ_CLEAN=${clean.rowsRead}`);
          console.log(`NO_CHANGE_RUNTIME_WRITE_CLEAN=${clean.rowsWritten}`);
          console.log(`NO_CHANGE_RUNTIME_READ_QUERIES_CLEAN=${clean.readQueries}`);
          console.log(`NO_CHANGE_RUNTIME_WRITE_QUERIES_CLEAN=${clean.writeQueries}`);
          NODE
