name: TEMP DEV 401 Expiry Hint

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded patch
        run: python3 .github/dev-tools/patch-ms-401-expiry-hint.py
      - name: Test
        run: |
          node --check ms.js
          node --check .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          node --check cloudflare-browser-test/src/connection-error.js
          node --test .github/dev-tools/ms-self-healing-supervisor.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          node --test cloudflare-browser-test/scripts/connection-error-intelligence.test.mjs
          grep -F 'changedAt: text(repair.changedAt, 100)' .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          grep -F 'กรุณาเชื่อมต่อ MS ใหม่ และอัปโหลด HAR' ms.js
          ! grep -F 'กรุณาเชื่อมต่อ MS ผ่าน QR ใหม่ และอัปโหลด HAR' ms.js
          grep -F 'source-expiry-hint' style.css
          grep -F 'INTELLIGENCE_HUB_FILTER_V4' cloudflare-browser-test/src/connection-error.js
          git diff --check
      - name: Commit tested DEV feature
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/dev-tools/patch-ms-self-healing-supervisor.mjs ms.js style.css cloudflare-browser-test/src/connection-error.js
          git commit -m 'feat(dev): explain 401 and fix intelligence HUB selector'
          git push origin HEAD:main

# trigger: actual stylesheet path
