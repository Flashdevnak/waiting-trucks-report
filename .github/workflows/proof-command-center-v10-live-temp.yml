name: Proof Command Center V10 Browser Live Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-command-center-v10-live-temp.yml

permissions:
  contents: read

jobs:
  browser-live:
    runs-on: ubuntu-latest
    steps:
      - name: Install Playwright Chromium
        run: |
          mkdir -p /tmp/proof-v10-live
          cd /tmp/proof-v10-live
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
      - name: Verify Proof V10 live runtime and quota guards
        run: |
          cd /tmp/proof-v10-live
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              page.setDefaultTimeout(15000);
              const observed=[];
              page.on('request', req=>observed.push(req.url()));
              const response=await page.goto(`${base}/proof.html?v10live=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              if(!response||!response.ok()) throw new Error(`proof.html HTTP ${response?.status()}`);
              await page.waitForFunction(()=>window.__PROOF_V10_READY__===true,{timeout:15000});
              await page.waitForTimeout(1800);

              const check=await page.evaluate(()=>{
                const P=window.ProofV2;
                const now=Date.now();
                const release=new Date(now-5*60_000);
                const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Bangkok',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(release).reduce((a,p)=>(a[p.type]=p.value,a),{});
                const day=`${parts.year}-${parts.month}-${parts.day}`;
                const minute=Number(parts.hour)*60+Number(parts.minute);
                const missed={proofState:1,proofId:'',departureDate:day,plannedDepartureTime:minute,lineName:'TEST-MISSED',lineMode:1,acknowledgements:{}};
                const enabled={...missed,proofId:'NAK1TEST123'};
                P.renderAlerts([{row:missed,alert:P.alertForRow(missed,now)}]);
                const alertPanel=document.getElementById('alert-panel');
                const alertList=document.getElementById('alert-list');
                const legacy=document.getElementById('metric-grid');
                const search=document.getElementById('search-input');
                const state=document.getElementById('state-filter');
                return {
                  command:!!document.getElementById('proof-command-center-v10'),
                  historyButton:!!document.getElementById('proof-history-open-v10'),
                  historyDialog:!!document.getElementById('proof-history-dialog-v10'),
                  legacyHidden:legacy?getComputedStyle(legacy).display==='none':false,
                  missed:P.isMissedVehicle(missed,now),
                  missedTitle:P.alertForRow(missed,now)?.title||'',
                  missedAction:P.actionButtons(missed),
                  enabledMissed:P.isMissedVehicle(enabled,now),
                  enabledText:P.barcodeStatusText(enabled),
                  enabledBadge:P.barcodeBadge(enabled),
                  alertCompact:alertPanel?.classList.contains('proof-alert-dock-v10')||false,
                  alertCollapsed:alertList?.classList.contains('hidden')||false,
                  alertToggle:!!document.getElementById('proof-alert-toggle-v10'),
                  platePlaceholder:search?.placeholder||'',
                  missedOption:!!state?.querySelector('option[value="missed"]'),
                  enabledOption:!!state?.querySelector('option[value="barcode-enabled"]'),
                };
              });

              if(!check.command||!check.historyButton||!check.historyDialog||!check.legacyHidden) throw new Error(`command center mismatch ${JSON.stringify(check)}`);
              if(!check.missed||!check.missedTitle.includes('รถไม่เข้า')||!check.missedAction.includes('รถไม่เข้า')) throw new Error(`missed rule mismatch ${JSON.stringify(check)}`);
              if(check.enabledMissed||check.enabledText!=='เปิดใช้บาร์รถแล้ว'||!check.enabledBadge.includes('เปิดใช้บาร์รถแล้ว')) throw new Error(`barcode enabled mismatch ${JSON.stringify(check)}`);
              if(!check.alertCompact||!check.alertCollapsed||!check.alertToggle) throw new Error(`alert dock mismatch ${JSON.stringify(check)}`);
              if(!check.platePlaceholder.includes('ทะเบียนรถ')||!check.missedOption||!check.enabledOption) throw new Error(`search/filter mismatch ${JSON.stringify(check)}`);

              const backgroundHistory=observed.filter(u=>u.includes('/api/proof/history'));
              const backgroundPlate=observed.filter(u=>u.includes('/api/proof/plate-options'));
              if(backgroundHistory.length) throw new Error(`history fetched in background: ${backgroundHistory.join(',')}`);
              if(backgroundPlate.length) throw new Error(`plate search fetched in background: ${backgroundPlate.join(',')}`);

              await page.click('#proof-history-open-v10');
              await page.waitForTimeout(250);
              const loginOpened=await page.evaluate(()=>document.getElementById('proof-login-dialog')?.open===true);
              if(!loginOpened) throw new Error('history without login did not request login dialog');
              if(observed.some(u=>u.includes('/api/proof/history'))) throw new Error('history endpoint called without explicit authenticated load');

              const unauth=await page.request.get(`${base}/api/proof/history?branch=NE1&days=30&limit=10`);
              if(unauth.status()!==401) throw new Error(`history auth guard expected 401 got ${unauth.status()}`);
              const v10=await page.request.get(`${base}/proof-v10.js?verify=${Date.now()}`);
              if(!v10.ok()||!(await v10.text()).includes('PROOF_COMMAND_CENTER_V10')) throw new Error('proof-v10.js marker missing');

              const responsive=await Promise.race([
                page.evaluate(()=>new Promise(resolve=>requestAnimationFrame(()=>queueMicrotask(()=>resolve(true))))),
                new Promise((_,reject)=>setTimeout(()=>reject(new Error('proof freeze timeout')),2500)),
              ]);
              if(!responsive) throw new Error('proof page not responsive');

              for(const name of ['ms.html','waiting.html','ms-report.html']){
                const r=await page.request.get(`${base}/${name}?scope=${Date.now()}`);
                if(!r.ok()) throw new Error(`${name} HTTP ${r.status()}`);
                if((await r.text()).includes('/proof-v10.js')) throw new Error(`${name} unexpectedly contains Proof V10 runtime`);
              }

              console.log('PROOF_V10_COMMAND_CENTER=PASS');
              console.log('PROOF_V10_MISSED_AFTER_RELEASE=PASS');
              console.log('PROOF_V10_BARCODE_ENABLED=PASS');
              console.log('PROOF_V10_ALERT_COMPACT=PASS');
              console.log('PROOF_V10_HISTORY_ON_DEMAND=PASS');
              console.log('PROOF_V10_HISTORY_AUTH_GUARD=PASS');
              console.log('PROOF_V10_NO_BACKGROUND_PLATE_SEARCH=PASS');
              console.log('PROOF_V10_SCOPE_PROOF_ONLY=PASS');
              console.log('PROOF_BROWSER_NO_FREEZE=PASS');
              console.log('HISTORY_BACKGROUND_WRITES_ADDED=0');
              console.log('HISTORY_POLLING_ADDED=0');
              console.log('MS_MUTATION_TESTED=NO');
              console.log('PRODUCTION_TOUCHED=NO');
            } finally { await browser.close(); }
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
