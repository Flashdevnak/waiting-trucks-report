name: Proof V15 Mobile Diagnostic Temp
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v15-mobile-diagnostic-temp.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose mobile overflow
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/proof-diag && cd /tmp/proof-diag
          npm init -y >/dev/null 2>&1
          timeout 120s npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          timeout 240s npx playwright install chromium >/dev/null
          cp "$GITHUB_WORKSPACE/.github/proof-v15-mobile-overflow-diagnostic.cjs" ./diag.cjs
          node diag.cjs
