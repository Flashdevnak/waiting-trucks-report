name: D1 Runtime Gate DEV

# Read-only diagnostics for the DEV D1 database. This workflow never deploys,
# migrates, writes D1 data, or touches the production backend.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/d1-runtime-gate-dev.yml

permissions:
  contents: read

jobs:
  runtime-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install Worker tooling
        working-directory: worker
        run: npm ci

      - name: Query DEV D1 runtime analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
        run: |
          node <<'NODE'
          const endpoint = 'https://api.cloudflare.com/client/v4/graphql';
          const accountTag = process.env.CLOUDFLARE_ACCOUNT_ID;
          const token = process.env.CLOUDFLARE_API_TOKEN;
          const databaseId = process.env.DEV_D1_DATABASE_ID;

          if (!accountTag || !token) {
            console.error('Missing Cloudflare GitHub Actions secrets.');
            process.exit(2);
          }

          const query = `
            query D1RuntimeGate($accountTag: String!, $databaseId: String!, $start: String!, $end: String!) {
              viewer {
                accounts(filter: { accountTag: $accountTag }) {
                  d1AnalyticsAdaptiveGroups(
                    limit: 1000
                    filter: {
                      databaseId: $databaseId
                      datetime_geq: $start
                      datetime_leq: $end
                    }
                  ) {
                    sum {
                      readQueries
                      writeQueries
                      rowsRead
                      rowsWritten
                    }
                    dimensions {
                      databaseId
                    }
                  }
                  d1QueriesAdaptiveGroups(
                    limit: 1000
                    filter: {
                      databaseId: $databaseId
                      datetime_geq: $start
                      datetime_leq: $end
                    }
                  ) {
                    count
                    sum {
                      rowsRead
                      rowsWritten
                    }
                    dimensions {
                      query
                    }
                  }
                }
              }
            }
          `;

          async function gql(start, end) {
            const response = await fetch(endpoint, {
              method: 'POST',
              headers: {
                Authorization: `Bearer ${token}`,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                query,
                variables: { accountTag, databaseId, start, end },
              }),
            });
            const payload = await response.json();
            if (!response.ok || payload.errors?.length) {
              throw new Error(JSON.stringify(payload.errors || payload));
            }
            return payload.data?.viewer?.accounts?.[0] || {};
          }

          function total(groups = []) {
            return groups.reduce((acc, group) => {
              const sum = group.sum || {};
              acc.readQueries += Number(sum.readQueries || 0);
              acc.writeQueries += Number(sum.writeQueries || 0);
              acc.rowsRead += Number(sum.rowsRead || 0);
              acc.rowsWritten += Number(sum.rowsWritten || 0);
              return acc;
            }, { readQueries: 0, writeQueries: 0, rowsRead: 0, rowsWritten: 0 });
          }

          function topQueries(groups = []) {
            return groups.map((group) => ({
              count: Number(group.count || 0),
              rowsRead: Number(group.sum?.rowsRead || 0),
              rowsWritten: Number(group.sum?.rowsWritten || 0),
              query: String(group.dimensions?.query || '').replace(/\s+/g, ' ').trim(),
            })).sort((a, b) => (b.rowsRead + b.rowsWritten) - (a.rowsRead + a.rowsWritten));
          }

          const end = new Date();
          // Exclude the newest two minutes because Cloudflare analytics can arrive with a short delay.
          end.setUTCMinutes(end.getUTCMinutes() - 2);

          for (const minutes of [15, 30]) {
            const start = new Date(end.getTime() - minutes * 60_000);
            const startIso = start.toISOString();
            const endIso = end.toISOString();
            const account = await gql(startIso, endIso);
            const totals = total(account.d1AnalyticsAdaptiveGroups);
            const queries = topQueries(account.d1QueriesAdaptiveGroups);

            console.log(`RUNTIME_GATE_${minutes}M_START=${startIso}`);
            console.log(`RUNTIME_GATE_${minutes}M_END=${endIso}`);
            console.log(`NO_CHANGE_RUNTIME_READ_${minutes}M=${totals.rowsRead}`);
            console.log(`NO_CHANGE_RUNTIME_WRITE_${minutes}M=${totals.rowsWritten}`);
            console.log(`READ_QUERIES_${minutes}M=${totals.readQueries}`);
            console.log(`WRITE_QUERIES_${minutes}M=${totals.writeQueries}`);
            console.log(`TOP_D1_QUERIES_${minutes}M=`);
            console.log(JSON.stringify(queries.slice(0, 20), null, 2));
          }
          NODE
