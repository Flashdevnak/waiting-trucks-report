name: Finalize Turso DEV No D1

on:
  push:
    branches: [turso-dev-migration]
    paths:
      - .github/workflows/finalize-turso-dev-no-d1.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: turso-dev-migration
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Assert Turso-only config
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const c=fs.readFileSync('wrangler.dev.jsonc','utf8');
          if(!c.includes('"DB_BACKEND": "turso"')) throw new Error('DB_BACKEND=turso missing');
          if(!c.includes('"main": "src/turso-index.js"')) throw new Error('Turso entrypoint missing');
          if(c.includes('d1_databases') || c.includes('waiting-trucks-report-dev-db')) throw new Error('D1 binding still present');
          console.log('DEV_CONFIG=TURSO_ONLY_NO_D1');
          NODE
      - name: Verify Turso secrets
        run: |
          npx wrangler secret list --config wrangler.dev.jsonc > /tmp/secrets.json
          node <<'NODE'
          const fs=require('node:fs'); const s=fs.readFileSync('/tmp/secrets.json','utf8');
          for(const n of ['TURSO_DATABASE_URL','TURSO_AUTH_TOKEN']) if(!s.includes(n)) throw new Error(`Missing ${n}`);
          console.log('TURSO_SECRETS=PASS');
          NODE
      - name: Stage exact DEV runtime
        run: |
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../ms.html ../ms.js ../style.css ../sw.js ../favicon.svg .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js src/index.js
          node --check .dev-assets/ms.js
          node --check src/index.js
          node --check src/turso-d1.js
          node --check src/turso-index.js
      - name: Deploy Turso-only DEV Worker
        run: npx wrangler deploy --config wrangler.dev.jsonc
      - name: Smoke health
        working-directory: .
        run: |
          sleep 5
          curl --fail --silent --show-error 'https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api?action=health' > /tmp/health.json
          node -e "const p=require('/tmp/health.json'); if(!p.ok) process.exit(2); console.log('DEV_HEALTH=PASS')"
      - name: Summary
        working-directory: .
        run: |
          echo 'DEV_DATABASE_BACKEND=TURSO'
          echo 'DEV_D1_BINDING=REMOVED'
          echo 'D1_ACCESS=0'
          echo 'PRODUCTION_TOUCHED=NO'
