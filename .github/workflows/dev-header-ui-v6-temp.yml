name: DEV Header UI V6 Temp
# trigger: run-v6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-header-ui-v6-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply DEV header V6 patch
        run: python3 .github/dev-tools/dev-header-v6-patch-temp.py
      - name: Validate DEV header V6
        run: |
          node --check .github/dev-tools/stage-dev-runtime.mjs
          node --check .github/dev-tools/stage-dev-runtime.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          grep -q 'DEV_HEADER_ALIGNMENT_V6' .github/dev-tools/stage-dev-runtime.mjs
          grep -q 'DEV_TOOLS_EMPTY_STATE_V6' .github/dev-tools/stage-dev-runtime.mjs
          echo 'DEV_HEADER_CENTER_V6=PASS'
          echo 'DEV_TOOLS_EMPTY_STATE_V6=PASS'
          echo 'DEV_DROPDOWN_EXCLUSIVE_V4=PRESERVED'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit functional changes
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add .github/dev-tools/stage-dev-runtime.mjs .github/dev-tools/stage-dev-runtime.test.mjs
          git commit -m 'Center DEV header labels and preserve tools dropdown content'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
