name: Deploy Worker DEV

# DEV-only pipeline. Runtime is Turso-only. Production is never deployed here.
# UI checkpoint: DEV_HEADER_POLISH_V3
# TBR checkpoint: TBR_ROUTE_CHUNK_RETRY_V4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/deploy-worker-dev.yml
      - .github/dev-tools/**
      - cloudflare-browser-test/scripts/patch-dev-tbr-shadow-readonly.mjs
      - cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
      - waiting.html
      - main.js
      - ms-report.html
      - ms-report.js
      - ms.html
      - ms.js
      - proof.html
      - proof.js
      - 'proof-v2-*.js'
      - style.css
      - sw.js
      - favicon.svg
      - worker/src/**
      - worker/tests/**
      - worker/scripts/**
      - worker/package.json
      - worker/package-lock.json
      - worker/wrangler.dev.jsonc
      - worker/migrations/**

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci
      - run: npm run check
      - name: Verify 100-device 180-day auth session resilience
        run: node --test tests/auth-session-resilience.test.mjs
      - run: node --test tests/dev-archive-patch.test.mjs
      - run: node --test ../.github/dev-tools/ms-realtime-recovery.test.mjs
      - run: node --test ../.github/dev-tools/ms-summary-filter.test.mjs
      - run: node --test ../.github/dev-tools/ms-multiclient-dedupe.test.mjs
      - run: node --test ../.github/dev-tools/ms-durable-coordinator.test.mjs
      - run: node --test ../.github/dev-tools/safe-parity.test.mjs
      - run: node --test ../.github/dev-tools/ms-connector-adoption.test.mjs
      - run: node --test ../.github/dev-tools/ms-route-cancellation.test.mjs
      - run: node --test ../.github/dev-tools/ms-archive-completeness.test.mjs
      - run: node --test ../.github/dev-tools/daily-history.test.mjs
      - run: node --test ../.github/dev-tools/ms-quota-safe-live.test.mjs
      - run: node --test ../.github/dev-tools/stage-dev-runtime.test.mjs

      - name: Reject D1 and verify DEV cron
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('wrangler.dev.jsonc','utf8');
          if(!text.includes('"main": "src/turso-index.js"')) throw new Error('DEV entrypoint is not Turso');
          if(!text.includes('"DB_BACKEND": "turso"')) throw new Error('DEV DB_BACKEND is not Turso');
          if(text.includes('d1_databases')) throw new Error('D1 binding is forbidden in DEV');
          if(!text.includes('"crons": ["* * * * *"]')) throw new Error('DEV one-minute cron missing');
          console.log('DEV_TURSO_CONFIG=PASS');
          console.log('DEV_D1_CONFIG_BINDING=0');
          console.log('DEV_PROOF_CRON=1_MINUTE');
          NODE

      - name: Stage DEV runtime and enforce checkpoint contracts
        run: |
          rm -rf .dev-assets
          mkdir -p .dev-assets
          cp ../waiting.html ../main.js ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../sw.js ../favicon.svg .dev-assets/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .dev-assets/
          cp ../.github/dev-tools/safe-parity.html .dev-assets/safe-parity.html
          node ../.github/dev-tools/stage-dev-runtime.mjs .dev-assets/ms.js src/index.js
          node --check .dev-assets/main.js
          node --check .dev-assets/ms-report.js
          node --check .dev-assets/ms.js
          node --check .dev-assets/proof.js
          node --check .dev-assets/proof-v2-core.js
          node --check .dev-assets/proof-v2-ui.js
          node --check .dev-assets/proof-v2-actions.js
          node --check src/index.js
          node --check src/turso-d1.js
          node --check src/turso-index.js
          node --check src/proof-control.js
          node --check src/proof-live-v2.js
          node <<'NODE'
          const fs=require('node:fs');
          const pages=['ms.html','proof.html','waiting.html','ms-report.html'];
          const front=fs.readFileSync('.dev-assets/ms.js','utf8');
          const proofFront=fs.readFileSync('.dev-assets/proof.js','utf8');
          const proofHtml=fs.readFileSync('.dev-assets/proof.html','utf8');
          const proofWorker=fs.readFileSync('src/proof-control.js','utf8');
          const proofV2=fs.readFileSync('src/proof-live-v2.js','utf8');
          const proofV2Front=fs.readFileSync('.dev-assets/proof-v2-core.js','utf8')+fs.readFileSync('.dev-assets/proof-v2-ui.js','utf8')+fs.readFileSync('.dev-assets/proof-v2-actions.js','utf8');
          const worker=fs.readFileSync('src/index.js','utf8');
          const style=fs.readFileSync('.dev-assets/style.css','utf8');

          for(const marker of ['MS_DAILY_HISTORY_V1','pollMs: 4000','apiGet("msDailyArchive"','เลือกวันอย่างเดียวไม่อ่านฐานข้อมูล จนกว่าจะกดค้นหา'])
            if(!front.includes(marker)) throw new Error(`staged frontend missing ${marker}`);
          for(const marker of ['MS_DAILY_HISTORY_V1: read-only daily history','MS_QUOTA_SAFE_LIVE_V1','AUTH_SESSION_RESILIENCE_V1','AUTH_VERIFY_UNAVAILABLE','TBR_SHADOW_SPLIT_V2','TBR_ROUTE_OPERATING_WINDOW_V3','TBR_ROUTE_CHUNK_RETRY_V4','tbrShadowRouteRanges','readTbrRouteRangeWithRetry','todayStartBangkok - 86400000','todayStartBangkok + 86400000 - 1000'])
            if(!worker.includes(marker)) throw new Error(`staged worker missing ${marker}`);
          if(!worker.includes('upstreamMsCalls: 0')||!worker.includes('historyWrites: 0')) throw new Error('daily-history read-only evidence missing');
          if(!worker.includes('baselineRows: (currentCache || cache)?.rows || null')) throw new Error('live-cache baseline missing');

          for(const marker of ['/api/proof/routes','/api/proof/profile','/api/proof/print','pollMs: 30_000'])
            if(!proofFront.includes(marker)) throw new Error(`proof frontend missing ${marker}`);
          for(const marker of ['/api/proof/routes-v2','/api/proof/ack','standbyLeadMinutes:60','lineMode'])
            if(!proofV2Front.includes(marker)) throw new Error(`proof V2 frontend missing ${marker}`);
          for(const marker of ['/fleet/van/proof/find','estimate_end_time','estimate_start_time','ms_proof_details_v2'])
            if(!proofV2.includes(marker)) throw new Error(`proof V2 worker missing ${marker}`);
          if(!proofHtml.includes('ปุ่มยกเลิกรถยังปิดไว้')) throw new Error('proof cancel safety notice missing');
          for(const marker of ['ms_proof_snapshots','ms_proof_events','ms_proof_print_log','pageSize: \'100\''])
            if(!proofWorker.includes(marker)) throw new Error(`proof worker missing ${marker}`);
          if(proofWorker.includes('/fleet/van/proof/cancel_car')||proofV2.includes('/fleet/van/proof/cancel_car')) throw new Error('proof cancel command must stay disabled');

          if(!style.includes('DEV_UNIFIED_HEADER_V2')||!style.includes('DEV_HEADER_POLISH_V3')) throw new Error('DEV header v3 CSS missing');
          for(const page of pages){
            const html=fs.readFileSync(`.dev-assets/${page}`,'utf8');
            if(!html.includes('data-dev-shell="20260905-v2"')) throw new Error(`${page} unified header marker missing`);
            if(!html.includes('style.css?v=20260905-dev-shell-v3')) throw new Error(`${page} style v3 missing`);
            if((html.match(/dev-shell-slot/g)||[]).length!==5) throw new Error(`${page} must have five header slots`);
            if(!html.includes('เปลี่ยนรหัสผ่าน')) throw new Error(`${page} account password entry missing`);
          }
          const msHtml=fs.readFileSync('.dev-assets/ms.html','utf8');
          const proofHtmlLive=fs.readFileSync('.dev-assets/proof.html','utf8');
          if(!msHtml.includes('การเชื่อมต่อ MS (QR/HAR)')) throw new Error('MS central QR/HAR entry missing');
          if(!proofHtmlLive.includes('ms.html#connection')||!proofHtmlLive.includes('การเชื่อมต่อ MS (QR/HAR)')) throw new Error('Proof shared QR/HAR entry missing');

          console.log('STAGED_DAILY_HISTORY=PASS');
          console.log('STAGED_QUOTA_SAFE_LIVE=PASS');
          console.log('STAGED_TBR_ROUTE_CHUNK_RETRY_V4=PASS');
          console.log('STAGED_DEV_HEADER_POLISH_V3=PASS');
          console.log('STAGED_HAR_SHARED_ENTRY=PASS');
          console.log('STAGED_AUTH_SESSION_RESILIENCE=PASS');
          console.log('STAGED_POLL_MS=4000');
          console.log('STAGED_PROOF_CONTROL=PASS');
          console.log('STAGED_PROOF_CANCEL_COMMANDS=0');
          NODE

      - name: Verify Turso and auth secrets exist on DEV Worker
        run: |
          npx wrangler secret list --config wrangler.dev.jsonc > /tmp/worker-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('/tmp/worker-secrets.json','utf8');
          const required=['TURSO_DATABASE_URL','TURSO_AUTH_TOKEN','AUTH_SECRET','PASSWORD_PEPPER'];
          const missing=required.filter(name=>!text.includes(name));
          if(missing.length) throw new Error(`Missing required DEV Worker secrets: ${missing.join(', ')}`);
          console.log('DEV_TURSO_SECRETS=PASS');
          console.log('DEV_AUTH_SECRETS=PASS');
          NODE

      - name: Deploy DEV Worker on Turso
        run: npx wrangler deploy --config wrangler.dev.jsonc

      - name: Verify active Worker has zero D1 bindings
        working-directory: .
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const name='waiting-trucks-report-api-dev';
          const headers={Authorization:`Bearer ${token}`};
          const deploymentsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`,{headers});
          const deployments=await deploymentsRes.json();
          if(!deploymentsRes.ok||!deployments.success) throw new Error(`deployments HTTP ${deploymentsRes.status}`);
          const active=deployments.result?.deployments?.[0];
          const versions=active?.versions||[];
          if(!versions.length) throw new Error('No active DEV version');
          const activeVersion=[...versions].sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]?.version_id;
          console.log(`ACTIVE_DEV_VERSION=${activeVersion}`);
          const settingsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/script-settings`,{headers});
          const settings=await settingsRes.json();
          if(!settingsRes.ok||!settings.success) throw new Error(`settings HTTP ${settingsRes.status}`);
          const d1=(settings.result?.bindings||[]).filter(x=>x.type==='d1'||x.type==='d1_database');
          if(d1.length) throw new Error('Active DEV Worker exposes D1');
          console.log('WORKER_D1_BINDING_ZERO=PASS');
          NODE

      - name: Smoke DEV public pages and UI v3
        working-directory: .
        run: |
          sleep 3
          node <<'NODE'
          const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          const pages=['ms.html','proof.html','waiting.html','ms-report.html'];
          const style='style.css?v=20260905-dev-shell-v3';
          async function get(path){
            const response=await fetch(path?`${base}/${path}`:`${base}/`,{headers:{'cache-control':'no-cache'},cache:'no-store'});
            const body=await response.text();
            if(!response.ok) throw new Error(`${path||'/'} HTTP ${response.status}`);
            return body;
          }
          const healthResponse=await fetch(`${base}/api?action=health`,{cache:'no-store'});
          const health=await healthResponse.json();
          if(!healthResponse.ok||!health?.ok) throw new Error('DEV health failed');
          for(const page of pages){
            const html=await get(page);
            if(!html.includes('data-dev-shell="20260905-v2"')) throw new Error(`${page} header marker missing`);
            if((html.match(/dev-shell-slot/g)||[]).length!==5) throw new Error(`${page} header slot count mismatch`);
            if(!html.includes(`href="${style}"`)) throw new Error(`${page} shared style v3 missing`);
            if(!html.includes('เปลี่ยนรหัสผ่าน')) throw new Error(`${page} password account entry missing`);
            const menuStart=html.indexOf('<div class="app-nav-menu">');
            const menuEnd=menuStart<0?-1:html.indexOf('</div></details>',menuStart);
            if(menuStart<0||menuEnd<0) throw new Error(`${page} system menu missing`);
            const menu=html.slice(menuStart,menuEnd);
            for(const href of pages) if(menu.split(`href="${href}"`).length-1!==1) throw new Error(`${page} menu missing ${href}`);
            if(!menu.includes(`href="${page}" class="is-current"`)) throw new Error(`${page} current menu wrong`);
          }
          const ms=await get('ms.html');
          const proof=await get('proof.html');
          if(!ms.includes('การเชื่อมต่อ MS (QR/HAR)')) throw new Error('MS QR/HAR entry missing');
          if(!proof.includes('ms.html#connection')) throw new Error('Proof shared connection link missing');
          const cssResponse=await fetch(`${base}/${style}`,{cache:'no-store'});
          const css=await cssResponse.text();
          if(!cssResponse.ok||!css.includes('DEV_HEADER_POLISH_V3')) throw new Error('live UI v3 CSS missing');
          for(const legacy of ['index.html','scan.html','warehouse.html']) if(!(await get(legacy)).includes('ms.html')) throw new Error(`${legacy} redirect missing`);
          if(!(await get('')).includes('ms.html')) throw new Error('DEV root entry missing');
          console.log('DEV_HEALTH=PASS');
          console.log('DEV_UI_PAGES=4');
          console.log('DEV_UI_MENU_ITEMS_PER_PAGE=4');
          console.log('DEV_UI_VISIBLE_ORDER=STATUS>REFRESH>SYSTEM_MENU>TOOLS>ACCOUNT');
          console.log(`DEV_UI_SHARED_STYLE=${style}`);
          console.log('DEV_UI_PASSWORD_ACCOUNT=PASS');
          console.log('DEV_UI_HAR_SHARED_ENTRY=PASS');
          console.log('DEV_UI_LIVE_AUDIT=PASS');
          console.log('DEV_DATABASE_BACKEND=TURSO');
          console.log('DEV_D1_RUNTIME_BINDING=0');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
