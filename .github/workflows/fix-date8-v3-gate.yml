name: Fix Date 8 Restore Gate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-date8-v3-gate.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Fix worker check directory and retrigger V3
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/restore-date8-lower-midnight-v3.yml')
          s=p.read_text()
          old='          npm run check\n'
          new='          (cd worker && npm run check)\n'
          if old not in s:
              raise SystemExit('npm gate anchor missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/restore-date8-lower-midnight-v3.yml
          git commit -m "ci: run worker check from worker directory"
          git push origin HEAD:main
