name: Owner Classic Lower Fix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/owner-classic-lower-fix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply classic lower presentation on current logic
        shell: python
        run: |
          from pathlib import Path
          import re

          def sub1(text, pattern, repl, name, flags=re.S):
              out, n = re.subn(pattern, repl, text, count=1, flags=flags)
              if n != 1:
                  raise SystemExit(f"{name}: expected exactly one match, got {n}")
              return out

          ms_path = Path("ms.js")
          style_path = Path("style.css")
          html_path = Path("ms.html")
          sw_path = Path("sw.js")
          ui_test_path = Path(".github/dev-tools/ms-unload-completion-ui.test.mjs")
          stage_path = Path(".github/dev-tools/stage-dev-runtime.mjs")
          stage_test_path = Path(".github/dev-tools/stage-dev-runtime.test.mjs")
          daily_test_path = Path(".github/dev-tools/daily-history.test.mjs")

          ms = ms_path.read_text()
          style = style_path.read_text()
          html = html_path.read_text()
          sw = sw_path.read_text()
          stage = stage_path.read_text()
          stage_test = stage_test_path.read_text()
          daily_test = daily_test_path.read_text()

          # Keep the current data architecture. Only make the displayed arrival use the
          # confirmed effective clock: Route must exist, then earliest Route/KIT/TBR wins.
          old_actual = '''  const actual = incoming
              ? row.actualArrivalAt
              : row.actualDepartureAt;'''
          new_actual = '''  const actual = incoming
              ? confirmedEffectiveArrival(row)
              : row.actualDepartureAt;'''
          if old_actual not in ms:
              raise SystemExit("scheduleSection current actual source not found")
          ms = ms.replace(old_actual, new_actual, 1)

          # One read-only detail probe per HUB/day prevents a transient lightweight zero
          # from being presented as authoritative. This is NOT polling and does not read MS.
          needle = 'let completedTodayRetryAt = 0;\n'
          if needle not in ms:
              raise SystemExit("completedTodayRetryAt marker missing")
          ms = ms.replace(needle, needle + 'let completedTodayZeroProbedKey = "";\n', 1)
          needle = '''    render();
              if (shouldHydrateCompletedTodayRows()) {'''
          replacement = '''    render();
              const zeroProbeKey = completedTodayDatasetKey();
              if (state.completedToday === 0 && completedTodayZeroProbedKey !== zeroProbeKey) {
                completedTodayZeroProbedKey = zeroProbeKey;
                const probeBranch = state.branch;
                void loadCompletedTodayRows(true)
                  .then(() => {
                    if (state.auth && state.branch === probeBranch) render();
                  })
                  .catch(() => {});
              }
              if (shouldHydrateCompletedTodayRows()) {'''
          if needle not in ms:
              raise SystemExit("loadData render/hydration anchor missing")
          ms = ms.replace(needle, replacement, 1)

          # Compact work-type labels: old black/yellow visual language, Drop gets one blue cue.
          attendance_anchor = '''function attendanceLabel(row) {
            if (isDestination(row)) return "รถเข้าคลัง";
            if (isDrop(row)) return "เข้าจุดดรอป";
            return "รอออกจากคลัง";
          }
          '''
          if attendance_anchor not in ms:
              raise SystemExit("attendanceLabel anchor missing")
          ms = ms.replace(attendance_anchor, attendance_anchor + '''function attendanceWorkLabel(row) {
            if (isDestination(row)) return "เข้า · ปลายทาง";
            if (isDrop(row)) return "ผ่าน · จุดดรอป";
            return "ออก · ต้นทาง";
          }
          ''', 1)

          # Restore the Owner-approved six-card lower summary while keeping current completed
          # hydration and all overtime/cancel logic available through the existing filters.
          classic_summary = r'''// MS_LOWER_CLASSIC_V12: Owner-approved six-card lower summary on current data truth.
          function renderFilterSummary(rows) {
            el("filter-summary").classList.remove("hidden");
            const counts = {
              waiting: 0,
              unloading: 0,
              completed: completedTodayDatasetReady()
                ? completedTodayDatasetRows().length
                : Number(state.completedToday) || 0,
              origin: 0,
              drop: 0,
            };
            for (const row of rows) {
              const key = routeState(row).key;
              const queue = queueInfo(row);
              if (isDestination(row) && key === "arrived") counts.waiting++;
              if (isDestination(row) && key === "unloading") counts.unloading++;
              if (isOrigin(row) && !queue.done && !queue.cancelled) counts.origin++;
              if (isDrop(row) && !queue.done && !queue.cancelled) counts.drop++;
            }
            const completedDisplay = completedTodayDatasetReady()
              ? nf.format(counts.completed)
              : "…";
            el("filter-summary").innerHTML = `
              <button type="button" class="summary-all ${state.summary === "all" ? "is-active" : ""}" data-summary-status="all"><span>ทั้งหมดตามตัวกรอง</span><strong>${nf.format(rows.length)}</strong></button>
              <button type="button" class="summary-wait ${state.summary === "waiting" ? "is-active" : ""}" data-summary-status="waiting"><span>รอลงรถ</span><strong>${nf.format(counts.waiting)}</strong></button>
              <button type="button" class="summary-work ${state.summary === "unloading" ? "is-active" : ""}" data-summary-status="unloading"><span>กำลังลงรถ</span><strong>${nf.format(counts.unloading)}</strong></button>
              <button type="button" class="summary-done ${state.summary === "completed" ? "is-active" : ""}" data-summary-status="completed"><span>ลงรถเสร็จ</span><strong>${completedDisplay}</strong></button>
              <button type="button" class="summary-origin ${state.summary === "origin" ? "is-active" : ""}" data-summary-status="origin"><span>รอปล่อยรถ</span><strong>${nf.format(counts.origin)}</strong></button>
              <button type="button" class="summary-drop ${state.summary === "drop" ? "is-active" : ""}" data-summary-status="drop"><span>จุดดรอป</span><strong>${nf.format(counts.drop)}</strong></button>`;
            el("filter-summary")
              .querySelectorAll("button")
              .forEach((button) => {
                button.onclick = async () => {
                  const value = button.dataset.summaryStatus;
                  if (value === "completed") {
                    try {
                      await loadCompletedTodayRows(true);
                      state.query = "";
                      state.dateFrom = "";
                      state.dateTo = "";
                      state.attendance = "all";
                      state.attribute = "all";
                      state.region = "all";
                      state.route = "all";
                      state.status = "all";
                      el("search-input").value = "";
                      el("date-from").value = "";
                      el("date-to").value = "";
                      el("attendance-filter").value = "all";
                      el("attribute-filter").value = "all";
                      el("region-filter").value = "all";
                      el("route-filter").value = "all";
                      el("status-filter").value = "all";
                      state.archiveView = true;
                      state.queue = "all";
                      el("queue-filter").value = "all";
                    } catch (error) {
                      toast(`โหลดรายการลงรถเสร็จวันนี้ไม่สำเร็จ: ${error.message}`, true);
                      return;
                    }
                  } else {
                    state.archiveView = false;
                    state.queue = "queue";
                    el("queue-filter").value = "queue";
                  }
                  state.summary = value;
                  render();
                };
              });
          }

          async function applyMetricFilter'''
          ms = sub1(
              ms,
              r'function renderFilterSummary\(rows\) \{.*?\n\}\n\nasync function applyMetricFilter',
              classic_summary,
              "renderFilterSummary",
          )

          # Replace full-cell colored operation cards/timelines with compact ordered facts.
          compact_ops = r'''function classicOperationRow(label, value, extra = "") {
            return `<div class="classic-operation-row"><span>${esc(label)}</span><strong>${value || "-"}</strong>${extra ? `<small>${esc(extra)}</small>` : ""}</div>`;
          }

          function renderOperation(row) {
            const q = queueInfo(row);
            if (q.cancelled) {
              return `<div class="classic-operation is-cancelled"><div class="classic-operation-head"><span class="classic-status-chip">ยกเลิกรถแล้ว</span></div>${classicOperationRow("ยกเลิกเมื่อ", shortDateTime(row.queueCancelledAt), row.queueCancelledBy || "")}</div>`;
            }

            if (isDestination(row)) {
              const timing = unloadTiming(row);
              const active = Number(row.unloadingState) === 1;
              const done = Number(row.unloadingState) === 2;
              const headline = done ? "ลงรถเสร็จ" : active ? "กำลังลงรถ" : timing.arrival ? "รอเริ่มลงรถ" : "รอรถถึง";
              const statusClass = timing.overStandard ? "is-danger" : active ? "is-working" : done ? "is-done" : "is-waiting";
              const duration = timing.slaMinutes === null ? "-" : `${nf.format(timing.slaMinutes)} นาที`;
              const standard = timing.standard === null ? "ยังไม่มีมาตรฐาน" : `มาตรฐาน ${nf.format(timing.standard)} นาที`;
              const warning = timing.overStandard
                ? `<div class="classic-operation-warning">เกินมาตรฐาน ${nf.format(timing.slaMinutes - timing.standard)} นาที</div>`
                : "";
              return `<div class="classic-operation destination ${statusClass}"><div class="classic-operation-head"><span class="classic-status-chip">${headline}</span><strong>${duration}</strong></div>${classicOperationRow("ถึงคลังจริง", shortDateTime(confirmedEffectiveArrival(row)))}${classicOperationRow("เริ่มลงรถ", shortDateTime(row.scheduleUnloadingStartedAt))}${done ? classicOperationRow("ลงเสร็จจริง", shortDateTime(row.unloadingCompletedAt)) : ""}<div class="classic-operation-foot"><span>${standard}</span></div>${warning}</div>`;
            }

            if (isDrop(row)) {
              const drop = dropOperation(row);
              const headline = drop.onwardDone ? "ออกจากจุดดรอปแล้ว" : drop.unloadingDone ? "ลงของเสร็จ · รอไปต่อ" : Number(row.unloadingState) === 1 ? "กำลังลงของที่จุดดรอป" : "ถึงจุดดรอป";
              const duration = drop.unloadingMinutes === null ? "-" : `${nf.format(drop.unloadingMinutes)} นาที`;
              return `<div class="classic-operation drop"><div class="classic-operation-head"><span class="classic-status-chip">${headline}</span><strong>${duration}</strong></div>${classicOperationRow("ถึงจุดดรอป", shortDateTime(confirmedEffectiveArrival(row)))}${classicOperationRow("ลงของ", drop.unloadingLabel)}${classicOperationRow("ไปต่อ", drop.onwardLabel, drop.onwardMinutes === null ? "" : `${nf.format(drop.onwardMinutes)} นาที`)}</div>`;
            }

            const routeArrival = parseDate(row.actualArrivalAt);
            const displayArrival = confirmedEffectiveArrival(row);
            const departure = parseDate(row.actualDepartureAt);
            const planned = parseDate(row.estimatedDepartureAt);
            const routeStillLoading = Number(row.unloadingState) === 1 || /กำลัง.*โหลด|loading/i.test(String(row.vehicleStatus || ""));
            const loadingComplete = !departure && !routeStillLoading && Number(row.unloadingState) === 2;
            const headline = departure ? "ออกจาก HUB แล้ว" : loadingComplete ? "รอปล่อยรถ" : "กำลังโหลดพัสดุขึ้นรถ";
            const stayMinutes = routeArrival && (departure || new Date()) >= routeArrival
              ? Math.floor(((departure || new Date()) - routeArrival) / 60000)
              : null;
            const countdown = departureCountdown(row);
            return `<div class="classic-operation origin"><div class="classic-operation-head"><span class="classic-status-chip">${headline}</span>${stayMinutes === null ? "" : `<strong>${nf.format(stayMinutes)} นาที</strong>`}</div>${classicOperationRow("ถึงคลังจริง", shortDateTime(displayArrival))}${classicOperationRow("กำหนดปล่อย", shortDateTime(planned))}${departure ? classicOperationRow("ออกจริง", shortDateTime(departure)) : ""}${countdown ? `<div class="classic-operation-foot ${countdown.key === "late" ? "is-late" : ""}"><span>${esc(countdown.label)}</span></div>` : ""}</div>`;
          }

          // LOCAL_ROUTE_BARCODE_V1'''
          ms = sub1(
              ms,
              r'function operationIcon\(kind\) \{.*?\nfunction renderOperation\(row\) \{.*?\n\}\n\n// LOCAL_ROUTE_BARCODE_V1',
              compact_ops,
              "operation renderer",
          )

          # Work type labels in both table and mobile header.
          ms = ms.replace(
              '${esc(normalizeAttendance(row.attendanceType) || "-")}',
              '${esc(attendanceWorkLabel(row))}',
          )

          # Move work type into the mobile header and remove its own tall section.
          old_tag = '<div class="compact-card-tags"><span class="vehicle-chip">${esc(row.vehicleType || "-")}</span></div>'
          new_tag = '<div class="compact-card-tags"><span class="vehicle-chip">${esc(row.vehicleType || "-")}</span><span class="type-badge ${attendanceClass}">${esc(attendanceWorkLabel(row))}</span></div>'
          if old_tag not in ms:
              raise SystemExit("mobile compact-card-tags anchor missing")
          ms = ms.replace(old_tag, new_tag, 1)
          ms = re.sub(
              r'\n\s*<div class="compact-attendance"><span class="type-badge \$\{attendanceClass\}">\$\{esc\(attendanceWorkLabel\(row\)\)\}</span><small>\$\{attendanceLabel\(row\)\}</small></div>',
              '',
              ms,
              count=1,
          )

          # Barcode stays at integer module width and scrolls when needed; no runtime CSS injection.
          old_svg = 'return `<svg class="local-barcode-svg" viewBox="0 0 ${total} ${barHeight + labelHeight}" role="img" aria-label="บาร์โค้ด ${esc(text)}" xmlns="http://www.w3.org/2000/svg">'
          new_svg = 'return `<svg class="local-barcode-svg" width="${total}" height="${barHeight + labelHeight}" viewBox="0 0 ${total} ${barHeight + labelHeight}" shape-rendering="crispEdges" role="img" aria-label="บาร์โค้ด ${esc(text)}" xmlns="http://www.w3.org/2000/svg">'
          if old_svg not in ms:
              raise SystemExit("barcode SVG anchor missing")
          ms = ms.replace(old_svg, new_svg, 1)
          ms = sub1(
              ms,
              r'function installLocalBarcodeStyle\(\) \{.*?\n\}\ninstallLocalBarcodeStyle\(\);',
              '// Barcode presentation is first-class in style.css; no runtime style injection.',
              "barcode runtime style",
          )

          # Replace the one canonical lower visual tail, not by stacking another CSS generation.
          marker = '/* MS_LOWER_CANONICAL_V11: one production visual system below frozen upper metrics. */'
          if marker not in style:
              raise SystemExit("canonical lower CSS marker missing")
          classic_css = r'''/* MS_LOWER_CLASSIC_V12: Owner-approved classic lower UI; current data logic remains unchanged. */
          .ms-page{--ms-drop:#1978ba;--ms-line:#e2e6e8;--ms-ink:#20262b}
          .ms-page #filter-summary{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:14px 0 18px}
          .ms-page #filter-summary button{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0;min-height:58px;padding:10px 14px;border:1px solid #d4d7d9;border-radius:8px;background:#fff;color:#202124;box-shadow:0 1px 3px #0000000d;text-align:left;cursor:pointer}
          .ms-page #filter-summary button:hover{border-color:#9da3a7;background:#fffdf3}.ms-page #filter-summary button span{font-size:12px;font-weight:800;color:#202124}.ms-page #filter-summary button strong{font-size:25px;font-weight:900;line-height:1;color:#111;font-variant-numeric:tabular-nums}.ms-page #filter-summary button:focus-visible{outline:2px solid #151515;outline-offset:2px}.ms-page #filter-summary button.is-active{border-color:#d8b500;background:#fff8d6;box-shadow:inset 0 -3px #ffd400,0 1px 3px #00000012}
          .ms-page .table-panel{background:#fff}.ms-page .table-scroll{max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain}.ms-page .ms-table{width:100%;min-width:1280px;border-collapse:separate;border-spacing:0;background:#fff}.ms-page .ms-table thead th{background:#1f2428;color:#fff;text-align:center;vertical-align:middle;border-color:#32393e;font-size:12px;font-weight:850}.ms-page .ms-table tbody tr,.ms-page .ms-table tbody tr:nth-child(even),.ms-page .ms-table tbody tr.is-unloading{background:#fff}.ms-page .ms-table tbody td{padding:12px 10px;border-color:#e6e9eb;background:#fff;vertical-align:middle}.ms-page .ms-table tbody tr:nth-child(even) td{background:#fdfdfc}.ms-page .ms-table tbody tr:hover td{background:#fffbed}
          .ms-page .ms-table .col-route{width:23%}.ms-page .ms-table .col-meta{width:12%}.ms-page .ms-table .col-work{width:10%}.ms-page .ms-table .col-schedule{width:25%}.ms-page .ms-table .col-status{width:18%}.ms-page .ms-table .col-company{width:12%}.ms-page .route-summary{text-align:left}.ms-page .route-title{font-size:13px;line-height:1.45}.ms-page .route-code strong{font-size:14px}.ms-page .attendance-cell{display:grid;justify-items:center;gap:7px;text-align:center}.ms-page .attendance-cell .row-muted{color:#555d62;font-size:11px;font-weight:700}.ms-page .type-badge{display:inline-flex;align-items:center;justify-content:center;min-width:88px;padding:6px 10px;border:1px solid #151515;border-radius:999px;font-size:11px;font-weight:850;line-height:1.15;white-space:nowrap}.ms-page .type-badge.inbound{background:#ffd400;color:#111;border-color:#c7a400}.ms-page .type-badge.outbound{background:#202124;color:#fff;border-color:#202124}.ms-page .type-badge.drop{background:#1978ba;color:#fff;border-color:#135f93}
          .ms-page .schedule-stack.single{gap:0;overflow:hidden;border:1px solid #dfe4e7;border-radius:10px;background:#fff;box-shadow:none;text-align:center}.ms-page .schedule-stack.single .schedule-section.arrival{margin:0;padding:0 0 10px;border:0;border-radius:0;background:#fff;box-shadow:none}.ms-page .schedule-stack.single .schedule-heading{padding:9px 12px 5px;border:0;background:#f6f7f7;color:#30383e;font-size:13px;font-weight:850}.ms-page .schedule-stack.single .schedule-values{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:7px 12px 2px}.ms-page .schedule-stack.single .schedule-values:after{content:"";position:absolute;left:50%;top:9px;bottom:4px;width:1px;background:#e8ecee}.ms-page .schedule-stack.single .schedule-values>span{min-width:0;padding:0;border:0}.ms-page .schedule-stack.single .schedule-values b{display:block;margin:0 0 4px;color:#778188;font-size:12px;font-weight:750}.ms-page .schedule-stack.single .schedule-values strong{display:block;color:#151515;font-size:14px;line-height:1.35;font-weight:900;font-variant-numeric:tabular-nums}.ms-page .schedule-stack.single .timing-chip{display:table;margin:8px auto 0;padding:5px 10px;border-radius:999px;font-size:12px}.ms-page .schedule-stack.single .arrival-system-row{margin:0;border:0;border-top:1px solid #e7ebed;background:#f7f8f8}.ms-page .arrival-system-row>div{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;padding:5px 6px 8px}.ms-page .arrival-system-row>div span{display:flex;min-width:0;flex-direction:column;align-items:center;gap:4px;padding:5px 6px;color:#707b82;font-size:12px;font-weight:750}.ms-page .arrival-system-row>div span+span{border-left:1px solid #e7ebed}.ms-page .arrival-system-row em{font-style:normal;font-size:12px;font-weight:850;color:#5c6870}.ms-page .arrival-source-value{display:flex;min-width:0;flex-direction:column;gap:1px;color:#20272c;font-size:13px;font-weight:850;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums}
          .ms-page .classic-operation{display:grid;gap:7px;padding:2px 3px;text-align:left;color:#202124}.ms-page .classic-operation-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0}.ms-page .classic-operation-head>strong{font-size:18px;font-weight:900;line-height:1;white-space:nowrap;color:#111}.ms-page .classic-status-chip{display:inline-flex;align-items:center;min-height:27px;padding:5px 8px;border:1px solid #202124;border-radius:6px;background:#202124;color:#fff;font-size:11px;font-weight:850;line-height:1.2}.ms-page .classic-operation.destination.is-working .classic-status-chip{background:#ffd400;border-color:#c7a400;color:#111}.ms-page .classic-operation.drop .classic-status-chip{background:#1978ba;border-color:#135f93;color:#fff}.ms-page .classic-operation.is-cancelled .classic-status-chip{background:#fff;color:#9b1c1c;border-color:#b3261e}.ms-page .classic-operation-row{display:grid;grid-template-columns:minmax(72px,.8fr) minmax(0,1.2fr);align-items:baseline;gap:4px 8px;padding:5px 0;border-bottom:1px solid #eceeed}.ms-page .classic-operation-row>span{color:#6a7277;font-size:11px;font-weight:700}.ms-page .classic-operation-row>strong{min-width:0;color:#202124;font-size:12px;font-weight:850;line-height:1.35}.ms-page .classic-operation-row>small{grid-column:2;color:#737b80;font-size:10px;font-weight:700}.ms-page .classic-operation-foot{padding:5px 0;color:#576067;font-size:11px;font-weight:750}.ms-page .classic-operation-foot.is-late,.ms-page .classic-operation-warning{color:#b3261e;font-weight:850}.ms-page .classic-operation-warning{padding:5px 0;font-size:11px}
          .ms-page .local-route-barcode{margin-top:8px}.ms-page .local-barcode-toggle{appearance:none;border:1px solid #c7a000;background:#ffd53d;color:#161616;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:850;cursor:pointer}.ms-page .local-barcode-panel{margin-top:7px;padding:8px;background:#fff;border:1px solid #cfd5d9;border-radius:8px;max-width:100%;overflow-x:auto;overscroll-behavior-inline:contain}.ms-page .local-barcode-svg{display:block;width:auto!important;max-width:none!important;height:80px;shape-rendering:crispEdges}.ms-page .local-barcode-error{font-size:12px;color:#a51f1f;font-weight:700}.ms-page .compact-card-head .local-route-barcode{display:flex;flex-direction:column;align-items:center}.ms-page .compact-card-head .local-barcode-panel{width:100%}
          @media(min-width:1201px){.ms-page #filter-summary{grid-template-columns:repeat(6,minmax(0,1fr))}.ms-page #desktop-table{display:block}.ms-page #mobile-cards{display:none}}@media(min-width:701px) and (max-width:1200px){.ms-page #filter-summary{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:1024px){.ms-page #desktop-table{display:none}.ms-page #mobile-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.ms-page .compact-card{min-width:0;max-width:100%;overflow:hidden}.ms-page .compact-card-tags{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px}.ms-page .compact-card .classic-operation{margin:0 12px 12px;padding:0}.ms-page .compact-schedule{padding:10px;background:#f7f8f8}}@media(max-width:700px){.ms-page #filter-summary{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.ms-page #filter-summary button{min-height:54px;padding:9px 10px}.ms-page #filter-summary button span{font-size:11px}.ms-page #filter-summary button strong{font-size:22px}.ms-page #mobile-cards{grid-template-columns:1fr;gap:9px}.ms-page .compact-card{width:100%;max-width:100%;margin:0;overflow:hidden}.ms-page .compact-card-head{padding-bottom:9px}.ms-page .classic-operation-head>strong{font-size:17px}.ms-page .local-barcode-toggle{min-height:38px;font-size:13px}}@media(max-width:430px){.ms-page .app-shell{padding-left:8px;padding-right:8px}.ms-page #filter-summary button{min-height:52px;padding:8px}.ms-page .compact-schedule{padding:8px}.ms-page .arrival-system-row>div span{padding-left:3px;padding-right:3px}.ms-page .arrival-source-value{font-size:12px}.ms-page .classic-operation{gap:5px}.ms-page .classic-operation-row{grid-template-columns:68px minmax(0,1fr)}}html.ms-desktop-site-phone .ms-page #desktop-table{display:block;max-width:100%;overflow-x:auto}html.ms-desktop-site-phone .ms-page #mobile-cards{display:none}html.ms-desktop-site-phone .ms-page .ms-table{min-width:1320px}
          '''
          style = style[:style.index(marker)] + classic_css.strip() + "\n"

          # Staging must preserve the integrated classic presentation instead of injecting
          # legacy 8-card/cancelled-summary patches over it.
          old_stage_front = '''  output = patchMsRouteCancellationFrontend(output);
            output = patchMsNonDestinationCancellationFrontend(output);
            output = patchMsFastAllCancelledFrontend(output);
            output = patchMsSummaryPerformanceFrontend(output);'''
          new_stage_front = '''  output = patchMsRouteCancellationFrontend(output);
            output = patchMsNonDestinationCancellationFrontend(output);
            if (!output.includes("MS_LOWER_CLASSIC_V12")) {
              output = patchMsFastAllCancelledFrontend(output);
              output = patchMsSummaryPerformanceFrontend(output);
            }'''
          if old_stage_front not in stage:
              raise SystemExit("stageFrontend summary patch anchor missing")
          stage = stage.replace(old_stage_front, new_stage_front, 1)
          old_stage_style = '''export function stageStyle(source) {
            return patchDevUnifiedHeaderStyle(
              patchMsSummaryPerformanceStyle(
                patchMsRouteCancellationStyle(patchDevMsMobileStyle(source)),
              ),
            );
          }'''
          new_stage_style = '''export function stageStyle(source) {
            const base = patchMsRouteCancellationStyle(patchDevMsMobileStyle(source));
            const lower = base.includes("MS_LOWER_CLASSIC_V12")
              ? base
              : patchMsSummaryPerformanceStyle(base);
            return patchDevUnifiedHeaderStyle(lower);
          }'''
          if old_stage_style not in stage:
              raise SystemExit("stageStyle anchor missing")
          stage = stage.replace(old_stage_style, new_stage_style, 1)

          # New release revision. Service worker remains freshness-only.
          old_rev = "20260909-04-overtime-snapshot"
          new_rev = "20260909-05-classic-lower"
          if old_rev not in html or old_rev not in sw or old_rev not in daily_test:
              raise SystemExit("asset revision anchor missing")
          html = html.replace(old_rev, new_rev)
          sw = sw.replace(old_rev, new_rev)
          daily_test = daily_test.replace(old_rev, new_rev)

          # Regression suite: classic visual contract + current data truth.
          ui_test = r'''import assert from "node:assert/strict";
          import { readFile } from "node:fs/promises";
          import vm from "node:vm";
          import test from "node:test";
          const root=new URL("../../",import.meta.url);
          const files=await Promise.all(["ms.js","style.css","ms.html","sw.js"].map(p=>readFile(new URL(p,root),"utf8")));
          const front=files[0],style=files[1],html=files[2],sw=files[3];
          const between=(text,a,b)=>{const x=text.indexOf(a),y=text.indexOf(b,x+a.length);assert.ok(x>=0&&y>x,"missing block "+a);return text.slice(x,y)};
          const visual=style.split("MS_LOWER_CLASSIC_V12")[1]||"";
          function loadTiming(){const src=between(front,"function unloadTiming","function isCompletedUnloadOverStandard");const ctx={Date,state:{standards:{"6W":45}},parseDate(v){if(!v)return null;const d=v instanceof Date?v:new Date(v);return Number.isNaN(d.getTime())?null:d},normalizeVehicle(){return "6W"},unloadStandard(){return 45},isDestination(){return true}};vm.createContext(ctx);vm.runInContext(src+";globalThis.fn=unloadTiming",ctx);return ctx.fn}
          test("frozen upper metric markup and classic six lower cards",()=>{assert.equal((html.match(/class="metric-card/g)||[]).length,8);const r=between(front,"function renderFilterSummary(rows)","async function applyMetricFilter");assert.equal((r.match(/data-summary-status=/g)||[]).length,6);for(const key of ["all","waiting","unloading","completed","origin","drop"])assert.match(r,new RegExp(`data-summary-status="${key}"`));assert.doesNotMatch(r,/data-summary-status="(?:unload-overtime|cancelled)"/)});
          test("classic black yellow presentation is one lower visual generation",()=>{assert.equal((style.match(/MS_LOWER_CLASSIC_V12/g)||[]).length,1);assert.doesNotMatch(style,/MS_LOWER_CANONICAL_V11/);assert.match(visual,/grid-template-columns:repeat\(6,minmax\(0,1fr\)\)/);assert.match(visual,/button\.is-active\{[^}]*background:#fff8d6/);assert.match(visual,/type-badge\.inbound\{background:#ffd400;color:#111/);assert.match(visual,/type-badge\.outbound\{background:#202124;color:#fff/);assert.match(visual,/type-badge\.drop\{background:#1978ba;color:#fff/);assert.doesNotMatch(visual,/\.metric-card|\.ms-metrics|data-metric/)});
          test("arrival display requires Route confirmation then uses earliest Route KIT TBR",()=>{const schedule=between(front,"function scheduleSection(row, mode)","function queueInfo");assert.match(schedule,/\? confirmedEffectiveArrival\(row\)/);const src=between(front,"function effectiveArrival(row)","function attendanceLabel(row)");const ctx={parseDate(v){if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d}};vm.createContext(ctx);vm.runInContext(src+";globalThis.fn=confirmedEffectiveArrival",ctx);assert.equal(ctx.fn({actualArrivalAt:"2026-09-09T09:09:00Z",scheduleKitArrivalAt:"2026-09-09T09:09:00Z",scheduleTbrArrivalAt:"2026-09-09T08:10:00Z"}).toISOString(),"2026-09-09T08:10:00.000Z");assert.equal(ctx.fn({scheduleKitArrivalAt:"2026-09-09T09:09:00Z",scheduleTbrArrivalAt:"2026-09-09T08:10:00Z"}),null)});
          test("171 45 gives 126 and S E is 46",()=>{const t=loadTiming()({unloadingState:2,actualArrivalAt:"2026-09-08T15:56:00Z",scheduleUnloadingStartedAt:"2026-09-08T18:01:00Z",unloadingCompletedAt:"2026-09-08T18:47:00Z"},new Date("2026-09-08T18:47:00Z"));assert.equal(t.slaMinutes,171);assert.equal(t.workMinutes,46);assert.equal(t.standard,45);assert.equal(t.overStandard,true);assert.equal(t.slaMinutes-t.standard,126)});
          test("active current SLA excluded from completed overtime",()=>{const t=loadTiming()({unloadingState:1,actualArrivalAt:"2026-09-08T17:40:00Z",scheduleUnloadingStartedAt:"2026-09-08T17:50:00Z"},new Date("2026-09-08T18:40:00Z"));assert.equal(t.slaMinutes,60);assert.equal(t.overStandard,false);assert.match(front,/function isCompletedTodayOvertime/)});
          test("overtime still shares completed-today authority",()=>{assert.match(front,/function isCompletedTodayOvertime/);assert.match(front,/function completedTodayOvertimeRows/);assert.match(front,/state\.status === "unload-overtime" && isCompletedTodayOvertime\(row\)/);assert.equal((front.match(/apiGet\("msCompletedToday"/g)||[]).length,1)});
          test("completed detail and transient zero use read-only detail without extra polling",()=>{assert.match(front,/completedTodayZeroProbedKey/);assert.match(front,/state\.completedToday === 0 && completedTodayZeroProbedKey !== zeroProbeKey/);assert.match(front,/void loadCompletedTodayRows\(true\)/);assert.match(front,/setInterval\(\(\) => state\.auth && loadData\(true\), CONFIG\.pollMs\)/);assert.match(front,/pollMs:\s*4000/)});
          test("status cell is compact ordered facts not full-cell operation card",()=>{const table=between(front,"function tableRow(row)","function card(row)");const card=between(front,"function card(row)","let cancelRouteTarget");assert.match(front,/function renderOperation\(row\)/);assert.match(front,/classic-operation-row/);assert.match(table,/operationHtml/);assert.match(card,/renderOperation\(row\)/);assert.doesNotMatch(front,/class="lower-operation/);assert.doesNotMatch(front,/operationTimeline\(/)});
          test("work type is compact and mobile moves it into header",()=>{assert.match(front,/function attendanceWorkLabel/);assert.match(front,/เข้า · ปลายทาง/);assert.match(front,/ออก · ต้นทาง/);assert.match(front,/ผ่าน · จุดดรอป/);const card=between(front,"function card(row)","let cancelRouteTarget");assert.match(card,/compact-card-tags[\s\S]*type-badge/);assert.doesNotMatch(card,/compact-attendance/)});
          test("barcode keeps integer geometry and has no runtime CSS injection",()=>{assert.match(front,/shape-rendering="crispEdges"/);assert.match(front,/width="\$\{total\}" height="\$\{barHeight \+ labelHeight\}"/);assert.doesNotMatch(front,/installLocalBarcodeStyle/);assert.match(visual,/local-barcode-panel[^}]*overflow-x:auto/);assert.match(visual,/local-barcode-svg[^}]*max-width:none!important/)});
          test("phone desktop site contract remains unchanged",()=>{const src=between(front,"function isPhoneDesktopSiteLayout(","function renderRowsProgressively(rows)");const ctx={};vm.createContext(ctx);vm.runInContext(src+";globalThis.desktop=isPhoneDesktopSiteLayout;globalThis.mobile=useMobileCardLayout",ctx);for(const w of [375,390,412,430])assert.equal(ctx.mobile(w,w,800),true);for(const w of [768,820,1024])assert.equal(ctx.mobile(w,w,1200),true);for(const w of [980,1024]){assert.equal(ctx.desktop(w,390,844),true);assert.equal(ctx.mobile(w,390,844),false)}for(const w of [1280,1366,1440,1920])assert.equal(ctx.mobile(w,390,844),false);assert.doesNotMatch(src,/userAgent|Android|iPhone|Samsung/i);assert.match(visual,/html\.ms-desktop-site-phone \.ms-page #desktop-table\{display:block/)});
          test("service worker freshness only with classic release",()=>{assert.match(sw,/20260909-05-classic-lower/);assert.match(sw,/cache: "no-store"/);assert.doesNotMatch(sw,/MS_JS_HOTFIX|MS_CSS_HOTFIX|String\.raw|appendPatch|style\.textContent/)});
          '''

          # Staging regression expectations: six cards; cancellation remains operational but no
          # longer consumes a summary card.
          stage_test = stage_test.replace(
              'assert.match(first, /data-summary-status="cancelled"/);',
              'assert.doesNotMatch(first, /data-summary-status="cancelled"/);',
              1,
          )
          stage_test = sub1(
              stage_test,
              r'test\("cancelled summary resets daily without clearing persisted cancellation", \(\) => \{.*?\n\}\);\n\ntest\("only origin rows expose manual cancellation"',
              '''test("cancellation remains operational without occupying a classic summary card", () => {
            const first = stageFrontend(frontendSource);
            assert.doesNotMatch(first, /summary-cancelled/);
            assert.doesNotMatch(first, /data-summary-status="cancelled"/);
            assert.match(first, /function isCancelledToday\(row, now = new Date\(\)\)/);
            assert.match(first, /queueCancelledAt/);
            assert.match(first, /data-cancel-ms-route/);
          });

          test("only origin rows expose manual cancellation"''',
              "stage cancelled summary test",
          )
          stage_test = sub1(
              stage_test,
              r'test\("eight lower summary cards stay on one desktop row", \(\) => \{.*?\n\}\);',
              '''test("classic six lower summary cards stay on one desktop row", () => {
            const first = stageStyle(styleSource);
            assert.match(first, /MS_LOWER_CLASSIC_V12/);
            assert.match(first, /grid-template-columns:repeat\\\(6,minmax\\\(0,1fr\\\)\\\)/);
            assert.doesNotMatch(first, /MS_LOWER_CANONICAL_V11/);
          });''',
              "stage six summary test",
          )
          stage_test = sub1(
              stage_test,
              r'test\("DEV staging integrates mobile spacing and route cancellation controls once", \(\) => \{.*?\n\}\);',
              '''test("DEV staging preserves classic lower UI and route cancellation controls once", () => {
            const first = stageStyle(styleSource);
            assert.match(first, /DEV mobile MS card spacing/);
            assert.match(first, /MS route cancellation controls/);
            assert.match(first, /MS_LOWER_CLASSIC_V12/);
            assert.equal(stageStyle(first), first);
          });''',
              "stage style idempotence test",
          )

          ms_path.write_text(ms)
          style_path.write_text(style)
          html_path.write_text(html)
          sw_path.write_text(sw)
          stage_path.write_text(stage)
          stage_test_path.write_text(stage_test)
          daily_test_path.write_text(daily_test)
          ui_test_path.write_text(ui_test)

      - name: Validate patched frontend and regression gates
        run: |
          node --check ms.js
          node --test .github/dev-tools/ms-unload-completion-ui.test.mjs
          node --test .github/dev-tools/ms-summary-filter.test.mjs
          node --test .github/dev-tools/daily-history.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
      - name: Commit fix-forward to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ms.js style.css ms.html sw.js .github/dev-tools/ms-unload-completion-ui.test.mjs .github/dev-tools/ms-summary-filter.test.mjs .github/dev-tools/daily-history.test.mjs .github/dev-tools/stage-dev-runtime.mjs .github/dev-tools/stage-dev-runtime.test.mjs
          git commit -m "fix: restore classic lower UI on current MS truth"
          git push origin HEAD:main
