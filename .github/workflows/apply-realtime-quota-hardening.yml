name: Apply Realtime Quota Hardening

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-realtime-quota-hardening.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  harden:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      CLEAN_BASE: 67c245f5b733bbae83cd0feb1924aa0ae3ba2cec
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Rebuild authoritative worker without staged-runtime contamination
        run: |
          rm -rf /tmp/realtime-rebuild
          git worktree add --detach /tmp/realtime-rebuild "$CLEAN_BASE"
          (
            cd /tmp/realtime-rebuild
            python3 .tmp/realtime_quota_hardening.py
          )
          cp /tmp/realtime-rebuild/worker/src/index.js worker/src/index.js
          git worktree remove --force /tmp/realtime-rebuild
          grep -q 'MS_REALTIME_WS_V1' worker/src/index.js
          grep -q 'HUB_SETTINGS_CACHE_V1' worker/src/index.js
          if grep -q 'DEV_ROOT_ENTRY_V1' worker/src/index.js; then
            echo 'canonical worker contains staged DEV root mutation' >&2
            exit 1
          fi
          echo 'AUTHORITATIVE_WORKER_REBUILD=PASS'

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Syntax checks
        run: |
          node --check ms.js
          node --check worker/src/index.js
          node --check worker/src/proof-control.js
          node --check worker/src/turso-index.js
          node --check .github/dev-tools/patch-ms-durable-coordinator.mjs
          node --check .github/dev-tools/patch-ms-completed-view-stability.mjs
          node --check .github/dev-tools/stage-dev-runtime.mjs

      - name: Realtime and quota regressions
        run: |
          node --test .github/dev-tools/realtime-quota-hardening.test.mjs
          node --test .github/dev-tools/ms-durable-coordinator.test.mjs
          node --test .github/dev-tools/ms-quota-safe-live.test.mjs
          node --test .github/dev-tools/ms-multiclient-dedupe.test.mjs
          node --test worker/tests/hbi-truck-photos.test.mjs

      - name: Worker full check
        working-directory: worker
        run: npm run check

      - name: Diff check
        run: git diff --check

      - name: Verify staged runtime on copies only
        run: |
          rm -rf worker/.dev-assets
          mkdir -p worker/.dev-assets
          cp ms.js worker/.dev-assets/ms.js
          cp style.css worker/.dev-assets/style.css
          cp ms.html proof.html waiting.html ms-report.html worker/.dev-assets/
          cp worker/src/index.js worker/.dev-assets/index.js
          cp worker/src/origin-manifest-v1.js worker/.dev-assets/origin-manifest-v1.js
          node .github/dev-tools/stage-dev-runtime.mjs worker/.dev-assets/ms.js worker/.dev-assets/index.js
          node .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs worker/.dev-assets/ms.js worker/.dev-assets/origin-manifest-v1.js
          node --check worker/.dev-assets/ms.js
          node --check worker/.dev-assets/index.js
          node --check worker/src/index.js
          grep -q 'MS_REALTIME_WS_V1' worker/.dev-assets/ms.js
          grep -q 'MS_REALTIME_WS_V1' worker/.dev-assets/index.js
          grep -q 'HUB_SETTINGS_CACHE_V1' worker/.dev-assets/index.js
          if grep -q 'DEV_ROOT_ENTRY_V1' worker/src/index.js; then
            echo 'staging mutated canonical worker' >&2
            exit 1
          fi
          echo 'STAGED_REALTIME_QUOTA_HARDENING=PASS'
          echo 'CANONICAL_SOURCE_UNTOUCHED_BY_STAGING=PASS'

      - name: Commit corrected authoritative source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.js
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No authoritative source correction required' >&2
            exit 1
          fi
          git commit -m 'fix(dev): keep realtime hardening in authoritative worker source'
          git push origin HEAD:main
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch and wait for DEV deploy
        run: |
          gh workflow run deploy-worker-dev.yml --ref main
          RUN_ID=''
          for i in $(seq 1 50); do
            RUN_ID=$(gh run list --workflow deploy-worker-dev.yml --branch main --limit 15 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_HEAD\") | .databaseId" | head -n1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then echo 'DEV deploy run not found' >&2; exit 1; fi
          echo "DEV_DEPLOY_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Dispatch and wait for live acceptance
        run: |
          gh workflow run current-system-acceptance.yml --ref main
          RUN_ID=''
          for i in $(seq 1 50); do
            RUN_ID=$(gh run list --workflow current-system-acceptance.yml --branch main --limit 15 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_HEAD\") | .databaseId" | head -n1)
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then echo 'Live acceptance run not found' >&2; exit 1; fi
          echo "LIVE_ACCEPTANCE_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Read-only Turso quota snapshot
        env:
          TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
          TURSO_ORG: flashdevnak
          TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
        run: |
          node <<'NODE'
          (async()=>{
            const token=process.env.TURSO_PLATFORM_API_TOKEN;
            if(!token) throw new Error('TURSO_PLATFORM_API_TOKEN missing');
            const headers={Authorization:`Bearer ${token}`};
            async function get(path){
              const response=await fetch(`https://api.turso.tech${path}`,{headers});
              const body=await response.json();
              if(!response.ok) throw new Error(`${path} HTTP ${response.status}`);
              return body;
            }
            const [organizations,usage,stats]=await Promise.all([
              get('/v1/organizations'),
              get(`/v1/organizations/${process.env.TURSO_ORG}/usage`),
              get(`/v1/organizations/${process.env.TURSO_ORG}/databases/${process.env.TURSO_DATABASE}/stats`),
            ]);
            const org=(Array.isArray(organizations)?organizations:[]).find(x=>x.slug===process.env.TURSO_ORG)||{};
            const u=usage.organization?.usage||{};
            console.log(`TURSO_PLAN=${org.plan_id||'-'}`);
            console.log(`TURSO_BLOCKED_READS=${Boolean(org.blocked_reads)}`);
            console.log(`TURSO_BLOCKED_WRITES=${Boolean(org.blocked_writes)}`);
            console.log(`TURSO_BILLING_ROWS_READ=${Number(u.rows_read||0)}`);
            console.log(`TURSO_BILLING_ROWS_WRITTEN=${Number(u.rows_written||0)}`);
            const top=(stats.top_queries||[]).slice(0,10).map((q,i)=>({rank:i+1,rowsRead:Number(q.rows_read||0),rowsWritten:Number(q.rows_written||0),query:String(q.query||'').replace(/'[^']*'/g,"'?'").replace(/\b\d+\b/g,'?').slice(0,180)}));
            console.log(`TURSO_TOP_QUERIES=${JSON.stringify(top)}`);
            console.log('TURSO_QUOTA_SNAPSHOT=PASS');
          })().catch((error)=>{console.error(error);process.exit(1);});
          NODE

      - name: Final checkpoint
        run: |
          echo "SOURCE_HEAD=$SOURCE_HEAD"
          echo "DEV_DEPLOY_RUN_ID=$DEV_DEPLOY_RUN_ID"
          echo "LIVE_ACCEPTANCE_RUN_ID=$LIVE_ACCEPTANCE_RUN_ID"
          echo 'PRODUCTION_TOUCHED=NO'
