name: Root-fix HBI photo auth and mobile manifest once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-photo-mobile-manifest-root-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard exact parent
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=98d04c3b5ef8cba889ac754df76e6802ebedf1ed
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }

      - name: Patch authoritative sources in place
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new, label):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 anchor, got {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          def sub_once(path, pattern, replacement, label, flags=0):
              text = path.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              path.write_text(updated, encoding='utf-8')

          # 1) Mobile: remove the existing <=430px rule that explicitly forced
          #    LH Manifest parcel/weight from the canonical two columns into one column.
          html = Path('ms.html')
          replace_once(
              html,
              '''      @media (max-width: 430px) {\n        .ms-page .origin-manifest-badge { grid-template-columns: 1fr !important; }\n      }\n''',
              '',
              'remove canonical one-column manifest override',
          )

          # 2) HBI connection status: dedicated Fleet Load Info HAR is the only photo authority.
          front = Path('ms.js')
          replace_once(
              front,
              '''      const manifestPhotoFallback = key === "hbiPhotos" && globalThis.__MS_ORIGIN_MANIFEST_HBI_FALLBACK__ === true;\n      node.className = item?.configured\n        ? (item.lastError ? "source-error" : "source-ok")\n        : manifestPhotoFallback\n          ? "source-ok"\n          : "source-missing";\n      node.textContent = !item?.configured\n        ? manifestPhotoFallback\n          ? "พร้อมใช้งานผ่าน LH Manifest · รูปโหลดเฉพาะเมื่อกดดูรูปท้ายรถ"\n          : "ยังไม่ได้อัปโหลด"\n        : key === "hbiPhotos"\n''',
              '''      node.className = item?.configured\n        ? (item.lastError ? "source-error" : "source-ok")\n        : "source-missing";\n      node.textContent = !item?.configured\n        ? key === "hbiPhotos"\n          ? "ยังไม่ได้อัปโหลด HAR รูปท้ายรถ"\n          : "ยังไม่ได้อัปโหลด"\n        : key === "hbiPhotos"\n''',
              'remove false LH Manifest photo-ready status',
          )

          # 3) Worker: do not reuse LH Manifest auth for fleet/loadInfoList.
          worker = Path('worker/src/index.js')
          replace_once(
              worker,
              'import { originManifestHbiCredentials } from "./origin-manifest-v1.js";\n',
              '',
              'remove LH Manifest photo credential import',
          )
          replace_once(
              worker,
              '''    // HBI_PHOTO_MANIFEST_FALLBACK_V2: prefer a dedicated HBI session when present,\n    // otherwise reuse the already-configured LH Manifest HBI session. This path\n    // is entered only after a user click; it adds no 4-second polling or writes.\n''',
              '''    // HBI_PHOTO_DEDICATED_SESSION_V3: fleet/loadInfoList uses only the dedicated\n    // Fleet Load Info HAR session. LH Manifest is a different HBI session and is never\n    // substituted here. This path is click-only and adds no polling or writes.\n''',
              'replace photo fallback contract comment',
          )
          replace_once(
              worker,
              '''    let credentials = null;\n    let credentialSource = "";\n    if (route.credentials_cipher) {\n      try {\n        credentials = JSON.parse(await decryptMs(route.credentials_cipher, env));\n        credentialSource = "HBI_HAR";\n      } catch (error) {\n        console.warn(JSON.stringify({ event: "hbi_photo_dedicated_session_error", hub, message: error?.message || String(error) }));\n      }\n    }\n    if (!credentials) {\n      credentials = await originManifestHbiCredentials(env, actor, hub);\n      if (credentials) credentialSource = "LH_MANIFEST";\n    }\n    if (!credentials)\n      fail(`HUB ${hub} ยังไม่มี Session HBI ที่ใช้ดูรูปท้ายรถ · เชื่อม LH Manifest หรืออัปโหลด HAR รูปท้ายรถ`, "HBI_PHOTOS_NOT_CONFIGURED", 409);\n\n    const value = await readHbiTruckPhotos(credentials, proofId, route.estimated_arrival_at);\n    rememberHbiPhoto(cacheKey, value);\n    return { ...value, upstreamCalls: 1, cache: "miss", credentialSource };\n''',
              '''    let credentials = null;\n    if (route.credentials_cipher) {\n      try {\n        credentials = JSON.parse(await decryptMs(route.credentials_cipher, env));\n      } catch (error) {\n        console.warn(JSON.stringify({ event: "hbi_photo_dedicated_session_error", hub, message: error?.message || String(error) }));\n      }\n    }\n    if (!credentials)\n      fail(`HUB ${hub} ยังไม่ได้อัปโหลด HAR รูปท้ายรถ (HBI) · เปิด Fleet Load Info แล้วบันทึกที่แหล่ง 4`, "HBI_PHOTOS_NOT_CONFIGURED", 409);\n\n    const value = await readHbiTruckPhotos(credentials, proofId, route.estimated_arrival_at);\n    rememberHbiPhoto(cacheKey, value);\n    return { ...value, upstreamCalls: 1, cache: "miss", credentialSource: "HBI_HAR" };\n''',
              'make photo source dedicated-only',
          )
          replace_once(
              worker,
              '''  for (const key of ["auth", "lang", "fbid", "time", "webSign", "_from"]) {\n    const value = credentials?.[key];\n    if (value !== undefined && value !== null) url.searchParams.set(key, value);\n  }\n''',
              '''  for (const key of ["auth", "lang", "fbid", "time", "webSign", "_from"]) {\n    // The successful Fleet Load Info HAR shows `time` as the request timestamp;\n    // keep the dedicated auth/fbid/webSign but generate a fresh request time per click.\n    const value = key === "time" ? String(Date.now()) : credentials?.[key];\n    if (value !== undefined && value !== null) url.searchParams.set(key, value);\n  }\n''',
              'restore fresh Fleet Load Info request time',
          )
          replace_once(worker, 'page: "1", page_size: "20",', 'page: "1", page_size: "100",', 'match captured HBI page size')

          # 4) Origin Manifest module: remove the old cross-source photo fallback and its false UI status.
          manifest = Path('worker/src/origin-manifest-v1.js')
          sub_once(
              manifest,
              r'\n// HBI_PHOTO_MANIFEST_FALLBACK_V2: server-only reuse of the existing HBI SSO\n// session\. No credential is returned to the browser and no persistence write occurs\.\nexport async function originManifestHbiCredentials\(env, actor, wantedHub\) \{.*?\n\}\n',
              '\n',
              'remove LH Manifest photo credential exporter',
              re.S,
          )
          replace_once(
              manifest,
              '''      globalThis.__MS_ORIGIN_MANIFEST_HBI_FALLBACK__ = Boolean(result?.configured);\n''',
              '',
              'remove frontend photo fallback flag',
          )
          sub_once(
              manifest,
              r'''      const hbiNode = document\.querySelector\('\[data-source-status="hbiPhotos"\] span'\);\n      if \(result\?\.configured && hbiNode && !hbiNode\.classList\.contains\('source-ok'\)\) \{\n        hbiNode\.className = 'source-ok';\n        hbiNode\.textContent = 'พร้อมใช้งานผ่าน LH Manifest · รูปโหลดเฉพาะเมื่อกดดูรูปท้ายรถ';\n      \}\n''',
              '',
              'remove false photo ready status from manifest UI',
          )

          # 5) DEV staging self-test: keep LH Manifest fresh-time behavior, remove only obsolete photo-fallback assertions.
          staging = Path('.github/dev-tools/patch-dev-origin-manifest-session-v2.mjs')
          sub_once(
              staging,
              r'''  const photoFallbackStart = patchedOrigin\.indexOf\("export async function originManifestHbiCredentials"\);\n  const photoFallbackEnd = patchedOrigin\.indexOf\("export async function readManifestPage", photoFallbackStart\);\n  const photoFallback = patchedOrigin\.slice\(photoFallbackStart, photoFallbackEnd\);\n  assert\.match\(photoFallback, /time: credentialValue\\\(credentials\\\.time, 100\\\)/\);\n''',
              '',
              'remove stale staging photo fallback assertions',
          )
          replace_once(
              staging,
              '  assert.ok(patchedOrigin.includes("HBI_PHOTO_MANIFEST_FALLBACK_V2"));\n',
              '',
              'remove stale fallback marker assertion',
          )

          # 6) Regression test contracts now assert the actual root-source behavior.
          tests = Path('worker/tests/hbi-truck-photos.test.mjs')
          text = tests.read_text(encoding='utf-8')
          text = text.replace(
              '''  assert.match(worker, /page_size: "20"/);\n  assert.match(worker, /HBI_PHOTO_MANIFEST_FALLBACK_V2/);\n  assert.match(worker, /originManifestHbiCredentials\\(env, actor, hub\\)/);\n''',
              '''  assert.match(worker, /page_size: "100"/);\n  assert.match(worker, /HBI_PHOTO_DEDICATED_SESSION_V3/);\n  assert.doesNotMatch(worker, /originManifestHbiCredentials/);\n''',
              1,
          )
          text = text.replace(
              '''  assert.match(read, /const value = credentials\\?\\.\\[key\\];/);\n  assert.doesNotMatch(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\)/);\n''',
              '''  assert.match(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\) : credentials\\?\\.\\[key\\]/);\n''',
              1,
          )
          text, count = re.subn(
              r'''\ntest\("LH Manifest HBI photo fallback replays the captured HBI time without extra polling", \(\) => \{.*?\n\}\);\n''',
              '\n',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'remove obsolete photo fallback test: expected 1, got {count}')
          old_mobile = '''test("mobile origin manifest keeps shipped parcels and weight on the same row", () => {\n  const manifest = fs.readFileSync(new URL("../src/origin-manifest-v1.js", import.meta.url), "utf8");\n  assert.match(manifest, /@media\\(max-width:700px\\)\\{\\.origin-manifest-badge\\{display:grid;grid-template-columns:minmax\\(0,1fr\\) minmax\\(0,1fr\\)/);\n  assert.match(manifest, /origin-manifest-badge span\\{display:flex;align-items:center;justify-content:center;min-width:0;gap:4px\\}/);\n});\n'''
          new_mobile = '''test("mobile origin manifest keeps shipped parcels and weight on the same row", () => {\n  const html = fs.readFileSync(new URL("../../ms.html", import.meta.url), "utf8");\n  const manifestStart = html.indexOf("/* Origin LH Manifest only");\n  const manifestEnd = html.indexOf("</style>", manifestStart);\n  const manifestCss = html.slice(manifestStart, manifestEnd);\n  assert.match(manifestCss, /grid-template-columns: repeat\\(2, minmax\\(0, 1fr\\)\\) !important/);\n  assert.doesNotMatch(manifestCss, /origin-manifest-badge \\{ grid-template-columns: 1fr !important; \\}/);\n});\n\ntest("LH Manifest never marks HBI photos ready and worker never falls back to its session", () => {\n  const manifest = fs.readFileSync(new URL("../src/origin-manifest-v1.js", import.meta.url), "utf8");\n  const front = fs.readFileSync(new URL("../../ms.js", import.meta.url), "utf8");\n  assert.doesNotMatch(manifest, /originManifestHbiCredentials|__MS_ORIGIN_MANIFEST_HBI_FALLBACK__/);\n  assert.doesNotMatch(front, /manifestPhotoFallback|พร้อมใช้งานผ่าน LH Manifest/);\n  assert.match(front, /ยังไม่ได้อัปโหลด HAR รูปท้ายรถ/);\n});\n'''
          if text.count(old_mobile) != 1:
              raise SystemExit(f'mobile regression test anchor: expected 1, got {text.count(old_mobile)}')
          tests.write_text(text.replace(old_mobile, new_mobile, 1), encoding='utf-8')
          PY

          node --check ms.js
          node --check worker/src/index.js
          node --check worker/src/origin-manifest-v1.js
          node --check .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs
          node .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs --self-test
          cd worker
          npm ci
          node --test tests/hbi-truck-photos.test.mjs
          npm run check
          cd ..
          git diff --check

      - name: Commit root-source fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-photo-mobile-manifest-root-once.yml
          git add ms.html ms.js worker/src/index.js worker/src/origin-manifest-v1.js .github/dev-tools/patch-dev-origin-manifest-session-v2.mjs worker/tests/hbi-truck-photos.test.mjs
          git diff --cached --check
          git diff --cached --stat
          git commit -m "fix(ms): root-fix HBI photos and mobile manifest row"
          git push origin HEAD:main
