name: Proof V10 Live Diagnostic Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v10-live-diagnostic-temp.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live V10 asset
        run: |
          set -euo pipefail
          BASE='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev'
          curl -fsS -D /tmp/v10.headers "$BASE/proof-v10.js?diag=$(date +%s)" -o /tmp/proof-v10-live.js
          echo '--- HEADERS ---'
          grep -Ei 'HTTP/|content-type|cache-control' /tmp/v10.headers || true
          echo "V10_BYTES=$(wc -c < /tmp/proof-v10-live.js)"
          grep -q 'PROOF_COMMAND_CENTER_V10' /tmp/proof-v10-live.js && echo 'V10_MARKER=PASS'
          node --check /tmp/proof-v10-live.js
          echo 'V10_LIVE_SYNTAX=PASS'
          curl -fsS "$BASE/proof.html?diag=$(date +%s)" -o /tmp/proof-live.html
          grep -o "proof-v10.js[^'\"]*" /tmp/proof-live.html | head -1 || true
      - name: Inspect browser dependencies and errors
        run: |
          mkdir -p /tmp/proof-diag && cd /tmp/proof-diag
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          node <<'NODE'
          const { chromium }=require('playwright');
          (async()=>{
            const base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
            const browser=await chromium.launch({headless:true});
            try{
              const page=await browser.newPage();
              const errors=[], failed=[], responses=[];
              page.on('pageerror',e=>errors.push(String(e.stack||e)));
              page.on('requestfailed',r=>failed.push(`${r.url()} :: ${r.failure()?.errorText||''}`));
              page.on('response',r=>{if(/proof-(?:v2|v5|v10)/.test(r.url()))responses.push(`${r.status()} ${r.url()}`)});
              const r=await page.goto(`${base}/proof.html?diagbrowser=${Date.now()}`,{waitUntil:'domcontentloaded',timeout:30000});
              await page.waitForTimeout(4000);
              const state=await page.evaluate(()=>({
                httpReady:document.readyState,
                proofV2:!!window.ProofV2,
                render:typeof window.ProofV2?.render,
                searchEditorOptions:typeof window.ProofV2?.searchEditorOptions,
                installProofEditor:typeof window.ProofV2?.installProofEditor,
                v10Ready:window.__PROOF_V10_READY__===true,
                scripts:[...document.scripts].map(s=>s.src).filter(Boolean),
                command:!!document.getElementById('proof-command-center-v10'),
              }));
              console.log('PAGE_HTTP='+r.status());
              console.log('DEPENDENCY_STATE='+JSON.stringify(state));
              console.log('PROOF_RESPONSES='+JSON.stringify(responses));
              console.log('REQUEST_FAILED='+JSON.stringify(failed));
              console.log('PAGE_ERRORS='+JSON.stringify(errors));
            } finally {await browser.close();}
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
