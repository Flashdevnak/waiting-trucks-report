name: Apply quota-safe HBI truck photos once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-hbi-truck-photos-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard expected source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=615d57a61346d6ade3bf9af545a526e3494b516f
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }
      - name: Apply first-class HBI photo feature
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match in {path}, got {count}")
              p.write_text(text.replace(old, new, 1))

          def insert_before(path, marker, block, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(marker)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 marker in {path}, got {count}")
              p.write_text(text.replace(marker, block + marker, 1))

