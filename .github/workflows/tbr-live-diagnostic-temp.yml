name: TBR Live Diagnostic Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tbr-live-diagnostic-temp.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read live Browser and DEV health
        run: |
          node <<'NODE'
          const browser='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev';
          const dev='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev';
          async function getJson(url){
            const r=await fetch(url,{headers:{accept:'application/json'},cache:'no-store'});
            const text=await r.text(); let body={}; try{body=JSON.parse(text)}catch{body={raw:text.slice(0,300)}}
            return {status:r.status,body};
          }
          const shadow=await getJson(browser+'/api/shadow-tbr?hub=NE1');
          const err=await getJson(browser+'/api/connection-error?hub=NE1');
          const health=await getJson(dev+'/api?action=health');
          const s=shadow.body||{}, e=err.body?.data||null, h=health.body||{};
          console.log('SHADOW_HTTP='+shadow.status);
          console.log('OBSERVER='+(s.observerStatus??'-'));
          console.log('SOURCE_AVAILABLE='+String(s.sourceAvailable));
          console.log('LAST_ATTEMPT='+(s.lastAttemptAt??'-'));
          console.log('LAST_OBSERVED='+(s.lastObservedAt??'-'));
          console.log('FEED='+(s.feedCount??'-'));
          console.log('ROUTES='+(s.rowCount??'-'));
          console.log('MODE='+(s.shadowQuota?.mode??s.mode??'-'));
          console.log('SHADOW_ERROR_CODE='+(s.lastError?.code??s.errorCode??'-'));
          console.log('CONNECTION_HTTP='+err.status);
          console.log('CONNECTION_CODE='+(e?.code??'-'));
          console.log('CONNECTION_SOURCE='+(e?.source??'-'));
          console.log('CONNECTION_MESSAGE='+(e?.message??'-'));
          console.log('CONNECTION_OCCURRED='+(e?.occurredAt??'-'));
          console.log('CONNECTION_RECOVERED='+(e?.recoveredAt??'-'));
          console.log('DEV_HEALTH_HTTP='+health.status);
          console.log('DEV_HEALTH_OK='+String(h.ok));
          console.log('SECRETS_EXPOSED=0');
          console.log('MUTATIONS=0');
          NODE
