name: Test Repair Connector Order

on:
  push:
    branches:
      - test/tbr-shadow-final-20260904
    paths:
      - .github/workflows/test-repair-connector-order.yml

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      DEV_API: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api
      BROWSER_ORIGIN: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Browser TEST tooling
        working-directory: cloudflare-browser-test
        run: npm install --no-audit --no-fund
      - name: Stage service binding and cron trace
        working-directory: cloudflare-browser-test
        run: |
          node scripts/patch-connector-recovery.mjs src/index.js
          node scripts/patch-cron-trace.mjs src/index.js
          node --check src/index.js
          grep -q 'BROWSER_DEV_SERVICE_BINDING_V1' src/index.js
          grep -q 'BROWSER_CRON_TRACE_V1' src/index.js
          grep -q '"service": "waiting-trucks-report-api-dev"' wrangler.jsonc
          ! grep -q 'd1_databases' wrangler.jsonc
          echo 'TEST_STAGE=PASS'
      - name: Generate one TEST connector pair
        run: |
          umask 077
          openssl rand -hex 32 > /tmp/connector-token
          openssl rand -hex 32 > /tmp/bootstrap-secret
          echo "::add-mask::$(cat /tmp/connector-token)"
          echo "::add-mask::$(cat /tmp/bootstrap-secret)"
          echo 'TEST_CONNECTOR_MATERIAL=GENERATED'
      - name: Pair token hash in Turso DEV FIRST
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {createHash}=require('node:crypto');
          (async()=>{
            const connectorToken=fs.readFileSync('/tmp/connector-token','utf8').trim();
            console.log(`::add-mask::${connectorToken}`);
            const tokenHash=createHash('sha256').update(connectorToken).digest('hex');
            const platform=process.env.TURSO_PLATFORM_API_TOKEN;
            const org=process.env.TURSO_ORG;
            const db=process.env.TURSO_DATABASE;
            if(db!=='waiting-trucks-dev-turso-20260902192750') throw new Error('Refusing non-DEV Turso database');
            const headers={Authorization:`Bearer ${platform}`};
            const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers});
            const dbJson=await dbRes.json().catch(()=>({}));
            if(!dbRes.ok) throw new Error(`DEV Turso lookup HTTP ${dbRes.status}`);
            const info=dbJson.database||dbJson;
            const hostname=info.Hostname||info.hostname;
            if(!hostname) throw new Error('DEV Turso hostname missing');
            const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,{method:'POST',headers});
            const tokenJson=await tokenRes.json().catch(()=>({}));
            const dbToken=tokenJson.jwt;
            if(!tokenRes.ok||!dbToken) throw new Error(`DEV Turso auth token HTTP ${tokenRes.status}`);
            console.log(`::add-mask::${dbToken}`);
            const now=new Date().toISOString();
            const sql=`INSERT INTO ms_connector_tokens(hub,token_hash,created_at,last_used_at,active) VALUES('NE1','${tokenHash}','${now}','',1) ON CONFLICT(hub) DO UPDATE SET token_hash=excluded.token_hash,created_at=excluded.created_at,last_used_at='',active=1`;
            const response=await fetch(`https://${hostname}/v2/pipeline`,{
              method:'POST',headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},
              body:JSON.stringify({requests:[{type:'execute',stmt:{sql}},{type:'close'}]}),
            });
            const payload=await response.json().catch(()=>({}));
            const item=payload?.results?.[0];
            if(!response.ok||item?.type==='error') throw new Error(`DEV Turso connector write failed: ${JSON.stringify(item?.error||payload)}`);
            console.log('DEV_TURSO_HASH_FIRST=PASS');
            console.log('D1_QUERIES=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Prove token is valid on active DEV BEFORE Browser stores it
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const connectorToken=fs.readFileSync('/tmp/connector-token','utf8').trim();
            console.log(`::add-mask::${connectorToken}`);
            const api=process.env.DEV_API;
            if(!api.includes('waiting-trucks-report-api-dev.26nak-testdev.workers.dev')) throw new Error('Refusing non-DEV API');
            const response=await fetch(api,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'connectorSync',hub:'NE1',connectorToken})});
            const body=await response.json().catch(()=>({}));
            const rows=Array.isArray(body?.data?.rows)?body.data.rows.length:null;
            const feed=Array.isArray(body?.data?.tbrShadowFeed)?body.data.tbrShadowFeed.length:null;
            console.log(`DEV_PRE_BROWSER_HTTP=${response.status}`);
            console.log(`DEV_PRE_BROWSER_ROWS=${rows ?? '-'}`);
            console.log(`DEV_PRE_BROWSER_TBR_FEED=${feed ?? '-'}`);
            if(!response.ok||body?.ok===false||rows===null||feed===null) throw new Error('DEV did not accept connector before Browser storage');
            console.log('DEV_CONNECTOR_VALID_BEFORE_BROWSER=PASS');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Deploy temporary Browser TEST bootstrap
        working-directory: cloudflare-browser-test
        run: |
          SECRET="$(cat /tmp/bootstrap-secret)"
          echo "::add-mask::$SECRET"
          npx wrangler deploy --config wrangler.jsonc --var CONNECTOR_BOOTSTRAP_SECRET:"$SECRET"
          echo 'BROWSER_TEST_TEMP_BOOTSTRAP=PASS'
      - name: Store already-valid token in Browser TEST KV SECOND
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const origin=process.env.BROWSER_ORIGIN;
            if(!origin.includes('waiting-trucks-ms-browser-test.26nak-testdev.workers.dev')) throw new Error('Refusing non-test origin');
            const connectorToken=fs.readFileSync('/tmp/connector-token','utf8').trim();
            const secret=fs.readFileSync('/tmp/bootstrap-secret','utf8').trim();
            console.log(`::add-mask::${connectorToken}`); console.log(`::add-mask::${secret}`);
            let last={};
            for(let attempt=1;attempt<=18;attempt++){
              await new Promise(r=>setTimeout(r,5000));
              const response=await fetch(origin+'/api/bootstrap-connector',{method:'POST',headers:{'content-type':'application/json','cache-control':'no-store'},body:JSON.stringify({hub:'NE1',connectorToken,bootstrapSecret:secret})});
              const body=await response.json().catch(()=>({}));
              last={status:response.status,body};
              console.log(`BROWSER_STORE_ATTEMPT_${attempt}=${response.status}`);
              if(response.ok&&body?.ok!==false&&body?.stored===true){console.log('BROWSER_KV_VALID_TOKEN=PASS');return;}
            }
            throw new Error(`Browser store failed: ${JSON.stringify(last)}`);
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Remove temporary bootstrap but keep service binding and trace
        if: always()
        working-directory: cloudflare-browser-test
        run: |
          sed 's/"keep_vars": true/"keep_vars": false/' wrangler.jsonc > wrangler.final.jsonc
          npx wrangler deploy --config wrangler.final.jsonc
          echo 'BROWSER_TEST_BOOTSTRAP_CLEANED=PASS'
      - name: Wait for two real cron opportunities
        run: sleep 130
      - name: Require connector retained and TBR Shadow LIVE
        run: |
          node <<'NODE'
          (async()=>{
            const origin=process.env.BROWSER_ORIGIN;
            const [healthRes,shadowRes]=await Promise.all([
              fetch(origin+'/api/cron-health',{headers:{'cache-control':'no-store'},cache:'no-store'}),
              fetch(origin+'/api/shadow-tbr?hub=NE1',{headers:{'cache-control':'no-store'},cache:'no-store'}),
            ]);
            const health=await healthRes.json().catch(()=>({}));
            const shadow=await shadowRes.json().catch(()=>({}));
            console.log(`CRON_HEALTH=${JSON.stringify(health)}`);
            console.log(`TBR_SHADOW=${JSON.stringify({observerStatus:shadow?.observerStatus,sourceAvailable:shadow?.sourceAvailable,feedCount:shadow?.feedCount,rowCount:shadow?.rowCount,lastAttemptAt:shadow?.lastAttemptAt,lastObservedAt:shadow?.lastObservedAt,total:shadow?.total,pending:shadow?.pending,confirmed:shadow?.confirmed,expired:shadow?.expired,tursoReads:shadow?.tursoReads,tursoWrites:shadow?.tursoWrites})}`);
            if(!healthRes.ok||health?.ok!==true||!health?.lastScheduledAt) throw new Error('Cron health unavailable');
            if(!health?.hubs?.includes('NE1')) throw new Error('NE1 not remembered');
            if(health?.hasConnector?.NE1!==true) throw new Error(`Connector was not retained: ${JSON.stringify(health)}`);
            const trace=health?.hubTrace?.NE1||{};
            if(trace.phase!=='SHADOW_OBSERVED') throw new Error(`Cron did not reach Shadow observer: ${JSON.stringify(trace)}`);
            if(!shadowRes.ok||shadow?.ok!==true) throw new Error('Shadow endpoint failed');
            if(shadow?.tursoReads!==0||shadow?.tursoWrites!==0) throw new Error('Shadow unexpectedly uses Turso');
            if(shadow?.observerStatus!=='LIVE'||shadow?.sourceAvailable!==true||!shadow?.lastObservedAt) throw new Error(`TBR not LIVE: ${JSON.stringify(shadow)}`);
            console.log('BROWSER_CONNECTOR_RETAINED=PASS');
            console.log('BROWSER_SERVICE_BINDING_SYNC=PASS');
            console.log('TBR_OBSERVER_LIVE=PASS');
            console.log('TBR_SHADOW_ONLY=PASS');
            console.log('END_TO_END_TEST_CHAIN=PASS');
            console.log('PRODUCTION_TOUCHED=NO');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
