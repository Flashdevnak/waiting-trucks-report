<!doctype html>
<html lang="th">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Waiting Trucks API Parity Check</title>
<style>
  body{font:16px system-ui,sans-serif;max-width:920px;margin:32px auto;padding:0 16px;color:#171717}
  h1{font-size:24px}button{padding:12px 18px;border:0;border-radius:8px;background:#171717;color:#fff;font-weight:700}
  table{width:100%;border-collapse:collapse;margin-top:20px}th,td{padding:10px;border:1px solid #ddd;text-align:left}
  .pass{color:#08783e;font-weight:700}.fail{color:#b42318;font-weight:700}.muted{color:#666}
  code{word-break:break-all}#summary{margin:16px 0;font-weight:700}
</style>
<h1>OLD API vs NEW Worker DEV</h1>
<p class="muted">เครื่องมือนี้ใช้ session ที่เก็บในเบราว์เซอร์เครื่องนี้ และแสดงเฉพาะผลเปรียบเทียบ ไม่แสดง token หรือข้อมูลพัสดุ</p>
<button id="run">ตรวจ API Parity</button>
<div id="summary"></div>
<table><thead><tr><th>Endpoint</th><th>ผล</th><th>Status</th><th>Raw contract</th><th>Business data</th><th>รายละเอียดปลอดภัย</th></tr></thead><tbody id="rows"></tbody></table>
<script>
const OLD='https://waiting-trucks-report.alert-squid-6738.chatgpt.site/api';
const NEW='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api';
const AUTH_KEY='bnak_operator_auth_v2';
const DAY=new Date().toISOString().slice(0,10),HUB='NE1';
const CASES=[
 ['list',{}],['history',{}],['settings',{branch:HUB}],['msRoutes',{branch:HUB}],
 ['msHistory',{branch:HUB}],['msArchive',{branch:HUB}],['msRange',{branch:HUB,start:DAY,end:DAY}],
 ['preEntryTrips',{branch:HUB,day:DAY}],['msConnectionStatus',{branch:HUB}],
 ['msPairingStatus',{hub:HUB,pairingId:'parity-read-only'}]
];
function type(v){return Array.isArray(v)?'array':v===null?'null':typeof v}
function contract(v){if(Array.isArray(v)){const variants=[...new Set(v.map(x=>JSON.stringify(contract(x))))].sort();return{type:'array',count:v.length,items:variants.map(JSON.parse)}}if(v===null)return{type:'null'};if(typeof v!=='object')return{type:typeof v};return{type:'object',fields:Object.keys(v).sort().map(k=>[k,contract(v[k])])}}
const META=new Set(['updatedAt','updatedBy','lastSuccessAt','lastSync','syncedAt','syncedBy','snapshotAt','archivedAt','serverTime','checkedAt']);
function stable(v,key=''){if(Array.isArray(v)){const rows=v.map(x=>stable(x,key));return rows.sort((a,b)=>JSON.stringify(a).localeCompare(JSON.stringify(b)))}if(v&&typeof v==='object'){const out={};for(const k of Object.keys(v).sort()){if(META.has(k))continue;out[k]=stable(v[k],k)}return out}return v}
function canonical(action,body){const v=structuredClone(body);if(action==='msRoutes'&&v?.data){delete v.data.msStatus;delete v.data.lastSync}if(action==='msHistory'&&Array.isArray(v?.data?.rows)){const latest=new Map();for(const row of v.data.rows){const id=row.routeId||row.id||'';if(!latest.has(id)){let payload=row.payloadJson;try{payload=JSON.parse(payload||'{}')}catch{}latest.set(id,payload)}}v.data.rows=[...latest.entries()].map(([id,payload])=>({id,payload}));delete v.data.nextOffset}return stable(v)}
async function digest(v){const b=new TextEncoder().encode(JSON.stringify(v));const d=await crypto.subtle.digest('SHA-256',b);return[...new Uint8Array(d)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16)}
function stats(v,path='$',out=[]){if(Array.isArray(v)){out.push(`${path}.length=${v.length}`);const keys=new Set();for(const x of v)if(x&&typeof x==='object'&&!Array.isArray(x))Object.keys(x).forEach(k=>keys.add(k));if(keys.size)out.push(`${path}.keys=${[...keys].sort().join(',')}`);v.slice(0,3).forEach((x,i)=>stats(x,`${path}[${i}]`,out));return out}if(v&&typeof v==='object')for(const[k,x]of Object.entries(v))stats(x,`${path}.${k}`,out);return out}
function safeDiff(a,b,path='$',out=[]){if(out.length>=8)return out;const ta=type(a),tb=type(b);if(ta!==tb){out.push(`${path}: ${ta}/${tb}`);return out}if(ta==='array'){if(a.length!==b.length)out.push(`${path}.length: ${a.length}/${b.length}`);for(let i=0;i<Math.min(a.length,b.length,5);i++)safeDiff(a[i],b[i],`${path}[${i}]`,out);return out}if(ta==='object'){const keys=[...new Set([...Object.keys(a),...Object.keys(b)])].sort();for(const k of keys){if(!(k in a)||!(k in b))out.push(`${path}.${k}: ${k in a?'มี/ไม่มี':'ไม่มี/มี'}`);else safeDiff(a[k],b[k],`${path}.${k}`,out);if(out.length>=8)break}return out}if(a!==b){if(typeof a==='number'||typeof a==='boolean')out.push(`${path}: ${a}/${b}`);else out.push(`${path}: value differs`)}return out}
async function archiveDetail(oldBody,newBody){const oldRows=oldBody?.data?.rows||[],newRows=newBody?.data?.rows||[];const key=r=>String(r?.id||r?.routeId||r?.proofId||'');const om=new Map(oldRows.map(r=>[key(r),r])),nm=new Map(newRows.map(r=>[key(r),r]));const onlyOld=[...om.keys()].filter(k=>!nm.has(k)),onlyNew=[...nm.keys()].filter(k=>!om.has(k));let sharedDiff=0;for(const[k,row]of om)if(nm.has(k)&&JSON.stringify(stable(row))!==JSON.stringify(stable(nm.get(k))))sharedDiff++;const label=async(k,map)=>`${await digest(k)} @ ${map.get(k)?.archivedAt||map.get(k)?.syncedAt||'ไม่มีเวลา'}`;const oldLabels=await Promise.all(onlyOld.slice(0,5).map(k=>label(k,om))),newLabels=await Promise.all(onlyNew.slice(0,5).map(k=>label(k,nm)));return[`จำนวน OLD/NEW: ${oldRows.length}/${newRows.length}`,`เฉพาะ OLD (${onlyOld.length}): ${oldLabels.join(', ')||'-'}`,`เฉพาะ NEW (${onlyNew.length}): ${newLabels.join(', ')||'-'}`,`รายการร่วมที่ข้อมูลธุรกิจต่าง: ${sharedDiff}`].join('<br>')}
async function call(base,action,params,token){const u=new URL(base);u.searchParams.set('action',action);u.searchParams.set('token',token);for(const[k,v]of Object.entries(params))u.searchParams.set(k,v);const r=await fetch(u,{cache:'no-store'});let body;try{body=await r.json()}catch{body={parseError:true}}return{status:r.status,body}}
document.getElementById('run').onclick=async()=>{const summary=document.getElementById('summary'),tbody=document.getElementById('rows');tbody.innerHTML='';let auth;try{auth=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch{}if(!auth?.token){summary.innerHTML='<span class="fail">ไม่พบ session — กรุณาเข้าสู่ระบบที่ ms.html ในเบราว์เซอร์นี้ก่อน</span>';return}summary.textContent='กำลังตรวจ...';let failures=0;for(const[action,params]of CASES){const[oldR,newR]=await Promise.all([call(OLD,action,params,auth.token),call(NEW,action,params,auth.token)]);const status=oldR.status===newR.status&&oldR.body?.ok===newR.body?.ok;const raw=JSON.stringify(contract(oldR.body))===JSON.stringify(contract(newR.body));const oc=canonical(action,oldR.body),nc=canonical(action,newR.body);const[od,nd]=await Promise.all([digest(oc),digest(nc)]);const data=od===nd;const pass=status&&raw&&data;if(!pass)failures++;const detail=action==='msArchive'?await archiveDetail(oldR.body,newR.body):(safeDiff(oc,nc).join('<br>')||([...new Set(stats(oldR.body).filter(x=>!new Set(stats(newR.body)).has(x)))].slice(0,4).join('<br>')||'-'));const tr=document.createElement('tr');tr.innerHTML=`<td>${action}</td><td class="${pass?'pass':'fail'}">${pass?'PASS':'FAIL'}</td><td>${oldR.status} / ${newR.status}</td><td class="${raw?'pass':'fail'}">${raw?'PASS':'FAIL'}</td><td class="${data?'pass':'fail'}">${data?'PASS':'DIFF'} <code>${od}/${nd}</code></td><td><code>${detail}</code></td>`;tbody.appendChild(tr)}summary.innerHTML=failures?`<span class="fail">FAIL ${failures} endpoint — ห้าม Cutover</span>`:`<span class="pass">PASS ทั้งหมด ${CASES.length} endpoint</span>`}
</script>
</html>
