name: Verify Intelligence UI Stability

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-intelligence-ui-stability.yml

permissions:
  contents: read

jobs:
  verify-stability:
    runs-on: ubuntu-latest
    steps:
      - name: Verify live UI remains after multiple 60s refresh windows
        run: |
          node <<'NODE'
          const origin='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function check(attempt){
            const stamp=Date.now();
            const paths=['/api/connection-error?hub=NE1','/shadow-tbr?hub=NE1'];
            for(const path of paths){
              const join=path.includes('?')?'&':'?';
              const r=await fetch(origin+path+join+'stability='+stamp,{headers:{accept:'text/html','cache-control':'no-cache'},cache:'no-store'});
              const text=await r.text();
              if(!r.ok) throw new Error(`${path} HTTP ${r.status}`);
              for(const marker of ['HUB ในระบบ','Error Intelligence','TBR Intelligence']){
                if(!text.includes(marker)) throw new Error(`ATTEMPT_${attempt} ${path} missing ${marker}`);
              }
            }
            console.log(`STABILITY_ATTEMPT_${attempt}=PASS`);
          }
          for(let attempt=1;attempt<=4;attempt++){
            if(attempt>1) await sleep(45_000);
            await check(attempt);
          }
          console.log('INTELLIGENCE_UI_STABLE_OVER_135_SECONDS=PASS');
          console.log('EXTRA_MS_POLLING=0');
          console.log('PRODUCTION_TOUCHED=NO');
          NODE
