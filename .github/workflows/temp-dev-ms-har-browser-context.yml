name: TEMP DEV MS HAR Browser Context

on:
  push:
    branches:
      - codex/dev-ms-har-browser-context-v1

permissions:
  contents: write

jobs:
  patch-test-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: codex/dev-ms-har-browser-context-v1
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Apply deterministic patch
        run: node .github/dev-tools/apply-ms-har-browser-context-v1.mjs

      - name: Install worker dependencies
        working-directory: worker
        run: npm ci

      - name: Run worker full check
        working-directory: worker
        run: npm run check

      - name: Diff safety check
        run: git diff --check

      - name: Remove temporary runner
        run: |
          rm .github/dev-tools/apply-ms-har-browser-context-v1.mjs
          rm .github/workflows/temp-dev-ms-har-browser-context.yml

      - name: Commit tested patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ms.js worker/src/index.js worker/package.json worker/tests/ms-har-browser-context.test.mjs .github/dev-tools/apply-ms-har-browser-context-v1.mjs .github/workflows/temp-dev-ms-har-browser-context.yml
          git commit -m "fix(dev): preserve MS HAR browser context"
          git push origin HEAD:codex/dev-ms-har-browser-context-v1
