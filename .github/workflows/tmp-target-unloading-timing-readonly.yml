name: DEV Target Unloading Timing Readonly

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-target-unloading-timing-readonly.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      TARGET_ROUTE_ID: NAK1TMSZ36
    steps:
      - name: Read only timing evidence for reported route
        run: |
          node <<'NODE'
          (async()=>{
            const platform=process.env.TURSO_PLATFORM_API_TOKEN,org=process.env.TURSO_ORG,db=process.env.TURSO_DATABASE,target=process.env.TARGET_ROUTE_ID;
            if(!platform||!target) throw new Error('diagnostic input missing');
            const headers={Authorization:`Bearer ${platform}`};
            const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers});
            const dbJson=await dbRes.json();
            const database=dbJson.database||dbJson,hostname=database.Hostname||database.hostname;
            if(!dbRes.ok||!hostname) throw new Error(`Turso lookup HTTP ${dbRes.status}`);
            const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=full-access`,{method:'POST',headers});
            const tokenJson=await tokenRes.json(),dbToken=tokenJson.jwt;
            if(!tokenRes.ok||!dbToken) throw new Error(`Turso token HTTP ${tokenRes.status}`);
            console.log(`::add-mask::${dbToken}`);
            const encode=value=>({type:'text',value:String(value)});
            async function query(sql,args=[]){
              const response=await fetch(`https://${hostname}/v2/pipeline`,{method:'POST',headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},body:JSON.stringify({requests:[{type:'execute',stmt:{sql,args:args.map(encode)}},{type:'close'}]})});
              const payload=await response.json(),item=payload?.results?.[0];
              if(!response.ok||item?.type==='error') throw new Error(`Turso query failed: ${JSON.stringify(item?.error||payload)}`);
              const decode=v=>v==null?null:(typeof v==='object'&&'value' in v?v.value:v);
              return (item?.response?.result?.rows||[]).map(row=>row.map(decode));
            }
            const history=await query(`SELECT hub,route_id,snapshot_at,event_type,synced_by,CAST(COALESCE(json_extract(payload_json,'$.unloadingState'),-1) AS INTEGER),COALESCE(json_extract(payload_json,'$.scheduleUnloadingStartedAt'),''),COALESCE(json_extract(payload_json,'$.scheduleUnloadingCompletedAt'),''),COALESCE(json_extract(payload_json,'$.unloadingCompletedAt'),''),COALESCE(json_extract(payload_json,'$.completionSource'),''),COALESCE(json_extract(payload_json,'$.scheduleTbrArrivalAt'),''),COALESCE(json_extract(payload_json,'$.actualArrivalAt'),'') FROM ms_route_history WHERE json_valid(payload_json)=1 AND (route_id=? OR json_extract(payload_json,'$.proofId')=?) ORDER BY snapshot_at DESC LIMIT 30`,[target,target]);
            console.log(`TARGET_HISTORY_ROWS=${history.length}`);
            let previous=null,transitionAt='';
            for(const row of [...history].reverse()){
              const state=Number(row[5]);
              if(state===1&&previous===0&&!transitionAt) transitionAt=String(row[2]||'');
              previous=state;
            }
            const latest=history[0]||[];
            console.log(`TARGET_HUB=${latest[0]||'-'}`);
            console.log(`TARGET_INTERNAL_ROUTE_PRESENT=${latest[1]?'YES':'NO'}`);
            console.log(`TARGET_LATEST_AT=${latest[2]||'-'}`);
            console.log(`TARGET_STATE=${latest[5]??'-'}`);
            console.log(`TARGET_SCHEDULE_START=${latest[6]||'-'}`);
            console.log(`TARGET_SCHEDULE_END=${latest[7]||'-'}`);
            console.log(`TARGET_COMPLETION=${latest[8]||'-'}`);
            console.log(`TARGET_COMPLETION_SOURCE=${latest[9]||'-'}`);
            console.log(`TARGET_TBR=${latest[10]||'-'}`);
            console.log(`TARGET_ROUTE_ARRIVAL=${latest[11]||'-'}`);
            console.log(`TARGET_OBSERVED_0_TO_1=${transitionAt||'-'}`);
            console.log('TARGET_TURSO_READS=1');
            console.log('TARGET_TURSO_WRITES=0');
            console.log('TARGET_UPSTREAM_MS_CALLS=0');
          })().catch(error=>{console.error(error);process.exit(1);});
          NODE
