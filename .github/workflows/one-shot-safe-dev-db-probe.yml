name: One-shot Safe DEV Real Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-safe-dev-db-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      WORKER_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
      BROWSER_ORIGIN: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
    steps:
      - name: Inspect real Route/TBR shadow without Turso
        shell: bash
        run: |
          node <<'NODE'
          const [healthRes, shadowRes] = await Promise.all([
            fetch(`${process.env.WORKER_ORIGIN}/api?action=health`, {cache:'no-store'}),
            fetch(`${process.env.BROWSER_ORIGIN}/api/shadow-tbr?hub=NE1`, {cache:'no-store'}),
          ]);
          const health = await healthRes.json();
          const shadow = await shadowRes.json();
          if (!healthRes.ok || !health?.ok) throw new Error(`Worker health failed ${healthRes.status}`);
          if (!shadowRes.ok || !shadow?.ok) throw new Error(`Shadow endpoint failed ${shadowRes.status}`);
          console.log('WORKER_HEALTH=PASS');
          console.log(`SHADOW_OBSERVER_STATUS=${shadow.observerStatus}`);
          console.log(`SHADOW_SOURCE_AVAILABLE=${shadow.sourceAvailable}`);
          console.log(`SHADOW_LAST_ATTEMPT_AT=${shadow.lastAttemptAt || '-'}`);
          console.log(`SHADOW_LAST_OBSERVED_AT=${shadow.lastObservedAt || '-'}`);
          console.log(`SHADOW_ROUTE_ROWS=${shadow.rowCount ?? '-'}`);
          console.log(`SHADOW_TBR_FEED=${shadow.feedCount ?? '-'}`);
          console.log(`SHADOW_ROUTE_FALLBACK=${Boolean(shadow.routeFallback)}`);
          console.log(`SHADOW_ROUTE_SOURCE_ERROR=${shadow.routeSourceError ? JSON.stringify(shadow.routeSourceError) : '-'}`);
          console.log(`SHADOW_LAST_SKIP=${shadow.lastSkip || '-'}`);
          console.log(`SHADOW_REPORTED_TURSO_READS=${shadow.tursoReads}`);
          console.log(`SHADOW_REPORTED_TURSO_WRITES=${shadow.tursoWrites}`);
          if (Number(shadow.tursoReads || 0) !== 0 || Number(shadow.tursoWrites || 0) !== 0)
            throw new Error('Shadow report unexpectedly consumes Turso quota');
          if (shadow.observerStatus === 'STALE' || shadow.observerStatus === 'NEVER_OBSERVED')
            throw new Error(`Shadow observer not current: ${shadow.observerStatus}`);
          console.log('ZERO_TURSO_REAL_SOURCE_DIAGNOSTIC=PASS');
          NODE
