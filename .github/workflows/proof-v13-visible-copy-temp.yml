name: Proof V13 Visible Copy Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v13-visible-copy-temp.yml

permissions:
  contents: write
  actions: write

jobs:
  clean-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Clean visible system wording
        run: python3 .github/dev-tools/proof-v13-visible-copy-temp.py
      - name: Validate
        run: |
          node --check worker/src/proof-ui-v10.js
          ! grep -q 'lineMode รถเสริม' worker/src/proof-ui-v10.js
          ! grep -q 'cache 5 นาที' worker/src/proof-ui-v10.js
          ! grep -q 'กำลังอ่านประวัติจาก Turso' worker/src/proof-ui-v10.js
          cd worker
          npm ci --no-audit --no-fund
          npm run check
          echo 'PROOF_V13_VISIBLE_COPY=PASS'
          echo 'NEW_POLLING=0'
          echo 'PRODUCTION_TOUCHED=NO'
      - name: Commit
        run: |
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add worker/src/proof-ui-v10.js
          git commit -m 'Simplify Proof operator copy'
          git pull --rebase --autostash origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --repo "$GITHUB_REPOSITORY" --ref main
