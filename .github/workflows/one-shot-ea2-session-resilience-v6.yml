name: One-shot EA2 Session Resilience V6

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-ea2-session-resilience-v6.yml

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Patch authoritative UI and DEV recovery source
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('ms.js')
          s = p.read_text()
          a = s.index('function renderFreshness() {')
          b = s.index('\nfunction connection(', a)
          s = s[:a] + '''function renderFreshness() {
            const synced = parseDate(state.lastSync);
            const ageMs = synced ? Math.max(0, Date.now() - synced.getTime()) : Infinity;
            const stale = !synced || ageMs > CONFIG.staleMs;
            const hardOffline = state.msStatus === "error" || state.msStatus === "not_configured";
            const degraded = state.msStatus === "degraded";
            el("live-dot").classList.toggle("stale", stale || hardOffline || degraded);
            if (state.syncError) {
              el("source-sync").textContent = synced
                ? `ข้อมูล MS ล่าสุด ${dtf.format(synced)} น. · ${state.syncError}`
                : `MS: ${state.syncError}`;
              return;
            }
            if (!synced) {
              el("source-sync").textContent = "ยังไม่มีข้อมูลจาก MS";
              return;
            }
            if (degraded || hardOffline) {
              el("source-sync").textContent =
                `ข้อมูล MS ล่าสุด ${dtf.format(synced)} น. · ใช้ข้อมูลล่าสุดและกำลังเชื่อมต่อใหม่`;
              return;
            }
            el("source-sync").textContent = stale
              ? `ข้อมูล MS ล่าสุด ${dtf.format(synced)} น. · กำลังตรวจข้อมูลใหม่`
              : `ข้อมูล MS ล่าสุด ${dtf.format(synced)} น.`;
          }
          ''' + s[b:]
          p.write_text(s)

          p = Path('.github/dev-tools/patch-ms-realtime-recovery.mjs')
          s = p.read_text()
          if 'const sessionGap = error?.code === "MS_SESSION_EXPIRED";' not in s:
              if s.count('const transient =') != 1 or s.count('if (transient) {') != 1:
                  raise SystemExit('recovery classifier shape changed')
              s = s.replace(
                  'const transient =',
                  'const sessionGap = error?.code === "MS_SESSION_EXPIRED";\n    const recoverable =',
                  1,
              ).replace('if (transient) {', 'if (recoverable) {', 1)

          start = s.index('const sessionGap = error?.code === "MS_SESSION_EXPIRED";')
          end = s.index('recentMsSync.set(branch, { until: Date.now() + MS_SYNC_TTL, result });', start)
          segment = s[start:end]
          if 'syncedAt: fallback.syncedAt || "",' not in segment:
              target = 'status: "degraded",'
              pos = segment.index(target) + len(target)
              segment = segment[:pos] + '\n          syncedAt: fallback.syncedAt || "",' + segment[pos:]
          if 'เซสชัน MS ต้องอัปเดต · ระบบยังแสดงข้อมูลล่าสุด' not in segment:
              literal = '"MS ตอบช้าชั่วคราว ระบบแสดงข้อมูลล่าสุดและจะลองใหม่อัตโนมัติ"'
              if segment.count(literal) != 1:
                  raise SystemExit(f'degraded message shape changed count={segment.count(literal)}')
              segment = segment.replace(
                  literal,
                  'sessionGap\n            ? "เซสชัน MS ต้องอัปเดต · ระบบยังแสดงข้อมูลล่าสุดและจะลองเชื่อมต่อใหม่อัตโนมัติ"\n            : "MS ตอบช้าชั่วคราว ระบบแสดงข้อมูลล่าสุดและจะลองใหม่อัตโนมัติ"',
                  1,
              )
          s = s[:start] + segment + s[end:]
          p.write_text(s)
          PY

      - name: Add focused regression
        run: |
          cat > worker/tests/ms-session-resilience.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import { patchDevRealtimeWorker } from '../../.github/dev-tools/patch-ms-realtime-recovery.mjs';
          const ui = fs.readFileSync(new URL('../../ms.js', import.meta.url), 'utf8');
          const worker = fs.readFileSync(new URL('../src/index.js', import.meta.url), 'utf8');
          test('timestamp age never falsely labels a HUB session stale', () => {
            const block = ui.slice(ui.indexOf('function renderFreshness()'), ui.indexOf('function connection('));
            assert.equal(block.includes('เซสชันยังไม่อัปเดต'), false);
            assert.ok(block.includes('กำลังตรวจข้อมูลใหม่'));
            assert.ok(block.includes('state.syncError'));
          });
          test('EA2-like session expiry preserves accepted cache and retries automatically', () => {
            const staged = patchDevRealtimeWorker(worker);
            assert.ok(staged.includes('const sessionGap = error?.code === "MS_SESSION_EXPIRED"'));
            assert.ok(staged.includes('if (recoverable)'));
            assert.ok(staged.includes('syncedAt: fallback.syncedAt || ""'));
            assert.ok(staged.includes('เซสชัน MS ต้องอัปเดต · ระบบยังแสดงข้อมูลล่าสุด'));
          });
          test('normal realtime cadence remains exactly four seconds', () => {
            assert.ok(ui.includes('pollMs: 4000'));
            assert.ok(ui.includes('setInterval(realtimeTick, CONFIG.pollMs)'));
          });
          EOF

      - name: Install dependencies
        working-directory: worker
        run: npm ci

      - name: Regression gates
        run: |
          node --check ms.js
          node --check .github/dev-tools/patch-ms-realtime-recovery.mjs
          node --check worker/src/index.js
          node --test worker/tests/ms-session-resilience.test.mjs
          node --test .github/dev-tools/ms-durable-coordinator.test.mjs
          node --test .github/dev-tools/ms-quota-safe-live.test.mjs
          node --test .github/dev-tools/ms-multiclient-dedupe.test.mjs
          node --test worker/tests/hbi-truck-photos.test.mjs
          (cd worker && npm run check)
          git diff --check

      - name: Verify exact DEV staging path
        working-directory: worker
        run: |
          rm -rf .ea2-check
          mkdir -p .ea2-check
          cp ../waiting.html ../main.js ../ms-report.html ../ms-report.js ../ms.html ../ms.js ../proof.html ../proof.js ../style.css ../ms-v4.css ../sw.js ../favicon.svg .ea2-check/
          cp ../proof-v2-core.js ../proof-v2-ui.js ../proof-v2-actions.js .ea2-check/
          cp ../.github/dev-tools/safe-parity.html .ea2-check/safe-parity.html
          cp src/index.js .ea2-check/index.js
          node ../.github/dev-tools/stage-dev-runtime.mjs .ea2-check/ms.js .ea2-check/index.js
          node --check .ea2-check/ms.js
          node --check .ea2-check/index.js
          grep -q 'const sessionGap = error?.code === "MS_SESSION_EXPIRED"' .ea2-check/index.js
          grep -q 'syncedAt: fallback.syncedAt || ""' .ea2-check/index.js
          grep -q 'เซสชัน MS ต้องอัปเดต' .ea2-check/index.js
          ! grep -q 'เซสชันยังไม่อัปเดต' .ea2-check/ms.js
          grep -q 'pollMs: 4000' .ea2-check/ms.js
          rm -rf .ea2-check

      - name: Commit clean source and remove all one-shot files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for f in \
            .github/workflows/one-shot-ea2-session-resilience.yml \
            .github/workflows/one-shot-ea2-session-resilience-v2.yml \
            .github/workflows/one-shot-ea2-session-resilience-v3.yml \
            .github/workflows/one-shot-ea2-session-resilience-v4.yml \
            .github/workflows/one-shot-ea2-session-resilience-v5.yml \
            .github/workflows/one-shot-ea2-session-resilience-v6.yml; do
            git rm -f "$f" 2>/dev/null || true
          done
          git add ms.js .github/dev-tools/patch-ms-realtime-recovery.mjs worker/tests/ms-session-resilience.test.mjs
          git diff --cached --check
          git commit -m 'fix(dev): make EA2 session state truth-safe'
          git push origin HEAD:main
          echo "SOURCE_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait for automatic DEV deployment
        run: |
          RUN_ID=''
          for i in $(seq 1 90); do
            RUN_ID=$(gh run list --workflow deploy-worker-dev.yml --branch main --limit 30 --json databaseId,headSha,event --jq ".[] | select(.headSha == \"$SOURCE_HEAD\") | .databaseId" | head -n1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          echo "DEV_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Dispatch and wait current-system acceptance
        run: |
          gh workflow run current-system-acceptance.yml --ref main
          RUN_ID=''
          for i in $(seq 1 90); do
            RUN_ID=$(gh run list --workflow current-system-acceptance.yml --branch main --limit 30 --json databaseId,headSha --jq ".[] | select(.headSha == \"$SOURCE_HEAD\") | .databaseId" | head -n1)
            [ -n "$RUN_ID" ] && break
            sleep 5
          done
          test -n "$RUN_ID"
          echo "ACCEPT_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          gh run watch "$RUN_ID" --exit-status

      - name: Final checkpoint
        run: |
          echo "SOURCE_HEAD=$SOURCE_HEAD"
          echo "DEV_RUN_ID=$DEV_RUN_ID"
          echo "ACCEPT_RUN_ID=$ACCEPT_RUN_ID"
          echo "REALTIME_CADENCE=4000ms"
          echo "EA2_SESSION_STATUS_TRUTH_SAFE=PASS"
          echo "PRODUCTION_TOUCHED=NO"
