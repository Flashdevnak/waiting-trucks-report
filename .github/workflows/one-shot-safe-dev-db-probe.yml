name: One-shot Safe DEV Real Acceptance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-safe-dev-db-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      BROWSER_ORIGIN: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
    steps:
      - name: Inspect real NE1 connection state without Turso
        shell: bash
        run: |
          node <<'NODE'
          const [shadowRes, errorRes] = await Promise.all([
            fetch(`${process.env.BROWSER_ORIGIN}/api/shadow-tbr?hub=NE1`, {cache:'no-store'}),
            fetch(`${process.env.BROWSER_ORIGIN}/api/connection-error?hub=NE1`, {cache:'no-store'}),
          ]);
          const shadow = await shadowRes.json();
          const errorBody = await errorRes.json();
          if (!shadowRes.ok || !shadow?.ok) throw new Error(`Shadow HTTP ${shadowRes.status}`);
          if (!errorRes.ok || !errorBody?.ok) throw new Error(`Connection-error HTTP ${errorRes.status}`);
          const data = errorBody.data || null;
          console.log(`SHADOW_STATUS=${shadow.observerStatus}`);
          console.log(`SHADOW_SOURCE_AVAILABLE=${shadow.sourceAvailable}`);
          console.log(`SHADOW_ROUTE_ROWS=${shadow.rowCount ?? '-'}`);
          console.log(`SHADOW_TBR_FEED=${shadow.feedCount ?? '-'}`);
          console.log(`SHADOW_LAST_SKIP=${shadow.lastSkip || '-'}`);
          console.log(`ERROR_SOURCE=${data?.source || '-'}`);
          console.log(`ERROR_CODE=${data?.code || '-'}`);
          console.log(`ERROR_LABEL=${data?.label || '-'}`);
          console.log(`ERROR_MESSAGE=${data?.message || '-'}`);
          console.log(`ERROR_OCCURRED_AT=${data?.occurredAt || '-'}`);
          console.log(`ERROR_RECOVERED_AT=${data?.recoveredAt || '-'}`);
          console.log(`SHADOW_TURSO_READS=${shadow.tursoReads}`);
          console.log(`SHADOW_TURSO_WRITES=${shadow.tursoWrites}`);
          if (Number(shadow.tursoReads || 0) !== 0 || Number(shadow.tursoWrites || 0) !== 0)
            throw new Error('Unexpected Turso usage in shadow diagnostic');
          console.log('ZERO_TURSO_CONNECTION_DIAGNOSTIC=PASS');
          NODE
