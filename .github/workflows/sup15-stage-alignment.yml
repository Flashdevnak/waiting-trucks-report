name: SUP-15 Stage Alignment

on:
  push:
    branches:
      - codex/sup-15-deploy-stage-alignment

permissions:
  contents: write

jobs:
  align-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align TBR staging patcher with accepted Turso recovery shape
        run: python3 .github/dev-tools/apply-sup15-stage-alignment.py

      - name: Syntax check staging patcher
        run: node --check cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs

      - name: Simulate exact DEV staging path
        shell: bash
        run: |
          TMP="$(mktemp -d)"
          cp ms.js "$TMP/ms.js"
          cp style.css "$TMP/style.css"
          cp worker/src/index.js "$TMP/index.js"
          node .github/dev-tools/stage-dev-runtime.mjs "$TMP/ms.js" "$TMP/index.js"
          grep -q 'MS_UPSTREAM_ACCOUNT_GUARD_V12' "$TMP/index.js"
          grep -q 'TBR_SHADOW_SPLIT_V2' "$TMP/index.js"
          rm -rf "$TMP"
          echo 'SUP15_STAGE_ALIGN=STAGE_PASS'

      - name: Run worker regression
        working-directory: worker
        run: |
          npm ci
          npm run check

      - name: Commit alignment only
        shell: bash
        run: |
          git status --short
          test "$(git status --short | grep -v '^??' | wc -l | tr -d ' ')" = "1"
          git diff --check
          git add cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs
          git diff --cached --name-only | grep -qx 'cloudflare-browser-test/scripts/patch-dev-tbr-shadow-split-v2.mjs'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(dev): align TBR staging with Turso recovery'
          git push origin HEAD:codex/sup-15-deploy-stage-alignment
