name: Test Diagnose Stale TBR

on:
  push:
    branches:
      - test/tbr-shadow-final-20260904
    paths:
      - .github/workflows/test-diagnose-stale-tbr.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      BROWSER_ORIGIN: https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Browser TEST tooling
        working-directory: cloudflare-browser-test
        run: npm install --no-audit --no-fund
      - name: Read current TBR and connection error before tail
        run: |
          node <<'NODE'
          (async()=>{
            const origin=process.env.BROWSER_ORIGIN;
            const [s,e]=await Promise.all([
              fetch(origin+'/api/shadow-tbr?hub=NE1',{headers:{accept:'application/json','cache-control':'no-store'},cache:'no-store'}),
              fetch(origin+'/api/connection-error?hub=NE1',{headers:{accept:'application/json','cache-control':'no-store'},cache:'no-store'}),
            ]);
            const shadow=await s.json().catch(()=>({}));
            const error=await e.json().catch(()=>({}));
            console.log('SHADOW_NOW='+JSON.stringify({observerStatus:shadow?.observerStatus,sourceAvailable:shadow?.sourceAvailable,lastAttemptAt:shadow?.lastAttemptAt,lastObservedAt:shadow?.lastObservedAt,healthUpdatedAt:shadow?.healthUpdatedAt,updatedAt:shadow?.updatedAt,feedCount:shadow?.feedCount,rowCount:shadow?.rowCount,shadowQuota:shadow?.shadowQuota,total:shadow?.total}));
            console.log('CONNECTION_ERROR_NOW='+JSON.stringify(error));
            console.log('MUTATIONS=0');
            console.log('PRODUCTION_TOUCHED=NO');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Tail Browser TEST across two cron cycles
        working-directory: cloudflare-browser-test
        run: |
          set +e
          timeout 145s npx wrangler tail waiting-trucks-ms-browser-test --config wrangler.jsonc --format json > /tmp/tail.log 2>&1
          set -e
          python - <<'PY'
          from pathlib import Path
          text=Path('/tmp/tail.log').read_text(errors='replace') if Path('/tmp/tail.log').exists() else ''
          keep=[]
          for line in text.splitlines():
              if any(x in line for x in ['connector_sync','tbr_shadow','scheduled']):
                  keep.append(line[:4000])
          print('RELEVANT_LOGS_BEGIN')
          print('\n'.join(keep[-120:]) if keep else 'NO_RELEVANT_LOGS')
          print('RELEVANT_LOGS_END')
          PY
      - name: Read current TBR after tail
        run: |
          node <<'NODE'
          (async()=>{
            const origin=process.env.BROWSER_ORIGIN;
            const r=await fetch(origin+'/api/shadow-tbr?hub=NE1',{headers:{accept:'application/json','cache-control':'no-store'},cache:'no-store'});
            const s=await r.json().catch(()=>({}));
            console.log('SHADOW_AFTER='+JSON.stringify({observerStatus:s?.observerStatus,sourceAvailable:s?.sourceAvailable,lastAttemptAt:s?.lastAttemptAt,lastObservedAt:s?.lastObservedAt,healthUpdatedAt:s?.healthUpdatedAt,updatedAt:s?.updatedAt,feedCount:s?.feedCount,rowCount:s?.rowCount,total:s?.total}));
            console.log('MUTATIONS=0');
            console.log('PRODUCTION_TOUCHED=NO');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
