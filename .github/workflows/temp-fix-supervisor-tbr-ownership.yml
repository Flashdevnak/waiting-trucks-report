name: TEMP DEV Repair State Probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-fix-supervisor-tbr-ownership.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sanitized DEV repair state
        shell: bash
        run: |
          set -euo pipefail
          base='https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api?action=msRepairHealthDev&branch='
          for hub in EA2 NE1; do
            echo "=== ${hub} ==="
            body="$(curl -fsS --retry 2 --connect-timeout 10 "${base}${hub}")"
            echo "$body" | jq -c '{ok:.ok,branch:.data.branch,repair:.data.repair,quota:.data.quota}'
            echo "$body" | jq -e '.ok == true and .data.quota.tursoReads == 0 and .data.quota.tursoWrites == 0 and .data.quota.upstreamCalls == 0' >/dev/null
          done
