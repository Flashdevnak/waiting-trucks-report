name: Diagnose Completion Cache

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-completion-cache.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
    steps:
      - name: Inspect completion cache read-only
        run: |
          node <<'NODE'
          (async()=>{
            const org=process.env.TURSO_ORG, db=process.env.TURSO_DATABASE, platform=process.env.TURSO_PLATFORM_API_TOKEN;
            if(!platform) throw new Error('Turso platform token missing');
            const headers={Authorization:`Bearer ${platform}`};
            const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}`,{headers});
            const dbJson=await dbRes.json();
            if(!dbRes.ok) throw new Error(`Turso lookup HTTP ${dbRes.status}`);
            const database=dbJson.database||dbJson;
            const hostname=database.Hostname||database.hostname;
            const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${db}/auth/tokens?authorization=read-only`,{method:'POST',headers});
            const tokenJson=await tokenRes.json();
            if(!tokenRes.ok||!tokenJson.jwt) throw new Error(`Turso read-only token HTTP ${tokenRes.status}`);
            const dbToken=tokenJson.jwt;
            console.log(`::add-mask::${dbToken}`);
            async function query(sql,args=[]){
              const response=await fetch(`https://${hostname}/v2/pipeline`,{
                method:'POST',headers:{Authorization:`Bearer ${dbToken}`,'content-type':'application/json'},
                body:JSON.stringify({requests:[{type:'execute',stmt:{sql,args:args.map(v=>({type:'text',value:String(v)}))}},{type:'close'}]}),
              });
              const payload=await response.json();
              const item=payload?.results?.[0];
              if(!response.ok||item?.type==='error') throw new Error(`Turso query failed: ${JSON.stringify(item?.error||payload)}`);
              return item?.response?.result;
            }
            const decode=v=>v==null?null:(typeof v==='object'&&'value' in v?v.value:v);
            const rows=r=>(r?.rows||[]).map(row=>row.map(decode));
            const schema=rows(await query('PRAGMA table_info(ms_live_cache)'));
            console.log('CACHE_SCHEMA='+JSON.stringify(schema));
            const names=schema.map(r=>String(r[1]||''));
            const jsonCol=names.find(n=>/payload|data|cache|json/i.test(n) && !/source_hash/i.test(n));
            console.log('CACHE_JSON_COLUMN='+(jsonCol||'NONE'));
            if(jsonCol){
              const q=`SELECT hub,source_hash,LENGTH(${jsonCol}) AS bytes, json_extract(${jsonCol},'$.version') AS version, json_extract(${jsonCol},'$.completedDay') AS completed_day, json_array_length(COALESCE(json_extract(${jsonCol},'$.completedRows'),'[]')) AS completed_rows, json_array_length(COALESCE(json_extract(${jsonCol},'$.rows'),'[]')) AS live_rows FROM ms_live_cache ORDER BY hub`;
              console.log('CACHE_MATRIX='+JSON.stringify(rows(await query(q))));
            }
            const shape=rows(await query(`
              SELECT
                COALESCE(json_extract(j.value,'$.attendanceType'),''),
                COALESCE(json_extract(j.value,'$.unloadingState'),''),
                COALESCE(json_extract(j.value,'$.completionSource'),''),
                COALESCE(json_extract(j.value,'$.completionObservedLive'),''),
                COALESCE(json_extract(j.value,'$.unloadingCompletedAt'),''),
                COALESCE(json_extract(j.value,'$.scheduleUnloadingCompletedAt'),''),
                COALESCE(json_extract(j.value,'$.id'),'')
              FROM ms_live_cache c, json_each(c.rows_json,'$.completedRows') j
              WHERE c.hub='NE1'
              LIMIT 12`));
            console.log('NE1_COMPLETED_SAMPLES='+JSON.stringify(shape));
            const grouped=rows(await query(`
              SELECT
                COALESCE(json_extract(j.value,'$.attendanceType'),'(blank)') AS attendance,
                COALESCE(json_extract(j.value,'$.unloadingState'),'(blank)') AS state,
                COALESCE(json_extract(j.value,'$.completionSource'),'(blank)') AS source,
                COALESCE(json_extract(j.value,'$.completionObservedLive'),'(blank)') AS observed,
                COUNT(*)
              FROM ms_live_cache c, json_each(c.rows_json,'$.completedRows') j
              WHERE c.hub='NE1'
              GROUP BY attendance,state,source,observed
              ORDER BY COUNT(*) DESC`));
            console.log('NE1_COMPLETED_GROUPS='+JSON.stringify(grouped));
            const counts=rows(await query(`SELECT hub,COUNT(*) FROM ms_route_history WHERE json_valid(payload_json)=1 AND CAST(json_extract(payload_json,'$.unloadingState') AS INTEGER)=2 AND COALESCE(json_extract(payload_json,'$.unloadingCompletedAt'),'')>='2026-09-09T00:00:00.000Z' AND COALESCE(json_extract(payload_json,'$.unloadingCompletedAt'),'')<'2026-09-10T00:00:00.000Z' GROUP BY hub ORDER BY hub`));
            console.log('D9_COMPLETION_HISTORY_ROWS='+JSON.stringify(counts));
            console.log('READ_ONLY=TRUE');
            console.log('MS_UPSTREAM_CALLS=0');
            console.log('DB_WRITES=0');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
