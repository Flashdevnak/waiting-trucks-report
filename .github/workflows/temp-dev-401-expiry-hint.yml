name: TEMP DEV Authoritative HUB Catalog V5

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/temp-dev-401-expiry-hint.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply guarded authoritative HUB catalog patch
        run: python3 .github/dev-tools/patch-browser-authoritative-hub-catalog-v5.py
      - name: Validate canonical DEV Worker and staging composition
        working-directory: worker
        run: |
          npm ci
          npm run check
          node --check src/index.js
          grep -F 'BROWSER_HUB_CATALOG_AUTH_V1' src/index.js
          grep -F 'upstreamMsCalls: 0' src/index.js
          node ../.github/dev-tools/patch-ms-connector-adoption.mjs /tmp/catalog-anchor-check.js 2>/dev/null && exit 99 || true
          node --test ../.github/dev-tools/ms-completion-burst-truth.test.mjs
      - name: Validate Browser Worker
        working-directory: cloudflare-browser-test
        run: |
          npm install --no-audit --no-fund
          npm run check
          node --check src/index.js
          node --check src/tbr-intelligence-entry.js
          grep -F 'BROWSER_AUTHORITATIVE_HUB_CATALOG_V5' src/index.js
          grep -F 'HUB_CATALOG_LEASE_SECONDS = 60 * 60' src/index.js
          grep -F 'TBR_INTELLIGENCE_HUB_CATALOG_V4' src/tbr-intelligence-entry.js
      - name: Verify quota contract and no HUB hardcode in V5 block
        run: |
          python3 - <<'PY'
          from pathlib import Path
          w=Path('worker/src/index.js').read_text()
          b=Path('cloudflare-browser-test/src/index.js').read_text()
          assert 'connectorHubCatalog' in w
          assert 'tursoWrites: 0, upstreamMsCalls: 0' in w
          assert 'if (action === "connectorSync") return ok(await connectorSync(body, env));\n  const actor = await verify(body.token, env);' in w
          block=b.split('// BROWSER_AUTHORITATIVE_HUB_CATALOG_V5',1)[1].split('async function saveToMain',1)[0]
          assert 'EA2' not in block and 'NE1' not in block
          assert 'expirationTtl: HUB_CATALOG_LEASE_SECONDS' in block
          assert 'action: "connectorHubCatalog"' in block
          print('CONNECTOR_ADOPTION_ANCHOR=PASS')
          print('AUTHORITATIVE_HUB_CATALOG_GENERIC=PASS')
          print('CATALOG_REFRESH_MAX=1_PER_HOUR')
          print('CATALOG_MS_POLLING_ADDED=0')
          print('CATALOG_TURSO_WRITES_ADDED=0')
          PY
          git diff --check
      - name: Commit tested HUB catalog V5
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add worker/src/index.js cloudflare-browser-test/src/index.js
          git commit -m 'fix(dev): sync Browser HUB catalog from authoritative DEV list'
          git push origin HEAD:main
