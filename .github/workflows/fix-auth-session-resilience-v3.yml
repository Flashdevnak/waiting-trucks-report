name: Fix Auth Session Resilience v3

on:
  push:
    branches:
      - fix/auth-session-180d-multidevice-20260904
    paths:
      - .github/dev-tools/commit-auth-session-fix.mjs

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - name: Apply auth source and corrected regression test
        run: |
          node .github/dev-tools/patch-auth-session-resilience.mjs
          node .github/dev-tools/patch-auth-session-test-paths.mjs
      - name: Install worker tooling
        working-directory: worker
        run: npm ci
      - name: Run all existing checks
        working-directory: worker
        run: npm run check
      - name: Run 100-device auth regression
        working-directory: worker
        run: node --test tests/auth-session-resilience.test.mjs
      - name: Verify current DEV auth secrets
        working-directory: worker
        run: |
          npx wrangler secret list --config wrangler.dev.jsonc > /tmp/dev-secrets.json
          node <<'NODE'
          const fs=require('node:fs');
          const text=fs.readFileSync('/tmp/dev-secrets.json','utf8');
          const required=['TURSO_DATABASE_URL','TURSO_AUTH_TOKEN','AUTH_SECRET','PASSWORD_PEPPER'];
          const missing=required.filter((name)=>!text.includes(name));
          if(missing.length) throw new Error(`Missing required DEV secrets: ${missing.join(', ')}`);
          console.log('DEV_AUTH_SECRET_NAMES=PASS');
          console.log('DEV_TURSO_SECRET_NAMES=PASS');
          NODE
      - name: Commit only runtime auth fix and regression test
        run: |
          git diff --check
          git config user.name 'Flashdevnak'
          git config user.email '26nak.testdev@gmail.com'
          git add worker/src/index.js worker/tests/auth-session-resilience.test.mjs
          git commit -m 'Keep 180-day sessions during transient auth outages'
          git push origin HEAD:fix/auth-session-180d-multidevice-20260904
