name: Fix HBI-aware DEV HAR staging once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-stage-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guard expected source checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=3f2c2704afe79a3e58dc143a032c914c705476f1
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }
      - name: Apply and test final HBI cleanup
        shell: bash
        run: |
          set -euo pipefail
          python3 .tmp-fix-hbi-stage.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/dev-tools/stage-dev-runtime.test.mjs')
          text = p.read_text()
          replacements = [
              ('  assert.match(stagedMsHtml, /อัปโหลด HAR ทั้ง 4 แหล่ง/);', '  assert.match(stagedMsHtml, /อัปโหลด HAR ทั้ง 5 แหล่ง/);'),
              ('  assert.match(stagedMsHtml, /data-source-status="proof"/);', '  assert.match(stagedMsHtml, /data-source-status="hbiPhotos"/);\n  assert.match(stagedMsHtml, /data-source-status="proof"/);'),
              ('  assert.match(stagedMsHtml, /4\\. ปริ้นบาร์โค้ดรถ/);', '  assert.match(stagedMsHtml, /5\\. ปริ้นบาร์โค้ดรถ/);'),
              ('  assert.match(stagedMsHtml, /ทั้ง 4 หน้าด้านล่าง/);', '  assert.match(stagedMsHtml, /ทั้ง 5 หน้าด้านล่าง/);'),
              ('  assert.match(stagedFrontend, /"ms-har-bustime", "ms-har-proof"/);', '  assert.match(stagedFrontend, /"ms-har-bustime", "ms-har-hbi-photos", "ms-har-proof"/);'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'stale DEV test anchor expected once, found {count}: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
          node --check .github/dev-tools/stage-dev-runtime.mjs
          node --check worker/src/index.js
          node --test worker/tests/hbi-truck-photos.test.mjs worker/tests/dev-archive-patch.test.mjs
          node --test .github/dev-tools/stage-dev-runtime.test.mjs
          grep -q 'CREATE TABLE IF NOT EXISTS ms_hbi_connections' worker/migrations/0011_hbi_truck_photos.sql
          git diff --check
      - name: Commit clean final source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-stage-once.yml .tmp-fix-hbi-stage.py
          git add .github/dev-tools/stage-dev-runtime.mjs .github/dev-tools/stage-dev-runtime.test.mjs worker/src/index.js
          git commit -m "fix(dev): finalize HBI staging without runtime DDL"
          git push origin HEAD:main
