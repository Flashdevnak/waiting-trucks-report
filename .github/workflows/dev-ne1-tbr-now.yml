name: DEV NE1 TBR Now
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-ne1-tbr-now.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
    steps:
      - name: Correlate current NE1 TBR shadow with accepted queue cache
        run: |
          node <<'NODE'
          const hub='NE1';
          const shadowUrl='https://waiting-trucks-ms-browser-test.26nak-testdev.workers.dev/api/shadow-tbr?hub=NE1';
          const r=await fetch(shadowUrl,{headers:{accept:'application/json'},cache:'no-store'});
          const j=await r.json();
          if(!r.ok||j?.ok===false) throw new Error(`shadow HTTP ${r.status}`);
          const now=Date.now();
          const rows=(Array.isArray(j.records)?j.records:[]).map(x=>({
            id:String(x.id||''), attendanceType:String(x.attendanceType||''), status:String(x.status||''),
            tbrAt:String(x.tbrAt||''), kitAt:String(x.kitAt||''), routeActualArrivalAt:String(x.routeActualArrivalAt||''),
            routeSeen:Boolean(x.routeSeen), leadMinutes:x.leadMinutes??null,
          }));
          const pending=rows.filter(x=>{
            const t=Date.parse(x.tbrAt||'');
            return x.status==='pending'&&!x.routeActualArrivalAt&&Number.isFinite(t)&&now-t<=60*60*1000&&now-t>=-5*60*1000;
          }).sort((a,b)=>Date.parse(b.tbrAt)-Date.parse(a.tbrAt));

          async function turso(sql){
            const platform=process.env.TURSO_PLATFORM_API_TOKEN;
            if(!platform) throw new Error('TURSO_PLATFORM_API_TOKEN missing');
            const headers={Authorization:`Bearer ${platform}`};
            const lookup=await fetch(`https://api.turso.tech/v1/organizations/${process.env.TURSO_ORG}/databases/${process.env.TURSO_DATABASE}`,{headers});
            const meta=await lookup.json(); if(!lookup.ok) throw new Error(`lookup ${lookup.status}`);
            const db=meta.database||meta; const hostname=db.Hostname||db.hostname;
            const tr=await fetch(`https://api.turso.tech/v1/organizations/${process.env.TURSO_ORG}/databases/${process.env.TURSO_DATABASE}/auth/tokens?authorization=full-access`,{method:'POST',headers});
            const tj=await tr.json(); if(!tr.ok||!tj.jwt) throw new Error(`token ${tr.status}`); console.log(`::add-mask::${tj.jwt}`);
            const q=await fetch(`https://${hostname}/v2/pipeline`,{method:'POST',headers:{Authorization:`Bearer ${tj.jwt}`,'content-type':'application/json'},body:JSON.stringify({requests:[{type:'execute',stmt:{sql}},{type:'close'}]})});
            const p=await q.json(); const result=p?.results?.[0]?.response?.result; if(!q.ok||!result) throw new Error('select failed');
            const cols=(result.cols||[]).map(c=>c.name); return (result.rows||[]).map(row=>Object.fromEntries(cols.map((n,i)=>[n,row[i]?.value??row[i]])));
          }
          const got=await turso(`SELECT synced_at, rows_json FROM ms_live_cache WHERE hub='NE1' LIMIT 1`);
          const cache=got[0]||{}; let live=[]; try{const p=JSON.parse(cache.rows_json||'[]'); live=Array.isArray(p)?p:Array.isArray(p?.rows)?p.rows:[]}catch{}
          const pendingTimes=new Set(pending.map(x=>x.tbrAt));
          const matches=live.filter(x=>pendingTimes.has(String(x.scheduleTbrArrivalAt||''))).map(x=>({
            proofId:String(x.proofId||x.barcode||''), attendanceType:String(x.attendanceType||''), unloadingState:x.unloadingState??null,
            actualArrivalAt:String(x.actualArrivalAt||''), scheduleTbrArrivalAt:String(x.scheduleTbrArrivalAt||''),
            scheduleKitMetadataAt:String(x.scheduleKitArrivalAt||''), actualDepartureAt:String(x.actualDepartureAt||''),
          }));
          console.log(`NE1_TBR_OBSERVER_STATUS=${j.observerStatus||''}`);
          console.log(`NE1_TBR_LAST_ATTEMPT_AT=${j.lastAttemptAt||''}`);
          console.log(`NE1_TBR_SOURCE_AVAILABLE=${String(j.sourceAvailable??'')}`);
          console.log(`NE1_TBR_PENDING_NOW=${JSON.stringify(pending)}`);
          console.log(`NE1_ACCEPTED_CACHE_SYNCED_AT=${cache.synced_at||''}`);
          console.log(`NE1_ACCEPTED_MATCHES_FOR_PENDING_TBR=${JSON.stringify(matches)}`);
          console.log('NE1_TBR_CHECK_MS_UPSTREAM_CALLS=0');
          console.log('NE1_TBR_CHECK_TURSO_SELECTS=1');
          console.log('NE1_TBR_CHECK_TURSO_WRITES=0');
          NODE
