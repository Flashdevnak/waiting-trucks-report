name: Proof V14 Plate Temp

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/proof-v14-plate-temp.yml

permissions:
  contents: write
  actions: write

# Final rerun after correcting URL-object support in the permanent HAR fixture.
jobs:
  patch-test-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Patch HAR exact plate search
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('worker/src/proof-plate-search-v5.js')
          s=p.read_text()
          if 'PROOF_PLATE_HAR_EXACT_V14' not in s:
              needle="for(const variant of variants){\n    try{const items=await fetchPlateSearch(credentials,primary,{fleetId,id:'',plateNumber:variant,pageSize:'50',pageNum:'1',plateType:requiredType});"
              repl="// PROOF_PLATE_HAR_EXACT_V14: first request mirrors captured MS car/info: no id param, pageSize 20.\n  for(const variant of variants){\n    try{const items=await fetchPlateSearch(credentials,primary,{fleetId,plateNumber:variant,pageSize:'20',pageNum:'1',plateType:requiredType});"
              if needle not in s: raise SystemExit('typed primary plate anchor missing')
              s=s.replace(needle,repl,1)
              s=s.replace("{fleetId,id:'',plateNumber:","{fleetId,plateNumber:")
              p.write_text(s)
              print('patched plate search')
          else:
              print('already patched')
          PY
      - name: Validate Proof V14 and HAR contract
        run: |
          cd worker
          npm ci --no-audit --no-fund
          npm run check
      - name: Commit functional plate fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add worker/src/proof-plate-search-v5.js
          git diff --cached --quiet && exit 0
          git commit -m "Match Proof plate search to captured MS HAR"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Dispatch DEV deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-worker-dev.yml --ref main
