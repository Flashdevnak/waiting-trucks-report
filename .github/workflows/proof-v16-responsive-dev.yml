name: Proof V16 Responsive DEV

# Permanent read-only DEV visual gate. No login, no DB writes, no MS mutation.
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/proof-v16-responsive-dev.yml
      - .github/dev-tools/proof-v16-live-responsive-smoke.mjs
      - proof.html
      - 'proof-v2-*.js'
      - worker/src/proof-ui-v15.js
      - worker/src/proof-ui-v16.js
      - worker/src/turso-index.js
      - worker/tests/proof-quick-day-v16.test.mjs
      - .github/dev-tools/ms-proof-ui-v16.test.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify smoke source syntax
        run: node --check .github/dev-tools/proof-v16-live-responsive-smoke.mjs
      - name: Smoke live DEV Proof at desktop tablet mobile
        env:
          PROOF_DEV_ORIGIN: https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev
          PROOF_V16_ASSET: proof-v16.js?v=20260907-05
        run: node .github/dev-tools/proof-v16-live-responsive-smoke.mjs
