name: Final Turso DEV Live Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/turso-final-live-proof.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_D1_DATABASE_ID: 798db282-46cd-4b2c-bfca-3d6d29596451
      TURSO_PLATFORM_API_TOKEN: ${{ secrets.TURSO_PLATFORM_API_TOKEN }}
      TURSO_ORG: flashdevnak
      TURSO_DATABASE: waiting-trucks-dev-turso-20260902192750
      WORKER_NAME: waiting-trucks-report-api-dev
    steps:
      - name: Verify active Worker deployment and bindings
        run: |
          node <<'NODE'
          const account=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const name=process.env.WORKER_NAME;
          const headers={Authorization:`Bearer ${token}`};
          const deploymentsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/deployments`,{headers});
          const deployments=await deploymentsRes.json();
          if(!deploymentsRes.ok || !deployments.success) throw new Error(`deployments HTTP ${deploymentsRes.status}: ${JSON.stringify(deployments.errors||deployments)}`);
          const active=deployments.result?.deployments?.[0];
          const versions=active?.versions||[];
          if(!versions.length) throw new Error('No active Worker version returned');
          const activeVersion=versions.sort((a,b)=>Number(b.percentage||0)-Number(a.percentage||0))[0]?.version_id;
          console.log(`ACTIVE_DEPLOYMENT_ID=${active.id}`);
          console.log(`ACTIVE_DEV_VERSION=${activeVersion}`);
          console.log(`ACTIVE_DEPLOYED_AT=${active.created_on}`);
          const settingsRes=await fetch(`https://api.cloudflare.com/client/v4/accounts/${account}/workers/scripts/${name}/script-settings`,{headers});
          const settings=await settingsRes.json();
          if(!settingsRes.ok || !settings.success) throw new Error(`settings HTTP ${settingsRes.status}`);
          const bindings=settings.result?.bindings||[];
          const types=bindings.map(x=>`${x.name||''}:${x.type||''}`).sort();
          console.log(`WORKER_BINDINGS=${types.join(',')}`);
          const hasD1=bindings.some(x=>x.type==='d1' || x.type==='d1_database');
          console.log(`WORKER_D1_BINDING=${hasD1?'YES':'NO'}`);
          if(hasD1) throw new Error('Active DEV Worker still exposes a D1 binding');
          NODE

      - name: Verify D1 stayed at zero after final Turso deployment
        run: |
          node <<'NODE'
          const endpoint='https://api.cloudflare.com/client/v4/graphql';
          const accountTag=process.env.CLOUDFLARE_ACCOUNT_ID;
          const token=process.env.CLOUDFLARE_API_TOKEN;
          const databaseId=process.env.DEV_D1_DATABASE_ID;
          const start='2026-09-02T19:38:00.000Z';
          const end=new Date(Date.now()-2*60_000).toISOString();
          const query=`query($accountTag:String!,$databaseId:String!,$start:String!,$end:String!){viewer{accounts(filter:{accountTag:$accountTag}){d1AnalyticsAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){sum{readQueries writeQueries rowsRead rowsWritten} dimensions{datetimeMinute}} d1QueriesAdaptiveGroups(limit:10000,filter:{databaseId:$databaseId,datetime_geq:$start,datetime_leq:$end}){count sum{rowsRead rowsWritten} dimensions{datetimeMinute query}}}}}`;
          const response=await fetch(endpoint,{method:'POST',headers:{Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify({query,variables:{accountTag,databaseId,start,end}})});
          const payload=await response.json();
          if(!response.ok || payload.errors?.length) throw new Error(JSON.stringify(payload.errors||payload));
          const a=payload.data?.viewer?.accounts?.[0]||{};
          let rowsRead=0,rowsWritten=0,readQueries=0,writeQueries=0;
          for(const g of a.d1AnalyticsAdaptiveGroups||[]){rowsRead+=Number(g.sum?.rowsRead||0);rowsWritten+=Number(g.sum?.rowsWritten||0);readQueries+=Number(g.sum?.readQueries||0);writeQueries+=Number(g.sum?.writeQueries||0);}
          console.log(`D1_PROOF_START=${start}`);
          console.log(`D1_PROOF_END=${end}`);
          console.log(`POST_TURSO_D1_READ_QUERIES=${readQueries}`);
          console.log(`POST_TURSO_D1_WRITE_QUERIES=${writeQueries}`);
          console.log(`POST_TURSO_D1_ROWS_READ=${rowsRead}`);
          console.log(`POST_TURSO_D1_ROWS_WRITTEN=${rowsWritten}`);
          console.log('ANALYTICS_ONLY=true');
          if(readQueries||writeQueries||rowsRead||rowsWritten){
            for(const g of (a.d1QueriesAdaptiveGroups||[]).filter(x=>Number(x.count||0)>0).slice(0,20)) console.log(`D1_QUERY=${JSON.stringify({count:g.count,rowsRead:g.sum?.rowsRead,rowsWritten:g.sum?.rowsWritten,query:g.dimensions?.query})}`);
            throw new Error('D1 activity detected after final Turso deployment');
          }
          NODE

      - name: Verify Turso database is live and populated
        run: |
          node <<'NODE'
          const platform=process.env.TURSO_PLATFORM_API_TOKEN;
          const org=process.env.TURSO_ORG;
          const name=process.env.TURSO_DATABASE;
          const headers={Authorization:`Bearer ${platform}`};
          const dbRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${name}`,{headers});
          const db=await dbRes.json();
          if(!dbRes.ok || !db?.database?.Hostname) throw new Error(`Turso db HTTP ${dbRes.status}: ${JSON.stringify(db)}`);
          const tokenRes=await fetch(`https://api.turso.tech/v1/organizations/${org}/databases/${name}/auth/tokens?expiration=10m&authorization=read-only`,{method:'POST',headers});
          const tokenPayload=await tokenRes.json();
          if(!tokenRes.ok || !tokenPayload.jwt) throw new Error(`Turso token HTTP ${tokenRes.status}`);
          const host=db.database.Hostname;
          const q=await fetch(`https://${host}/v2/pipeline`,{method:'POST',headers:{Authorization:`Bearer ${tokenPayload.jwt}`,'Content-Type':'application/json'},body:JSON.stringify({requests:[{type:'execute',stmt:{sql:'SELECT COUNT(*) AS c FROM users'}},{type:'execute',stmt:{sql:'SELECT COUNT(*) AS c FROM ms_routes'}},{type:'execute',stmt:{sql:'SELECT COUNT(*) AS c FROM ms_live_cache'}},{type:'close'}]})});
          const p=await q.json();
          if(!q.ok || !Array.isArray(p.results)) throw new Error(`Turso query HTTP ${q.status}`);
          const val=x=>Number(x?.response?.result?.rows?.[0]?.[0]?.value ?? x?.response?.result?.rows?.[0]?.[0] ?? 0);
          const users=val(p.results[0]),routes=val(p.results[1]),cache=val(p.results[2]);
          console.log(`TURSO_DATABASE=${name}`);
          console.log(`TURSO_USERS=${users}`);
          console.log(`TURSO_MS_ROUTES=${routes}`);
          console.log(`TURSO_LIVE_CACHE=${cache}`);
          if(users<1 || routes<1 || cache<1) throw new Error('Turso live database unexpectedly empty');
          console.log('TURSO_LIVE_QUERY=PASS');
          NODE

      - name: Smoke DEV health
        run: |
          curl --fail --show-error --silent 'https://waiting-trucks-report-api-dev.26nak-testdev.workers.dev/api?action=health' | tee /tmp/health.json
          node -e "const p=require('/tmp/health.json'); if(!p.ok) process.exit(1); console.log('DEV_HEALTH=PASS')"
