name: Fix DEV Admin Canonical HUB V1

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fix-admin-canonical-hub-v1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical HUB contract
        run: node .github/dev-tools/patch-admin-canonical-hub-v1.mjs
      - name: Syntax and focused regressions
        run: |
          node --check admin.js
          node --check worker/src/index.js
          node --check .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          node --test worker/tests/admin-page.test.mjs
          node --test .github/dev-tools/ms-self-healing-supervisor.test.mjs
          git diff --check
      - name: Commit safe source patch to main
        run: |
          if git diff --quiet; then
            echo "ADMIN_CANONICAL_HUB_V1=NO_CHANGES"
            exit 0
          fi
          git config user.name "Flashdevnak"
          git config user.email "26nak.testdev@gmail.com"
          git add admin.js worker/src/index.js worker/tests/admin-page.test.mjs .github/dev-tools/patch-ms-self-healing-supervisor.mjs
          git commit -m "fix(dev): enforce canonical HUB codes in Admin"
          git push origin HEAD:main
