name: Fix HBI photo auth replay once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-hbi-photo-auth-replay-once.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Guard expected checkpoint
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=b8b6b28db0e31e59ee1229e5530cbd5c34786fe3
          PARENT=$(git rev-parse HEAD^)
          test "$PARENT" = "$EXPECTED" || { echo "Unexpected parent $PARENT"; exit 1; }

      - name: Replay captured HBI auth exactly
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          worker = Path('worker/src/index.js')
          text = worker.read_text(encoding='utf-8')

          old_time = '''  for (const key of ["auth", "lang", "fbid", "time", "webSign", "_from"]) {
            const value = key === "time" ? String(Date.now()) : credentials?.[key];
            if (value !== undefined && value !== null) url.searchParams.set(key, value);
          }'''
          new_time = '''  for (const key of ["auth", "lang", "fbid", "time", "webSign", "_from"]) {
            const value = credentials?.[key];
            if (value !== undefined && value !== null) url.searchParams.set(key, value);
          }'''
          if text.count(old_time) != 1:
            raise SystemExit(f'HBI time replay anchor expected 1, got {text.count(old_time)}')
          text = text.replace(old_time, new_time, 1)

          old_headers = '''  const response = await fetch(url, { headers: {
            Accept: "application/json, text/plain, */*",
            Origin: "https://cbi-fbi.flashexpress.com",
            Referer: "https://cbi-fbi.flashexpress.com/",
            "User-Agent": "Mozilla/5.0",
          }});'''
          new_headers = '''  const response = await fetch(url, { headers: {
            Accept: "application/json, text/plain, */*",
            "Accept-Language": credentials?.lang || "th",
            "BI-PLATFORM": "",
            Origin: "https://cbi-fbi.flashexpress.com",
            Referer: "https://cbi-fbi.flashexpress.com/",
            "User-Agent": "Mozilla/5.0",
          }});'''
          if text.count(old_headers) != 1:
            raise SystemExit(f'HBI header replay anchor expected 1, got {text.count(old_headers)}')
          text = text.replace(old_headers, new_headers, 1)
          worker.write_text(text, encoding='utf-8')

          test_file = Path('worker/tests/hbi-truck-photos.test.mjs')
          test_text = test_file.read_text(encoding='utf-8')
          anchor = '''  assert.equal((read.match(/await fetch\\(/g) || []).length, 1);
          assert.doesNotMatch(read, /Promise\\.all|for \\(let page|page \\+/);'''
          replacement = '''  assert.equal((read.match(/await fetch\\(/g) || []).length, 1);
          assert.doesNotMatch(read, /Promise\\.all|for \\(let page|page \\+/);
          assert.match(read, /const value = credentials\\?\\.\\[key\\];/);
          assert.doesNotMatch(read, /key === "time" \\? String\\(Date\\.now\\(\\)\\)/);
          assert.match(read, /"BI-PLATFORM": ""/);
          assert.match(read, /"Accept-Language": credentials\\?\\.lang \\|\\| "th"/);'''
          if test_text.count(anchor) != 1:
            raise SystemExit(f'HBI test anchor expected 1, got {test_text.count(anchor)}')
          test_text = test_text.replace(anchor, replacement, 1)
          test_file.write_text(test_text, encoding='utf-8')
          PY

          node --check worker/src/index.js
          cd worker
          npm ci
          node --test tests/hbi-truck-photos.test.mjs
          npm run check
          cd ..
          git diff --check

      - name: Commit source and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Flashdevnak
          git config user.email 26nak.testdev@gmail.com
          git rm .github/workflows/fix-hbi-photo-auth-replay-once.yml
          git add worker/src/index.js worker/tests/hbi-truck-photos.test.mjs
          git diff --cached --check
          git commit -m "fix(ms): replay HBI photo session exactly"
          git push origin HEAD:main
